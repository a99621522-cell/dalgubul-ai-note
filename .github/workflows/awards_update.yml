name: 기관 선정 공고 수집 (매일)

on:
  schedule:
    - cron: "10 21 * * *"   # UTC 21:10 = 한국 06:10 매일 (collect.yml 05:30 뒤)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: awards-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: pdftotext 설치 (첨부 PDF 본문 추출용)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: 선정 공고 수집·추출 (게시글당 Gemini 1회, 상한은 award_sources.yml max_per_run)
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python3 scripts/collect_awards_notices.py
      - name: 레지스트리에 과제 이력 반영
        run: python3 scripts/merge_sources.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 변경분 커밋
        run: |
          git config user.name "dalgubul-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/data/awards scripts/state/seen_notices.json scripts/data/companies_registry.json scripts/data/sources/ambiguous.csv
          git diff --cached --quiet && echo "변경 없음" || git commit -m "chore: 선정 공고 수집 $(date -u +%Y-%m-%d)"
          git push
