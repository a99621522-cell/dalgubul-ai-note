name: 매일 새벽 수집·초안 생성

on:
  schedule:
    - cron: "30 20 * * *"   # UTC 20:30 = 한국 05:30 매일
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: DART 공시 수집 (대구 확장신호 → inbox)
        env:
          DART_KEY: ${{ secrets.DART_KEY }}
        run: python3 scripts/collect_dart.py
      - name: 수집 및 초안 생성
        env:
          BIZINFO_KEY: ${{ secrets.BIZINFO_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python3 scripts/collect.py
      - name: 초안 커밋
        run: |
          git config user.name "dalgubul-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/content/posts scripts/state data/notices
          git diff --cached --quiet && echo "새 초안 없음" || git commit -m "chore: 자동 초안 $(date -u +%Y-%m-%d)"
          git push

  # GITHUB_TOKEN 푸시는 다른 워크플로를 트리거하지 않으므로 직접 호출한다
  deploy:
    needs: collect
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
