name: 대구 공개 지출 자료(지출건별) 집계

# scripts/fetch_daegu_expense.py — 대구 주민참여 재정 포털 '세출현황 지출건별' 하루치 엑셀을 2021~2023(포털에 있는 마지막 해) 날짜마다 받아
# (과세기간·회계·부서·세부사업·통계목) 집계만 data/vat/expense/<gov>.json 에 둔다 — 지자체 부가세 절감 점검기 '공개 지출 자료로 후보 찾기'
# (운영자 2026-11-03 '홈택스 붙여넣는 것은 공무원이 안 할 것 같은데 방법을 찾아봐'). 원본 행·거래처 없음. 지자체마다 1시간쯤(요청 사이 1.2초).
on:
  workflow_dispatch:
    inputs:
      gov:
        description: "지자체 key(쉼표: daegu,jung,dong,seo,nam,buk,suseong,dalseo,dalseong,gunwi — 비우면 전부)"
        required: false
        default: ""
      years:
        description: "연도(쉼표)"
        required: false
        default: "2021,2022,2023"
      probe:
        description: "true 면 연도 목록·한 날짜 행 수만 로그"
        required: false
        default: "false"
      attempt:
        description: "(자동) 몇 번째 시도인지 — 러너 IP 가 포털에 막혀 종료 코드 3 으로 끝난 지자체는 retry 잡이 새 러너로 다시 돌린다(8번까지)"
        required: false
        default: "1"
  schedule:
    - cron: "0 19 15 2,8 *"   # 2월·8월 16일 04:00 KST — 포털이 2024년 뒤 자료를 다시 싣는지 확인(없으면 그대로)

permissions:
  contents: write
  actions: write   # retry 잡이 같은 워크플로를 다시 부른다(GITHUB_TOKEN 의 workflow_dispatch 는 허용 예외)

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      govs: ${{ steps.p.outputs.govs }}
    steps:
      - id: p
        run: |
          IN="${{ github.event.inputs.gov }}"; [ -z "$IN" ] && IN="daegu,jung,dong,seo,nam,buk,suseong,dalseo,dalseong,gunwi"
          echo "govs=$(echo "$IN" | python3 -c 'import sys,json; print(json.dumps([x.strip() for x in sys.stdin.read().split(",") if x.strip()]))')" >> "$GITHUB_OUTPUT"
  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        gov: ${{ fromJSON(needs.plan.outputs.govs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q xlrd
      - id: f
        continue-on-error: true
        run: |
          set +e
          python scripts/fetch_daegu_expense.py --gov ${{ matrix.gov }} --years "${{ github.event.inputs.years || '2021,2022,2023' }}" ${{ github.event.inputs.probe == 'true' && '--probe' || '' }}
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
      - name: 커밋
        if: github.event.inputs.probe != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vat/expense
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "대구 공개 지출 자료 집계: ${{ matrix.gov }} $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5 6; do git pull --rebase -q origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }} && break; sleep $((i*10)); done
      - name: 다시 받을 지자체 표시(연결 차단)
        if: steps.f.outputs.rc == '3'
        run: mkdir -p retry && echo "${{ matrix.gov }}" > "retry/${{ matrix.gov }}"
      - uses: actions/upload-artifact@v4
        if: steps.f.outputs.rc == '3'
        with:
          name: retry-${{ matrix.gov }}
          path: retry
          retention-days: 1
      - name: 결과
        run: |
          echo "종료 코드 ${{ steps.f.outputs.rc }}"
          [ "${{ steps.f.outputs.rc }}" = "0" ]
  retry:
    # 러너 VM 의 IP 에 따라 jumin.daegu.go.kr 이 TCP 연결을 막는다(revenue_docs 와 같음) — 종료 코드 3 으로 끝난 지자체만 모아 같은 워크플로를 새 러너로 다시 부른다(8번째 시도까지)
    needs: fetch
    if: always() && github.event.inputs.probe != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: retry-*
          path: retry
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          G=$(ls retry 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          A="${{ github.event.inputs.attempt || '1' }}"
          if [ -z "$G" ]; then echo "다시 받을 지자체 없음"; exit 0; fi
          if [ "$A" -ge 8 ]; then echo "::warning::$G — $A번째 시도까지 포털 연결이 막혀 중단(국내 PC 또는 수동 재실행)"; exit 0; fi
          echo "다시 받기: $G (시도 $((A+1)))"
          gh workflow run daegu_expense.yml --ref "${{ github.ref_name }}" -f gov="$G" -f years="${{ github.event.inputs.years || '2021,2022,2023' }}" -f probe=false -f attempt="$((A+1))"
