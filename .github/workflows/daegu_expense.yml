name: 대구 공개 지출 자료(지출건별) 집계

# scripts/fetch_daegu_expense.py — 대구 주민참여 재정 포털 '세출현황 지출건별' 하루치 엑셀을 2021~2023(포털에 있는 마지막 해) 날짜마다 받아
# (과세기간·회계·부서·세부사업·통계목) 집계만 data/vat/expense/<gov>.json 에 둔다 — 지자체 부가세 절감 점검기 '공개 지출 자료로 후보 찾기'
# (운영자 2026-11-03 '홈택스 붙여넣는 것은 공무원이 안 할 것 같은데 방법을 찾아봐'). 원본 행·거래처 없음. 지자체마다 1시간쯤(요청 사이 1.2초).
on:
  workflow_dispatch:
    inputs:
      gov:
        description: "지자체 key(쉼표: daegu,jung,dong,seo,nam,buk,suseong,dalseo,dalseong,gunwi — 비우면 전부)"
        required: false
        default: ""
      years:
        description: "연도(쉼표)"
        required: false
        default: "2021,2022,2023"
      probe:
        description: "true 면 연도 목록·한 날짜 행 수만 로그"
        required: false
        default: "false"
      attempt:
        description: "(자동) 몇 번째 시도인지 — 러너 IP 가 포털에 막혀 종료 코드 3 으로 끝난 지자체는 그 잡이 자기만 새 러너로 다시 부른다(50번까지)"
        required: false
        default: "1"
  schedule:
    - cron: "0 19 15 2,8 *"   # 2월·8월 16일 04:00 KST — 포털이 2024년 뒤 자료를 다시 싣는지 확인(없으면 그대로)

permissions:
  contents: write
  actions: write   # 막힌 잡이 같은 워크플로를 다시 부른다(GITHUB_TOKEN 의 workflow_dispatch 는 허용 예외)

concurrency:   # 같은 지자체(입력 gov 글자) 실행은 하나씩 — 다시 부르기가 겹쳐도 둘이 함께 받지 않는다
  group: daegu-expense-${{ github.event.inputs.gov || 'all' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      govs: ${{ steps.p.outputs.govs }}
    steps:
      - id: p
        run: |
          IN="${{ github.event.inputs.gov }}"; [ -z "$IN" ] && IN="daegu,jung,dong,seo,nam,buk,suseong,dalseo,dalseong,gunwi"
          echo "govs=$(echo "$IN" | python3 -c 'import sys,json; print(json.dumps([x.strip() for x in sys.stdin.read().split(",") if x.strip()]))')" >> "$GITHUB_OUTPUT"
  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340   # 스크립트는 290분(--budget 17400)에서 스스로 멈춰 커밋·retry 가 돌게 한다
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        gov: ${{ fromJSON(needs.plan.outputs.govs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q xlrd
      - id: f
        continue-on-error: true
        run: |
          set +e
          python scripts/fetch_daegu_expense.py --gov ${{ matrix.gov }} --years "${{ github.event.inputs.years || '2021,2022,2023' }}" --budget 17400 ${{ github.event.inputs.probe == 'true' && '--probe' || '' }}
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
      - name: 커밋
        if: github.event.inputs.probe != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vat/expense
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "대구 공개 지출 자료 집계: ${{ matrix.gov }} $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5 6; do git pull --rebase -q origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }} && break; sleep $((i*10)); done
          echo "pushed=1" >> "$GITHUB_OUTPUT"
        id: c
      - name: 점검기 배포(GITHUB_TOKEN 커밋은 push 배포를 깨우지 않는다)
        if: steps.c.outputs.pushed == '1' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy_vat.yml -R "${{ github.repository }}" --ref main || echo "::warning::deploy_vat 호출 실패"
      - name: 이 지자체만 새 러너로 다시(연결 차단, 종료 코드 3)
        # 러너 VM 의 IP 에 따라 jumin.daegu.go.kr 이 TCP 연결을 막는다(2026-11-03 러너 약 30대 중 1대꼴로만 연결) — 막힌 지자체는 저마다 따로 다시 부른다.
        # 이전에는 retry 잡이 모든 잡이 끝나길 기다려 한꺼번에 불렀는데, 연결된 잡 하나가 한 시간 넘게 받는 동안 나머지가 멈춰 있었다.
        # probe 실행(연결 확인용)은 다시 부르지 않는다 — 2026-11-04 probe 하나가 수집 체인을 열었다
        if: ${{ !cancelled() && steps.f.outputs.rc == '3' && github.event.inputs.probe != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          A="${{ github.event.inputs.attempt || '1' }}"
          if [ "$A" -ge 50 ]; then echo "::warning::${{ matrix.gov }} — $A번째 시도까지 포털 연결이 막혀 중단(국내 PC 또는 수동 재실행)"; exit 0; fi
          echo "다시 받기: ${{ matrix.gov }} (시도 $((A+1)))"
          gh workflow run daegu_expense.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}" -f gov="${{ matrix.gov }}" -f years="${{ github.event.inputs.years || '2021,2022,2023' }}" -f probe=false -f attempt="$((A+1))"
      - name: 결과
        run: |
          echo "종료 코드 ${{ steps.f.outputs.rc }}"
          [ "${{ steps.f.outputs.rc }}" = "0" ]
