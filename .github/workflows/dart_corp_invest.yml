name: DART 회사 목록 투자 공시·설비 계획(분야 조사용)

# scripts/dart_corp_invest.py — 회사 이름 목록의 신규시설투자·유형자산·사채·증자 공시와 정기보고서 설비 계획 문구 → data/dart/corp_invest.csv
# 분야별 기업 투자 조사용(운영자 지시 2026-11-09 전력반도체). 사이트는 이 파일을 읽지 않는다. 키 DART_KEY.
on:
  workflow_dispatch:
    inputs:
      names:
        description: "회사 이름 쉼표"
        required: true
      months:
        description: "최근 몇 개월"
        default: "24"
      tag:
        description: "분야 이름(CSV tag 칸)"
        default: ""
  push:   # 새 워크플로는 기본 브랜치에 있어야 수동 실행이 되므로, 이 브랜치에서는 data/dart/corp_invest_query.txt(1줄 tag, 2줄 이름 쉼표, 3줄 개월)를 고쳐 푸시
    branches: ["claude/factorion-file-repair-tyqnlb"]
    paths: ["data/dart/corp_invest_query.txt", "scripts/dart_corp_invest.py"]

permissions:
  contents: write

concurrency:
  group: dart-corp-invest
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r scripts/requirements.txt
      - name: 받기
        env:
          DART_KEY: ${{ secrets.DART_KEY }}
          PYTHONUNBUFFERED: "1"
          NAMES: ${{ inputs.names }}
          MONTHS: ${{ inputs.months }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$NAMES" ] && [ -f data/dart/corp_invest_query.txt ]; then
            TAG=$(sed -n 1p data/dart/corp_invest_query.txt); NAMES=$(sed -n 2p data/dart/corp_invest_query.txt); MONTHS=$(sed -n 3p data/dart/corp_invest_query.txt)
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          python3 scripts/dart_corp_invest.py --names "$NAMES" --months "${MONTHS:-24}" --tag "$TAG"
      - name: 커밋
        run: |
          git config user.name dalgubul-bot
          git config user.email bot@users.noreply.github.com
          git add data/dart/corp_invest.csv
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "data: DART 회사 투자 공시 ${TAG} $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && break; sleep $((i * 5)); done
