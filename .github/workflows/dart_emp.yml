name: DART 대구 본사 기업 직원 현황 받기

# scripts/collect_dart_emp.py — 대구 본사 공시 기업(scripts/state/dart_corp.json, dart_fin 이 채움)의 사업보고서 직원 현황
# → scripts/data/company_employees.csv. 키 DART_KEY. 이 세션 환경은 opendart 가 막혀 러너가 돈다.
on:
  schedule:
    - cron: "17 22 15 4,5,6,9,12 *"   # dart_fin 다음(16일 07:17 KST)
  workflow_dispatch:
  push:
    branches: ["claude/factorion-file-repair-tyqnlb"]
    paths: ["scripts/collect_dart_emp.py", ".github/workflows/dart_emp.yml"]

permissions:
  contents: write

concurrency:
  group: dart-emp
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r scripts/requirements.txt
      - name: 받기
        env:
          DART_KEY: ${{ secrets.DART_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/collect_dart_emp.py --years 3
      - name: 커밋
        run: |
          git config user.name dalgubul-bot
          git config user.email bot@users.noreply.github.com
          git add scripts/data/company_employees.csv
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "data: DART 대구 본사 기업 직원 현황 $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && break; sleep $((i * 5)); done
