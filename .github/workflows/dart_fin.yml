name: DART 대구 본사 기업 재무 받기

# scripts/collect_dart_fin.py — 최근 3년 사업보고서를 낸 회사 중 본사가 대구인 곳을 찾아(기업개황 주소, 캐시 scripts/state/dart_corp.json)
# 매출액·영업이익·당기순이익·자산·부채·자본(사업보고서 주요계정)을 scripts/data/company_financials.csv 로 커밋한다. 키 DART_KEY.
# 이 세션 환경은 opendart.fss.or.kr 이 막혀 러너가 대신 돈다. 첫 실행은 기업개황 조회가 많아 30분쯤 걸린다(그 뒤는 캐시).
on:
  schedule:
    - cron: "37 21 15 4,5,6,9,12 *"   # 사업보고서(3월 말)·정정 반영: 4·5·6월, 그 밖에 9·12월 16일 06:37 KST
  workflow_dispatch:
  push:
    branches: ["claude/factorion-file-repair-tyqnlb"]
    paths: ["scripts/collect_dart_fin.py", ".github/workflows/dart_fin.yml"]

permissions:
  contents: write

concurrency:
  group: dart-fin
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r scripts/requirements.txt
      - name: 받기
        env:
          DART_KEY: ${{ secrets.DART_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/collect_dart_fin.py --years 3
      - name: 커밋
        run: |
          git config user.name dalgubul-bot
          git config user.email bot@users.noreply.github.com
          git add scripts/data/company_financials.csv scripts/state/dart_corp.json
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "data: DART 대구 본사 기업 재무 갱신 $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && break; sleep $((i * 5)); done
