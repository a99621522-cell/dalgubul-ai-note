name: DART 대구 상장회사 분기 실적·실적 공시

# scripts/collect_dart_qtr.py — 대구 본사 유가증권·코스닥 상장회사의 분기별 매출액·영업이익·당기순이익(주요계정)과
# 영업(잠정)실적·손익구조 변동(주요원인)·영업실적 전망 공시를 받아 scripts/data/company_financials_q.csv · data/dart/performance.csv 로 커밋한다.
# 분기·반기보고서는 분기 끝 45일 안(5·8·11월 중순), 사업보고서는 90일 안(3월 말), 잠정실적은 그 전에 나오므로 매달 2·17일에 돈다.
# 이 세션 환경은 opendart.fss.or.kr 이 막혀 러너가 대신 돈다. data/dart/qtr_probe.txt 첫 줄에 회사 이름을 적어 푸시하면 그 회사만 원문을 로그로(저장 안 함).
on:
  schedule:
    - cron: "17 21 1,16 * *"     # 매달 2·17일 06:17 KST
  workflow_dispatch:
    inputs:
      probe:
        description: "회사 이름(적으면 그 회사 응답·원문만 로그로, 저장 안 함)"
        required: false
        default: ""
  push:
    branches: ["claude/factorion-file-repair-tyqnlb"]
    paths: ["scripts/collect_dart_qtr.py", ".github/workflows/dart_qtr.yml", "data/dart/qtr_probe.txt"]

permissions:
  contents: write

concurrency:
  group: dart-qtr
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r scripts/requirements.txt
      - name: 받기
        env:
          DART_KEY: ${{ secrets.DART_KEY }}
          PYTHONUNBUFFERED: "1"
          PROBE_IN: ${{ inputs.probe }}
        run: |
          P="$PROBE_IN"
          if [ -z "$P" ] && [ "${{ github.event_name }}" = "push" ] && [ -f data/dart/qtr_probe.txt ]; then P=$(head -1 data/dart/qtr_probe.txt | tr -d '\r'); fi
          echo "PROBE=$P" >> "$GITHUB_ENV"
          if [ -n "$P" ]; then python3 scripts/collect_dart_qtr.py --probe "$P"; else python3 scripts/collect_dart_qtr.py; fi
      - name: 커밋
        if: env.PROBE == ''
        run: |
          git config user.name dalgubul-bot
          git config user.email bot@users.noreply.github.com
          git add scripts/data/company_financials_q.csv data/dart/performance.csv data/dart/prelim.csv
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "data: DART 대구 상장회사 분기 실적·실적 공시 $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && break; sleep $((i * 5)); done
