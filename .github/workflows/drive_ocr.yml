name: Drive 큰 PDF 글자 뽑기 (OCR → 아티팩트)

# 운영 세션의 Drive 커넥터는 스캔 PDF(이미지)에서 글자를 못 얻는다. 이 워크플로가 러너에서 파일을 받아
# tesseract(kor+eng)로 쪽마다 글자를 뽑고 결과 txt 를 아티팩트(7일)로만 남긴다. 저장소에는 아무것도 커밋하지 않는다.
# 파일은 Drive 에서 '링크가 있는 모든 사용자' 로 공유돼 있어야 한다(폴더 공유면 folder:<폴더id>).
# 실행: Actions → 이 워크플로 → Run workflow → files 에 Drive 파일 id 나 링크(공백 구분).
# 결과 받기(운영 세션): GitHub API 로 아티팩트 zip 을 받아 요약 JSON(data/refs)만 남긴다. 절차는 data/refs/README.md.

on:
  workflow_dispatch:
    inputs:
      files:
        description: "Drive 파일 id 또는 공유 링크(공백·쉼표 구분). folder:<폴더id> 면 폴더 전체"
        required: true
      dpi:
        description: "렌더 해상도(기본 200, 흐린 스캔은 300)"
        required: false
        default: "200"
      lang:
        description: "tesseract 언어(기본 kor+eng)"
        required: false
        default: "kor+eng"
      echo:
        description: "뽑은 글자를 로그에도 찍기(true, 또는 쪽 범위 61-116 이면 그 쪽만) — 세션 환경에서 아티팩트 저장소(blob)가 막혀 있을 때 get_job_logs 로 읽는다(끝 5,000줄만 오므로 긴 문서는 범위로 나눠 찍는다)"
        required: false
        default: "false"
      parse_budget:
        description: "대구시 본예산 사업설명서면 true — 글자를 뽑은 뒤 scripts/parse_city_budget.py --append 로 city_programs.csv 를 갱신하고 main 에 커밋(원문 txt 는 커밋하지 않음)"
        required: false
        default: "false"

permissions:
  contents: write   # parse_budget=true 일 때 city_programs.csv·match_daegu_national.csv 커밋

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      OMP_THREAD_LIMIT: "1"   # tesseract 여러 개를 나란히 돌릴 때 OpenMP 스레드끼리 다투어 몇 배 느려지는 것을 막는다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-kor > /dev/null
          pip install -q gdown
          tesseract --version | head -1; tesseract --list-langs | tr '\n' ' '; echo
      - name: 받기 + OCR
        env:
          FILES: ${{ inputs.files }}
          ECHO: ${{ inputs.echo }}
        run: python3 scripts/drive_ocr.py --files "$FILES" --dpi "${{ inputs.dpi }}" --lang "${{ inputs.lang }}" --out ocr $(case "$ECHO" in true) echo --echo;; [0-9]*) echo --echo --echo-pages "$ECHO";; esac)
      - name: 결과 요약
        if: always()
        run: |
          { echo "## OCR 결과"; echo; echo '| 파일 | 쪽 | OCR 쪽 | 글자 수 | 빈 쪽 | 시간 |'; echo '|---|---:|---:|---:|---:|---:|';
            python3 -c "import json;[print(f\"| {r['file']} | {r['pages']} | {r['ocr_pages']} | {r['chars']:,} | {r['empty_pages']} | {r['seconds']}s |\") for r in json.load(open('ocr/index.json'))]" 2>/dev/null || echo '| (없음) | | | | | |'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drive-ocr-${{ github.run_number }}
          path: |
            ocr/*.txt
            ocr/index.json
          retention-days: 7
          if-no-files-found: warn
      - name: 대구시 사업설명서 파싱 → city_programs.csv 커밋
        if: inputs.parse_budget == 'true'
        run: |
          ls ocr/*.txt
          python3 scripts/parse_city_budget.py ocr/*.txt --append --debug
          python3 scripts/match_daegu.py
          ! grep -qE "담당자\s*:|\(80[0-9]-[0-9]{4}\)" scripts/data/city_programs.csv   # 담당자·전화가 섞이지 않았는지
          git config user.name dalgubul-bot
          git config user.email bot@users.noreply.github.com
          git add scripts/data/city_programs.csv scripts/data/match_daegu_national.csv
          git diff --cached --quiet && echo "변경 없음" || git commit -m "data: 대구시 본예산 사업설명서 세부사업 갱신 $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"
