name: 팩토리온 월간 파일(Drive) → 기업 사전 갱신 → 통계 → 배포

# 두 길: ① main 을 비우면 scripts/fetch_factoryon.py 가 팩토리온 현황통계자료실에서 최신(또는 month) 파일 2개를 직접 받는다
#   (운영자 지시 2026-10-08 '니가 크롤링해' — robots.txt 가 /bbs/ 를 막지만 운영자 지시로 월 1회 파일 2개만 받는 내려받기, 다른 글은 열지 않음)
# ② 운영자가 받은 파일을 Google Drive 에 올리고 main(·kicox) 에 파일 id·링크를 넣는다.
# 전국 원본은 저장소에 넣지 않는다(러너 임시 폴더에서만).
# 흐름: 받기 → 실제 형식 확인(HTML 표·CSV 로 온 xls 는 repair_factoryon 으로 정리) → import_factoryon.py →
#       국민연금 산단 외 기업 재대조 → 입지 유형 → 월간 통계·그래프·효과표 → 커밋 → 배포. 매월 3일 06:00 KST 자동(①).

on:
  schedule:
    - cron: "0 21 2 * *"      # 매월 3일 06:00 KST — 팩토리온은 매달 1~2일 전월 파일을 올린다
  workflow_dispatch:
    inputs:
      main:
        description: "전국(개별,계획)입주업체현황 — Drive 파일 id 또는 공유 링크(비우면 팩토리온에서 직접 받음)"
        required: false
      kicox:
        description: "산단공관할단지내_입주업체리스트 — Drive 파일 id 또는 링크(선택)"
        required: false
      month:
        description: "기준월 YYYY.MM (Drive 파일이면 필수, 직접 받을 때는 비우면 최신 글)"
        required: false
      probe:
        description: "true 면 팩토리온 상세 페이지 구조(링크·스크립트)만 찍고 끝낸다"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: nps-collect        # nps.yml 과 같은 CSV 를 만지므로 겹치지 않게
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r scripts/requirements.txt pandas openpyxl xlrd
      - name: 받기 (팩토리온 직접 또는 Drive) — 저장소 밖 임시 폴더
        id: get
        env:
          MAIN: ${{ inputs.main }}
          KICOX: ${{ inputs.kicox }}
          MONTH: ${{ inputs.month }}
          PROBE: ${{ inputs.probe }}
        run: |
          set -e
          mkdir -p /tmp/fo
          if [ -z "$MAIN" ]; then
            python3 scripts/fetch_factoryon.py --out /tmp/fo ${MONTH:+--month "$MONTH"} $([ "$PROBE" = "true" ] && echo --probe) | tee /tmp/fo/.log
            [ "$PROBE" = "true" ] && { echo "probe 끝"; echo "month=" >> "$GITHUB_OUTPUT"; exit 0; }
            MONTH=$(grep -o '^MONTH=.*' /tmp/fo/.log | tail -1 | cut -d= -f2)
          else
            [[ "$MONTH" =~ ^20[0-9]{2}\.(0[1-9]|1[0-2])$ ]] || { echo "Drive 파일이면 month 를 YYYY.MM 으로"; exit 1; }
            gid() { python3 -c "import re,sys;s=sys.argv[1];m=re.search(r'/d/([\w-]+)|[?&]id=([\w-]+)',s);print((m.group(1) or m.group(2)) if m else s)" "$1"; }
            pip install -q gdown
            gdown -O "/tmp/fo/(${MONTH}월말기준)_전국(개별,계획)입주업체현황.xlsx" "https://drive.google.com/uc?id=$(gid "$MAIN")"
            if [ -n "$KICOX" ]; then gdown -O "/tmp/fo/(${MONTH}월말기준)_산단공관할단지내_입주업체리스트.xlsx" "https://drive.google.com/uc?id=$(gid "$KICOX")"; fi
          fi
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"
          ls -la /tmp/fo; file /tmp/fo/* || true
      - name: 형식 확인·정리 (확장자만 xls/xlsx 인 HTML 표·CSV 대비)
        if: steps.get.outputs.month != ''
        run: |
          set -e
          for z in /tmp/fo/*.zip; do [ -f "$z" ] && { python3 -c "import zipfile,sys;z=zipfile.ZipFile(sys.argv[1]);[z.extract(n,'/tmp/fo') for n in z.namelist() if n.lower().endswith(('.xls','.xlsx','.csv'))];print(z.namelist())" "$z"; rm -f "$z"; }; done
          for f in /tmp/fo/*.xls /tmp/fo/*.xlsx; do
            [ -f "$f" ] || continue
            python3 scripts/repair_factoryon.py "$f" --inspect || true
            python3 - "$f" <<'PY'
          import sys, zipfile
          p = sys.argv[1]
          head = open(p, "rb").read(8)
          ok = zipfile.is_zipfile(p) or head.startswith(b"\xd0\xcf\x11\xe0")   # xlsx(zip) / xls(OLE2)
          print(p, "진짜 엑셀" if ok else "엑셀 아님 → 정리본 사용")
          open("/tmp/fo/.need_repair", "a").write("" if ok else p + "\n")
          PY
          done
          if [ -s /tmp/fo/.need_repair ]; then
            while read -r f; do [ -n "$f" ] && python3 scripts/repair_factoryon.py "$f"; done < /tmp/fo/.need_repair
            ls -la /tmp/fo
          fi
      - name: 기업 사전 갱신
        if: steps.get.outputs.month != ''
        env:
          MONTH: ${{ steps.get.outputs.month }}
        run: |
          set -e
          pick() { b=$(ls /tmp/fo/*"$1"_정리.xlsx 2>/dev/null | head -1); [ -n "$b" ] || b=$(ls /tmp/fo/*"$1".xls* 2>/dev/null | head -1); echo "$b"; }
          M=$(pick "전국(개별,계획)입주업체현황")
          K=$(pick "산단공관할단지내_입주업체리스트")
          [ -n "$M" ] || { echo "전국 파일 없음"; exit 1; }
          echo "main=$M kicox=$K"
          before=$(tail -n +2 scripts/data/dalseong_companies.csv | wc -l)
          python3 scripts/import_factoryon.py "$M" ${K:+"$K"}
          after=$(tail -n +2 scripts/data/dalseong_companies.csv | wc -l)
          echo "기업 행 $before → $after"
          git diff --stat scripts/data/dalseong_companies.csv scripts/data/dalseong_complexes.csv
      - name: 산단 외 기업 재대조 · 입지 유형 · 통계 · 그래프
        if: steps.get.outputs.month != ''
        run: |
          set +e
          latest=$(ls data/nps/??????.csv 2>/dev/null | sort | tail -1)
          if [ -n "$latest" ]; then
            python3 scripts/nps_to_extra.py && python3 scripts/import_extra.py --replace-source '국민연금' && rm -f scripts/data/extra/nps_*.csv
          fi
          python3 scripts/sites.py
          python3 scripts/build_stats.py --backfill
          python3 scripts/render_charts.py
          python3 scripts/effect_table.py
          true
      - name: 커밋
        if: steps.get.outputs.month != ''
        env:
          MONTH: ${{ steps.get.outputs.month }}
        run: |
          git config user.name "dalgubul-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/data/dalseong_companies.csv scripts/data/dalseong_complexes.csv scripts/data/extra_companies.csv scripts/data/company_tags.csv scripts/data/company_facts.csv data/stats data/effects src/generated
          git status --short | head -20
          git diff --cached --quiet && echo "변경 없음" || git commit -m "data: 팩토리온 ${MONTH} 기업 사전 갱신"
          for i in 1 2 3 4; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && break; sleep $((i * 5)); done

  deploy:
    needs: import
    if: inputs.probe != 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
