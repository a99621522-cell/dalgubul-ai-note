name: 공공데이터 파일 받아오기 (지식산업센터·국민연금·DART 재무)

# Claude Code 세션 환경은 공공데이터포털·DART 접속이 막혀 있어, 이 워크플로가 대신 받는다.
# mode=probe: 페이지 구조와 다운로드 응답만 출력하고 파일은 artifact 로 올린다 (커밋 없음)
# mode=save : 받은 파일로 지식산업센터 건물 목록·국민연금 대구 사업장·DART 재무를 갱신하고 커밋한다

on:
  # 작업 브랜치에서는 push 로도 돈다(기본 브랜치에 없는 워크플로는 수동 실행 API 에 안 잡히므로). 그때는 probe 모드
  push:
    branches: ["claude/factorion-file-repair-tyqnlb"]
    paths: [".github/workflows/fetch_public.yml", "scripts/fetch_datago.py", "scripts/collect_dart_fin.py", "data/fetch_mode.txt"]
  workflow_dispatch:
    inputs:
      mode:
        description: "probe | save"
        required: true
        default: "probe"
      ids:
        description: "data.go.kr 파일데이터 번호(공백 구분)"
        required: false
        default: "15117154 15083277"
      pick:
        description: "파일이 여럿일 때 고를 문자열(예: 2026)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt pandas openpyxl
      - name: 공공데이터포털 파일 (${{ inputs.mode }})
        env:
          MODE_IN: ${{ inputs.mode }}
          IDS_IN: ${{ inputs.ids }}
          PICK_IN: ${{ inputs.pick }}
        run: |
          set +e
          # push 로 돌 때는 data/fetch_mode.txt 의 첫 줄(mode ids pick)을 쓴다
          # 형식: mode|ids|pick (예: probe|15117154 15083277|)
          if [ -z "$MODE_IN" ] && [ -f data/fetch_mode.txt ]; then IFS='|' read -r MODE IDS PICK < data/fetch_mode.txt; else MODE="$MODE_IN"; IDS="$IDS_IN"; PICK="$PICK_IN"; fi
          MODE="${MODE:-probe}"; IDS="${IDS:-15117154 15083277}"
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "mode=$MODE ids=$IDS pick=$PICK"
          if [ "$MODE" = "save" ]; then FLAG=--save; else FLAG=--probe; fi
          python3 scripts/fetch_datago.py $FLAG $IDS ${PICK:+--pick "$PICK"} --max 3
          echo "fetch exit=$?"
      - name: DART 재무 (DART_KEY 가 있을 때)
        env:
          DART_KEY: ${{ secrets.DART_KEY }}
        run: |
          set +e
          python3 scripts/collect_dart_fin.py --years 3
          echo "dart_fin exit=$?"
      - name: 받은 파일 처리 (save 일 때)
        if: env.MODE == 'save'
        run: |
          set +e
          for f in data/raw/15117154/*; do case "$f" in *.csv|*.xlsx|*.xls) python3 scripts/import_kic.py "$f" --as-of "$(date -u +%Y-%m)";; esac; done
          for f in data/raw/15083277/*.csv; do [ -f "$f" ] && python3 scripts/collect_nps.py --file "$f"; done
          # 팩토리온에 없는 대구 사업장 → 산단 외 기업 (임시 투입 파일은 반영 후 지운다)
          python3 scripts/nps_to_extra.py && python3 scripts/import_extra.py --replace-source '국민연금' && rm -f scripts/data/extra/nps_*.csv
          # 지원받은 기업·벤처 등 명단 → 지원 이력(support_history.csv)·태그(company_tags.csv)
          python3 scripts/import_public_support.py data/raw
          ls scripts/data/support/portal_*.csv >/dev/null 2>&1 && python3 scripts/import_support.py --replace-source '공공데이터포털' ; rm -f scripts/data/support/portal_*.csv
          ls scripts/data/extra/portal_*.csv >/dev/null 2>&1 && python3 scripts/import_extra.py --replace-source '중소벤처기업부' ; rm -f scripts/data/extra/portal_*.csv
          python3 scripts/sites.py
          python3 scripts/build_stats.py --backfill
          python3 scripts/render_charts.py
          python3 scripts/report_context.py --area startup | head -20
      - name: artifact (받은 원본)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: data/raw
          if-no-files-found: ignore
          retention-days: 7
      - name: 커밋 (save 일 때)
        if: env.MODE == 'save'
        run: |
          git config user.name "dalgubul-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/data/kic_buildings.csv scripts/data/company_financials.csv scripts/data/extra_companies.csv scripts/data/company_tags.csv scripts/data/support_history.csv data/nps data/stats src/generated
          git diff --cached --quiet && echo "변경 없음" || git commit -m "chore: 공공데이터 파일 반영 $(date -u +%Y-%m-%d)"
          git push
