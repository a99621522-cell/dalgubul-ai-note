name: 달성군 외식업소 수 집계 (임시)

# 세션 환경에서 공공데이터 사이트가 막혀 있어 러너가 대신 받는다. 결과는 로그·artifact 로만 남기고 커밋하지 않는다.
on:
  push:
    branches: ["claude/dalseong-food-count"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: repo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests openpyxl
      - name: 포털 파일데이터(달성군 휴게음식점 15127422 + 검색)
        run: |
          set +e
          mkdir -p out
          cd repo
          python3 scripts/fetch_datago.py --search 달성군 일반음식점 > ../out/search.txt 2>&1
          python3 scripts/fetch_datago.py --search 달성군_일반음식점 >> ../out/search.txt 2>&1
          python3 scripts/fetch_datago.py --save 15127422 > ../out/fetch_15127422.txt 2>&1
          ls -la data/raw/15127422 >> ../out/fetch_15127422.txt 2>&1
          cp -r data/raw ../raw_portal 2>/dev/null
          true
      - name: 받기·집계
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          set +e
          mkdir -p out raw
          cat > c.py <<'PY'
          import os, sys, re, io, zipfile, json, glob, requests, pandas as pd
          UA={"User-Agent":"Mozilla/5.0 daitda-note-bot/1.0"}
          OUT=open("out/result.txt","w",encoding="utf-8")
          def p(*a):
              s=" ".join(str(x) for x in a); print(s); OUT.write(s+"\n"); OUT.flush()
          # 지방행정인허가 업종 코드: 일반음식점 07_24_04_P, 휴게음식점 07_24_05_P, 제과점영업 07_24_06_P(추정), 관광식당 07_24_01_P 등
          kinds={"일반음식점":"07_24_04_P","휴게음식점":"07_24_05_P","제과점영업":"07_24_06_P","단란주점":"07_23_02_P","유흥주점":"07_23_01_P"}
          bases=["https://www.localdata.go.kr/datafile/each/{c}_CSV.zip","https://www.localdata.go.kr/datafile/each/{c}.csv","https://www.localdata.go.kr/datafile/each/{c}.xlsx"]
          def load(code):
              for b in bases:
                  u=b.format(c=code)
                  try:
                      r=requests.get(u,headers=UA,timeout=600)
                  except Exception as e:
                      p("  실패",u,e); continue
                  ct=r.headers.get("content-type",""); p("  ",u,r.status_code,len(r.content),ct)
                  if r.status_code!=200 or len(r.content)<10000: continue
                  data=r.content
                  try:
                      if data[:2]==b"PK" and u.endswith(".zip"):
                          z=zipfile.ZipFile(io.BytesIO(data)); n=[x for x in z.namelist() if x.lower().endswith(".csv")][0]; data=z.read(n)
                      if u.endswith(".xlsx"):
                          return pd.read_excel(io.BytesIO(data),dtype=str)
                      for enc in ("cp949","utf-8-sig","utf-8"):
                          try: return pd.read_csv(io.BytesIO(data),dtype=str,encoding=enc,low_memory=False)
                          except Exception: pass
                  except Exception as e:
                      p("  파싱 실패",e)
              return None
          summary={}
          for name,code in kinds.items():
              p(f"== {name} ({code})")
              df=load(code)
              if df is None: p("  받지 못함"); continue
              p("  전국 행",len(df)," 열:",list(df.columns)[:30])
              addr=None
              for c in df.columns:
                  if "주소" in c: 
                      m=df[c].fillna("").str.contains("대구광역시 달성군")
                      addr = m if addr is None else (addr|m)
              st=[c for c in df.columns if "영업상태" in c]
              d=df[addr] if addr is not None else df.iloc[0:0]
              p("  달성군 전체 행(폐업 포함)",len(d))
              for c in st: p("  ",c,d[c].value_counts().to_dict())
              live=d
              for c in st:
                  if c.endswith("명") and "상세" not in c: live=d[d[c].fillna("").str.contains("영업|정상")]
              p("  달성군 영업 중",len(live))
              for c in [c for c in df.columns if "업태" in c][:1]:
                  p("  업태별",live[c].value_counts().head(25).to_dict())
              ac=[c for c in df.columns if "도로명" in c and "주소" in c] or [c for c in df.columns if "주소" in c]
              if ac:
                  em=live[ac[0]].fillna("").str.extract(r"달성군\s+(\S+[읍면])")[0]
                  p("  읍면별",em.value_counts().to_dict())
              summary[name]=len(live)
              live.to_csv(f"out/{code}_dalseong_live.csv",index=False,encoding="utf-8-sig")
          # 포털에서 받은 달성군 휴게음식점 파일
          for f in glob.glob("raw_portal/**/*.csv",recursive=True)+glob.glob("raw_portal/**/*.xlsx",recursive=True):
              try:
                  if f.endswith(".xlsx"): d=pd.read_excel(f,dtype=str)
                  else:
                      d=None
                      for enc in ("cp949","utf-8-sig"):
                          try: d=pd.read_csv(f,dtype=str,encoding=enc); break
                          except Exception: pass
                  p("== 포털 파일",f,"행",len(d),"열",list(d.columns))
                  for c in d.columns:
                      if "업태" in c or "행정동" in c: p("  ",c,d[c].value_counts().head(30).to_dict())
              except Exception as e: p("  포털 파일 실패",f,e)
          # 새 지방행정인허가 파일 사이트 안내 페이지에서 내려받기 주소 찾기
          for slug in ("general_restaurants","rest_cafes","bakeries"):
              u=f"https://file.localdata.go.kr/file/{slug}/info"
              try:
                  r=requests.get(u,headers=UA,timeout=60); p("== 안내",u,r.status_code,len(r.text))
                  links=sorted(set(re.findall(r'(?:href|src|url)\s*[=:]\s*["\']([^"\']+)',r.text)))
                  p("  링크",[l for l in links if re.search(r'down|csv|zip|xlsx|file',l,re.I)][:40])
              except Exception as e: p("  실패",u,e)
          p("== 요약",json.dumps(summary,ensure_ascii=False))
          PY
          python3 c.py
          echo "exit=$?"
      - name: 결과 커밋(임시 브랜치)
        if: always()
        run: |
          git init -q res && cd res
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git fetch -q --depth 1 origin "${GITHUB_REF_NAME}" && git checkout -q FETCH_HEAD
          mkdir -p tmp/food && cp ../out/*.txt tmp/food/ 2>/dev/null
          git config user.name dalgubul-bot; git config user.email bot@users.noreply.github.com
          git add -f tmp/food && git commit -q -m "tmp: 달성군 외식업소 집계 결과 [skip ci]" && git push -q origin HEAD:"${GITHUB_REF_NAME}"
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dalseong-food-${{ github.run_id }}
          path: out
          retention-days: 7
