name: 기관 관리지침 받기 — 국내 러너 (미국에서 접속 안 되는 기관)

# 대구기계부품연구원(dmi)·케이메디허브(kmedi)·한국로봇산업진흥원(kiria)은 미국 GitHub 러너에서 접속 시간 초과·연결 끊김이라
# 국내 self-hosted 러너(라벨 korea, research_kr.yml 과 같은 러너)로 받는다. 러너가 없으면 대기 상태로 머무르므로 수동 실행만 둔다.
# 러너 없이 하려면 국내 PC 에서 `pip install -r scripts/requirements.txt playwright pyhwp && python -m playwright install chromium` 뒤
# `python3 scripts/fetch_guideline_docs.py --only dmi,kmedi,kiria` 를 돌리고 data/guidelines 를 커밋한다(원본 data/raw 는 커밋하지 않는다).

on:
  workflow_dispatch:
    inputs:
      only:
        description: "기관 key (쉼표 구분)"
        required: false
        default: "dmi,kmedi,kiria,ttp"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: [self-hosted, korea]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r scripts/requirements.txt playwright openpyxl pyhwp && python -m playwright install chromium
      - name: 받기·본문 추출
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set +e
          python3 scripts/fetch_guideline_docs.py --only "$ONLY"
          echo "exit=$?"
      - name: 커밋
        run: |
          git config user.name dalgubul-bot
          git config user.email bot@users.noreply.github.com
          git add -A data/guidelines
          git diff --cached --quiet && echo "변경 없음" || git commit -m "chore: 기관 관리지침 받기(국내 러너) $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"
