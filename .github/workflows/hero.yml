name: 리포트 대표 그림 생성 (Gemini, 수동)

# format: insight 리포트의 hero.png 를 (다시) 만든다. 이 세션 환경은 외부 접속이 막혀 있어 Actions 가 대신 한다.
on:
  workflow_dispatch:
    inputs:
      post:
        description: "글 파일 이름(확장자 없이, 예: 2026-09-27-policy-healthcare-medical-data). 비우면 hero 없는 발행 리포트 전부"
        required: false
        default: ""
      force:
        description: "있어도 다시 만들기"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: 생성
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          POST: ${{ inputs.post }}
          FORCE: ${{ inputs.force }}
        run: |
          args=""; [ "$FORCE" = "true" ] && args="--force"
          if [ -n "$POST" ]; then python3 scripts/gen_hero.py "src/content/posts/$POST.md" $args; else python3 scripts/gen_hero.py --all $args; fi
      - name: 커밋
        run: |
          git config user.name dalgubul-bot
          git config user.email bot@users.noreply.github.com
          git add public/figures
          git diff --cached --quiet && echo "변경 없음" || git commit -m "figures: 리포트 대표 그림 생성 $(date -u +%Y-%m-%d)"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"
  deploy:
    needs: hero
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
    secrets: inherit
