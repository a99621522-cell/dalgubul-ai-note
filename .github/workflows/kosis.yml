name: 통계청 KOSIS 통계표 받기

# config/kosis_tables.yml 의 표를 KOSIS 공유서비스에서 받아 data/kosis/ 에 커밋한다(대구 행만).
# 키는 Secrets KOSIS_KEY 하나. 없으면 받지 않고 끝난다. 이 세션 환경은 kosis.kr 이 막혀 있어 Actions 가 대신 돈다.
# discover=true 면 tbl_id 가 빈 표의 후보를 로그에 찍기만 한다(커밋 없음).

on:
  schedule:
    - cron: "17 19 8 * *"      # 매월 9일 04:17 KST — 전체 다시 받기(수정값 반영)
    - cron: "17 4 * * *"       # 매일 13:17 KST — 새 시점이 올라온 표만(--check). 통계청·중기부 공표는 대개 08:00·12:00(2026-10-16 운영자 '언제 업데이트 되는지 보고 자동으로 받아와')
  workflow_dispatch:
    inputs:
      check:
        description: "새 시점이 올라온 표만 받기(true)"
        required: false
        default: "false"
      only:
        description: "표 key (쉼표 구분, 비우면 전부)"
        required: false
        default: ""
      discover:
        description: "tbl_id 가 빈 표의 후보 검색만(true)"
        required: false
        default: "false"
      list:
        description: "통계목록 트리에서 낱말이 든 표 번호 찾기(예: 전국사업체조사 시도). 비우면 안 함"
        required: false
        default: ""
      probe:
        description: "표 key 하나의 메타·최소 요청 응답 찍기(오류 21 원인 확인). 비우면 안 함"
        required: false
        default: ""
      meta:
        description: "표 key(쉼표)의 항목·분류 메타를 data/kosis/<key>.meta.json 으로 저장·커밋. 비우면 안 함"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: kosis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    # 미국 러너는 IP 에 따라 kosis.kr 연결이 처음부터 시간 초과다(2026-09-28: 3번 중 1번 성공). 러너 3개를 동시에 띄워
    # 어느 하나라도 통하면 커밋한다(같은 내용이면 나머지는 '변경 없음'). 스크립트는 첫 연결이 막히면 종료 코드 75 로 바로 끝난다.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r scripts/requirements.txt
      - name: 받기
        env:
          KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
          PYTHONUNBUFFERED: "1"      # 취소·중단돼도 --list·--discover 출력이 로그에 남게(2026-09-28: 33분 뒤 취소했더니 출력 0줄)
        run: |
          if [ -n "${{ inputs.meta }}" ]; then python3 scripts/fetch_kosis.py --meta "${{ inputs.meta }}"; exit 0; fi
          if [ -n "${{ inputs.probe }}" ]; then python3 scripts/fetch_kosis.py --probe "${{ inputs.probe }}"; exit 0; fi
          if [ -n "${{ inputs.list }}" ]; then [ "${{ matrix.attempt }}" = "1" ] && python3 scripts/fetch_kosis.py --list "${{ inputs.list }}"; exit 0; fi   # 목록 검색은 러너 하나만(셋이 같이 돌면 1분 200건 한도에 걸린다)
          if [ "${{ inputs.discover }}" = "true" ]; then python3 scripts/fetch_kosis.py --discover ${{ inputs.only && format('--only {0}', inputs.only) || '' }}; exit 0; fi
          CHECK=""; { [ "${{ github.event.schedule }}" = "17 4 * * *" ] || [ "${{ inputs.check }}" = "true" ]; } && CHECK="--check"
          python3 scripts/fetch_kosis.py $CHECK ${{ inputs.only && format('--only {0}', inputs.only) || '' }} || { rc=$?; [ "$rc" = "75" ] && echo "::warning::이 러너(attempt ${{ matrix.attempt }})는 kosis.kr 연결 불가" && exit 0; exit $rc; }
      - name: 커밋
        if: inputs.discover != 'true' && inputs.list == '' && inputs.probe == ''
        run: |
          git config user.name dalgubul-bot
          git config user.email bot@users.noreply.github.com
          python3 scripts/structure_index.py > /dev/null 2>&1 || true
          python3 scripts/render_kosis.py || true
          python3 scripts/growth_backtest.py > /dev/null 2>&1 || true   # 성장 계산기 되돌려 보기(data/growth/backtest.json)
          git add data/kosis src/generated/kosis data/growth/backtest.json
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "data: KOSIS 통계표 갱신 $(date -u +%Y-%m-%d)"
          # 러너 3개가 같은 표를 받아 동시에 커밋하면 summary.md 가 충돌한다(2026-09-28: 데이터 커밋 2개가 밀려 사라짐).
          # 충돌하면 summary.md 는 내 쪽 JSON 으로 다시 만들어 이어 간다
          for i in 1 2 3 4; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            if ! git rebase -q "origin/${GITHUB_REF_NAME}"; then
              git checkout --theirs -- data/kosis/summary.md 2>/dev/null || true
              python3 scripts/fetch_kosis.py --summary >/dev/null 2>&1 || true
              git add -A data/kosis src/generated/kosis
              GIT_EDITOR=true git rebase --continue || { git rebase --abort; sleep $((i * 5)); continue; }
            fi
            git push origin HEAD:"${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done

  # 데이터 커밋은 GITHUB_TOKEN 으로 올라가 deploy.yml(push 트리거)을 깨우지 않는다 — 이 실행에서 data/kosis 가 바뀌었으면 바로 배포
  changed:
    needs: fetch
    if: always() && github.ref_name == 'main' && inputs.discover != 'true' && inputs.list == '' && inputs.probe == '' && inputs.meta == ''
    runs-on: ubuntu-latest
    outputs:
      yes: ${{ steps.c.outputs.yes }}
      welfare: ${{ steps.c.outputs.welfare }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 30 }
      - id: c
        run: |
          n=$(git log --since="90 minutes ago" --grep="data: KOSIS" --format=%H -- data/kosis | wc -l)
          echo "이 실행 뒤 data/kosis 커밋 $n 개"; [ "$n" -gt 0 ] && echo "yes=1" >> "$GITHUB_OUTPUT" || true
          # 복지 분야 표(welfare-*)가 바뀌었으면 복지 사이트도 다시 올린다(운영자 지시 2026-10-21 '통계청 자료가 업데이트 되면 자동으로 반영해')
          w=$(git log --since="90 minutes ago" --grep="data: KOSIS" --format=%H -- 'data/kosis/welfare-*' | wc -l)
          [ "$w" -gt 0 ] && echo "welfare=1" >> "$GITHUB_OUTPUT" || true
  deploy:
    needs: changed
    if: needs.changed.outputs.yes == '1'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
  welfare_deploy:
    needs: changed
    if: needs.changed.outputs.welfare == '1'
    uses: ./.github/workflows/welfare_site.yml
    with:
      ref: main
    secrets: inherit
