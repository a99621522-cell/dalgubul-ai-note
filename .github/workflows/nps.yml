name: 월간 국민연금 사업장 수집 → 통계 집계 → 그래프 → 배포

# 공공데이터포털 "국민연금 가입 사업장 내역"을 받아 대구만 data/nps/YYYYMM.csv 로 저장하고,
# build_stats.py → render_charts.py 를 이어 돌린 뒤 커밋·배포한다.
# 이 세션 환경(claude.ai)은 포털 접속이 막혀 있어 Actions 가 대신 받는다.
# 필요: Secrets DATA_GO_KR_KEY (공공데이터포털 일반 인증키, 해당 API 활용신청), scripts/sources.yml 의 nps.api (이번 달 uddi 주소)
#      또는 workflow_dispatch 입력 api_url 로 주소를 넘긴다.

on:
  schedule:
    - cron: "0 21 5 * *"      # 매월 6일 06:00 KST (포털 월별 갱신 뒤, 재시도)
    - cron: "0 21 27 * *"     # 매월 28일 06:00 KST — 포털은 매달 23~26일쯤 전월 자료로 갈아끼우므로 그때 바로 받아 달마다 빠짐없이 쌓는다(2026-10-06: 포털에는 최신 한 달 파일만 있어 과거 소급 불가)
  workflow_dispatch:
    inputs:
      api_url:
        description: "odcloud API 주소 (비우면 sources.yml nps.api)"
        required: false
      month:
        description: "YYYYMM (자료에 기준월이 없을 때만)"
        required: false

permissions:
  contents: write

concurrency:
  group: nps-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: 국민연금 사업장 수집 (대구)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          API_URL: ${{ inputs.api_url }}
          MONTH: ${{ inputs.month }}
        run: |
          set +e
          # 키가 있으면 오픈API, 없으면 포털 파일데이터(15083277)를 그대로 받아 대구만 거른다(키 불필요). 파일명의 자료생성년월로 data/nps/YYYYMM.csv 가 정해져 같은 달은 덮어쓰고 새 달은 쌓인다
          if [ -n "$DATA_GO_KR_KEY" ]; then
            python3 scripts/collect_nps.py ${API_URL:+--url "$API_URL"} ${MONTH:+--month "$MONTH"}
          else
            echo "DATA_GO_KR_KEY 없음 → 포털 파일로 받음"
            python3 scripts/fetch_datago.py --save 15083277 --max 1
            for f in data/raw/15083277/*.csv; do [ -f "$f" ] && python3 scripts/collect_nps.py --file "$f" ${MONTH:+--month "$MONTH"}; done
          fi
          ls -la data/nps/*.csv
          # 팩토리온에 없는 사업장 → 산단 외 기업(fetch_public 의 save 단계와 같은 처리)
          python3 scripts/nps_to_extra.py && python3 scripts/import_extra.py --replace-source '국민연금' && rm -f scripts/data/extra/nps_*.csv
          python3 scripts/sites.py
          true
      - name: 월간 통계 집계 · 그래프 생성
        run: |
          python3 scripts/build_stats.py --backfill
          python3 scripts/render_charts.py
          python3 scripts/write_monthly_report.py   # 월보 초안(draft) — 발행은 approve.py 로
      - name: 커밋
        run: |
          git config user.name "dalgubul-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/nps data/stats src/generated src/content/posts scripts/data/extra_companies.csv scripts/data/company_tags.csv scripts/data/company_facts.csv
          git diff --cached --quiet && echo "변경 없음" || git commit -m "chore: 국민연금 사업장 수집·월간 통계 $(date -u +%Y-%m-%d)"
          git push

  deploy:
    needs: collect
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
