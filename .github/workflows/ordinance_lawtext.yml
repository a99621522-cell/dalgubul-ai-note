# 자치법규 정비 검토 — 법제처 회신 쟁점 대조용 현행 법령 전문(scripts/ordin/lawtext.py, config/ordinance_lawtext.yml → data/ordinance/lawtext/).
name: 자치법규 정비 검토 — 현행 법령 전문

on:
  workflow_dispatch:
  push:
    branches: [ccr-a1fc4817-w0vo95]
    paths: ["config/ordinance_lawtext.yml", "scripts/ordin/lawtext.py"]

permissions:
  contents: write

concurrency:
  group: ordinance-lawtext
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r scripts/requirements.txt
      - env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: python3 -u scripts/ordin/lawtext.py
      - name: 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ordinance/lawtext || true
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "chore: 법제처 회신 대조용 현행 법령 전문 $(date +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 7; done
