# 자치법규 정비 검토 — 조례 관련 대법원 판례 수집(scripts/ordin/fetch_prec.py, 국가법령정보센터 판례 API).
# data/ordinance/prec_run.txt 를 바꿔 푸시하거나 매월 1일. 새 판례만 받는다.
name: 자치법규 정비 검토 — 대법원 판례

on:
  schedule:
    - cron: "10 20 1 * *"
  workflow_dispatch:
  push:
    branches: [ccr-a1fc4817-w0vo95]
    paths: ["data/ordinance/prec_run.txt", "scripts/ordin/fetch_prec.py"]

permissions:
  contents: write

concurrency:
  group: ordinance-prec
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r scripts/requirements.txt
      - env:
          LAW_OC: ${{ secrets.LAW_OC }}
          BUDGET_MIN: "100"
        run: python3 -u scripts/ordin/fetch_prec.py || true
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ordinance/prec || true
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "chore: 조례 관련 대법원 판례 $(date +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 7; done
