name: 정책제안 리포트 발행 (루틴 브랜치 → main)

# 정책제안 리포트 루틴(Claude 루틴, 세션은 main 에 직접 푸시할 수 없다)이 claude/policy-reports 브랜치에 푸시하면
# 이 워크플로가 main 에 병합하고, 브랜치에서 온 리포트를 전부 draft 로 강제한 뒤(운영자 지시 2026-09-28: 초안으로만, 발행은 운영자가 approve.py 로),
# 발행본(draft: false)을 scripts/review_report.py 로 다시 검사해 미달은 draft 로 되돌리고 main 에 푸시·배포한다.
# GITHUB_TOKEN 으로 한 푸시는 다른 워크플로를 깨우지 않으므로 배포는 여기서 deploy.yml 을 직접 부른다.

on:
  push:
    branches: ["claude/policy-reports", "claude/policy-reports-*"]
  workflow_dispatch:
    inputs:
      branch:
        description: "병합할 브랜치"
        required: false
        default: "claude/policy-reports"

permissions:
  contents: write

concurrency:
  group: publish-reports
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: main 에 병합
        id: merge
        env:
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          git config user.name dalgubul-bot
          git config user.email bot@users.noreply.github.com
          git fetch origin "$BRANCH"
          if git merge --no-ff -m "publish: 정책제안 리포트 병합 ($BRANCH) $(date -u +%Y-%m-%d)" "origin/$BRANCH"; then
            echo "merged=1" >> "$GITHUB_OUTPUT"
          else
            echo "병합 충돌 — 리포트 파일만 브랜치 쪽으로 받고 나머지는 main 유지"
            git checkout --theirs -- src/content/posts docs/strategy/proposals 2>/dev/null || true
            git add -A src/content/posts docs/strategy/proposals
            if git diff --cached --quiet; then git merge --abort; echo "merged=0" >> "$GITHUB_OUTPUT"; exit 0; fi
            git checkout --ours -- . 2>/dev/null || true
            git add -A
            git commit -m "publish: 정책제안 리포트 병합(충돌은 리포트만 반영) ($BRANCH) $(date -u +%Y-%m-%d)"
            echo "merged=1" >> "$GITHUB_OUTPUT"
          fi
      - name: 브랜치에서 온 리포트는 초안으로만 (운영자 지시 2026-09-28)
        if: steps.merge.outputs.merged == '1'
        run: |
          set +e
          # 병합으로 바뀐 리포트 파일만 draft: true 로 강제한다(운영자가 approve.py 로 발행한 기존 리포트는 건드리지 않음)
          for f in $(git diff --name-only HEAD^1 HEAD -- 'src/content/posts/*-policy-*.md'); do
            [ -f "$f" ] && grep -qE '^draft:\s*false' "$f" && sed -i -E '0,/^draft:\s*false/s//draft: true   # 초안으로만(운영자 지시 2026-09-28)/' "$f" && echo "draft 로: $f"
          done
          git add src/content/posts
          git diff --cached --quiet || git commit -m "publish: 루틴 리포트는 초안으로만 $(date -u +%Y-%m-%d)"
      - name: 발행본 재검사 → 미달은 draft 로
        if: steps.merge.outputs.merged == '1'
        run: |
          set +e
          python3 scripts/review_report.py --published --json > /tmp/review.json
          python3 scripts/review_report.py --published
          python3 - <<'PY'
          import json, re, pathlib
          rs = json.load(open("/tmp/review.json"))
          for r in [r for r in rs if not r["ok"]]:
              p = pathlib.Path(r["file"]); t = p.read_text(encoding="utf-8")
              p.write_text(re.sub(r"^draft:\s*false", "draft: true", t, count=1, flags=re.M), encoding="utf-8")
              print("draft 로 되돌림:", r["file"], "|", "; ".join(r["errors"])[:300])
          PY
          git add src/content/posts
          git diff --cached --quiet || git commit -m "review: 품질 기준 미달 정책제안 리포트를 draft 로 되돌림 $(date -u +%Y-%m-%d)"
      - name: 대표 그림 생성 (format insight, hero.png 없는 리포트만 · Gemini)
        if: steps.merge.outputs.merged == '1'
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          pip install -q requests
          python3 scripts/gen_hero.py --all || true
          git add public/figures
          git diff --cached --quiet || git commit -m "figures: 리포트 대표 그림 생성 $(date -u +%Y-%m-%d)"
      - name: 한글 파일 생성 (발행 리포트 전부, 양식 scripts/data/hwpx)
        if: steps.merge.outputs.merged == '1'
        run: |
          pip install -q pyyaml pillow
          sudo apt-get install -y -qq librsvg2-bin fonts-noto-cjk > /dev/null   # 그림 SVG → PNG(한글 글꼴 포함)
          python3 scripts/hwpx_report.py --all || true
          git add public/hwpx
          git diff --cached --quiet || git commit -m "hwpx: 정책제안 리포트 한글 파일 갱신 $(date -u +%Y-%m-%d)"
      - name: main 푸시
        if: steps.merge.outputs.merged == '1'
        run: |
          git pull --rebase origin main || true
          git push origin HEAD:main
  deploy:
    needs: merge
    if: needs.merge.outputs.merged == '1'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
    secrets: inherit
