name: 정책제안 리포트 발행 (루틴 브랜치 → main)

# 정책제안 리포트 루틴(Claude 루틴, 세션은 main 에 직접 푸시할 수 없다)이 claude/policy-reports 브랜치에 푸시하면
# 이 워크플로가 main 에 병합하고, 발행본(draft: false)을 scripts/review_report.py 로 다시 검사해 미달은 draft 로 되돌린 뒤 main 에 푸시하고 배포한다.
# GITHUB_TOKEN 으로 한 푸시는 다른 워크플로를 깨우지 않으므로 배포는 여기서 deploy.yml 을 직접 부른다.

on:
  push:
    branches: ["claude/policy-reports", "claude/policy-reports-*"]
  workflow_dispatch:
    inputs:
      branch:
        description: "병합할 브랜치"
        required: false
        default: "claude/policy-reports"

permissions:
  contents: write

concurrency:
  group: publish-reports
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: main 에 병합
        id: merge
        env:
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          git config user.name dalgubul-bot
          git config user.email bot@users.noreply.github.com
          git fetch origin "$BRANCH"
          if git merge --no-ff -m "publish: 정책제안 리포트 병합 ($BRANCH) $(date -u +%Y-%m-%d)" "origin/$BRANCH"; then
            echo "merged=1" >> "$GITHUB_OUTPUT"
          else
            echo "병합 충돌 — 리포트 파일만 브랜치 쪽으로 받고 나머지는 main 유지"
            git checkout --theirs -- src/content/posts docs/strategy/proposals 2>/dev/null || true
            git add -A src/content/posts docs/strategy/proposals
            if git diff --cached --quiet; then git merge --abort; echo "merged=0" >> "$GITHUB_OUTPUT"; exit 0; fi
            git checkout --ours -- . 2>/dev/null || true
            git add -A
            git commit -m "publish: 정책제안 리포트 병합(충돌은 리포트만 반영) ($BRANCH) $(date -u +%Y-%m-%d)"
            echo "merged=1" >> "$GITHUB_OUTPUT"
          fi
      - name: 발행본 재검사 → 미달은 draft 로
        if: steps.merge.outputs.merged == '1'
        run: |
          set +e
          python3 scripts/review_report.py --published --json > /tmp/review.json
          python3 scripts/review_report.py --published
          python3 - <<'PY'
          import json, re, pathlib
          rs = json.load(open("/tmp/review.json"))
          for r in [r for r in rs if not r["ok"]]:
              p = pathlib.Path(r["file"]); t = p.read_text(encoding="utf-8")
              p.write_text(re.sub(r"^draft:\s*false", "draft: true", t, count=1, flags=re.M), encoding="utf-8")
              print("draft 로 되돌림:", r["file"], "|", "; ".join(r["errors"])[:300])
          PY
          git add src/content/posts
          git diff --cached --quiet || git commit -m "review: 품질 기준 미달 정책제안 리포트를 draft 로 되돌림 $(date -u +%Y-%m-%d)"
      - name: main 푸시
        if: steps.merge.outputs.merged == '1'
        run: |
          git pull --rebase origin main || true
          git push origin HEAD:main
  deploy:
    needs: merge
    if: needs.merge.outputs.merged == '1'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
    secrets: inherit
