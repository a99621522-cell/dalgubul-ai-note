name: 사이트 확인 (robots.txt + 첫 화면 링크)

# 소스를 추가하기 전에 robots.txt 와 첫 화면 메뉴 링크만 로그로 본다(첫 화면 1회, 다른 쪽은 열지 않음). 저장소 변경 없음.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "확인할 주소"
        required: true
      render:
        description: "JS 로 그리는 화면이면 true(브라우저로 연다)"
        required: false
        default: "false"
      dump:
        description: "표·선택 상자·스크립트 속 주소까지 찍기(true)"
        required: false
        default: "false"
      text:
        description: "기사·공지 한 쪽의 제목·날짜·본문 글자만 찍기(true) — 운영자가 준 링크를 세션이 읽을 때"
        required: false
        default: "false"
      raw:
        description: "응답 본문 앞 3,000자를 그대로 찍기(true) — XML·JSON 오픈API 확인용"
        required: false
        default: "false"
      xhr:
        description: "화면이 숫자를 받아 오는 내부 요청(XHR)을 찍기(true, 브라우저로 연다)"
        required: false
        default: "false"
      datalab:
        description: "한국관광 데이터랩 화면이면 true — 스크립트 속 qid 를 모아 지역 코드로 다시 불러 본다. click 칸에 '27:40'(지역:qid 수, 27=대구) — qid 수 0 이면 화면을 대구로 그려 글자를 찍고, '27:0:방문자,관광소비' 처럼 탭을 누른다"
        required: false
        default: "false"
      file:
        description: "주소가 첨부 파일이면 true — 받아서 형식·시트·표 머리와 click 칸 낱말(기본 대구,지역,시도)이 든 줄을 찍는다"
        required: false
        default: "false"
      click:
        description: "xhr 때 연 뒤 차례로 누를 글자(쉼표로 구분, 예: 지역,대구)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r scripts/requirements.txt
      - if: inputs.render == 'true' || inputs.xhr == 'true' || inputs.datalab == 'true'
        run: pip install -q playwright && python -m playwright install --with-deps chromium
      - if: inputs.datalab == 'true'
        env:
          URL: ${{ inputs.url }}
          SGG: ${{ inputs.click }}
        run: |
          IFS=: read -r A B C <<< "$SGG"
          python3 scripts/datalab_probe.py "$URL" "${A:-27}" "${B:-40}" "$C"
      - if: inputs.file == 'true'
        env:
          URL: ${{ inputs.url }}
          WORDS: ${{ inputs.click }}
        run: pip install -q openpyxl && python3 scripts/file_probe.py "$URL" "$WORDS"
      - if: inputs.xhr == 'true' && inputs.datalab != 'true' && inputs.file != 'true'
        env:
          URL: ${{ inputs.url }}
          CLICK: ${{ inputs.click }}
        run: python3 scripts/site_probe.py "$URL" --xhr --click "$CLICK"
      - if: inputs.xhr != 'true' && inputs.datalab != 'true' && inputs.file != 'true'
        run: python3 scripts/site_probe.py "${{ inputs.url }}" $([ "${{ inputs.render }}" = "true" ] && echo --render) $([ "${{ inputs.dump }}" = "true" ] && echo --dump) $([ "${{ inputs.text }}" = "true" ] && echo --text) $([ "${{ inputs.raw }}" = "true" ] && echo --raw)
