# 예산서·사업설명자료 수집 대상 (scripts/fetch_budget_docs.py, .github/workflows/fetch_budget.yml)
# 각 기관의 seeds 페이지에서 link_pattern 에 맞는 글·첨부를 따라가 PDF·HWP·HWPX·XLSX 를 받는다(같은 호스트, 최대 2단계).
# 받은 파일은 data/raw/budget/<key>/ (artifact) → 본문 텍스트는 data/budget/<key>/*.txt.gz, 색인 index.json.
# parse: true 면 budget_year 의 '사업설명자료' 본문을 scripts/parse_budget.py 로 읽어 scripts/data/programs_budget_<key>.csv 를 만든다(programs_<key>.csv 는 덮어쓰지 않음).
# 공공기관 사이트만, robots.txt 존중, 하루 1회. 평가 없음.
version: 2026-09-25
link_pattern: "사업설명자료|사업\\s*설명|예산\\s*및\\s*기금운용계획|기금운용계획|세입\\s*세출\\s*예산|세출예산|사업예산서|예산서|예산안|성과계획서|예산\\s*편성"
exclude_pattern: "채용|입찰|결산검사|결산서|회계연도\\s*결산|지침|편성지침|작성지침|보도자료"
file_ext: "pdf|hwpx?|xlsx?|zip"
max_files_per_org: 40
min_year: 2025        # 글자에 연도가 있고 이보다 오래된 첨부(예: '24년 공통요구자료')는 받지 않는다
budget_year: 2026     # 사업설명자료 파싱 대상 연도
organizations:
  - key: motie
    name: 산업통상부
    ministry: 산업통상부
    parse: true
    seeds: ["https://motie.go.kr/kor/article/ATCL3f70bb6cf", "https://www.motir.go.kr/kor/article/ATCL3f70bb6cf/48/view"]
  - key: msit
    name: 과학기술정보통신부
    ministry: 과학기술정보통신부
    parse: true
    seeds: ["https://www.msit.go.kr/contents/cont.do?sCode=user&mPid=259&mId=287", "https://www.msit.go.kr/publicinfo/list.do"]
  - key: mss
    name: 중소벤처기업부
    ministry: 중소벤처기업부
    parse: true
    seeds: ["https://www.mss.go.kr/site/smba/ex/bbs/List.do?cbIdx=621", "https://www.mss.go.kr/site/smba/ex/bbs/List.do?cbIdx=128"]
  - key: daegu
    name: 대구광역시
    ministry: 대구광역시
    parse: false
    seeds: ["https://jumin.daegu.go.kr/budget/information/informationBudgetBill.do", "https://jumin.daegu.go.kr/budget/information/informationSummary.do", "https://www.daegu.go.kr/public/index.do?menu_id=00934040"]
