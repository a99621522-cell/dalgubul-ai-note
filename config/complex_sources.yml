# 대구 산업단지 관리기관 누리집의 분기 생산·수출·고용 자료(운영자 지시 2026-10-12 '대구시 개별 산단 홈페이지 들어가서 조사해서 올려').
# scripts/fetch_complex_reports.py 가 게시판 목록 → 제목이 title 에 맞는 글 → 첨부 이름이 files 에 맞는 PDF 를 받아 글자를 data/complexes/raw/ 에 둔다.
# 입주업체 명단 첨부(대표자 등 개인정보가 섞일 수 있음)는 받지 않는다. robots.txt 를 지킨다.
# 조사 결과(2026-10-12, 미국 GitHub 러너 기준):
#   성서(1~5차·인쇄출판밸리) — 대구성서산업단지관리공단 seongseo.or.kr '경기동향' 게시판, 분기마다 단지별 입주현황(생산·수출·고용)·경기동향 보고서 PDF. 수집함
#   서대구 — 서대구산업단지관리공단 seodaegu.or.kr (robots 허용) — 입주업체 명단(대표자 이름 포함, 받지 않음)만 있고 생산 자료 없음
#   달성1차 — 달성1차산업단지관리공단 dalin.or.kr (robots 없음) — 월간 「달성1차산업단지 뉴스」 PDF 의 'N월 중 현황'(생산·수출·가동률·입주·고용, 두 달 전 값). 수집함(spa)
#   대구염색 — 대구염색산업단지관리공단 dyecen.or.kr — robots.txt 가 전체 차단(Disallow: /)이라 수집하지 않음
#   대구국가·달성2차 — 한국산업단지공단 관리(kicox.or.kr) — 미국 러너 SSL 차단
#   대구제3·검단 등 — 관리기관 누리집 주소 못 찾음
# 다시 조사(2026-10-18, 운영자 '다른 산단은 산단별 홈페이지 이런 곳을 찾아봐'):
#   단지별 관리기관(대구시 「산업단지 기업 등록현황」 공공데이터포털 15073542 의 관할조직명): 성서 1~5차·출판 = 대구성서산업단지관리공단, 서대구 = 서대구산업단지관리공단,
#     제3 = 대구제3산업단지관리공단, 검단·금호워터폴리스·이시아폴리스(·율하) = 대구시티밸리산업단지관리공단, 국가·달성2차 = 한국산업단지공단 대구지역본부 달성사무소,
#     달성1차 = 달성1차산업단지관리공단, 염색 = 대구염색산업단지관리공단, 테크노폴리스·연구개발특구 = 연구개발특구진흥재단 대구연구개발특구본부·대구경북경제자유구역청,
#     옥포·구지 = 달성군, 군위·효령 = 군위군
#   대구제3 — dg3rd.or.kr 은 미국 러너에 HTTP 403(해외 차단으로 보임). 대구시티밸리 — 누리집 주소 못 찾음. 대구경북경제자유구역청 dgfez.go.kr — 연결 시간 초과·화면 스크립트
#   대신 KOTRA 「대구 투자환경」 누리집 '전체 산업단지 현황'(investkorea.org/dg-kr/cntnts/i-2972/web.do)에 24개 단지 모두의 입주업체·종업원·연 매출액·관리기관 표가 있어
#   scripts/fetch_complex_overview.py 가 받는다(→ data/complexes/overview.csv, 현황판 #complex-sales). 대구시가 언론에 준 '산업단지 가동률·매출 현황'은 공개 원문이 없어 쓰지 않음
