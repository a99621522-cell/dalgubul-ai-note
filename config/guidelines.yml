# 사업 지침 창고 — 중앙부처·대구시 지원사업의 예산요구서·결산서를 지침대로 작성·집행했는지 검토할 때 근거가 되는 법령·행정규칙·자치법규·사업 관리지침 목록.
# 운영자 지시 2026-09-27 「각 사업별 사업 지침을 조사해 기업지원기관이 작성한 예산요구서나 결산서가 지침대로 작성·집행되었는지 검토할 수 있게」.
#
# 읽는 코드: scripts/fetch_guidelines.py (국가법령정보센터 law.go.kr 에서 본문을 받아 data/guidelines/<key>.txt.gz + index.json),
#           scripts/guideline_check.py (지침 본문에서 검토 항목 초안 → data/guidelines/checks/<key>.json, 운영자 검토 뒤 사이트 검토표),
#           src/pages/programs/guidelines/ (지침 목록·검토표, 사업 DB 와 규칙으로 연결).
# 원칙: 공개된 법령·고시·조례만(법령은 공공저작물). 사업별 내부 지침(비공개)은 넣지 않는다. 지침 내용을 평가하지 않고 조문을 그대로 인용한다.
# source.type: law(법령) | admrul(행정규칙: 고시·예규·훈령) | ordin(자치법규: 조례·규칙) | url(부처 홈페이지 첨부). name 은 law.go.kr 의 한글 주소(공백 없음).
# verify: true 는 이름·존재를 아직 확인하지 않은 항목 — fetch_guidelines.py 가 못 찾으면 index.json 에 '없음' 으로 남기고, 운영자가 이름을 바로잡는다.
# applies: layer(국비|시비|기관), ministry(소관), program_type(R&D|보조금|출연|위탁|융자|창업|전체), name_pattern(사업명 정규식, 선택). 사업 DB 의 사업마다 맞는 지침을 이 규칙으로 고른다.
# review: 이 지침이 검토 근거가 되는 문서 — 예산요구서(편성 단계) / 집행(집행 단계) / 결산서(정산 단계).
version: 2026-09-27

