# 한글(HWPX) 양식과 역할 ↔ 양식 문단 인덱스 (docs/prompts/site_hwpx_skill.md 3절, 2026-10-06)
# 스킬 .claude/skills/hwpx-autofill-conversion/SKILL.md 의 "top[3]·[8]·[12]·[15]·[17]·[19]~[24]·[64]" 인덱스를 파일로 옮겼다.
# 양식 파일을 갈아끼우면 `python3 scripts/hwpx_template.py --detect scripts/data/hwpx/<양식>.hwpx` 로 후보를 보고 여기 인덱스를 고친 뒤
# `python3 scripts/hwpx_template.py` 로 public/hwpx/template.json 을 다시 내보낸다. 로고·직인 그림·부서·담당·연락처 칸은 쓰지 않는다(지운다).
forms:
  report_basic:
    file: scripts/data/hwpx/report_basic.hwpx
    use: 정책제안 리포트(hwpx_report.py)·브라우저 산출물(template.json)·시험 파일(hwpx_test.py)
    paper: { width: 59528, height: 84188, margin_lr: 5669, margin_tb: 4251, text_w: 48188 }   # A4 세로, HWPUNIT(1/7200 인치)
    fonts: { gothic: 0, myeongjo: 5 }            # header.xml 글꼴 id: 맑은 고딕 / 휴먼명조 (양식이 가진 글꼴만 참조)
    paragraphs:
      secpr: 0            # 용지·구역 설정 문단(그대로 둔다, 머리말·꼬리말 ctrl 은 뺀다)
      cover_title: 3      # 표지 제목(이전 양식 복제 방식에서만 씀)
      cover_date: 8
      toc: 12
      section_head: 15    # 절 머리표(Ⅰ Ⅱ …)
      h1_box: 17          # □ HY헤드라인M 15
      levels: [19, 20, 21, 22, 23, 24]   # ○ 휴먼명조 14 / - 14 / ※ 11 단계
      table_proto: 64     # 표 원형(hp:tbl) — design_table·merge_table 이 복제
    styles: hwpx_report.py PARA_SPECS·CHAR_SPECS·BORDER_SPECS 를 header.xml 에 덧붙인다(id 는 양식 itemCnt 다음부터)
  report_summary:
    file: scripts/data/hwpx/report_summary.hwpx
    use: 정책제안 리포트 한 쪽 요약(hwpx_report.py build_summary, 양식 문단 복제)
    paragraphs: { secpr: 0 }
