# 대구 주력산업 그룹 매핑표 — 기업 DB의 업종코드(KSIC)와 업종명·생산품을 11개 그룹으로 묶는다.
# 규칙은 이 파일에만 둔다. 읽는 코드: scripts/industry.py (Python), src/lib/industry.ts (Astro).
#
# 판정 순서
#   1. ksic: 업종코드가 가장 긴 접두어와 일치하는 그룹 (5자리 > 3자리 > 2자리)
#      단, keyword_first 에 있는 접두어는 2단계 키워드를 먼저 본다 (개정판이 섞여 같은 코드가 다른 뜻인 경우)
#   2. keywords: 업종명 + 생산품 문자열에 키워드가 있는 그룹 (아래 groups 순서가 우선순위)
#   3. 어느 것에도 안 걸리면 미분류 → data/stats/unclassified.csv
#
# 참고: 팩토리온 파일의 업종코드는 대부분 KSIC 10차(2017)지만 8차·9차 코드가 섞여 있다.
#   34 = 10차 '산업용 기계·장비 수리업' / 8차 '자동차·트레일러 제조업', 36 = 10차 '수도업' / 8차 '가구 제조업'.
#   그래서 34·36 은 keyword_first 로 두고 키워드로 가른다.
# 의료·바이오에 KSIC 271(의료용 기기)이 들어가므로 대구 안경(27194)도 여기에 속한다.
# 기타 운송장비(31: 선박·철도·항공)는 자동차가 아니므로 기계·금속에 둔다.

version: 2026-09-24
unclassified: 미분류

keyword_first: ["34", "36", "70", "72", "73"]

# 업종코드가 없고 업종명만 있을 때(국민연금 사업장 등): 아래 낱말이 업종명에 있으면 다른 키워드보다 먼저 '기타 서비스'.
# 단 keep_service 낱말이 함께 있으면 예외(연구개발업·소프트웨어 등은 산업 그룹으로).
service_patterns: [소매, 도매, 공사업, 건설업, 의원, 병원, 운송, 중개, 음식점, 임대, 숙박, 학원, 보육, 복지, 협회, 조합, 교회, 세탁, 미용, 주유소,
                   편의점, 부동산, 보험, 금융, 은행, 회계, 법무, 세무, 경비, 청소, 인력, 용역, 급식, 약국, 판매업, 여행, 택배, 창고, 주차, 골프,
                   장례, 종교, 정당, 행정, 우편, 방송, 광고, 오락, 이발, 목욕, 카페, 커피, 제과점, 정육, 수산물, 농산물, 자동차 수리, 세차, 정비, 요양]
keep_service: [연구개발, 연구소, 소프트웨어, 정보서비스, 정보기술, 엔지니어링, 디자인, 데이터]

groups:
  - key: robot
    name: 로봇
    ksic: ["29280"]
    keywords: [로봇]

  - key: auto
    name: 자동차·부품
    ksic: ["30", "22291"]
    keywords: [자동차, 차량, 트레일러, 전장부품]

  - key: bio
    name: 의료·바이오
    ksic: ["21", "271"]
    keywords: [의료, 의약, 바이오, 진단, 제약, 치과, 안경, 임플란트]

  - key: software
    name: 소프트웨어·IT
    ksic: ["582", "61", "62", "63"]
    keywords: [소프트웨어, 프로그래밍, 정보기술, 데이터, 플랫폼, 시스템통합, 호스팅]

  - key: textile
    name: 섬유·패션
    ksic: ["13", "14", "15"]
    keywords: [섬유, 직물, 염색, 의복, 패션, 봉제, 원단, 편직, 양말, 자수, 부직포, 방적]

  - key: electronics
    name: 전기·전자
    ksic: ["26", "27", "28"]
    keywords: [전기, 전자, 반도체, 배터리, 이차전지, 조명, 센서, 통신장비, 디스플레이, 계측]

  - key: chemical
    name: 화학·에너지
    ksic: ["19", "20", "22", "35"]
    keywords: [화학, 플라스틱, 고무, 도료, 수지, 에너지, 발전, 연료, 화장품, 비료, 접착]

  - key: food
    name: 식품
    ksic: ["10", "11", "12"]
    keywords: [식품, 식료, 음료, 빵, 육류, 조미, 김치, 주류, 떡, 면류, 도정]

  - key: machinery
    name: 기계·금속
    ksic: ["24", "25", "29", "31"]
    keywords: [기계, 금속, 금형, 절삭, 가공, 주조, 단조, 용접, 철강, 알루미늄, 수리, 장비, 공구]

  - key: other-mfg
    name: 기타 제조
    ksic: ["16", "17", "18", "23", "274", "32", "33", "383"]
    keywords: [가구, 인쇄, 종이, 목재, 포장, 간판, 완구, 유리, 시멘트, 레미콘, 제조]

  - key: other-service
    name: 기타 서비스
    ksic: ["37", "38", "39", "41", "42", "45", "46", "47", "49", "50", "51", "52", "55", "56", "581", "59", "60",
           "64", "65", "66", "68", "70", "71", "72", "73", "74", "75", "76", "84", "85", "86", "87", "90", "91", "94", "95", "96"]
    keywords: [임대, 도매, 소매, 판매, 창고, 운송, 컨설팅, 연구개발, 엔지니어링, 디자인, 건설, 공사, 서비스]
