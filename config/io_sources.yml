# 한국은행 산업연관표 첨부 받기 (scripts/fetch_io_tables.py → scripts/data/io/)
# 필요한 파일: (1) 생산자가격 거래표(기본부문) (2) 부문분류표(기본부문 ↔ 한국표준산업분류). 둘 다 xlsx.
# 자동으로 못 받으면 ECOS(ecos.bok.or.kr) > 산업연관표 > 해당 연도에서 내려받아 scripts/data/io/ 에 넣는다(파일명 자유, attract.py 가 내용으로 판별).
version: 2026-09-25
file_pattern: "거래표|부문분류|기본부문|통계표|연장표|산업연관표|투입산출|분류표|xlsx|zip"
exclude_pattern: "보도자료\\.hwp|\\.hwp$|\\.pdf$|해설"
