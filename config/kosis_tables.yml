# 통계청 KOSIS 공유서비스에서 받을 통계표 (scripts/fetch_kosis.py, .github/workflows/kosis.yml)
# 키는 KOSIS 인증키 하나(GitHub Secrets KOSIS_KEY)로 모든 표를 받는다. 표마다 orgId·tblId 만 다르다.
# tblId 가 비어 있으면 `fetch_kosis.py --discover` 가 통계표 검색 API 로 후보(표 이름·ID)를 로그에 찍는다 → 확인해서 채운다.
# 결과: data/kosis/<key>.csv (대구 행만) + <key>.json (표 이름·단위·기간·출처 URL). 평가 없음, 값은 그대로.
#   prd_se   기간 구분 Y 연간 / H 반기 / Q 분기 / M 월간
#   years    받을 기간 길이(연도 수)
#   area_col 행정구역이 든 분류 열(C1..C4). 없으면 '대구' 낱말이 든 행을 전부 남긴다
#   area     남길 지역 이름 조각(대구 = 시도, 구·군 이름은 대구 아래 하위 행으로 온다)
#   areas    리포트 분야 key(config/pledge_areas.yml) — report_context 가 분야 근거로 먼저 보여 준다
#   min_levels 처음부터 보낼 분류 단계 수(objL1..n). 1단계만으로 응답이 오지만 하위 분류가 빠지는 표에
#   keep     저장 전 거르기 {C2_level: [1,2], C2_also: [...], C3: [...]}: 분류 코드 길이(메타 <key>.meta.json 필요)·값. 큰 표를 줄일 때
version: 2026-09-28
defaults: { org_id: "101", area: ["대구"], years: 6 }
tables:
  # ── 산업·기업 구조 (연간) ──
