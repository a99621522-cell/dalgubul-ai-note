    org_id: "101"
    tbl_id: "DT_1K52D01"
    prd_se: Y
    years: 6
    area_col: C1
    area: []
    areas: [manufacturing-ax, ai-sw-startup, machinery, automotive, textile, root]
    keep: { C2_level: [1, 3], C3: ["계"] }   # 산업 대분류(A, 1자)·중분류(A01, 3자)·전체 산업(0) + 사업체구분 '계' 만(원본 74만 행 → 저장소 크기 제한)
    note: 산업 그룹의 공식 기준값(사업체·종사자)과 scripts/structure_index.py 의 종사자 기준 LQ. 40,000셀을 넘는 표라 연도×시도별로 나눠 받고, 메타(<key>.meta.json, --meta)의 분류 코드로 대·중분류만 남긴다. 표 번호는 KOSIS 통계표 주소(statHtml.do?tblId=…)에서 확인
