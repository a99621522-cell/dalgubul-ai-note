    all: ['주민등록번호가?\s*(기재|적힌|표시)', '(학생증|청소년증|증명서)']
    join_items: true
    basis: 「개인정보 보호법」 제24조의2제1항(주민등록번호는 법률·대통령령·국회규칙·대법원규칙·헌법재판소규칙·중앙선거관리위원회규칙·감사원규칙이 구체적으로 요구하거나 허용한 경우 등에만 처리 가능 — 조례·규칙은 근거가 되지 않음)
    prec: []
    why: 본인·나이 확인 서류를 '주민등록번호가 기재된' 학생증·청소년증으로 한정해 법령 근거 없이 주민등록번호 처리를 전제한다.
    how: "'주민등록번호가 기재된'을 삭제하고 '생년월일을 확인할 수 있는 학생증이나 청소년증'으로 고친다."
  entity_officer_attend_duty:
    name: 공단·공사·출연기관 임원에게 의회 출석·답변 의무
    level: 위반 소지
    scope: (공단|공사|재단|진흥원|출연).*(설립|설치|운영)
    all: ['(이사장|사장|대표이사|원장|임원)', '(의회|위원회)', '출석', '(하여야|응하여야)']
    basis: 「지방자치법」 제51조(지방의회 출석·답변 의무는 지방자치단체의 장과 관계 공무원), 「지방공기업법」·「지방자치단체 출자·출연 기관의 운영에 관한 법률」에 임원의 의회 출석 의무 규정 없음
    prec:
      - {no: 의견19-0355, org: 경기도 수원시, date: '2019-11-11', seq: '2019000355', concl: 출자·출연하여 설립한 공사·공단·법인의 임원은 지방자치법 제42조제2항의 '관계 공무원의 범위'에 포함되지 않음}
      - {no: 의견19-0307, org: 경상남도 사천시, date: '2019-09-26', seq: '2019000309', concl: 시설관리공단 이사장 등에게 관계 공무원을 대신해 출석·답변을 요청하도록 규정하는 것은 바람직하지 않음}
      - {no: 의견18-0218, org: 충청북도 제천시, date: '2018-10-01', seq: '2018000221', concl: 법률의 위임 없이 재단에 추가적인 의무를 부과하는 것은 위배 소지}
    why: 별도 법인인 공단·공사·출연기관의 임원에게 법률 근거 없이 의회 출석·답변 의무를 지운다.
    how: "임원의 출석 의무를 삭제하고, 필요하면 '지방자치단체의 장은 의회의 요구가 있으면 공단 운영 상황을 보고하고, 이사장으로 하여금 설명하게 하도록 요청할 수 있다'처럼 장의 보고·협조 요청으로 바꾼다."
  mobility_inspection_entrust:
    name: 법령 근거 없이 이동편의시설 검사 업무를 비영리법인에 위탁·의뢰
    level: 위반 소지
    scope: 교통약자
    all: ['검사', '비영리\s*법인', '(위탁|의뢰|대행)']
    basis: 「교통약자의 이동편의 증진법」 제28조제3항(이동편의시설 검사는 교통행정기관 소속 공무원), 같은 법 제30조제2항(업무 위탁은 중앙행정기관의 장만 대통령령으로) — 지방자치단체의 검사 위탁 근거 없음
    prec:
      - {no: 의견20-0326, org: 대구광역시, date: '2021-02-24', seq: '2020000326', concl: 법령의 근거 없이 이동편의시설 검사업무를 비영리법인에게 대행하게 하는 내용은 조례에 규정할 수 없을 것으로 보임(대구광역시 교통약자 조례 제21조제2항 관련)}
    why: 법령 근거 없이 이동편의시설 검사 업무를 비영리법인에 의뢰·위탁할 수 있게 한다 — 법제처가 이 조문에 대해 대구광역시에 '조례에 규정할 수 없을 것'이라고 회신(의견20-0326)한 뒤에도 문구가 남아 있다.
    how: 제2항(비영리법인 의뢰·위탁)과 제4항(위탁 비용 지원)을 삭제하고, 검사는 소속 공무원이 하되 기술 자문을 받을 수 있다는 정도로 고친다.
  road_restore_unit_contract:
    name: 도로복구공사 단가계약 체결을 조례로 의무화
    level: 위반 소지
    scope: (도로|굴착)
    all: ['단가\s*계약', '(체결하여|체결하여야|하여야)', '(복구|도로공사)']
    basis: 「지방자치법」 제28조제1항·제116조(집행기관의 고유 권한), 대법원 2009. 9. 24. 선고 2009추53 판결(지방의회는 집행기관 고유권한에 사전·적극적으로 개입할 수 없음)
    prec:
      - {no: 의견20-0143, org: 대구광역시, date: '2020-06-22', seq: '2020000143', concl: 도로관리청인 지방자치단체장이 직접 도로공사를 시행할 때 건설업자와 매년 단가계약을 체결하도록 조례에 규정하는 것은 집행권을 침해할 우려 — 입안에 신중}
    why: 시장(구청장)이 도로굴착지 복구공사를 할 때 매년 초 특정 방식(단가계약)으로 계약하도록 조례로 의무화한다 — 법제처가 대구광역시 질의에 집행권 침해 우려로 회신(의견20-0143).
    how: "'단가계약을 체결하여 신속하게 복구하여야 한다'를 삭제하거나 '신속하게 복구하여야 한다'만 남기고 계약 방식은 시장이 정하게 한다."
  road_restore_defect_bond:
    name: 원인자에게 지방계약법상 하자보수보증금 납부를 조례로 정함
    level: 위반 소지
    scope: (도로|굴착)
    all: ['하자\s*보수\s*보증금', '원인자']
    basis: 「지방자치단체를 당사자로 하는 계약에 관한 법률」 제21조(하자보수보증금은 계약상대자에게 받는 것) — 계약 당사자가 아닌 원인자에게 적용할 근거 없음, 「지방자치법」 제28조제1항 단서
    prec:
      - {no: 의견20-0143, org: 대구광역시, date: '2020-06-22', seq: '2020000143', concl: 도로공사를 시행하게 하는 타공사 시행자 등에게 지방계약법 제21조의 하자보수보증금을 납부하게 하는 내용을 조례에 규정하는 것은 상위법령에 위반될 소지}
    why: 계약 상대방이 아닌 원인자(타공사 시행자 등)에게 하자보수보증금을 내게 한다 — 법제처가 대구광역시 질의에 상위법령 위반 소지로 회신(의견20-0143).
    how: "하자보수보증금 납부 규정을 삭제하고, 필요하면 「도로법」에 따른 원인자부담·복구 의무 이행 확보 수단(허가 조건 등)으로 정한다. 인용한 '예산회계법'(2007년 폐지)도 함께 정비한다."
  loan_forced_collection:
    name: 기금 융자금을 지방세 체납처분의 예로 강제징수
    level: 위반 소지
    scope: (자활|기금)
    all: ['(체납처분의\s*예|강제\s*징수)', '(융자|대여|상환)']
    basis: 체납처분의 예에 따른 징수는 법률에 근거가 있어야 함(「지방자치법」 제28조제1항 단서) — 융자금 채권은 「지방재정법」 등 일반적인 채권 회수 절차에 따름
    prec:
      - {no: 의견11-0155, org: 강원도 태백시, date: '2011-08-08', seq: '2011000155', concl: 자활기금 조례 시행규칙에 체납처분의 예에 따라 징수하도록 규정하더라도 상환의무자·연대보증인에게 지방세 체납처분의 예에 따른 징수절차는 진행할 수 없음}
    why: 기금 융자금 미상환을 '지방세 체납처분의 예'에 따라 강제징수한다고 정했다 — 법률 근거 없이 조례·규칙으로 강제징수 권한을 만들 수 없다.
    how: "강제징수 문구를 삭제하고 '「지방재정법」 등 관계 법령에 따라 채권을 회수한다'로 고친다."
  # ── 대법원 판례(조례안 재의결 무효확인 등, data/ordinance/prec/) 기반 규칙 ──
  council_alumni_subsidy:
    name: 전·현직 의원 단체(의정회 등) 사업비 보조
    level: 위반 소지
    scope: (의정회|의정동우회|시우회|구우회|군우회)
    all: ['(보조|경비)', '(지원|교부)\s*할\s*수\s*있다|보조할\s*수\s*있다']
    basis: 「지방재정법」 제17조제1항(개인·단체 공금 지출 원칙적 금지, 단서의 '지방자치단체가 권장하는 사업' 등만 예외)
    prec:
      - {no: 대법원 2013. 5. 23. 선고 2012추176 판결, org: 대법원, date: '2013-05-23', seq: '', concl: "전·현직 의원으로 구성된 의정회 등은 공직 경력만으로 회원자격이 부여되고 친목이 주된 목적이어서 그 사업이 '지방자치단체가 권장하는 사업'이라 볼 수 없음 — 보조 조례안 지방재정법 제17조 위반"}
      - {no: 대법원 2004. 4. 23. 선고 2002추16 판결, org: 대법원, date: '2004-04-23', seq: '', concl: "구의정회는 지방재정법상 기부·보조할 수 있는 공공기관이나 단체에 해당하지 않음"}
    why: 전·현직 지방의회 의원으로 구성된 단체(의정회 등)의 사업·활동 경비를 보조할 수 있게 한다 — 대법원은 같은 내용의 조례안을 지방재정법 제17조 위반으로 무효라고 판결했다.
    how: 보조금 지원 조문을 삭제하거나, 개별 법령에 보조 근거가 있는지 확인한다(없으면 조례 폐지를 검토).
  speaker_recommend_member:
    name: 집행기관 위원회 위원을 지방의회 의장이 추천하게 함
    level: 위반 소지
    not_scope: 의회
    all: ['의장이\s*추천하는']
    basis: 「지방자치법」상 집행기관과 지방의회의 권한 분리 — 의장 개인에게는 집행기관 인사(위원 위촉)에 관여할 권한이 없음. 해당 위원회 근거 법령이 의회 추천을 정한 경우는 제외(고향사랑 기부금법·시행령에는 의장 추천 조항 없음, 2026-10-08 확인)
    prec:
      - {no: 대법원 1996. 5. 14. 선고 96추15 판결, org: 대법원, date: '1996-05-14', seq: '', concl: "지방의회 의장 개인의 자격으로는 집행기관의 인사권에 관여할 권한이 없어, 시의회 의장에게 공유재산심의회 위원 추천권을 부여한 조례 규정은 위법"}
      - {no: 대법원 1994. 4. 26. 선고 93추175 판결, org: 대법원, date: '1994-04-26', seq: '', concl: 행정불만처리조정위원회 위원 일부의 위촉권을 도의회 의장에게 부여한 조례 규정은 위법}
    why: 집행기관 소속 위원회의 위원 일부를 지방의회 의장이 추천하는 사람으로 정해, 의장 개인이 단체장의 위원 위촉(인사)에 사전에 관여하게 한다.
    how: "'의회 의장이 추천하는 사람'을 삭제하고 위촉 대상 자격(전문 분야 등)만 정한다. 의원을 위원으로 두려면 의견25-0232 취지대로 '위촉할 수 있는 사람'으로만 둔다."
  resident_council_member_advisor:
    name: 주민자치위원회에 지방의회 의원을 당연직 고문으로
    level: 위반 소지
    scope: 주민자치
    all: ['(구의회|군의회|지방의회)?\s*의원', '(당연직\s*)?고문']
    strong: ['당연직\s*고문', '고문이\s*될\s*수\s*있']
    basis: 「지방자치법」상 의결기관(지방의회)과 집행기관의 권한 분리 — 집행기관 견제 권한은 의회에 있고 의원 개인에게 있지 않음
    prec:
      - {no: 대법원 2001. 12. 11. 선고 2001추64 판결, org: 대법원, date: '2001-12-11', seq: '', concl: 주민자치센터운영위원회는 동장의 집행사무를 심의하는 보조기관이므로 당해 동 구의원 개인이 당연직 위원장이 되도록 한 조례안은 지방의회 의원의 법령상 권한 범위를 넘어 위법}
      - {no: 대법원 2000. 11. 10. 선고 2000추36 판결, org: 대법원, date: '2000-11-10', seq: '', concl: 주민자치위원 위촉 때 동장과 당해 지역 구의원 개인의 사전 협의를 거치게 한 조례안 규정은 위법}
      - {no: 의견19-0142, org: 세종특별자치시, date: '2019-04-18', seq: '2019000139', concl: 지방의회 의원을 주민자치회 위원으로 위촉하거나 표결권 없는 고문으로 참여하게 하는 규정은 바람직하지 않음}
    why: 지역구 의원이 그 직에 있는 동안 해당 동(읍면) 주민자치위원회의 당연직 고문이 되게 해, 의원 개인이 동장의 집행사무를 심의하는 기구에 관여한다.
    how: 의원 당연직 고문 규정을 삭제한다(필요하면 회의에 의견을 들을 수 있다는 정도로).
  opex_subsidy_no_statute:
    name: 민간 단체 운영비 보조 — 법령에 운영비 근거 없음
    level: 위반 소지
    scope: 지식산업센터
    all: ['입주\s*기업\s*체?\s*협의회', '운영비']
    basis: 「지방자치단체 보조금 관리에 관한 법률」 제6조제2항(법령에 명시적 근거가 있는 경우 외에는 지방보조금을 운영비로 교부할 수 없음), 같은 법 시행령 제3조(운영비 사용 경비 종목) — 「산업집적활성화 및 공장설립에 관한 법률」·시행령·시행규칙에 지방자치단체가 입주기업체협의회 운영비를 보조하는 조문 없음(제45조의26 출연·보조는 한국산업단지공단 대상, 2026-10-08 확인)
    why: 법령에 운영비 지원 근거가 없는 민간 협의회에 시장이 운영비 일부를 지원할 수 있게 한다 — 지방보조금은 법령에 명시적 근거가 있을 때만 운영비로 교부할 수 있다.
    how: 운영비 지원을 삭제하고 '지식산업센터 건립 촉진·재정비 사업에 드는 경비(사업비)를 지원할 수 있다'처럼 사업비 지원으로 바꾼다.
  honorary_resident_rights:
    name: 명예주민에게 「지방자치법」상 주민의 권리 부여
    level: 위반 소지
    scope: 명예(시민|구민|군민|주민)
    all: ['지방자치법', '제1[37]조', '권리']
    basis: 「지방자치법」 제17조제2항(주민은 법령으로 정하는 바에 따라 소속 지방자치단체의 재산과 공공시설을 이용할 권리와 균등하게 행정의 혜택을 받을 권리를 가짐) — 주민의 지위는 주소로 정해지고(같은 법 제16조) 조례로 주민 아닌 사람에게 부여할 수 없음
    prec:
      - {no: 의견22-0397, org: 경상남도 남해군, date: '2022-12-28', seq: '2022000402', concl: 명예군민증서를 받은 사람에게 「지방자치법」 제17조제2항에 따른 주민의 권리를 부여할 수 있도록 조례로 규정하기는 어려움}
    why: 명예주민증을 받은 사람(주민 아님)에게 「지방자치법」이 주민에게 주는 재산·공공시설 이용권과 행정 혜택을 받을 권리를 조례로 부여한다. 옛 조문 번호(제13조)를 인용한 경우도 있다.
    how: 권리 부여 조문을 삭제하고 행사 초청·위원 위촉·홍보물 발송 같은 예우 규정으로 바꾼다.
  speaker_consult_exec:
    name: 집행기관 결정 전에 의회 의장과 협의하게 함
    level: 정비 권고
    scope: 명예(시민|구민|군민|주민)
    all: ['의회\s*의장과\s*협의\s*후']
    basis: 「지방자치법」상 집행기관과 지방의회의 권한 분리 — 의장 개인은 집행기관의 결정에 사전에 관여할 권한이 없음(의회 동의는 합의체 의결로 받는 것)
    prec:
      - {no: 대법원 2000. 11. 10. 선고 2000추36 판결, org: 대법원, date: '2000-11-10', seq: '', concl: 구청장이 주민자치위원을 위촉할 때 동장과 해당 지역 구의원 개인과 사전 협의하게 한 조례 규정은 법령 위반}
      - {no: 대법원 1994. 4. 26. 선고 93추175 판결, org: 대법원, date: '1994-04-26', seq: '', concl: 지방의회는 집행기관의 권한 행사에 사전에 적극적으로 개입할 수 없고 의장 개인에게 위촉권을 준 규정은 위법}
    why: 명예주민증 수여·취소를 결정하기 전에 의회 의장 개인과 협의하도록 해, 의장이 집행기관의 결정에 사전에 관여하게 한다.
    how: "'의회 의장과 협의 후'를 삭제하거나 다른 구처럼 '의회의 동의를 받아'(합의체 의결)로 바꾼다."
  city_obliges_gugun_budget:
    name: 시 조례가 구청장·군수에게 예산 확보 의무를 지움
    level: 정비 권고
    all: ['구청장\s*[ㆍ·]\s*군수[^.。]{0,80}(예산|비용)[^.。]{0,60}(\d+\s*퍼센트|100분의)', '(확보|부담)하(되|여야)']
    basis: 「지방자치법」 제142조제1항(예산 편성은 각 지방자치단체의 장 권한), 같은 법 제28조(조례는 그 지방자치단체의 사무) — 구·군은 시와 별개 법인
    prec:
      - {no: 의견17-0107, org: 경상남도, date: '2017-05-04', seq: '2017000108', concl: "도와 시ㆍ군의 비용 부담 비율에 따른 시ㆍ군의 예산계상 의무는 해당 시ㆍ군의 자치법규로 규정하는 것이 바람직"}
      - {no: 의견18-0267, org: 경기도 수원시, date: '2018-12-13', seq: '2018000272', concl: 도 조례에 지급 근거가 있어도 시ㆍ군이 지급하는 보조금은 시ㆍ군 조례에도 지급 근거를 두어야 함}
    why: 시 조례가 별개 지방자치단체인 구·군의 장에게 사업비의 일정 비율을 구·군 예산으로 확보하도록 의무를 지운다.
    how: 시 조례에는 시의 부담·보조만 정하고, 구·군 부담분은 각 구·군 조례(예산 확보·지급 근거)로 정한다. 근거 조례가 없는 구·군은 제정 여부를 확인한다.
  far_bonus_no_cap:
    name: 용적률 가산 완화에 시행령 최대한도 단서 없음
    level: 정비 권고
    scope: 도시계획\s*조례
    all: ['지역균형개발', '가산하여\s*완화']
    none: ['최대한도를?\s*초과할\s*수\s*없', '영\s*제85조제1항[^.。]{0,20}범위']
    basis: 「국토의 계획 및 이용에 관한 법률 시행령」 제85조제1항(용도지역별 용적률은 각 호의 범위에서 조례로 정하는 비율을 초과할 수 없음 — 예 제1종전용주거 100%, 제1종일반주거 200%, 일반공업 350%, 자연녹지 100%) — 2026-10-08 현행 전문 확인
    why: 조례 제80조의 용적률에 15퍼센트까지 가산할 수 있게 하면서 시행령 제85조제1항의 용도지역별 최대한도를 넘지 못한다는 단서가 없다 — 제80조 값이 이미 최대한도인 용도지역(제1종전용주거 100%, 제1종일반주거 200%, 전용공업 300%, 일반공업 350%, 준공업 400%, 생산·자연녹지 100%)에서는 가산하면 최대한도를 넘을 수 있다.
    how: "같은 조 제4항처럼 '다만, 영 제85조제1항에 따른 용적률의 최대한도를 초과할 수 없다'는 단서를 둔다."
  ordin_petition_number_unset:
    name: 주민조례청구 연서 수를 조례로 정하지 않음
    level: 정비 권고
    scope: 주민조례발안
    all: ['공표한\s*연서\s*주민\s*수']
    basis: 「주민조례발안에 관한 법률」 제5조제1항(인구 구간별 기준 이내에서 해당 지방자치단체의 조례로 정하는 청구권자 수 이상이 연대 서명), 같은 조 제3항(단체장이 공표하는 것은 청구권자 총수)
    why: 법률이 조례로 정하게 한 연대 서명 청구권자 수(비율)를 정하지 않고 단체장이 공표하는 '연서 주민수'에 맡긴다 — 법률상 단체장의 공표 대상은 청구권자 총수다.
    how: 다른 구처럼 '공표된 청구권자 총수의 ○분의 1 이상'으로 비율을 조례에 정한다(인구 10만 이상 50만 미만 자치구는 70분의 1 이내).
  fee_share_conflict_city:
    name: 징수교부금 비율이 시 조례와 다름
    level: 정비 권고
    scope: 도로점용
    all: ['점용료\s*[·ㆍ,]\s*변상금[^.。]{0,60}징수액의\s*100분의\s*50']
    basis: 「지방자치법」 제30조(시·군 및 자치구의 조례는 시·도의 조례를 위반해서는 안 됨), 「대구광역시 도로점용 허가 및 점용료 징수 조례」 제8조제2항(시장이 구청장·군수에게 지급하는 교부금 — 사용료 100분의 50, 변상금 100분의 40)
    why: 구 조례가 점용료·변상금(과태료 포함)을 모두 징수액의 100분의 50으로 시에 청구하도록 정해, 변상금을 100분의 40으로 정한 시 조례와 다르다.
    how: 수성구 조례처럼 '시로부터 받는 교부금은 「대구광역시 도로점용 허가 및 점용료 징수 조례」 제8조제2항에 따른다'로 고친다.
  other_agency_duty:
    name: 구·군 조례가 국가기관·시 교육청에 의무를 지움
    level: 정비 권고
    scope: 대구광역시\s*(중구|동구|서구|남구|북구|수성구|달서구|달성군|군위군)|대구광역시달서구
    all: ['(경찰서장|경찰청장|교육감|교육장|교육청|교육지원청|학교의\s*장)(은|는|이|가)\s[^.。]{0,140}(하여야|해야)\s*한다']
    none: ['지원(을)?\s*받(은|으려|고자)|교부(를)?\s*받|보조(금을)?\s*받|신청서|정산|지원금|노력하여야|노력해야']
    basis: 「지방자치법」 제28조제1항(지방자치단체는 그 사무에 관하여 조례를 제정) — 경찰서장은 국가기관(「국가경찰과 자치경찰의 조직 및 운영에 관한 법률」), 교육감·교육장은 광역시의 교육·학예 집행기관(「지방교육자치에 관한 법률」 제18조·제34조)으로 구·군 조례가 직무·예산·인력 의무를 지울 수 있는 대상이 아님
    prec:
      - {no: 의견15-0004, org: 전라남도 의회사무처, date: '2015-03-31', seq: '2015005904', concl: "같은 도의 조례에는 그 도 교육감의 책무를 '노력하여야' 형식으로 둘 수 있다고 본 사례 — 도 조례와 도 교육감은 같은 지방자치단체여서 가능하다는 취지"}
    why: 구·군 조례가 국가기관(경찰서장)이나 광역시 교육청(교육감·교육장)에게 인력 배치·예산 지원·지도감독·자료 제출 같은 의무를 '하여야 한다'로 지운다 — 구·군은 이를 강제할 권한이 없어 집행이 담보되지 않는다.
    how: "'○○에게 협조를 요청할 수 있다'·'○○과 협의하여 …할 수 있다'처럼 구청장·군수의 요청·협의 권한으로 바꾸거나, 해당 기관과 협약으로 정한다."
  head_pledge_ordinance:
    name: 단체장 공약 이행 관리를 조례로 정함
    level: 정비 권고
    scope: '(구청장|군수|시장)?\s*공약(사항|이행| 관리)'
    not_scope: '규칙$'   # 규칙(단체장 내부규범)으로 정한 것은 법제처가 가능하다고 본 방식
    all:
      - '제1조\(목적\)[^.。]{0,160}공약'
    basis: 「지방자치법」 제28조제1항(조례는 그 지방자치단체의 사무에 관하여) — 공약은 후보자 개인의 정치적 약속이라 지방자치단체 사무로 보기 어렵다는 법제처 의견
    prec:
      - {no: 의견13-0227, org: 서울특별시, date: '2013-08-12', seq: '', concl: '단체장 공약 이행·평가·공개 의무를 조례로 규율하는 것은 조례의 규율 범위를 벗어나고 단체장 권한을 침해할 소지가 있어 바람직하지 않음 — 내부규칙 등으로 정해 집행에 참고하는 것은 별론'}
      - {no: 의견12-0161, org: 경기도 광명시, date: '2012-06-20', seq: '', concl: '단체장 공약 이행 관리·점검을 조례로 규율하는 것은 조례의 규율 범위를 벗어나고 단체장 권한을 침해할 소지가 있어 바람직하지 않음'}
    why: 단체장 공약의 이행 관리·평가·공개(평가단 등)를 조례로 정한다. 법제처는 공약을 후보자 개인의 정치적 약속으로 보아 조례 규율 대상이 아니라고 회신했다(단체장 스스로 발의한 조례라도 같은 취지).
    how: 공약 관리 절차는 단체장의 규칙·훈령 등 내부규범으로 옮기고, 조례에는 주민 참여 평가단 같은 일반 주민참여 근거만 남기는 방안을 검토한다.
