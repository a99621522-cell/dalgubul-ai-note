# 조례 내용 점검 규칙 — 법제처 자치법규 의견제시·법령해석과 상위법령 조문에 근거한 '상위법령 위반 소지' 유형.
# scripts/ordin/signals.py 가 조문(부칙 제외)을 항 단위로 나눠 맞춘다. 판정이 아니라 검토 후보.
# 필드: name · level(위반 소지 | 정비 권고) · scope(자치법규 이름 정규식, 없으면 전체) · not_scope · title(조 제목 정규식)
#       all(같은 항 안에 모두 맞아야 할 정규식 목록) · none(하나라도 맞으면 제외) · basis(상위법령) · prec(근거 사례) · why · how
# prec 의 seq 는 법제처 누리집 의견제시 caseSeq(링크용), expc 는 국가법령정보센터 법령해석례 일련번호.
rules:
  council_audit_entity:
    name: 출연기관에 대한 의회 행정사무감사 범위
    level: 위반 소지
    scope: 재단|출연|출자|공단|공사|진흥원|장학회
    all: ['의회', '감사']
    none: ['본회의', '출자\s*또는\s*출연에\s*관련', '감사위원회', '감사를\s*받', '공인회계사', '감사는\s*재단', '감사\s*\d+명', '감사를\s*둔', '이사와\s*감사', '감사의\s*임']
    basis: 「지방자치법 시행령」 제44조제1항제6호 — 출자·출연기관은 본회의가 특별히 필요하다고 의결한 경우 출자·출연에 관련된 업무·회계·재산으로 한정해 감사
    prec:
      - {no: 의견18-0218, org: 충청북도 제천시, date: '2018-10-01', seq: '2018000221', concl: 법률의 위임 없이 재단에 추가적인 의무를 부과하는 것은 「지방자치법」 제22조(현 제28조) 단서에 위배될 소지}
    why: 조례가 의회의 출연기관 감사를 시행령보다 넓게(요건·범위 없이) 정하거나 재단에 감사에 응할 의무를 지운다.
    how: 시행령 제44조제1항제6호의 요건(본회의 의결)·범위(출자·출연 관련 업무·회계·재산)로 맞추고, 재단에 직접 지우는 의무 문구는 삭제한다.
  entity_report_council:
    name: 재단·출연기관에 의회 보고·제출 의무
    level: 위반 소지
    scope: 재단|출연|출자|공단|공사|진흥원|장학회
    all: ['(재단|법인|공단|공사|기관|진흥원)(은|는)', '의회', '(보고|통지|제출)(하여야|한다|해야|하고)']
    none: ['(구청장|군수|시장)(은|는)[^.。]{0,60}의회', '(구청장|군수|시장)에게\s*(보고|제출)']
    basis: 「지방자치단체 출자·출연 기관의 운영에 관한 법률」 제26조(지방자치단체의 장의 검사·보고), 「지방자치법」 제28조제1항 단서
    prec:
      - {no: 의견18-0218, org: 충청북도 제천시, date: '2018-10-01', seq: '2018000221', concl: 재단이 결산 보고서를 시의회 의장에게 제출하도록 조례로 규정하는 것은 상위법령에 위배될 소지}
      - {no: 의견26-0287, org: 대구광역시 중구, date: '2026-09-22', seq: '2026000289', concl: 구청장이 결과를 구의회 의장에게 제출하는 것은 재단에 직접 의무를 부과하지 않는 단순 제출이라 가능}
    why: 독립 법인인 재단(출연기관)에 법률 위임 없이 의회에 직접 보고·통지·제출할 의무를 지운다.
    how: 재단의 의무로 두지 말고 '지방자치단체의 장이 그 결과를 의회(의장)에 제출한다'로 고친다(중구 의견26-0287 취지).
  articles_council_consent:
    name: 정관 변경에 의회 동의·사전 보고
    level: 위반 소지
    scope: 재단|출연|출자|공단|공사|진흥원|장학회
    all: ['정관', '의회', '(동의|승인|보고)']
    none: ['(구청장|군수|시장)(은|는)[^.。]{0,40}(결과|변경\s*사항)[^.。]{0,40}제출']
    basis: 「민법」 제45조(재단법인 정관 변경)·「지방출자출연법」 제8조제2항(지방자치단체의 장과 협의), 「지방자치법」 제28조제1항 단서
    prec:
      - {no: 의견16-0100, org: 경기도 오산시, date: '2016-04-27', seq: '2016000109', concl: 정관 변경 시 지방의회 동의를 받도록 하는 것은 상위법령에 위반될 소지가 있고 「지방자치법」 제22조 단서에도 위배}
      - {no: 의견21-0061, org: 경상북도 김천시, date: '2021-02-23', seq: '2021000062', concl: 정관 제정·변경 시 시의회 사전 동의를 받도록 조례에 규정할 수 없음}
      - {no: 의견26-0287, org: 대구광역시 중구, date: '2026-09-22', seq: '2026000289', concl: 구청장 협의 후 이사회 의결, 구청장이 결과를 의회에 사후 제출하는 것은 가능 — 의회의 승인·동의 수단이 되지 않도록 유의}
    why: 재단 정관 변경을 의회의 동의·승인이나 재단의 사전 보고에 걸리게 한다.
    how: "'재단은 구청장과 미리 협의한 후 이사회 의결을 거치고, 구청장은 변경 결과를 의회 의장에게 제출한다'로 고친다."
  head_appoint_consent:
    name: 기관장 임명에 의회 동의
    level: 위반 소지
    all: ['(이사장|대표이사|원장|사장|관장|기관장|본부장)', '임명', '의회', '동의']
    none: ['인사청문']
    basis: 「지방자치단체 출자·출연 기관의 운영에 관한 법률」 제9조(임원 공개모집·임명), 「민법」 제43조
    prec:
      - {no: 의견23-0116, org: 서울특별시 동대문구, date: '2023-04-19', seq: '2023000116', concl: 문화재단 이사장·대표이사 임명 시 지방의회 동의를 받도록 하는 것은 지방출자출연법 및 「민법」에 위반될 소지}
    why: 출연기관 임원 임명을 의회 동의에 걸리게 한다.
    how: 의회 동의 요건을 삭제한다(인사청문은 「지방자치법」 제47조의2와 그 조례로).
  entity_property_consent:
    name: 출연기관 재산 매입·처분에 의회 동의
    level: 위반 소지
    scope: 재단|출연|출자|공단|공사|진흥원|장학회
    all: ['(재산|기본재산)', '(매입|매각|처분|취득)', '의회', '동의']
    basis: 「민법」 재단법인 규정·「지방출자출연법」(출연기관 재산은 법인 재산)
    prec:
      - {no: 의견25-0059, org: 충청북도, date: '2025-03-20', seq: '2025000059', concl: 출자·출연 기관이 재산을 매입·매각하는 경우 지방의회의 동의를 받도록 조례에 규정할 수 없음}
    why: 출연기관(독립 법인) 재산의 매입·처분을 의회 동의에 걸리게 한다.
    how: 의회 동의 요건을 삭제하고, 지방자치단체 공유재산이면 「공유재산 및 물품 관리법」 절차에 따른다.
  free_lease_no_consent:
    name: 출연기관에 공유재산 무상대부·사용(의회 동의 요건 없음)
    level: 위반 소지
    scope: 재단|출연|출자|진흥원|장학회
    all: ['무상', '(대부|사용|수익)', '(공유재산|재산|물품)']
    none: ['의회의?\s*동의', '공유재산\s*및\s*물품\s*관리법', '공유재산법']
    basis: 「공유재산 및 물품 관리법」 제24조제1항제4호·제34조제1항제2호(지방의회 동의), 같은 법 시행령 제75조(물품 무상대부 대상)
    prec:
      - {no: 의견16-0352, org: 강원도 횡성군, date: '2016-12-19', seq: '2016000356', concl: 재단에 군유재산 무상대부·사용을 규정하면서 공유재산법의 '지방의회의 동의'가 빠져 같은 법에 위반될 소지, 물품 무상대부는 규정할 수 없음}
    why: 재단에 공유재산·물품을 무상으로 대부·사용하게 하면서 공유재산법의 지방의회 동의 요건이나 근거를 두지 않는다.
    how: "'「공유재산 및 물품 관리법」에서 정하는 바에 따라'로 고치거나 지방의회 동의 요건을 넣고, 물품 무상대부는 삭제를 검토한다."
  member_on_exec_committee:
    name: 집행기관 위원회 위원으로 지방의원
    level: 위반 소지
    not_scope: 의회
    all: ['위원', '(구|군|시)?\s*의회\s*(의\s*)?의원|(구|군|시)의원|의회에서\s*추천|의회가\s*추천', '(위촉|구성|포함|추천|당연직|임명)']
    none: ['의원(이|은)\s*아닌', '겸직', '의원\s*선거', '의회의원\s*선거', '지방의회의원과\s*지방자치단체의\s*장의', '의원\s*및\s*지방자치단체의\s*장', '결산검사', '대표위원', '될\s*수\s*없', '배우자', '배제', '제외', '임기는', '임기\s*내', '중복']
    # 의원 위촉이 의무(당연직·인원 지정·포함)이거나 법령이 위원 자격을 정한 위원회만 '위반 소지', 나머지는 참고(의견25-0232: 반드시 위촉이 아니면 가능)
    strong: ['당연직\s*위원(은|으로)[^,，.。]{0,40}의원', '의원[^.。,]{0,10}(은|는)\s*당연직\s*위원', '의원\s*(중\s*)?\d+\s*(명|인)', '의원\s*(을|를)\s*포함', '추천하는\s*\d+\s*명', '의원\s*(일|이|삼)\s*명']
    strong_scope: 공직자윤리위원회|지역사회보장협의체|산사태|평생교육|처우개선위원회
    basis: 「지방자치법」 기관 분리 원칙(지방의회와 집행기관의 권한 배분), 위원 자격을 법령이 정한 위원회는 그 법령
    prec:
      - {no: 의견12-0001, org: 경상북도 상주시, date: '2012-01-16', seq: '2012001566', concl: 시의회 추천 의원을 집행기능 위원회 위원으로 위촉하게 한 것은 권한배분·분리 원칙의 한계를 넘을 우려}
      - {no: 의견13-0110, org: 경상북도 김천시, date: '2013-04-17', seq: '2013002832', concl: 법령이 위원 자격을 정한 위원회(산사태취약지역지정위원회)에 시의원을 위원으로 규정하는 것은 위법}
      - {no: 의견17-0052, org: 인천광역시 중구, date: '2017-03-17', seq: '2017000051', concl: 지역사회보장협의체 위원으로 구의원을 규정하는 것은 사회보장급여법 제41조제3항에 위배}
      - {no: 의견23-0179, org: 서울특별시 강동구, date: '2023-05-16', seq: '2023000179', concl: 사회복지사 처우개선위원회 위원으로 구의원을 규정할 수 없음}
      - {no: 의견25-0232, org: 경상북도 포항시, date: '2025-09-26', seq: '2025000232', concl: 의원을 반드시 위촉하도록 한 것이 아니라면 조례로 규정할 수 있음}
    why: 집행기관 소속 위원회의 위원으로 지방의원(또는 의회 추천 의원)을 둔다 — 법령이 위원 자격을 정한 위원회이거나 의원을 반드시(당연직) 위촉하게 하면 위반 소지가 크다.
    how: 위원회 근거 법령이 위원 자격을 정했는지 확인하고, 정했으면 의원을 삭제한다. 법령에 정함이 없으면 '반드시 위촉'이나 당연직이 아닌 '위촉할 수 있는 사람'으로만 둔다(포항 의견25-0232).
  member_on_entity_board:
    name: 출연기관 이사·감사로 지방의원
    level: 위반 소지
    scope: 재단|출연|출자|공단|공사|진흥원|장학회
    all: ['(이사|감사|임원)', '(구|군|시)?\s*의회\s*(의\s*)?의원|(구|군|시)의원']
    basis: 「지방자치법」 제43조(지방의회의원의 겸직 금지)
    prec:
      - {expc: '12-0025', org: 서울특별시 중구, date: '2012-02-23', concl: 지방자치단체가 출연한 비영리 재단법인의 당연직 이사가 지방의회의원이 될 수는 없음}
    why: 지방자치단체 출연 재단의 이사·감사에 지방의원을 둔다.
    how: 지방의원을 임원 구성에서 삭제한다.
  transfer_budget_consent:
    name: 예산 전용·공유재산 사용허가에 의회 동의
    level: 위반 소지
    all: ['(전용|사용허가)', '의회', '동의']
    none: ['민간위탁', '위탁', '영구시설물']
    basis: 「지방재정법」 제49조(예산의 전용), 「공유재산 및 물품 관리법」 제20조·제21조(사용허가)
    prec:
      - {no: 의견24-0370, org: 충청북도 영동군, date: '2024-10-23', seq: '2024000376', concl: 군수가 예산을 전용하려는 경우 사전에 군의회의 동의를 받도록 조례에 규정할 수 없음}
      - {no: 의견25-0143, org: 전북특별자치도 전주시, date: '2025-04-22', seq: '2025000143', concl: 사용허가·갱신 때 지방의회 동의를 받도록 조례에 규정할 수 없음}
    why: 법령이 단체장 권한으로 정한 예산 전용·행정재산 사용허가를 의회 동의에 걸리게 한다.
    how: 의회 동의 요건을 삭제한다(필요하면 사후 보고로).
  articles_listed:
    name: 조례에 정관 기재사항 열거
    level: 정비 권고
    scope: 재단|출연|출자|공단|공사|진흥원|장학회
    title: 정관
    all: ['정관에는\s*다음']
    basis: 「민법」 제43조, 「지방출자출연법」 제8조제1항(직접 적용)
    prec:
