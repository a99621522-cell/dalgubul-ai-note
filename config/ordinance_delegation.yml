# 자치법규 내용 점검 '참고' 후보(주민 의무·권리 제한, 의원 위원)의 상위법령 위임 근거 확인 대상.
# scripts/ordin/delegation.py(러너)가 법령마다 현행 법률·시행령·시행규칙 전문을 받아
# '조례' 가 든 문장(위임 조문)과 kw 낱말이 든 문장(법률이 직접 정한 의무)을 data/ordinance/delegation/ 에 남긴다.
# 판정은 세션·운영자가 조문을 읽고 한다(자동 판정 아님).
topics:
  animal:
    what: 동물 소유자 동반 출입 금지 장소 지정, 등록사항 변경신고
