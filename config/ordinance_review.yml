  - {oid: "2047650", art: "제6조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 사회복지시설의 위탁 대상에 사회복지법인·비영리법인 외에 법인이 아닌 단체를 포함", level: "위반 소지", ctx: "③ 시장은 제1항에 따른 시설의 설치 및 운영에 관한 업무를 다음 각호의 어느 하나에 해당하는 법인 및 단체에 위탁할 수 있다. 이 때 위탁 기간은 5년 이내로 한다. 1. 사회복지법인 2. 노인복지 관련 비영리법인 및 단체", basis: "법제처 자치법규 의견제시(의견13-0139) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견13-0139", "org": "경상남도 거창군", "date": "2013-05-15", "seq": "", "concl": "법인이 아닌 단체나 법인의 지회에 … 위탁ㆍ운영할 수 있도록 … 조례에 규정하는 것은 상위법령에 위배될 소지"}], why: "「사회복지사업법」상 사회복지시설에 해당하는 복지관 등의 위탁 대상에 \"단체\"(비영리 민간단체·종교단체 등)를 넣어 법인이 아닌 단체도 수탁할 수 있게 읽힌다.", how: "위탁 대상을 「사회복지사업법」 제34조의 사회복지법인·비영리법인으로 한정하는 방향으로 검토."}
