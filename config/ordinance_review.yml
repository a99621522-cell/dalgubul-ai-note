  - {oid: "2048444", art: "제4조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 폐기물처리시설 설치비용 납부금액을 시행령 제4조·별표 1의 산정방법과 별도로 조례에서 산정하도록 정하는 것", level: "위반 소지", ctx: "제4조(납부금액 산정기준) ① 법 제6조 및 영 제4조제3항제1호의 시설부지의 매입에 소요되는 비용의 산정은 소요되는 시설부지 면적에 택지조성원가를 곱한 금액으로 한다.(단, 소각시설 1톤당 소요되는 부지면적은 200제곱미터이상, 음식물류폐기물처리시설 1톤당 소요되는 부지면적은 80제곱미터 이상을 적용한다)(개정2007.11.30) ② 영 제4조제3항제2호", basis: "법제처 자치법규 의견제시(의견21-0277) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견21-0277", "org": "경기도 과천시", "date": "2021-09-09", "seq": "", "concl": "시행령 제4조제5항에도 불구하고 별도로 설치납부금액 산정방법을 조례로 규정할 수는 없을 것으로 보임"}], why: "택지 개발자가 내는 폐기물처리시설 설치비용 납부금액을 부지 매입비·시설 설치비 단가 등 조례 자체 방식으로 산정하도록 정하고 있어, 법제처가 시행령 제4조·별표 1과 별도로 조례로 정할 수 없다고 본 산정방법 규정과 같은 유형임. [확인할 점] 조문이 '영 제4조제3항제1호' 등 개정 전 시행령 조항을 인용하고 있어 현행 시행령 조문 대조 필요.", how: "설치납부금액 산정은 「폐기물처리시설 설치촉진 및 주변지역지원 등에 관한 법률 시행령」 제4조 및 별표 1에 따르도록 조문을 정비하는 방안을 검토."}
  - {oid: "2201102", art: "제5조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 대형건축물 공사장의 건축관계자가 공사 민원 협의를 위해 시민(주민)협의체를 구성·운영할 수 있도록 조례에 정하는 것", level: "위반 소지", ctx: "① 학교 주변 및 아파트단지 주변 공사장 중 연면적의 합계가 1만 제곱미터 이상의 대형건축물의 공사장의 건축관계자는 공사와 관련한 민원을 협의하기 위하여 학교 관계자 또는 인근 주민으로 구성된 주민협의체를 구성ㆍ운영할 수 있다. ② 건축관계자는 주민협의체와 제1항 해당 공사장 주변의 환경관리 및 안전확보, 학생ㆍ보행자의 교통안전 등을 협의할 수 있다. ③ ", basis: "법제처 자치법규 의견제시(의견22-0388) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견22-0388", "org": "강원도 속초시", "date": "2022-12-20", "seq": "", "concl": "건축관계자가 민원 협의를 위해 시민협의체를 구성ㆍ운영할 수 있도록 조례로 정하는 것은 「지방자치법」 제28조제1항에 위배될 소지(신중)"}], why: "대형건축물 공사장의 건축관계자가 공사 민원 협의를 위해 학교 관계자·인근 주민으로 주민협의체를 구성·운영할 수 있도록 정하고 있어, 법제처가 속초시 같은 이름의 조례안에 대해 문제 삼은 시민협의체 규정과 같음.", how: "건축관계자의 협의체 구성·운영 규정은 법령 근거를 확인하여 삭제하거나 구청장의 협의 지원 등 자치사무 범위로 한정하는 방향으로 정비를 검토."}
  - {oid: "2201102", art: "제3조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 건설공사 안전관리계획에 상위 법령이 정한 수립 기준 외의 사항을 넣어 건설사업자 등에게 요청할 수 있도록 조례에 정하는 것", level: "위반 소지", ctx: "② 제1항에 따른 공사장의 건축관계자는 다음 각 호의 내용이 포함된 “공사장 주변 안전관리계획(이하 “안전관리계획”이라 한다)”을 수립하여 건축물해체허가 및 착공신고 시 대구광역시 수성구청장(이하 “구청장”이라 한다)에게 제출하여야 한다. 다만, 제1항에 따른 적용대상 중 연면적의 합계가 1만 제곱미터 이상으로서 자문위원회 자문 대상인 경우 해체 및 착공 ", basis: "법제처 자치법규 의견제시(의견22-0388) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견22-0388", "org": "강원도 속초시", "date": "2022-12-20", "seq": "", "concl": "시행령에서 정한 안전관리계획 수립 기준 외의 사항이 포함된 안전관리계획을 요청할 수 있도록 조례로 규정하기는 어려울 것"}], why: "조례로 정한 학교·아파트단지 주변 공사장의 건축관계자에게 통행안전시설 등 조례가 정한 항목을 담은 '공사장 주변 안전관리계획'을 수립·제출하고 일부는 승인받도록 정하고 있어, 법제처가 시행령 기준 외 사항을 포함한 안전관리계획 요청을 조례로 정하기 어렵다고 본 쟁점과 같은 유형임. [확인할 점] 제1항(시행령 제98조제1항제6호나목에 따른 대상 건설공사 지정)은 위임 범위이므로 제2항 이하의 계획 내용·승인 부분이 검토 대상.", how: "「건설기술 진흥법」상 안전관리계획 수립 기준(시행령·시행규칙)과 대조하여 그 범위를 넘는 계획 항목·제출·승인 의무를 정비하는 방안을 검토."}
  - {oid: "2149467", art: "제2조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 공영주차장 주차요금 감면·면제 사유에 \"그 밖에 단체장이 특별한 사유가 있다고(필요하다고) 인정하는\" 포괄 사유를 둠", level: "정비 권고", ctx: "③ 공영주차장에 주차하는 자동차 중 다음 각 호의 어느 하나에 해당하는 경우에는 주차요금을 면제한다. … 4. 그 밖에 구청장이 특별한 사유가 있다고 인정하는 자동차", basis: "법제처 자치법규 의견제시(의견23-0452) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견23-0452", "org": "인천광역시 중구", "date": "2024-01-22", "seq": "", "concl": "\"그 밖에 구청장이 특별한 사유가 있다고 인정하는 경우\"를 규정하는 것은 바람직하지 않은 것으로 보이며, 구체화하여 규정하는 것이 바람직"}], why: "공영주차장 주차요금 면제 사유 끝에 \"그 밖에 구청장이 특별한 사유가 있다고 인정하는 자동차\"라는 포괄 사유를 두어 법제처가 문제 삼은 조문 형식과 같다.", how: "감면·면제 대상을 구체적 사유로 열거하거나 포괄 사유를 삭제해 주민의 예측가능성을 높이는 방향으로 정비를 검토"}
