  - {oid: "2049542", art: "제10조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 주민자치위원회가 주민자치센터 프로그램 수강료의 감면·미징수 여부를 스스로 결정하도록 함", level: "위반 소지", ctx: "①위원회는 프로그램의 효율적 운영을 위해 조례 제10조제2항 및 제3항에 따라 동장과 협의한 후 수강료 등을 결정하여 이용자에게 징수할 수 있다. 다만, 지역의 특수성 및 주민자치센터 운영의 효율성을 높이기 위하여 수강료를 징수하는 것이 부적합하다고 판단되는 경우에는 수강료를 징수하지 아니할 수 있다", basis: "법제처 자치법규 의견제시(의견24-0082) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견24-0082", "org": "서울특별시 서초구", "date": "2024-03-15", "seq": "", "concl": "이 사안의 주민자치위원회가 수강료 감면 여부를 결정할 수 없을 것으로 보입니다"}], why: "주민자치위원회가 동장과 협의해 수강료를 결정하면서, 부적합하다고 판단하면 수강료를 징수하지 않을 수 있도록 해 위원회가 감면(면제) 여부를 정하는 구조이다. [확인할 점] 규칙 조문이다. 조례 제10조제5항은 감면 주체를 구청장으로 정하고 있어 규칙 단서와의 관계 확인 필요.", how: "수강료 감면·미징수 기준은 조례(구청장 감면 규정)로 정하고 위원회 결정 단서는 삭제하거나 구청장 승인 절차로 바꾸는 정비를 검토"}
