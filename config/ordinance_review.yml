  # 참고 미분류 잔여분 — 도시교통정비 촉진법·수도법·여객자동차법·하수도법·자원봉사활동 기본법·농안법 대조(2026-10-09)
  - {oid: "2151087", art: "제7조", verdict: "delegated", deleg: "「도시교통정비 촉진법」 제38조·시행령 제24조제2항(별표 4 교통량 감축 활동별 경감률)·제7항(경감되는 시설물 범위 등은 조례로) — 경감을 받으려는 소유자의 요건이다(신청하지 않으면 의무 없음)."}
  - {oid: "2049318", art: "제4조", verdict: "check", deleg: "「수도법 시행령」 제32조는 대지경계선에서 계량기까지 급수설비의 관리자를 '조례로 정하는 자'로 맡긴다 — 그러나 제3항은 원인자부담금 조례에서 사유지 안의 '수도시설'(수도사업자 시설 포함 가능) 전반에 소유자·관리자의 주의 의무를 지운다.", how: "급수설비 관리자 지정은 수도급수 조례(시행령 제32조 위임)에 두고, 수도사업자 소유 시설에 대한 사유지 소유자 의무는 근거 조문을 밝히거나 '협조하여야 한다'로 범위를 줄인다."}
  - {oid: "2049642", art: "제18조", verdict: "check", deleg: "수도요금 감면은 「수도법」 제38조·시행령 제53조의2제2항이 조례에 맡긴다 — 계측장치 설치는 감면을 받으려는 중수도·빗물이용시설 설치자의 요건이지만, 이 요건을 조례가 아닌 시행규칙에 두었다.", how: "「대구광역시 수도급수 조례」의 감면 조문이 감면 요건·절차를 규칙에 맡겼는지 확인하고, 맡기지 않았다면 계측장치 설치 요건을 조례 감면 조문으로 옮긴다."}
  - {oid: "2047646", art: "제8조", verdict: "delegated", deleg: "「여객자동차 운수사업법 시행규칙」 제23조제2항: 마을버스운송사업의 등록조건·운행계통의 기준 등 등록에 관한 세부 사항은 시·도의 조례로 정할 수 있다."}
