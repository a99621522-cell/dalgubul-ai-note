  - {oid: "2049788", art: "제1조", key: "basis_moved_law", name: "근거 조항이 다른 법률로 옮겨감", level: "정비 권고", ctx: "이 조례는 『산림보호법』 제45조의9에 따라 … 산사태취약지역지정위원회의 구성ㆍ운영에 필요한 사항을 정함을 목적으로 한다.", basis: "「산림보호법」 제45조의9 삭제(2025.1.31), 「산림재난방지법」 제23조(산사태취약지역 지정위원회 — 시장·군수·구청장 소속은 조례로 정한다) — 2026-10-09 현행 조문 확인", prec: [{"case": "「산림재난방지법」 제23조", "org": "법령", "date": "", "seq": "", "concl": "산사태취약지역 지정위원회 — 산림재난방지기관의 장 소속으로 구성·운영하여야 하고, 시장·군수·구청장 소속은 해당 지방자치단체의 조례로 정한다"}], why: "조례 제1조가 근거로 든 「산림보호법」 제45조의9는 삭제되었고, 산사태취약지역 지정위원회 규정은 「산림재난방지법」 제23조로 옮겨졌다. 같은 조는 시장·군수·구청장 소속 위원회를 '해당 지방자치단체의 조례로 정한다'고 맡긴다. 이 조례는 법령 이름을 『』로 적어 자동 대조에서 빠졌다.", how: "제1조의 근거를 「산림재난방지법」 제23조로 고치고, 위원회 기능·구성 조문이 같은 법과 시행령의 지정·변경 절차와 맞는지 함께 확인한다."}
  - {oid: "2231908", art: "제1조", key: "unenacted_carbon_plan", name: "법률이 조례로 정하게 한 사항의 조례가 없음", level: "정비 권고", ctx: "이 조례는 대구광역시 군위군의 저탄소 녹색성장 시책을 종합적으로 추진함으로써 기후변화에 대응하고 …", basis: "「기후위기 대응을 위한 탄소중립ㆍ녹색성장 기본법」 제12조(시장·군수·구청장의 탄소중립 시·군·구계획 수립), 같은 법 시행령 제7조제6항(계획 수립·변경에 필요한 사항은 시·군·구의 조례로 정한다) — 「저탄소 녹색성장 기본법」은 같은 법 시행(2022.3.25)으로 폐지", prec: [], why: "대구시와 다른 8개 구·군은 탄소중립기본법에 따른 조례를 두고 있으나 군위군에는 이 법을 인용하는 조례가 없고, 폐지된 「저탄소 녹색성장 기본법」 체계의 '저탄소 녹색성장 기본조례'만 있다. 시행령 제7조제6항은 탄소중립 시·군·구계획의 수립·변경에 필요한 사항을 시·군·구 조례로 정하게 한다.", how: "이 조례를 탄소중립기본법 체계(탄소중립 시·군·구계획, 지방 탄소중립녹색성장위원회 등)에 맞춰 전부개정하거나 새 조례로 대체한다."}
  - {oid: "2160917", art: "제1조", key: "unenacted_village_enterprise", name: "새 법률이 조례로 정하게 한 사항의 조례가 없음", level: "정비 권고", ctx: "사회적경제 육성 및 지원에 관한 조례 — 마을기업은 정의(제3조)에만 나온다", basis: "「마을기업 육성 및 지원에 관한 법률」(2025.8.14 공포, 2026.8.15 시행) 제7조제4항(시·도 시행계획의 수립·시행 등에 필요한 사항은 조례로 정한다), 같은 법 시행령(2026.8.11 공포) 제21조제4항(마을기업지원기관의 설치·지정·운영 세부 사항은 지방자치단체의 조례로 정한다)", prec: [], why: "새로 제정된 마을기업법은 시·도 마을기업 시행계획의 수립·시행 등에 필요한 사항과 마을기업지원기관의 설치·지정·운영 세부 사항을 조례로 정하게 한다. 대구시 자치법규 가운데 이 법을 인용하는 것이 없고, 사회적경제 조례(2018년 공포)는 마을기업을 정의에만 둔다.", how: "법이 2026.8.15부터 시행 중이므로 사회적경제 조례에 마을기업 시행계획·지원기관 조문을 더하거나 마을기업 조례를 따로 만든다. 시·도 마을기업육성·지원위원회(법 제10조)를 두는 경우 그 구성·운영도 조례로 정한다."}
# 다른 지자체가 법제처에 질의해 '위배 소지·바람직하지 않음' 회신을 받은 쟁점과 같은 대구 조문(2026-10-09 세션 대조 — 의견제시 1,242묶음, 운영자 확인 전). 형식은 annex 와 같다.
opinion:
  - {oid: "2050501", art: "제2조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 단체장의 자체감사 규칙에서 감사대상기관에 지방의회 사무기구(의회사무과)와 지방자치단체 금고를 포함하는 규정", level: "정비 권고", ctx: "2. 소속기관 및 동 행정복지센터, 구 의회사무과", basis: "법제처 자치법규 의견제시(의견12-0026, 의견15-0279) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견12-0026", "org": "충청북도 진천군", "date": "2012-02-08", "seq": "", "concl": "감사대상기관에 의회 소속으로 설치된 의회사무과 및 군 금고를 포함하는 것은 바람직하지 않은 것으로 보입니다."}, {"case": "의견15-0279", "org": "서울특별시 광진구", "date": "2015-10-21", "seq": "", "concl": "지방의회 소속으로 설치된 의회 사무국을 지방자치단체의 장이 제정하는 규칙으로 자체감사 대상기관에 포함시키는 것은 … 바람직하지 않은 것"}], why: "구청장·군수가 실시하는 자체감사의 대상기관에 의회 소속 사무기구를 열거하고 있어, 법제처가 바람직하지 않다고 본 규정 유형과 같습니다. / 단체장 규칙으로 의회사무국(사무과)을 본청·소속기관과 같은 자체감사 대상기관으로 열거해, 회신이 권한 배분 원칙상 바람직하지 않다고 본 유형과 같음. [확인할 점] 회신 자료에 이유 본문이 없어 근거 조문은 확인 필요. 2022년 「지방자치법」 전부개정(제103조, 의회 사무직원 임용권 의장)으로 같은 취지가 더 강해졌을 수 있으나 행정안전부 지침 확인 필요. 9개 구·군 규칙에 같은 유형이 공통으로 있음. 2022년 전부개정 「지방자치법」 제103조로 의회 사무직원 인사권이 의장에게 넘어가 회신 당시보다 의회 독립성이 커졌음. 의회 쪽 감사 규정이 있는지 함께 확인.", how: "감사대상기관에서 의회사무국(과)를 빼거나, 의회사무기구 감사는 의장 요청·협의 등 별도 근거를 두는 방향으로 검토. 의회사무국(사무과)을 감사대상기관 열거에서 빼거나, 임용·보수·복무 등 단체장 소관 사항에 한정해 감사할 수 있도록 범위를 좁히는 방향으로 검토."}
  - {oid: "2048747", art: "제3조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 단체장의 자체감사 규칙에서 감사대상기관에 지방의회 사무기구(의회사무과)와 지방자치단체 금고를 포함하는 규정", level: "정비 권고", ctx: "감사대상기관은 대구광역시 동구(이하 “구”라 한다) 본청 및 그 소속기관(직속기관, 사업소, 동 포함), 구 출자·출연기관, 의회사무국으로 한다.", basis: "법제처 자치법규 의견제시(의견12-0026, 의견15-0279) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견12-0026", "org": "충청북도 진천군", "date": "2012-02-08", "seq": "", "concl": "감사대상기관에 의회 소속으로 설치된 의회사무과 및 군 금고를 포함하는 것은 바람직하지 않은 것으로 보입니다."}, {"case": "의견15-0279", "org": "서울특별시 광진구", "date": "2015-10-21", "seq": "", "concl": "지방의회 소속으로 설치된 의회 사무국을 지방자치단체의 장이 제정하는 규칙으로 자체감사 대상기관에 포함시키는 것은 … 바람직하지 않은 것"}], why: "구청장·군수가 실시하는 자체감사의 대상기관에 의회 소속 사무기구를 열거하고 있어, 법제처가 바람직하지 않다고 본 규정 유형과 같습니다. / 단체장 규칙으로 의회사무국(사무과)을 본청·소속기관과 같은 자체감사 대상기관으로 열거해, 회신이 권한 배분 원칙상 바람직하지 않다고 본 유형과 같음. [확인할 점] 회신 자료에 이유 본문이 없어 근거 조문은 확인 필요. 2022년 「지방자치법」 전부개정(제103조, 의회 사무직원 임용권 의장)으로 같은 취지가 더 강해졌을 수 있으나 행정안전부 지침 확인 필요. 9개 구·군 규칙에 같은 유형이 공통으로 있음. 2022년 전부개정 「지방자치법」 제103조로 의회 사무직원 인사권이 의장에게 넘어가 회신 당시보다 의회 독립성이 커졌음. 의회 쪽 감사 규정이 있는지 함께 확인.", how: "감사대상기관에서 의회사무국(과)를 빼거나, 의회사무기구 감사는 의장 요청·협의 등 별도 근거를 두는 방향으로 검토. 의회사무국(사무과)을 감사대상기관 열거에서 빼거나, 임용·보수·복무 등 단체장 소관 사항에 한정해 감사할 수 있도록 범위를 좁히는 방향으로 검토."}
