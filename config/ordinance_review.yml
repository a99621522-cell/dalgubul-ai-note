  - {oid: "2049788", art: "제1조", key: "basis_moved_law", name: "근거 조항이 다른 법률로 옮겨감", level: "정비 권고", ctx: "이 조례는 『산림보호법』 제45조의9에 따라 … 산사태취약지역지정위원회의 구성ㆍ운영에 필요한 사항을 정함을 목적으로 한다.", basis: "「산림보호법」 제45조의9 삭제(2025.1.31), 「산림재난방지법」 제23조(산사태취약지역 지정위원회 — 시장·군수·구청장 소속은 조례로 정한다) — 2026-10-09 현행 조문 확인", prec: [{"case": "「산림재난방지법」 제23조", "org": "법령", "date": "", "seq": "", "concl": "산사태취약지역 지정위원회 — 산림재난방지기관의 장 소속으로 구성·운영하여야 하고, 시장·군수·구청장 소속은 해당 지방자치단체의 조례로 정한다"}], why: "조례 제1조가 근거로 든 「산림보호법」 제45조의9는 삭제되었고, 산사태취약지역 지정위원회 규정은 「산림재난방지법」 제23조로 옮겨졌다. 같은 조는 시장·군수·구청장 소속 위원회를 '해당 지방자치단체의 조례로 정한다'고 맡긴다. 이 조례는 법령 이름을 『』로 적어 자동 대조에서 빠졌다.", how: "제1조의 근거를 「산림재난방지법」 제23조로 고치고, 위원회 기능·구성 조문이 같은 법과 시행령의 지정·변경 절차와 맞는지 함께 확인한다."}
  - {oid: "2231908", art: "제1조", key: "unenacted_carbon_plan", name: "법률이 조례로 정하게 한 사항의 조례가 없음", level: "정비 권고", ctx: "이 조례는 대구광역시 군위군의 저탄소 녹색성장 시책을 종합적으로 추진함으로써 기후변화에 대응하고 …", basis: "「기후위기 대응을 위한 탄소중립ㆍ녹색성장 기본법」 제12조(시장·군수·구청장의 탄소중립 시·군·구계획 수립), 같은 법 시행령 제7조제6항(계획 수립·변경에 필요한 사항은 시·군·구의 조례로 정한다) — 「저탄소 녹색성장 기본법」은 같은 법 시행(2022.3.25)으로 폐지", prec: [], why: "대구시와 다른 8개 구·군은 탄소중립기본법에 따른 조례를 두고 있으나 군위군에는 이 법을 인용하는 조례가 없고, 폐지된 「저탄소 녹색성장 기본법」 체계의 '저탄소 녹색성장 기본조례'만 있다. 시행령 제7조제6항은 탄소중립 시·군·구계획의 수립·변경에 필요한 사항을 시·군·구 조례로 정하게 한다.", how: "이 조례를 탄소중립기본법 체계(탄소중립 시·군·구계획, 지방 탄소중립녹색성장위원회 등)에 맞춰 전부개정하거나 새 조례로 대체한다."}
  - {oid: "2160917", art: "제1조", key: "unenacted_village_enterprise", name: "새 법률이 조례로 정하게 한 사항의 조례가 없음", level: "정비 권고", ctx: "사회적경제 육성 및 지원에 관한 조례 — 마을기업은 정의(제3조)에만 나온다", basis: "「마을기업 육성 및 지원에 관한 법률」(2025.8.14 공포, 2026.8.15 시행) 제7조제4항(시·도 시행계획의 수립·시행 등에 필요한 사항은 조례로 정한다), 같은 법 시행령(2026.8.11 공포) 제21조제4항(마을기업지원기관의 설치·지정·운영 세부 사항은 지방자치단체의 조례로 정한다)", prec: [], why: "새로 제정된 마을기업법은 시·도 마을기업 시행계획의 수립·시행 등에 필요한 사항과 마을기업지원기관의 설치·지정·운영 세부 사항을 조례로 정하게 한다. 대구시 자치법규 가운데 이 법을 인용하는 것이 없고, 사회적경제 조례(2018년 공포)는 마을기업을 정의에만 둔다.", how: "법이 2026.8.15부터 시행 중이므로 사회적경제 조례에 마을기업 시행계획·지원기관 조문을 더하거나 마을기업 조례를 따로 만든다. 시·도 마을기업육성·지원위원회(법 제10조)를 두는 경우 그 구성·운영도 조례로 정한다."}
