  - {oid: "2184797", art: "제15조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 농외소득법에 따른 농산물가공시설 사용허가를 받은 자에게 법령 위임 없이 사용 정지·허가 변경 등 처분을 할 수 있도록 한 조문", level: "위반 소지", ctx: "군수는 다음 각 호의 어느 하나에 해당하는 경우 사용허가를 취소하거나 사용중지, 변경 등 그 밖에 필요한 조치를 취할 수 있다. 1. 제14조 각 호의 어느 하나에 해당하는 사유가 발생한 경우 2. 규정에 따른 관리자의 지시사항을 위반한 경우 3. 사용자의 건강·위생상태가 안전과 식품위생에 위해하다고 판단될 경우 4. 허위 또는 부정한 방법으로 사용허가를 ", basis: "법제처 자치법규 의견제시(의견19-0350) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견19-0350", "org": "경상북도 청도군", "date": "2019-11-25", "seq": "", "concl": "이러한 내용을 조례에 규정하는 것은 「지방자치법」제22조 단서에 위반될 소지가 있을 것으로 보이므로 조례 입안에 신중"}], why: "「농업인등의 농외소득 활동 지원에 관한 법률」 제7조에 따른 가공센터 사용자에게 허가 취소 외에 사용중지·변경 등 처분을 할 수 있게 해 청도군 질의(사용 정지·기간 단축)와 같다. [확인할 점] 회신 뒤 농외소득법령에 사용 정지 위임이 생겼는지 확인할 것.", how: "사용중지·변경 등 처분은 공유재산법상 취소·철회 근거 범위로 한정하는 방향으로 검토한다."}
