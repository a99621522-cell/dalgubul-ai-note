  - {oid: "2233093", art: "제24조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 위탁계약이 해지된 수탁자는 일정 기간 위탁운영(입찰·수의계약)에 참여할 수 없도록 일률적으로 정한 조문", level: "정비 권고", ctx: "③ 제1항제1호에서 제3호까지의 사유에 따라 위탁계약이 해지된 자는 1년간 위탁운영에 참여할 수 없다. <신설 2026.8.18.>", basis: "법제처 자치법규 의견제시(의견20-0032) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견20-0032", "org": "경상북도 경산시", "date": "2020-02-25", "seq": "", "concl": "획일적으로 위탁계약이 해지된 수탁자에 대하여…입찰참가등 제한을 하도록…규정하는 것은 법령에 따른 지방자치단체 장의 권한을 침해할 소지"}], why: "체육시설 위탁계약이 해지된 자를 일정 기간(1~2년) 위탁운영 참여에서 일률적으로 배제하고 있어 경산시 조례안과 같은 유형이다. [확인할 점] 회신은 '권한 침해 소지·신중'으로 표현되어 정비 권고로 분류함.", how: "참여 제한을 일률 규정하지 않고 지방계약법령의 입찰참가자격 제한 절차에 따르도록 하거나 단체장 판단 여지를 두는 방향으로 검토한다."}
