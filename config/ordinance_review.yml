# 자치법규 별표(금액표 등)를 상위법령 별표와 대조한 결과(data/ordinance/annex/, scripts/ordin/annex.py). art 는 그 별표를 인용하는 조문.
annex:
  - {oid: "2231951", art: 제3조, key: annex_road_fee_old, name: 도로점용료 산정기준 별표가 개정 전 시행령 기준, level: 위반 소지,
     annex: "별표 1 점용료 산정기준",
     ctx: "3. 주유소ㆍ주차장ㆍ여객자동차터미널… 건축물: 1층인 건축물 토지가격에 0.05, 2층 0.055, 3층 0.06, 4층 이상 0.065를 곱한 금액",
     basis: "「도로법」 제66조제4항, 같은 법 시행령 제69조제2항(고속국도·일반국도 외 도로의 점용료는 별표 3의 점용료 산정기준에서 규정한 범위에서 조례로 정함), 같은 시행령 별표 3 제3호(2021. 1. 5. 개정: 건축물 토지가격에 0.04, 진입로·출입로 0.02, 그 밖의 것 0.05를 곱한 금액) — 2026-10-09 현행 별표 확인",
     why: "조례 별표 1 제3호(주유소·주차장 등)의 건축물 점용료를 층수별로 토지가격의 0.05~0.065로 정해, 현행 시행령 별표 3의 건축물 기준(토지가격에 0.04)보다 높다. 제1호 명칭('전주')·수소자동차 충전시설 미반영 등 개정 전 별표 형식이 남아 있다.",
     how: "별표 1을 현행 「도로법 시행령」 별표 3과 맞추거나, 다른 구처럼 '점용료는 영 별표 3에서 정하는 기준에 따른다'로 고친다(농어촌도로 점용료는 「농어촌도로 정비법」 제19조제2항에 따라 따로 정함)."}
  - {oid: "2049197", art: 제3조, key: annex_info_fee_old, name: 정보공개 수수료 별표가 개정 전 기준(전자파일 복제 유료), level: 정비 권고,
     annex: "별표 4 행정정보공개수수료",
     ctx: "전자파일(문서ㆍ도면ㆍ사진 등)의 복제 - 1건 1MB 이내: 무료 - 1MB 초과 시 1MB마다 100원",
     basis: "「공공기관의 정보공개에 관한 법률」 제17조(비용 부담), 같은 법 시행규칙 별표 수수료(2021. 6. 23. 개정: 전자파일(문서ㆍ도면ㆍ사진 등)의 복제 — 무료, 매체비용은 별도) — 2026-10-09 현행 별표 확인",
     why: "조례 별표의 정보공개 수수료가 전자파일 복제에 1MB 초과분 1MB마다 100원을 받도록 해, 전자파일 복제를 무료로 바꾼 현행 시행규칙 별표와 다르다. 열람·사본 수수료는 현행 별표와 같다.",
     how: "전자파일 복제 수수료를 '무료(매체비용은 별도)'로 고쳐 현행 시행규칙 별표와 맞춘다(대구시·동구·서구·남구·중구·수성구 조례는 이미 반영)."}
  - {oid: "2048360", art: 제3조, key: annex_info_fee_old, name: 정보공개 수수료 별표가 개정 전 기준(전자파일 복제 유료), level: 정비 권고,
