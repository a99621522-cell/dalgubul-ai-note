  - {oid: "2231803", art: "제20조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 자원봉사자·위원 등 민간인에게 산업시찰·견학(국내외 시찰 포함)을 실시하거나 그 비용을 지원하는 규정", level: "정비 권고", ctx: "군수는 헌신적이며 모범적으로 자원봉사활동을 실천하는 자원봉사자 및 단체에 대하여 산업시찰, 세미나, 포상자 추천 등을 실시할 수 있다.", basis: "법제처 자치법규 의견제시(의견12-0419) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견12-0419", "org": "경상북도 칠곡군", "date": "2012-12-31", "seq": "", "concl": "직접지원방식이라면 「지방재정법」 제17조제1항에 위반될 소지 … 견학 등을 실시하는 것은 바람직하지도 않은 것"}], why: "자원봉사자 등 민간인을 대상으로 산업시찰·견학 등을 실시하거나 그 경비를 지원할 수 있게 하여 회신 사안과 같은 유형이다.", how: "개인·단체에 대한 직접 지원이 「지방재정법」 제17조제1항 예외에 해당하는지 검토하고, 해당하지 않으면 견학·시찰 지원 규정 삭제를 검토."}
  - {oid: "2049206", art: "제23조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 자원봉사자·위원 등 민간인에게 산업시찰·견학(국내외 시찰 포함)을 실시하거나 그 비용을 지원하는 규정", level: "정비 권고", ctx: "② 구청장은 자치센터 활성화를 위하여 자치위원, 자원봉사자 등에 대한 견학, 교육 또는 워크숍 개최 등을 할 수 있으며, 이에 따른 경비 및 편의제공을 할 수 있다.", basis: "법제처 자치법규 의견제시(의견12-0419) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견12-0419", "org": "경상북도 칠곡군", "date": "2012-12-31", "seq": "", "concl": "직접지원방식이라면 「지방재정법」 제17조제1항에 위반될 소지 … 견학 등을 실시하는 것은 바람직하지도 않은 것"}], why: "자원봉사자 등 민간인을 대상으로 산업시찰·견학 등을 실시하거나 그 경비를 지원할 수 있게 하여 회신 사안과 같은 유형이다. [확인할 점] 주민자치위원·자원봉사자 견학 경비 지원.", how: "개인·단체에 대한 직접 지원이 「지방재정법」 제17조제1항 예외에 해당하는지 검토하고, 해당하지 않으면 견학·시찰 지원 규정 삭제를 검토."}
  - {oid: "2193518", art: "제33조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 자원봉사자·위원 등 민간인에게 산업시찰·견학(국내외 시찰 포함)을 실시하거나 그 비용을 지원하는 규정", level: "정비 권고", ctx: "⑨ 군수는 차별화된 디자인도시를 만들기 위하여 필요하다고 인정하는 경우 경관위원회 및 경관사업추진협의체 위원 그리고 담당공무원과 디자인 사업지구 내 주민대표 등에게 디자인사업의 성공사례 견학을 목적으로 하는 국내·외 비교 시찰·견학에 필요한 비용의 일부 또는 전부를 예산의 범위에서 지원할 수 있다.", basis: "법제처 자치법규 의견제시(의견12-0419) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견12-0419", "org": "경상북도 칠곡군", "date": "2012-12-31", "seq": "", "concl": "직접지원방식이라면 「지방재정법」 제17조제1항에 위반될 소지 … 견학 등을 실시하는 것은 바람직하지도 않은 것"}], why: "자원봉사자 등 민간인을 대상으로 산업시찰·견학 등을 실시하거나 그 경비를 지원할 수 있게 하여 회신 사안과 같은 유형이다. [확인할 점] 경관위원회·협의체 위원·주민대표 대상 국내외 시찰 경비 지원(유사 회신 의견13-0262: 자문기관 국내외 벤치마킹 예산지원 부적절).", how: "개인·단체에 대한 직접 지원이 「지방재정법」 제17조제1항 예외에 해당하는지 검토하고, 해당하지 않으면 견학·시찰 지원 규정 삭제를 검토."}
  - {oid: "2047903", art: "제6조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 자문 성격 위원회의 심의결과를 단체장이 계획 수립에 반드시 반영하도록 해 위원회 결정에 단체장이 기속되게 함", level: "정비 권고", ctx: "④ 구청장은 제1항의 기본계획 수립, 제3항의 연도별 시행계획 수립 및 평가에 관한 사항을 제10조에 따른 위원회에 보고하여야 하고, 위원회의 심의결과를 연도별 시행계획 및 기본계획 수립에 반영하여야 한다.", basis: "법제처 자치법규 의견제시(의견13-0311) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견13-0311", "org": "제주특별자치도", "date": "2013-10-31", "seq": "", "concl": "위원회의 심의결과 등에 도지사가 기속되지 않도록 … ‘자문기관’의 성격을 갖도록 … 변경할 필요"}], why: "구청장이 위원회의 심의결과를 계획에 \"반영하여야 한다\"고 정해, 위원회 심의결과에 단체장이 기속되는 것으로 읽힌다. [확인할 점] 같은 취지 회신 의견12-0430(천안시).", how: "\"반영하여야 한다\"를 \"반영할 수 있다\" 또는 \"참고하여야 한다\" 등 자문기구 성격에 맞는 표현으로 고치는 방향으로 검토."}
  - {oid: "2187788", art: "제6조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 자문 성격 위원회의 심의결과를 단체장이 계획 수립에 반드시 반영하도록 해 위원회 결정에 단체장이 기속되게 함", level: "정비 권고", ctx: "② 시행계획에는 제9조에 따른 위원회의 협의 또는 심의 결과를 반영하여야 한다.", basis: "법제처 자치법규 의견제시(의견13-0311) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견13-0311", "org": "제주특별자치도", "date": "2013-10-31", "seq": "", "concl": "위원회의 심의결과 등에 도지사가 기속되지 않도록 … ‘자문기관’의 성격을 갖도록 … 변경할 필요"}], why: "구청장이 위원회의 심의결과를 계획에 \"반영하여야 한다\"고 정해, 위원회 심의결과에 단체장이 기속되는 것으로 읽힌다. [확인할 점] 같은 취지 회신 의견12-0430(천안시). 인권 분야가 아닌 일반 자문위원회 조문 — 같은 원칙(자문기구 심의결과 기속) 적용 여부 검토.", how: "\"반영하여야 한다\"를 \"반영할 수 있다\" 또는 \"참고하여야 한다\" 등 자문기구 성격에 맞는 표현으로 고치는 방향으로 검토."}
  - {oid: "2229747", art: "제2조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 소속 무기계약(공무직) 근로자와 그 자녀에게 학자금을 조례로 지원", level: "정비 권고", ctx: "1. “환경공무직”이란 대구광역시(이하 “시”라 한다) 및 구ㆍ군 소속의 공무직 근로자로서 도로ㆍ가로 청소, 폐기물 수거ㆍ처리 등 환경미화 업무에 종사하는 근로자를 말한다.", basis: "법제처 자치법규 의견제시(의견13-0083) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견13-0083", "org": "경상남도 통영시의회", "date": "2013-03-27", "seq": "", "concl": "학자금 대출 이자 지원은 … 인사권을 침해할 가능성 … 「지방재정법」 제17조제1항에 위반될 가능성"}], why: "시·구·군 소속 환경공무직 근로자의 대학생 자녀에게 시가 장학금을 지급하도록 조례로 정해, 소속 근로자(가족)에 대한 개인 지원이라는 점에서 회신 사안과 유형이 같다. [확인할 점] 회신 사안은 학자금 대출 이자 지원(의원발의)이고 대구 조례는 자녀 장학금이라 형태가 다름. 발의 주체·단체협약 등 근거 확인 필요.", how: "근로조건·복리후생으로 단체장이 정할 사항인지와 「지방재정법」 제17조제1항 예외 해당 여부를 검토해 근거 형식을 정비하는 방향으로 검토."}
  - {oid: "2229747", art: "제6조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 소속 무기계약(공무직) 근로자와 그 자녀에게 학자금을 조례로 지원", level: "정비 권고", ctx: "① 시장은 제5조에 따라 선발된 장학생에게 예산의 범위 내에서 장학금을 연 1회 지급한다.", basis: "법제처 자치법규 의견제시(의견13-0083) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견13-0083", "org": "경상남도 통영시의회", "date": "2013-03-27", "seq": "", "concl": "학자금 대출 이자 지원은 … 인사권을 침해할 가능성 … 「지방재정법」 제17조제1항에 위반될 가능성"}], why: "시·구·군 소속 환경공무직 근로자의 대학생 자녀에게 시가 장학금을 지급하도록 조례로 정해, 소속 근로자(가족)에 대한 개인 지원이라는 점에서 회신 사안과 유형이 같다. [확인할 점] 회신 사안은 학자금 대출 이자 지원(의원발의)이고 대구 조례는 자녀 장학금이라 형태가 다름. 발의 주체·단체협약 등 근거 확인 필요.", how: "근로조건·복리후생으로 단체장이 정할 사항인지와 「지방재정법」 제17조제1항 예외 해당 여부를 검토해 근거 형식을 정비하는 방향으로 검토."}
  - {oid: "2049238", art: "제3조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 상위법령 근거 없이 조례로 지역치안협의회에 경찰서장·소방서장·세무서장 등 관내 국가기관 장을 당연직 위원(의장·부의장 포함…", level: "정비 권고", ctx: "② 협의회의 의장은 대구광역시북구청장(이하“구청장”이라 한다), 대구북부경찰서장, 대구강북경찰서장이 공동으로 한다.(일부개정 2020.09.21, 2025.5.30.) ③ (삭 제 2020.09.21.) ④ 위원은 당연직 위원과 위촉직 위원으로 구분하고, 다음 각 호의 사람을 당연직 위원으로 한다. 1. 대구광역시 북구의회 의장 2. 대구광역시 북구 관할소", basis: "법제처 자치법규 의견제시(의견14-0168) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견14-0168", "org": "서울특별시 의회사무처", "date": "2014-09-26", "seq": "", "concl": "상위법령에 특별한 규정이 없다면 관내기관 단체장을 당연직 위원으로 규정하는 것은 바람직하지 않음"}], why: "상위법령의 근거 없이 조례로 북부·강북경찰서장을 공동의장으로, 관할소방서장·서부교육지원청 교육장을 당연직 위원으로 정하고 있어 법제처가 문제 삼은 구성 방식과 같다. [확인할 점] 2014년 회신이며 표준조례에 따른 조문일 수 있음. 의회 의장 당연직 부분은 별도 규칙(member_on_exec_committee) 대상. 자치경찰 관련 법령 변화로 근거가 생겼는지 확인 필요", how: "국가기관 장은 당연직이 아니라 해당 기관의 추천·동의를 받아 위촉하는 방식 등으로 구성 조항을 고치는 것을 검토한다."}
  - {oid: "2047998", art: "제4조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 상위법령 근거 없이 조례로 지역치안협의회에 경찰서장·소방서장·세무서장 등 관내 국가기관 장을 당연직 위원(의장·부의장 포함…", level: "정비 권고", ctx: "② 위원장은 대구광역시 달서구청장(이하 “구청장”이라 한다)이 되고, 부위원장은 대구성서경찰서장, 대구달서경찰서장으로 한다. ③ 당연직 위원은 다음 각 호와 같다. 1. 대구광역시 달서구의회 의장 2. 대구광역시 남부교육지원청 교육장 3. 대구광역시 달서소방서장 4. 대구광역시 강서소방서장 5. 남대구세무서장 6. 서대구세무서장 7. 대구공업대학 총장 8.", basis: "법제처 자치법규 의견제시(의견14-0168) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견14-0168", "org": "서울특별시 의회사무처", "date": "2014-09-26", "seq": "", "concl": "상위법령에 특별한 규정이 없다면 관내기관 단체장을 당연직 위원으로 규정하는 것은 바람직하지 않음"}], why: "상위법령의 근거 없이 조례로 성서·달서경찰서장을 부위원장으로, 소방서장·세무서장·보호관찰소 지소장 등을 당연직 위원으로 정하고 있어 법제처가 문제 삼은 구성 방식과 같다. [확인할 점] 2014년 회신이며 표준조례에 따른 조문일 수 있음. 의회 의장 당연직 부분은 별도 규칙(member_on_exec_committee) 대상. 자치경찰 관련 법령 변화로 근거가 생겼는지 확인 필요", how: "국가기관 장은 당연직이 아니라 해당 기관의 추천·동의를 받아 위촉하는 방식 등으로 구성 조항을 고치는 것을 검토한다."}
  - {oid: "2160863", art: "제3조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 상위법령 근거 없이 조례로 지역치안협의회에 경찰서장·소방서장·세무서장 등 관내 국가기관 장을 당연직 위원(의장·부의장 포함…", level: "정비 권고", ctx: "② 협의회의 의장(이하 “의장”이라 한다)은 대구광역시 달성군수(이하 “군수”라 한다)가 되고, 부의장은 대구달성경찰서장으로 한다. ③ 위원은 당연직 위원과 위촉직 위원으로 구분하고, 다음 각 호의 사람을 당연직 위원으로 한다. 1. 대구광역시 달성군의회 의장 2. 대구광역시 달성소방서장 3. 대구광역시 강서소방서장(신설 2016.9.30) 4. 대구광역시", basis: "법제처 자치법규 의견제시(의견14-0168) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견14-0168", "org": "서울특별시 의회사무처", "date": "2014-09-26", "seq": "", "concl": "상위법령에 특별한 규정이 없다면 관내기관 단체장을 당연직 위원으로 규정하는 것은 바람직하지 않음"}], why: "상위법령의 근거 없이 조례로 달성경찰서장을 부의장으로, 달성·강서소방서장과 교육장을 당연직 위원으로 정하고 있어 법제처가 문제 삼은 구성 방식과 같다. [확인할 점] 2014년 회신이며 표준조례에 따른 조문일 수 있음. 의회 의장 당연직 부분은 별도 규칙(member_on_exec_committee) 대상. 자치경찰 관련 법령 변화로 근거가 생겼는지 확인 필요", how: "국가기관 장은 당연직이 아니라 해당 기관의 추천·동의를 받아 위촉하는 방식 등으로 구성 조항을 고치는 것을 검토한다."}
