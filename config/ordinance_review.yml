# 같은 유형이 여러 구·군에 있는 것 — 자치법규 이름(정규식)과 조문 제목(정규식, 없으면 모든 조문)으로 맞춘다.
patterns:
  - {name: "위험수목|도시가스 공급사업|착한가격업소|모범사업자|식품등 기부", verdict: delegated, deleg: "지원·지정을 신청하는 사람이 갖출 요건·지원 조건이다 — 신청하지 않는 주민에게는 의무가 없음."}
  - {name: "전통시장 및 상점가", title: "시장구역|시장의 구역|전통시장의 구역|지정", verdict: delegated, deleg: "구청장이 시장구역을 다시 지정할 때의 기준(행정청 자신의 기준)이다 — 주민 의무가 아님(「전통시장 및 상점가 육성을 위한 특별법」 제2조·제3조)."}
  - {name: "테마파크|배움터", verdict: delegated, deleg: "공공시설 안의 금지행위(이용 조건)다 — 「지방자치법」 제161조제2항."}
  - {name: "자립준비청년|갑질|위기가구|공공기관등의 유치", title: "비밀|신분|정보", verdict: check, deleg: "'누구든지' 알게 된 비밀·신분을 누설·공개하지 못하게 해 업무 종사자가 아닌 주민에게까지 의무를 지운다 — 업무 종사자 범위로 한정하거나(「지방공무원법」 제52조 비밀엄수, 위탁 계약 조건) 관련 법률 조문을 인용한다."}
  - {name: "보조금", title: "표지판|보조사업자|공모|선정", verdict: delegated, deleg: "지방보조금 교부 조건·선정 절차(「지방자치단체 보조금 관리에 관한 법률」 제7조~제10조, 교부 조건)로 보조사업자가 받아들인 의무다 — 일반 주민 의무가 아님."}
  - {name: "공익제보|공익신고", verdict: delegated, deleg: "「공익신고자 보호법」 제12조가 공익신고자 인적사항 공개 금지를 직접 정한다 — 조례는 법률을 옮겨 적은 것."}
  - {name: "아동학대", verdict: delegated, deleg: "「아동복지법」 제17조(금지행위)·「아동학대범죄의 처벌 등에 관한 특례법」 제10조제3항(신고인 신분 보호)이 직접 정한다 — 조례는 법률을 옮겨 적은 것."}
  - {name: "테마파크|테마공원|공원|배움터|물놀이장|기록관|아트센터|문화전당|체육", title: "준수|금지|이용|대여|반환|관람", verdict: delegated, deleg: "공공시설의 이용 조건이다 — 「지방자치법」 제161조제2항(공공시설의 설치와 관리에 관한 사항은 조례로 정함), 이용자에게만 적용."}
  - {name: "석면", verdict: delegated, deleg: "「석면안전관리법」 제22조제3항: 석면건축물 소유자는 관리기준을 지켜야 한다 — 법률이 직접 정한 의무를 옮겨 적은 것."}
  - {name: "주택의 소방시설", verdict: delegated, deleg: "「소방시설 설치 및 관리에 관한 법률」 제10조제3항: 주택용소방시설의 설치기준 및 자율적인 안전관리 등은 시·도의 조례로 정한다."}
  - {name: "문화예술진흥", title: "미술작품|설치", verdict: delegated, deleg: "「문화예술진흥법」 제9조의2제3항: 미술작품의 설치 절차 및 방법 등은 시·도의 조례로 정한다."}
  - {name: "폐수", verdict: check, deleg: "「물환경보전법」 제48조제1항은 원인자의 공공폐수처리시설 설치·운영 비용 부담 의무를 직접 정하고, 같은 법 제48조의2제5항은 설치 부담금 산정·부과·징수를 대통령령에 맡긴다 — 조례의 시설설치비·유지관리비 산정이 시행령 기준과 맞는지, 유량계·배수설비 설치 의무의 법령 근거(같은 법 시행령·하수도법)를 확인한다."}
  - {name: "위탁|대행|공판장|생활자원회수센터|방문방역", title: "보고|조치계획|징수|보증금|관리", verdict: delegated, deleg: "위탁·대행 계약 상대방(수탁자·대행사업자·공판장 개설자)의 계약상 의무다 — 일반 주민 의무가 아님."}
  - {name: "도서관", title: "운영위원회|위원회", verdict: delegated, deleg: "「도서관법」 제34조제3항: 공립 공공도서관 도서관운영위원회의 구성·운영은 해당 지방자치단체의 조례로 정한다 — 법령에 위원 자격 제한이 없어 지방의원 위촉은 조례로 정할 수 있는 사항(의견25-0232 취지)."}
  - {name: "지방재정계획심의위원회", verdict: delegated, deleg: "「지방재정법」 제33조제10항: 지방재정계획심의위원회의 구성·운영은 해당 지방자치단체의 조례로 정한다 — 법령에 위원 자격 제한 없음."}
  - {name: "지역자율방재단", verdict: delegated, deleg: "「자연재해대책법 시행령」 제60조제4항: 지역자율방재단의 구성·운영은 시·군·구 조례로 정한다 — 자문위원 구성에 법령상 제한 없음."}
  - {name: "물가대책위원회", verdict: delegated, deleg: "물가대책위원회는 법령이 아니라 조례로 둔 자문 위원회다(「물가안정에 관한 법률」에 시·군·구 물가대책위원회 구성 규정 없음) — 지방의원을 위촉할 수 있는 위원으로 둔 것은 의견25-0232 취지로 가능."}
  - {name: "제설", verdict: delegated, deleg: "「자연재해대책법」 제27조제2항: 건축물관리자의 구체적 제설·제빙 책임 범위 등은 해당 지방자치단체의 조례로 정한다."}
  - {name: "금연|간접흡연", verdict: delegated, deleg: "「국민건강증진법」 제9조제7항: 지방자치단체는 조례로 다수인이 모이거나 오고가는 관할구역 안의 일정한 장소를 금연구역으로 지정할 수 있다."}
  - {name: "금주|음주폐해", verdict: delegated, deleg: "「국민건강증진법」 제8조의4제1항: 지방자치단체는 조례로 일정한 장소를 금주구역으로 지정할 수 있다."}
  - {name: "(구세|군세) 조례", title: "신고", verdict: delegated, deleg: "「지방세법」 제84조제1항: 사업소분 납세의무자 또는 사업소용 건축물 소유자는 조례로 정하는 바에 따라 필요한 사항을 신고하여야 한다."}
  - {name: "폐기물", verdict: delegated, deleg: "「폐기물관리법」 제14조(생활폐기물 처리·종량제 봉투)·제15조의2·제8조(청결유지 명령)가 조례 위임 또는 법률 직접 규정."}
  - {name: "건축 조례", verdict: delegated, deleg: "「건축법」 제13조제4항(안전관리예치금)·제25조제14항, 같은 법 시행령 제19조의2제5항(공사감리자 지정 세부사항은 시·도 조례)."}
  - {name: "자전거", verdict: delegated, deleg: "「자전거 이용 활성화에 관한 법률」 제20조가 무단방치 자전거 처리를 직접 정하고, 제11조제4항 등이 자전거 주차장 관리를 조례에 맡긴다."}
  - {name: "실내공기질", verdict: delegated, deleg: "「실내공기질 관리법」 제5조·제12조가 다중이용시설 소유자등의 유지기준 준수·측정 의무를 직접 정한다 — 조례는 법률을 옮겨 적은 것(유지기준 강화는 같은 법 제5조제3항에 따라 시·도 조례만 가능)."}
  - {name: "청사.*주차장", verdict: delegated, deleg: "장기 방치 차량 처리는 「자동차관리법」 제26조(무단방치 금지·강제 처리)에 따른다 — 조례가 그 조문을 인용."}
  - {name: "동물", title: "변경", verdict: delegated, deleg: "「동물보호법」 제15조가 등록대상동물 소유자의 변경신고 의무를 직접 정한다 — 조례는 법률을 옮겨 적은 것."}
# 자치법규 별표(금액표 등)를 상위법령 별표와 대조한 결과(data/ordinance/annex/, scripts/ordin/annex.py). art 는 그 별표를 인용하는 조문.
annex:
  - {oid: "2231951", art: 제3조, key: annex_road_fee_old, name: 도로점용료 산정기준 별표가 개정 전 시행령 기준, level: 위반 소지,
     annex: "별표 1 점용료 산정기준",
     ctx: "3. 주유소ㆍ주차장ㆍ여객자동차터미널… 건축물: 1층인 건축물 토지가격에 0.05, 2층 0.055, 3층 0.06, 4층 이상 0.065를 곱한 금액",
     basis: "「도로법」 제66조제4항, 같은 법 시행령 제69조제2항(고속국도·일반국도 외 도로의 점용료는 별표 3의 점용료 산정기준에서 규정한 범위에서 조례로 정함), 같은 시행령 별표 3 제3호(2021. 1. 5. 개정: 건축물 토지가격에 0.04, 진입로·출입로 0.02, 그 밖의 것 0.05를 곱한 금액) — 2026-10-09 현행 별표 확인",
     why: "조례 별표 1 제3호(주유소·주차장 등)의 건축물 점용료를 층수별로 토지가격의 0.05~0.065로 정해, 현행 시행령 별표 3의 건축물 기준(토지가격에 0.04)보다 높다. 제1호 명칭('전주')·수소자동차 충전시설 미반영 등 개정 전 별표 형식이 남아 있다.",
     how: "별표 1을 현행 「도로법 시행령」 별표 3과 맞추거나, 다른 구처럼 '점용료는 영 별표 3에서 정하는 기준에 따른다'로 고친다(농어촌도로 점용료는 「농어촌도로 정비법」 제19조제2항에 따라 따로 정함)."}
  - {oid: "2049197", art: 제3조, key: annex_info_fee_old, name: 정보공개 수수료 별표가 개정 전 기준(전자파일 복제 유료), level: 정비 권고,
     annex: "별표 4 행정정보공개수수료",
     ctx: "전자파일(문서ㆍ도면ㆍ사진 등)의 복제 - 1건 1MB 이내: 무료 - 1MB 초과 시 1MB마다 100원",
     basis: "「공공기관의 정보공개에 관한 법률」 제17조(비용 부담), 같은 법 시행규칙 별표 수수료(2021. 6. 23. 개정: 전자파일(문서ㆍ도면ㆍ사진 등)의 복제 — 무료, 매체비용은 별도) — 2026-10-09 현행 별표 확인",
     why: "조례 별표의 정보공개 수수료가 전자파일 복제에 1MB 초과분 1MB마다 100원을 받도록 해, 전자파일 복제를 무료로 바꾼 현행 시행규칙 별표와 다르다. 열람·사본 수수료는 현행 별표와 같다.",
     how: "전자파일 복제 수수료를 '무료(매체비용은 별도)'로 고쳐 현행 시행규칙 별표와 맞춘다(대구시·동구·서구·남구·중구·수성구 조례는 이미 반영)."}
  - {oid: "2048360", art: 제3조, key: annex_info_fee_old, name: 정보공개 수수료 별표가 개정 전 기준(전자파일 복제 유료), level: 정비 권고,
     annex: "별표 2 행정정보공개수수료",
     ctx: "전자파일(문서ㆍ도면ㆍ사진 등)의 복제 - 1건 1MB 이내: 무료 - 1MB 초과 시 1MB마다 100원",
     basis: "「공공기관의 정보공개에 관한 법률」 제17조(비용 부담), 같은 법 시행규칙 별표 수수료(2021. 6. 23. 개정: 전자파일(문서ㆍ도면ㆍ사진 등)의 복제 — 무료, 매체비용은 별도) — 2026-10-09 현행 별표 확인",
     why: "조례 별표의 정보공개 수수료가 전자파일 복제에 1MB 초과분 1MB마다 100원을 받도록 해, 전자파일 복제를 무료로 바꾼 현행 시행규칙 별표와 다르다. 열람·사본 수수료는 현행 별표와 같다.",
     how: "전자파일 복제 수수료를 '무료(매체비용은 별도)'로 고쳐 현행 시행규칙 별표와 맞춘다(대구시·동구·서구·남구·중구·수성구 조례는 이미 반영)."}
  - {oid: "2049947", art: 제16조, key: annex_parking_gu_criteria, name: 자치구 조례가 부설주차장 설치기준을 정함, level: 위반 소지,
     annex: "별표 5 부설주차장의 설치대상시설물 종류 및 설치기준",
     ctx: "① 영 제6조에 따라 부설주차장을 설치하여야 할 시설물의 종류와 설치기준은 별표 5와 같다. (위락시설 70㎡당 1대, 판매·업무시설 등 100㎡당 1대 …)",
     basis: "「주차장법」 제19조제3항, 같은 법 시행령 제6조제1항·제2항(조례로 설치기준을 따로 정하거나 별표 1 기준의 2분의 1 범위에서 강화·완화할 수 있는 것은 특별시·광역시·특별자치시·특별자치도·시 또는 군(광역시의 군은 제외)이다 — 자치구는 들어 있지 않음, 2026-10-09 현행 조문 확인)",
     why: "자치구 조례가 부설주차장 설치대상 시설물과 설치기준을 별표 5로 따로 정한다. 시행령은 이 권한을 광역시에 두고 있어, 다른 구·군은 「대구광역시 주차장 설치 및 관리 조례」 별표 2를 따르도록 정하고 있다. 별표 5는 2021년 개정 뒤 시 별표 2(2025. 7. 10. 개정)와 달라진 부분이 있다(다가구주택 분리 등).",
     how: "제16조제1항을 다른 구처럼 '부설주차장을 설치하여야 할 시설물의 종류와 설치기준은 「대구광역시 주차장 설치 및 관리 조례」 별표 2와 같다'로 고치고 별표 5를 삭제한다(제19조의3의 인용도 함께 고침)."}
  - {oid: "2049801", art: 제4조, key: annex_sohacheon_exempt, name: 소하천 점용료 감면 사유·비율이 법령과 다름, level: 정비 권고,
     annex: "수성구 소하천 점용료 및 사용료 징수 조례 별표 2",
     basis: "「소하천정비법」 제22조제4항(감면 사유는 1. 공익 목적 비영리사업 2. 국민경제에 중대한 영향을 미치는 공익사업 3. 재해 등 특별한 사정 — 점용료등의 감면 비율은 대통령령으로 정함), 같은 법 시행령 제15조의2제1항(제2호는 2분의 1 감면, 제3호는 조례로 정하는 비율) — 2026-10-09 현행 조문 확인",
     why: "감면 대상을 재해응급복구·관리청 공사·도로 보수·「한국수자원공사법」 비용 부담·생활용수 유수 점용·농업용수로·농지개량조합(현재 없는 기관) 등 7가지 100%와 '공익 비영리·재해는 구청장이 정하는 비율'로 정해, 법률의 세 가지 사유와 시행령 감면 비율(국민경제 공익사업 2분의 1 등)과 다르다. 제4조는 감면 비율을 조례로 정한다고 적었으나 법률은 점용료등 감면 비율을 대통령령에 맡긴다.",
     how: "별표 2를 법률 제22조제4항 각 호·시행령 제15조의2의 감면 사유·비율대로 다시 정하고(달성군 조례 별표 2 형식), 제4조의 '조례로 정하는 점용료등의 감면 비율'은 시행령 제15조의2제1항제3호(재해 등)만 가리키도록 고친다."}
