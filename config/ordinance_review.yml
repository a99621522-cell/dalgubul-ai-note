  - {oid: "2049062", art: "제14조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 공익법인(장학회)이 해산할 때 남은 재산을 지방자치단체에 귀속시키는 내용을 정관이 아니라 조례로 정하는 규정", level: "정비 권고", ctx: "제14조 (잔여재산의 귀속) 재단이 해산하면 잔여재산은 대구광역시 북구에 귀속한다.", basis: "법제처 자치법규 의견제시(의견11-0144) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견11-0144", "org": "서울특별시 서대문구", "date": "2011-07-22", "seq": "", "concl": "조례로 장학회가 해산하는 경우 … 재산은 서대문구에 귀속한다고 규정하는 것은 바람직하지 않은 것으로 보입니다."}], why: "「민법」·「공익법인의 설립·운영에 관한 법률」에 따른 재단법인(제2조)의 해산 시 잔여재산 귀속을 조례로 직접 정하고 있어, 같은 법 제13조가 정관으로 정하도록 한 사항을 조례에 둔 유형과 같습니다. [확인할 점] 서대문구 사례는 구가 일부 출연한 기존 장학회였고, 북구사랑 장학회는 구가 조례로 설립한 재단이라 사정이 다를 수 있음. 정관에 같은 내용이 있는지 확인 필요.", how: "잔여재산 귀속은 법인 정관에서 정하도록 하고, 조례에는 출연금 반환·정관 승인 등 구의 권한 범위만 남기는 방향으로 검토."}
  - {oid: "2171190", art: "제12조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 「학교폭력예방 및 대책에 관한 법률」이 교육감 등에게 준 학교폭력 실태조사·예방교육 권한을 조례로 지방자치단체장이 행사하도…", level: "위반 소지", ctx: "제12조(실태조사) ① 구청장은 학교폭력예방과 대책활동을 지원하기 위하여 학교를 대상으로 설문조사 등 다양한 방법으로 학교폭력에 관한 실태조사를 할 수 있다. ② 제1항의 실태조사는 전문기관·단체 등에 위탁할 수 있으며, 소요경비는 예산의 범위에서 지원한다.", basis: "법제처 자치법규 의견제시(의견12-0324) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견12-0324", "org": "울산광역시", "date": "2012-10-17", "seq": "", "concl": "교육감 등에게 … 실태조사 등에 관한 권한을 행사하도록 하고 있음에도 … 시장이 그 권한을 행사하도록 하는 것은 … 위반 소지가 있습니다."}], why: "법이 교육감에게 맡긴 학교 대상 학교폭력 실태조사를 구청장이 직접(또는 위탁하여) 할 수 있도록 정하고 있어 법제처가 문제 삼은 권한 행사 유형과 같습니다. [확인할 점] 같은 조례 제6조 예방교육은 학교장 교육 외 보충으로 교육장 협의를 두고 있어 대상에서 뺐음. 회신 뒤 법 개정(지방자치단체 역할 조항) 여부 확인 필요.", how: "구청장의 실태조사를 교육감(교육장)이 실시하는 조사에 대한 협조·지원이나 교육장과 협의한 조사로 한정하는 방향으로 검토."}
