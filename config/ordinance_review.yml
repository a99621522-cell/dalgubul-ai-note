  - {name: "건축 조례", verdict: delegated, deleg: "「건축법」 제13조제4항(안전관리예치금)·제25조제14항, 같은 법 시행령 제19조의2제5항(공사감리자 지정 세부사항은 시·도 조례)."}
  - {name: "자전거", verdict: delegated, deleg: "「자전거 이용 활성화에 관한 법률」 제20조가 무단방치 자전거 처리를 직접 정하고, 제11조제4항 등이 자전거 주차장 관리를 조례에 맡긴다."}
