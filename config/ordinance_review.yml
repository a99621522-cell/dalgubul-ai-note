  - {oid: "2048655", art: "제2조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 사회복지시설의 위탁 대상에 사회복지법인·비영리법인 외에 법인이 아닌 단체를 포함", level: "위반 소지", ctx: "조례 제7조제1항에 따라 대구광역시 동구 사회복지관(이하 \"복지관\" 이라 한다)의 시설 전부 또는 일부를 사회복지법인, 종교단체, 비영리법인 또는 비영리 민간단체에 위탁할 경우 별지 서식에 의거 복지관 위탁운영 협약을 체결하여 운영토록 한다.(개정 2013.10.21)", basis: "법제처 자치법규 의견제시(의견13-0139) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견13-0139", "org": "경상남도 거창군", "date": "2013-05-15", "seq": "", "concl": "법인이 아닌 단체나 법인의 지회에 … 위탁ㆍ운영할 수 있도록 … 조례에 규정하는 것은 상위법령에 위배될 소지"}], why: "「사회복지사업법」상 사회복지시설에 해당하는 복지관 등의 위탁 대상에 \"단체\"(비영리 민간단체·종교단체 등)를 넣어 법인이 아닌 단체도 수탁할 수 있게 읽힌다. [확인할 점] 조례 제7조를 되풀이한 규칙 조문.", how: "위탁 대상을 「사회복지사업법」 제34조의 사회복지법인·비영리법인으로 한정하는 방향으로 검토."}
  - {oid: "2047288", art: "제9조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 특별교통수단 이용을 출발지(또는 목적지)가 해당 지역인 경우로 제한해 사실상 거주지에 따른 이용 제한을 둠", level: "정비 권고", ctx: "② 운행지역은 대구광역시 관할구역 안, 경상북도 전역 및 경상남도 창녕군으로 한다. 다만, 출발지가 대구광역시가 아닌 경우에는 이용할 수 없다.", basis: "법제처 자치법규 의견제시(의견13-0222) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견13-0222", "org": "전라북도 김제시", "date": "2013-07-26", "seq": "", "concl": "출발지 또는 목적지에 따른 이용제한으로 … 법령의 취지에 위배될 소지가 있으므로 적절하지 않은 것"}], why: "운행지역 안이라도 \"출발지가 대구광역시가 아닌 경우에는 이용할 수 없다\"고 정해, 회신이 문제 삼은 출발지 기준 이용 제한과 같다. [확인할 점] 회신 뒤 법률에 광역 이동지원·지역 간 연계 운행 규정이 보강되었으므로 현행 법 제16조 문언과 대조 필요. 규칙 조문임.", how: "출발지 기준 이용 제한을 두지 않거나 「교통약자의 이동편의 증진법」 제16조의 거주지 이용 제한 금지 취지에 맞게 고치는 방향으로 검토."}
  - {oid: "2047825", art: "제18조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 생활폐기물 수집·운반 대행업체 평가에서 위원회가 최종 평가결과를 확정하게 해 단체장의 평가 권한을 대신함", level: "위반 소지", ctx: "① 위원회는 각 평가대상 업체의 분야별 평가점수에 대하여 제7조 제1항의 평가지침에 따라 적정하게 평가되었는지를 심의하여 최종 평가결과를 확정하고 이를 구청장에게 통보한다.", basis: "법제처 자치법규 의견제시(의견12-0375) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견12-0375", "org": "경상북도 구미시", "date": "2012-12-10", "seq": "", "concl": "평가위원회가 … 심의·의결을 하는 구조 … 권한을 본질적으로 침해 … 「폐기물관리법」에 위배"}], why: "평가위원회가 분야별 평가점수를 심의해 \"최종 평가결과를 확정하고\" 구청장에게 통보하도록 하여, 평가 확정 권한이 구청장이 아닌 위원회에 있다. [확인할 점] 회신 당시 「폐기물관리법」 제14조제6항 — 현행 조항(평가 주체·방법) 확인 필요.", how: "위원회는 심의·자문만 하고 최종 평가결과는 구청장이 확정하도록 고치는 방향으로 검토."}
