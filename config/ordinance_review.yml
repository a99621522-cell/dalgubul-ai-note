  - {oid: "2048374", art: "제20조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 기계식주차장치 철거 시 부설주차장 설치기준을 2분의 1로 완화하면서 완화된 설치기준 대수의 소수점 이하를 버리도록 함", level: "위반 소지", ctx: "② 법 제19조의13에 따라 기계식주차장치를 철거함으로써 해당 건축물의 부설주차장 규모가 「대구광역시 주차장 설치 및 관리 조례」 별표 2가 정하는 부설주차장 설치기준에 미달하게 되는 경우에는 제1항에도 불구하고 그 설치기준을 2분의 1로 완화(완화된 설치기준 대수의 소수점 이하는 버림)하여 적용할 수 있다", basis: "법제처 자치법규 의견제시(의견23-0184) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견23-0184", "org": "경기도 화성시", "date": "2023-06-16", "seq": "", "concl": "(2분의 1 완화 기준에) \"소수점 이하의 수는 버리는 것으로 한다\"는 단서 규정을 신설하는 것은 상위법령에 저촉될 소지"}], why: "설치기준을 2분의 1로 완화한 뒤 완화된 대수의 소수점 이하를 버리도록 해, 화성시가 신설하려던 단서와 같은 구조로 2분의 1을 넘는 완화가 될 수 있다. [확인할 점] 다른 구 조례는 \"철거되는 주차대수의 2분의 1(소수점 이하 버림)의 범위에서 완화\"로 버림이 완화 폭을 줄이는 방향이라 같은 쟁점으로 보지 않았다.", how: "「주차장법」 제19조의13제6항의 \"2분의 1의 범위\" 안에 들도록 소수점 처리(올림 등)를 바꾸는 정비를 검토"}
  - {oid: "2243932", art: "제5조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 지방의회의 서류제출 요구에 대해 「공공기관의 정보공개에 관한 법률」 제9조제1항 비공개 사유를 이유로 제출을 거부하지 못하…", level: "정비 권고", ctx: "② 구청장은 제1항에 따른 서류(원자료 포함)가 「공공기관의 정보공개에 관한 법률」 제9조제1항에 해당된다는 이유로 제출을 거부하여서는 아니 된다", basis: "법제처 자치법규 의견제시(의견25-0319) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견25-0319", "org": "전라남도 보성군", "date": "2025-12-16", "seq": "", "concl": "정보공개법 제9조제1항 각 호에 해당된다는 이유로 군수가 제출을 거부해서는 안된다는 내용을 조례에 규정하는 것은 적절하지 않으므로 신중"}], why: "구청장이 정보공개법 제9조제1항 비공개 사유를 이유로 의회 서류제출을 거부할 수 없도록 정해 회신 사안과 같다. [확인할 점] 구의회 소관 조례이나 집행기관(구청장)의 의무를 정하는 조문이다.", how: "비공개 대상 정보에 대한 집행기관의 판단 재량을 남기는 방향(거부 시 사유 소명 등)으로 정비를 검토"}
  - {oid: "2048254", art: "제19조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 「청소년활동 진흥법」에 따른 청소년수련시설의 운영을 지방공단이 맡도록(공단 사업으로) 정함", level: "위반 소지", ctx: "공단은 제1조에 따른 목적을 달성하기 위하여 다음 각 호의 사업을 행한다. … 6. 청소년 수련시설 운영", basis: "법제처 자치법규 의견제시(의견24-0165) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견24-0165", "org": "서울특별시 관악구", "date": "2024-07-18", "seq": "", "concl": "지방자치단체가 설치한 청소년수련시설의 운영을 지방공단에 위탁할 수 있도록 하는 내용을 조례에 규정할 수 없을 것"}], why: "시설관리공단의 사업으로 청소년수련시설 운영을 정해 공단이 수련시설 운영을 맡을 수 있게 하므로 회신 사안과 같다. [확인할 점] 실제 위탁 여부는 「대구광역시 달성군 청소년수련시설의 설치 및 운영에 관한 조례」 위탁 조문과 함께 확인 필요.", how: "청소년수련시설 운영 위탁은 「청소년 기본법」 제3조제8호의 청소년단체로 한정한 법 제16조에 맞추어 공단 사업 범위에서 제외하는 정비를 검토"}
  - {oid: "2176375", art: "제5조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 자치구(광역시 군 포함) 조례로 구청장이 안전표지 등 「도로교통법」상 교통안전시설을 설치ㆍ관리하도록 정함", level: "위반 소지", ctx: "구청장은 관할 경찰서장의 의견을 들어 어린이 통학로의 교통안전을 위해 다음 각 호의 사항을 시행할 수 있다.(일부개정 2023.6.12.) 1. 법 시행규칙 제8조에 따른 안전표지의 설치·관리", basis: "법제처 자치법규 의견제시(의견24-0116) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견24-0116", "org": "울산광역시 남구", "date": "2024-06-25", "seq": "", "concl": "구청장이 보호구역 내 교통안전시설의 설치·관리에 관한 사무를 수행하도록 자치구 조례에 규정하는 것은 상위법령에 위배될 소지"}], why: "구청장이 「도로교통법 시행규칙」 제8조의 안전표지(교통안전시설)를 설치·관리하도록 정해, 자치구 사무로 보기 어렵다는 회신 취지와 같은 유형이다. [확인할 점] 대상이 \"어린이 통학로\"이고 경찰서장 의견 청취·협의 규정이 있다. 「도로교통법」 제147조에 따른 대구시 권한 위임 여부(사무위임 규칙 별표) 확인 필요.", how: "교통안전시설(안전표지 등)은 시장 권한으로 두고 구청장은 도로부속물 설치나 시장·경찰서장에 대한 설치 요청 등으로 한정하는 정비를 검토"}
