  - {oid: "2145409", art: 제2조, key: rule_holds_ordinance_matter, name: 법률이 조례로 정하게 한 가축사육 제한구역 기준을 규칙으로 정함, level: 위반 소지,
     ctx: "가축사육 제한지역 지정 기준 — 택지개발지구·상수도보호구역 경계선에서 500m, 아파트 부지·주거지역·취락지구 경계선에서 100m, 하천·도시계획도로·철도 경계선에서 50m 이내 …",
     basis: "「가축분뇨의 관리 및 이용에 관한 법률」 제8조제1항·제5항(가축사육제한구역은 '해당 지방자치단체의 조례로 정하는 바에 따라' 지정·변경·해제) — 2026-10-09 현행 조문 확인",
     prec: [{case: 대법원 2022. 6. 30. 선고 2020추5169 판결, org: 대법원, date: "2022-06-30", seq: "", concl: "위임명령은 구체적으로 범위를 정한 개별 위임이 있어야 하며, 이 법리는 조례가 법률로부터 위임받은 사항을 다시 지방자치단체장이 정하는 규칙에 재위임하는 경우에도 적용됨"}],
     why: "법률이 조례로 정하게 한 가축사육제한구역의 지정 기준(경계선에서 거리)을 조례가 아니라 시행규칙에 정했다. 조례(제3조·제6조)는 구청장이 지정할 수 있다는 것과 '시행에 필요한 사항은 규칙으로 정한다'는 일반 위임만 두고 있다. 같은 사항을 남구·군위군은 조례 본문·별표로 정한다.",
     how: "시행규칙 제2조의 지정 기준(거리)을 「대구광역시 동구 가축사육 제한 조례」 제3조 또는 조례 별표로 옮기고, 규칙에는 서식·절차만 남긴다."}
