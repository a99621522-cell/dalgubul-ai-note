  - {oid: "2049197", art: 제3조, key: annex_reclaim_fee_old, name: 공유수면 매립면허 수수료 별표가 폐지 법률·옛 요율 기준, level: 위반 소지,
     annex: "별표 3 공유수면매립면허수수료산정기준표",
     ctx: "매립면허 수수료는 … 조성될 매립지(「공유수면매립법」 제14조제1항 단서 …)의 가액에 1,000분의 30을 곱하여 … 그 시가는 「지방세법」 제111조제2항의 과세시가표준액으로 한다",
     basis: "「공유수면 관리 및 매립에 관한 법률」 제34조(매립면허 수수료는 대통령령으로 정하는 바에 따라 징수), 같은 법 시행령 제43조제1항(해양수산부령으로 정하는 산정기준에 따라 산출한 금액을 징수하여야 함)·제3항(시장·군수·구청장은 매립면허 권한이 재위임된 경우에만 징수), 같은 법 시행규칙 제25조·별표 3(1등급: 특별시·광역시 도시계획구역 — 인접한 토지가격(개별공시지가)의 1천분의 15, 농·축·수산업 목적 1천분의 1) — 2026-10-09 현행 별표 확인. 「공유수면매립법」은 2010. 4. 15. 「공유수면 관리 및 매립에 관한 법률」 시행으로 폐지",
     why: "조례 별표 3이 폐지된 「공유수면매립법」과 옛 「지방세법」 조문을 인용하면서 매립지 가액의 1,000분의 30을 수수료로 정한다. 현행 법령은 매립면허 수수료를 해양수산부령 별표 3의 산정기준(광역시 도시계획구역은 인접한 토지가격의 1천분의 15)에 따라 징수하게 해, 조례가 따로 요율을 정할 여지가 없고 요율도 다르다.",
     how: "별표 3과 제3조의 매립면허 수수료 부분을 삭제한다(매립면허 권한이 재위임된 경우에도 수수료는 같은 법 시행규칙 별표 3에 따름). 남겨야 하면 '「공유수면 관리 및 매립에 관한 법률 시행규칙」 별표 3에 따른다'로 고친다."}
