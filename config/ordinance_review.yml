  - {oid: "2049090", art: 제4조, key: annex_sohacheon_exempt, name: 소하천 점용료 감면 사유·비율이 법령과 다름, level: 정비 권고,
     annex: "북구 소하천 점용료와 사용료 징수 조례 별표 2",
     basis: "「소하천정비법」 제22조제4항(감면 사유는 1. 공익 목적 비영리사업 2. 국민경제에 중대한 영향을 미치는 공익사업 3. 재해 등 특별한 사정 — 점용료등의 감면 비율은 대통령령으로 정함), 같은 법 시행령 제15조의2제1항(제2호는 2분의 1 감면, 제3호는 조례로 정하는 비율) — 2026-10-09 현행 조문 확인",
     why: "감면 대상을 13가지로 열거해(생활용수 유수 점용, 농업용수로 토지점용, 「한국수자원공사법」 사용료 납부, 학교법인 사립학교 등 100%) 법률이 정한 세 가지 감면 사유보다 넓다. 국민경제 공익사업 2분의 1, 재해 등 기간 환산은 법령과 같다.",
     how: "열거한 사유가 법률 제22조제4항제1호(공익 목적 비영리사업)에 해당하는지 확인하고, 해당하지 않는 사유는 삭제하거나 제1호로 묶는다."}
