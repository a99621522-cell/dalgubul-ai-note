  - {oid: "2050215", art: "제2조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 광역시 조례가 편의시설 사전검사 등 의무의 주체(시설주관기관)에 구청장·군수를 포함해 의무를 지움", level: "위반 소지", ctx: "3. “시설주관기관”이란 편의시설의 설치와 운영에 관하여 지도·감독하는 대구광역시장(이하 “시장”이라 한다) 또는 구청장·군수를 말한다.", basis: "법제처 자치법규 의견제시(의견13-0030) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견13-0030", "org": "울산광역시", "date": "2013-02-08", "seq": "", "concl": "시설주관기관에 울산광역시장 외에 구청장·군수까지를 포함시킨 것은 … 반하여 위법"}], why: "시 조례가 시설주관기관을 \"시장 또는 구청장·군수\"로 정의하고 그 시설주관기관에 지도·감독과 사전점검 실시 의무를 지워, 회신이 문제 삼은 구조와 같다. [확인할 점] 회신(2013) 뒤 「장애인·노인·임산부 등의 편의증진 보장에 관한 법률」 제9조의2(사전점검)가 신설(2018)되어 시설주관기관 의무를 법률이 직접 정하므로, 현행 법률 문언과 대조해 결론이 달라지는지 확인 필요.", how: "시 조례의 의무 주체를 시장으로 한정하고 구청장·군수 소관은 각 구·군 조례로 정하도록 하는 방향으로 검토."}
