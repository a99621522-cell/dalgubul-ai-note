  - {oid: "2048034", art: "제3조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 이장 해임사유로 '그 밖에 직권남용·직무태만·품위손상 등으로 직무수행이 곤란하다고 인정되는 경우'처럼 포괄적·주관적 사유를…", level: "정비 권고", ctx: "4. 법령위반, 품위손상 등으로 사회적 물의를 일으키거나 주민으로부터 지탄을 받을 때 5. 통의 통·폐합 등 구역조정이 있을 때 6. 그 밖의 사유로 통장의 직무를 수행하기가 어렵다고 판단될 때", basis: "법제처 자치법규 의견제시(의견22-0226) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견22-0226", "org": "경상남도 합천군", "date": "2022-08-18", "seq": "", "concl": "질의요지와 같은 내용을 규칙으로 규정하는 것은 바람직하지 않을 것으로 보임(입안 여부 신중 재검토)"}], why: "이장·통장 해임(해촉) 사유에 '그 밖에 ~ 인정(판단)될 때', '품위손상 등으로 지탄'처럼 포괄적·주관적 사유를 두고 있어, 법제처가 명확성 측면에서 바람직하지 않다고 본 이장 해임사유 규정과 같은 유형임. [확인할 점] 통장 해임 규정(규칙).", how: "해임(해촉) 사유를 구체적·객관적 요건으로 한정하고 '그 밖에 ~ 인정될 때' 같은 포괄 사유의 삭제 또는 구체화를 검토."}
  - {oid: "2232070", art: "제13조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 가축분뇨 수집·운반 대행업자가 공공처리시설 운영비(사용료)를 징수·납입하면 그 일부를 징수교부금으로 대행업자에게 교부하도록…", level: "위반 소지", ctx: "제13조(징수보상금 교부) 제10조제2항에 따라 대행업자가 공공처리시설 사용료를 징수하여 군수에게 납입한 경우에는 징수금액의 100분의 3 범위에서 징수보상금을 교부할 수 있다. [제14조에서 이동 <2023. 9. 27.>] [종전 제13조는 삭제 <2017. 12. 22.>]", basis: "법제처 자치법규 의견제시(의견20-0294) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견20-0294", "org": "경상북도 예천군", "date": "2020-12-17", "seq": "", "concl": "수집·운반 수수료 외에 공공처리시설 운영비 중 일부를 징수교부금으로 교부하는 것은 가축분뇨법 제26조제7항에 반하여 조례로 규정할 수 없음"}], why: "가축분뇨 수집·운반 대행업자가 공공처리시설 사용료를 징수하여 군수에게 납입한 경우 징수금액의 100분의 3 범위에서 징수보상금을 교부하도록 정하고 있어 법제처가 문제 삼은 징수교부금 교부 규정과 같음. [확인할 점] 조문은 '제10조제2항에 따라'를 인용하나 현행 제10조제2항은 반입 신고 규정이어서 인용 조항도 함께 확인 필요.", how: "대행업자에 대한 징수보상금(징수교부금) 교부 규정을 가축분뇨법 제26조제7항 등 수수료 규정에 맞게 삭제 또는 정비하는 방안을 검토."}
  - {oid: "2217881", art: "제3조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 지방자치단체장이 사무를 위탁받은 기관·단체 소속 근로자를 생활임금 적용대상으로 정할 수 있도록 조례에 정하는 것", level: "위반 소지", ctx: "3. 시로부터 그 사무를 위탁받거나 시에 공사, 용역 등을 제공하는 기관 및 업체에 소속된 근로자 중 시의 업무를 직접 수행하는 근로자 <개정 2023.8.10.> 4. 제3호의 기관 및 업체의 하수급인이 고용한 근로자 중 시의 업무를 직접 수행하는 근로자 <개정 2023.8.10.> ② 제1항에도 불구하고 다음 각 호의 어느 하나에 해당하는 경우에는 적용", basis: "법제처 자치법규 의견제시(의견21-0027) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견21-0027", "org": "충청남도 천안시", "date": "2021-01-27", "seq": "", "concl": "수탁기관 소속 근로자를 생활임금 적용 대상으로 정할 수 있도록 하는 내용은 조례로 정할 수는 없을 것으로 보임"}], why: "생활임금 적용대상에 시로부터 사무를 위탁받은 기관·업체 소속 근로자와 그 하수급인 근로자를 넣고 시장이 결정하도록 정하고 있어, 법제처가 조례로 정할 수 없다고 본 수탁기관 소속 근로자 적용 규정과 같은 유형임. [확인할 점] 제4호(하수급인이 고용한 근로자)도 같은 쟁점. 실제 적용 방식(계약 조건 반영 등)은 원문·운영 실태 확인 필요.", how: "수탁기관·업체 소속 근로자는 해당 사용자가 임금을 정하는 점을 고려하여, 직접 적용 대상 규정 대신 위탁·계약 조건이나 권고 방식으로 정비하는 방안을 검토."}
  - {oid: "2255480", art: "제5조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 인·허가 신청인의 동의 없이 신청 접수일부터 일정 기간 안에 신청 사업 내용을 인근 주민에게 일률적으로 고지(사전고지)하도…", level: "위반 소지", ctx: "제5조(사전고지의 방법) 구청장은 행위자로부터 사전고지 대상시설에 대한 인ㆍ허가의 신청 등을 접수한 경우, 접수일로부터 7일 이내로 다음 각 호의 방법을 통하여 대상지역 주민에게 사전고지를 하여야 한다. 단, 변경 인ㆍ허가의 경우 5일 이내로 한다. 1. 구 홈페이지에 게재 2. 해당 동행정복지센터 게시판을 통한 게재 3. 300세대 이상의 공동주택의 경우", basis: "법제처 자치법규 의견제시(의견21-0105, 의견23-0219) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견21-0105", "org": "충청남도 예산군", "date": "2021-04-28", "seq": "", "concl": "동의 없이 민원 내용·개인정보 등이 공개될 수 있어 민원처리법 제7조 취지에 반하고 「개인정보 보호법」 제17조제1항에 위반될 소지"}, {"case": "의견23-0219", "org": "충청북도 음성군", "date": "2023-07-25", "seq": "", "concl": "신청인의 동의 없이 접수일로부터 7일 이내에 인ㆍ허가 신청 대상 시설의 내용 등을 주민들에게 고지하도록 하는 내용을 조례로 규정할 수 없을 것"}], why: "갈등유발 예상시설 인·허가 신청을 접수하면 신청인 동의 절차 없이 7일 이내에 시설 위치·용도·면적·접수일 등을 주민에게 고지하도록 정하고 있어, 법제처가 같은 이름의 예산군 조례안에 대해 문제 삼은 내용과 같음. / 인ㆍ허가 신청 접수일부터 7일 이내에 신청인 동의 요건 없이 대상지역 주민에게 사전고지를 하도록 의무화하여 회신 사안과 구조가 같다. [확인할 점] 고지 항목에 신청인 성명은 없으나 대지 위치 등으로 신청인과 민원 내용이 특정될 수 있음. 같은 쟁점의 의견24-0456(청주시)은 의원 발의로 단체장에게 사전고지 의무를 지우는 것이 집행권 침해 소지가 있다고 보았다. 제정 경위(발의 주체)와 개별 법령의 고지 근거 여부 확인 필요.", how: "고지 전에 신청인 동의를 받거나 「개인정보 보호법」·민원처리법상 공개가 허용되는 범위로 고지 대상·항목을 한정하는 방향으로 정비를 검토. 개별 인ㆍ허가 근거 법령에 사전고지 규정이 없는 한 신청인 동의 없는 의무적 사전고지 규정의 존치·수정(동의 요건, 법령상 절차로 한정 등)을 검토"}
  - {oid: "2048860", art: "제7조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 폐기물처리시설 설치비용 납부금액을 시행령 제4조·별표 1의 산정방법과 별도로 조례에서 산정하도록 정하는 것", level: "위반 소지", ctx: "제7조(시설부지 매입비용 산정) 부지매입에 필요한 비용은 부지매입 단가와 부지면적을 곱한 금액으로 하되, 다음 각 호를 적용하여 산정한다. 1. 부지매입단가는 개발하고자 하는 해당 공동주택단지나 택지의 1제곱미터 당 조성원가로 한다. 2. 부지면적은 시설설치와 주민편익시설 설치 및 주변녹지대 설치에 필요한 면적을 합하여 산출하되, 구체적인 기준은 별표와 같", basis: "법제처 자치법규 의견제시(의견21-0277) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견21-0277", "org": "경기도 과천시", "date": "2021-09-09", "seq": "", "concl": "시행령 제4조제5항에도 불구하고 별도로 설치납부금액 산정방법을 조례로 규정할 수는 없을 것으로 보임"}], why: "택지 개발자가 내는 폐기물처리시설 설치비용 납부금액을 부지 매입비·시설 설치비 단가 등 조례 자체 방식으로 산정하도록 정하고 있어, 법제처가 시행령 제4조·별표 1과 별도로 조례로 정할 수 없다고 본 산정방법 규정과 같은 유형임. [확인할 점] 제6조(납부금액 구성)·제8조·제9조와 함께 검토.", how: "설치납부금액 산정은 「폐기물처리시설 설치촉진 및 주변지역지원 등에 관한 법률 시행령」 제4조 및 별표 1에 따르도록 조문을 정비하는 방안을 검토."}
  - {oid: "2048860", art: "제8조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 폐기물처리시설 설치비용 납부금액을 시행령 제4조·별표 1의 산정방법과 별도로 조례에서 산정하도록 정하는 것", level: "위반 소지", ctx: "제8조(소각시설 설치비용 산정) ① 소각시설 설치비용은 1일 처리능력 200톤 규모의 소각시설을 설치하는 데에 드는 비용의 1톤당 단가에 그 택지 등에서의 “1일 발생 예상 폐기물량” 중 재활용되는 폐기물량, 불연성폐기물량 및 가연성폐기물 중 음식물류 폐기물처리시설에서 처리할 예정인 유기성폐기물량을 뺀 폐기물 전량의 톤수를 곱한 금액으로 한다. ② 제1항의", basis: "법제처 자치법규 의견제시(의견21-0277) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견21-0277", "org": "경기도 과천시", "date": "2021-09-09", "seq": "", "concl": "시행령 제4조제5항에도 불구하고 별도로 설치납부금액 산정방법을 조례로 규정할 수는 없을 것으로 보임"}], why: "택지 개발자가 내는 폐기물처리시설 설치비용 납부금액을 부지 매입비·시설 설치비 단가 등 조례 자체 방식으로 산정하도록 정하고 있어, 법제처가 시행령 제4조·별표 1과 별도로 조례로 정할 수 없다고 본 산정방법 규정과 같은 유형임. [확인할 점] 제7조·제9조와 함께 검토.", how: "설치납부금액 산정은 「폐기물처리시설 설치촉진 및 주변지역지원 등에 관한 법률 시행령」 제4조 및 별표 1에 따르도록 조문을 정비하는 방안을 검토."}
