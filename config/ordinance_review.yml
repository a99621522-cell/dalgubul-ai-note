     how: "별표 3과 제3조의 매립면허 수수료 부분을 삭제한다(매립면허 권한이 재위임된 경우에도 수수료는 같은 법 시행규칙 별표 3에 따름). 남겨야 하면 '「공유수면 관리 및 매립에 관한 법률 시행규칙」 별표 3에 따른다'로 고친다."}
  - {oid: "2145409", art: 제2조, key: rule_holds_ordinance_matter, name: 법률이 조례로 정하게 한 가축사육 제한구역 기준을 규칙으로 정함, level: 위반 소지,
     ctx: "가축사육 제한지역 지정 기준 — 택지개발지구·상수도보호구역 경계선에서 500m, 아파트 부지·주거지역·취락지구 경계선에서 100m, 하천·도시계획도로·철도 경계선에서 50m 이내 …",
     basis: "「가축분뇨의 관리 및 이용에 관한 법률」 제8조제1항·제5항(가축사육제한구역은 '해당 지방자치단체의 조례로 정하는 바에 따라' 지정·변경·해제) — 2026-10-09 현행 조문 확인",
     prec: [{case: 대법원 2022. 6. 30. 선고 2020추5169 판결, org: 대법원, date: "2022-06-30", seq: "", concl: "위임명령은 구체적으로 범위를 정한 개별 위임이 있어야 하며, 이 법리는 조례가 법률로부터 위임받은 사항을 다시 지방자치단체장이 정하는 규칙에 재위임하는 경우에도 적용됨"}],
     why: "법률이 조례로 정하게 한 가축사육제한구역의 지정 기준(경계선에서 거리)을 조례가 아니라 시행규칙에 정했다. 조례(제3조·제6조)는 구청장이 지정할 수 있다는 것과 '시행에 필요한 사항은 규칙으로 정한다'는 일반 위임만 두고 있다. 같은 사항을 남구·군위군은 조례 본문·별표로 정한다.",
     how: "시행규칙 제2조의 지정 기준(거리)을 「대구광역시 동구 가축사육 제한 조례」 제3조 또는 조례 별표로 옮기고, 규칙에는 서식·절차만 남긴다."}
# 규칙이 조례 사항을 정한 곳 — scripts/ordin/subdeleg_scan.py 목록(docs/ordinance/subdeleg_scan_<날짜>.md)을 세션이 모조례 원문과 대조(2026-10-09, 운영자 확인 전).
# 형식은 annex 와 같다(art 는 후보를 붙일 조문).
subdeleg:
  - {oid: "2231641", art: "제11조", key: "fee_no_outline", name: "사용료 금액을 조례에 대강 없이 맡김", level: "위반 소지", ctx: "시설 및 부대시설의 사용료와 그 반환에 관하여는 군수가 다른 지방자치단체 등의 관리ㆍ운영 파크골프장 등의 자료 등을 참조하여 합리적 범위에서 정한다.", basis: "「지방자치법」 제156조제1항(사용료·수수료 또는 분담금의 징수에 관한 사항은 조례로 정한다), 대법원 2020추5169(조례가 규칙에 재위임할 때도 대강을 예측할 수 있어야 함)", prec: [{"case": "의견26-0099", "org": "충청남도 천안시", "date": "2026-04-27", "seq": "", "concl": "조례에서 사용료의 금액이나 징수에 대해 전혀 정하지 않고 규칙으로 위임하는 것은 포괄위임금지원칙에 위배될 소지 — 상한과 하한 또는 부과기준 등 기본 사항을 조례에 둔 뒤 세부사항을 규칙으로"}, {"case": "의견13-0283", "org": "전라남도 보성군의회", "date": "2013-10-18", "seq": "", "concl": "사용료를 규칙으로 위임할 때는 조례에서 징수대상 시설·재산의 범위, 사용료의 상한과 하한 또는 금액 산정기준의 대강을 정해야"}, {"case": "대법원 2022. 6. 30. 선고 2020추5169 판결", "org": "대법원", "date": "2022-06-30", "seq": "", "concl": "위임명령은 구체적으로 범위를 정한 개별 위임이 있어야 하며, 이 법리는 조례가 법률로부터 위임받은 사항을 다시 지방자치단체장이 정하는 규칙에 재위임하는 경우에도 적용됨"}], why: "파크골프장 사용료 금액과 반환 기준을 조례가 상한·범위·산정 기준 없이 군수가 정하게 하고, 실제 금액은 시행규칙 제4조 별표가 정한다(조례에 규칙 위임 문구도 없음).", how: "조례 제11조에 사용료 상한액(또는 산정 기준)을 별표로 두고 '그 범위에서 규칙으로 정한다'로 고친다 — 「대구광역시 달성군 체육시설 관리ㆍ운영 조례」 제11조(별표 상한액 범위에서 시행규칙으로)와 같은 방식."}
  - {oid: "2049739", art: "제11조", key: "fee_no_outline", name: "사용료 금액을 조례에 대강 없이 맡김", level: "위반 소지", ctx: "구립도서관 시설 사용료 및 이용자 수수료, 각각의 반환기준은 규칙으로 정한다.", basis: "「지방자치법」 제156조제1항(사용료·수수료 또는 분담금의 징수에 관한 사항은 조례로 정한다), 대법원 2020추5169(조례가 규칙에 재위임할 때도 대강을 예측할 수 있어야 함)", prec: [{"case": "의견26-0099", "org": "충청남도 천안시", "date": "2026-04-27", "seq": "", "concl": "조례에서 사용료의 금액이나 징수에 대해 전혀 정하지 않고 규칙으로 위임하는 것은 포괄위임금지원칙에 위배될 소지 — 상한과 하한 또는 부과기준 등 기본 사항을 조례에 둔 뒤 세부사항을 규칙으로"}, {"case": "의견13-0283", "org": "전라남도 보성군의회", "date": "2013-10-18", "seq": "", "concl": "사용료를 규칙으로 위임할 때는 조례에서 징수대상 시설·재산의 범위, 사용료의 상한과 하한 또는 금액 산정기준의 대강을 정해야"}, {"case": "대법원 2022. 6. 30. 선고 2020추5169 판결", "org": "대법원", "date": "2022-06-30", "seq": "", "concl": "위임명령은 구체적으로 범위를 정한 개별 위임이 있어야 하며, 이 법리는 조례가 법률로부터 위임받은 사항을 다시 지방자치단체장이 정하는 규칙에 재위임하는 경우에도 적용됨"}], why: "구립도서관 시설 사용료·이용자 수수료와 반환 기준을 상한·범위·산정 기준 없이 모두 규칙으로 정하게 했다 — 금액은 시행규칙 제4조 별표 1이 정한다.", how: "조례에 사용료·수수료의 상한(또는 산정 기준)을 별표로 두고, 그 범위의 세부 금액과 반환 절차만 규칙에 맡긴다."}
  - {oid: "2049099", art: "제11조", key: "fee_no_outline", name: "사용료 금액을 조례에 대강 없이 맡김", level: "위반 소지", ctx: "구청장은 EYE VIL의 시설물 및 장비를 사용하고자 하는 자에 대해 사용료를 징수한다. … 연간 사용료의 요율은 … 해당 재산 평정가격의 1,000분의 20이상으로 할 수 있다.", basis: "「지방자치법」 제156조제1항(사용료·수수료 또는 분담금의 징수에 관한 사항은 조례로 정한다), 대법원 2020추5169(조례가 규칙에 재위임할 때도 대강을 예측할 수 있어야 함)", prec: [{"case": "의견26-0099", "org": "충청남도 천안시", "date": "2026-04-27", "seq": "", "concl": "조례에서 사용료의 금액이나 징수에 대해 전혀 정하지 않고 규칙으로 위임하는 것은 포괄위임금지원칙에 위배될 소지 — 상한과 하한 또는 부과기준 등 기본 사항을 조례에 둔 뒤 세부사항을 규칙으로"}, {"case": "의견20-0185", "org": "경기도 부천시", "date": "2020-08-04", "seq": "", "concl": "이용료 감면 대상은 이용료에 관한 핵심 사항이므로 조례로 규정해야"}, {"case": "대법원 2022. 6. 30. 선고 2020추5169 판결", "org": "대법원", "date": "2022-06-30", "seq": "", "concl": "위임명령은 구체적으로 범위를 정한 개별 위임이 있어야 하며, 이 법리는 조례가 법률로부터 위임받은 사항을 다시 지방자치단체장이 정하는 규칙에 재위임하는 경우에도 적용됨"}], why: "조례는 재산(시설) 연간 사용료 요율만 정하고, 장비 사용료의 금액·산정 기준과 규칙 위임을 두지 않았다 — 장비 사용료는 시행규칙 제12조 별표 1이, 입주업체 30% 감면도 시행규칙 제12조제2항이 정한다.", how: "조례에 장비 사용료의 산정 기준(가동비용 등)이나 상한을 두고 세부 금액을 규칙에 맡기는 조문을 더하며, 입주업체 감면은 조례 감면 조문으로 옮긴다."}
  - {oid: "2189091", art: "제7조", key: "fee_weak_outline", name: "사용료 금액을 고려 요소만 두고 규칙에 맡김", level: "정비 권고", ctx: "이용료는 놀이시설의 규모, 운영경비, 프로그램 등을 고려하여 시행규칙으로 정한다.", basis: "「지방자치법」 제156조제1항(사용료·수수료 또는 분담금의 징수에 관한 사항은 조례로 정한다), 대법원 2020추5169(조례가 규칙에 재위임할 때도 대강을 예측할 수 있어야 함)", prec: [{"case": "의견13-0283", "org": "전라남도 보성군의회", "date": "2013-10-18", "seq": "", "concl": "사용료를 규칙으로 위임할 때는 조례에서 징수대상 시설·재산의 범위, 사용료의 상한과 하한 또는 금액 산정기준의 대강을 정해야"}, {"case": "의견26-0099", "org": "충청남도 천안시", "date": "2026-04-27", "seq": "", "concl": "조례에서 사용료의 금액이나 징수에 대해 전혀 정하지 않고 규칙으로 위임하는 것은 포괄위임금지원칙에 위배될 소지 — 상한과 하한 또는 부과기준 등 기본 사항을 조례에 둔 뒤 세부사항을 규칙으로"}], why: "이용료를 고려 요소(규모·운영경비·프로그램)만 적고 상한·범위나 산정 방법 없이 시행규칙(제2조 별표)에 맡겼다.", how: "조례에 이용료 상한(또는 운영경비 대비 산정 방법)을 두고 '그 범위에서 시행규칙으로 정한다'로 고친다."}
  - {oid: "2048583", art: "제2조", key: "rule_sets_zone_range", name: "과태료 대상 금연구역의 범위를 규칙으로 정함", level: "정비 권고", ctx: "금연구역의 경계(범위) — 버스정류소(택시 승차대)는 표지판으로부터 10미터 이내 보도로 한다 …", basis: "「국민건강증진법」 제9조제7항(지방자치단체는 조례로 일정한 장소를 금연구역으로 지정), 대법원 2020추5169(조례가 규칙에 재위임할 때도 대강을 예측할 수 있어야 함)", prec: [{"case": "의견23-0199", "org": "서울특별시 영등포구", "date": "2023-08-29", "seq": "", "concl": "아동복지시설 경계선에서 30미터 이내 구역을 금연구역으로 지정할 수 있도록 하는 내용은 조례에 규정할 수 있음"}, {"case": "의견23-0344", "org": "서울특별시 영등포구", "date": "2023-09-20", "seq": "", "concl": "유치원 경계선 10미터를 넘는 일정 구역을 금연구역으로 지정할 수 있도록 하는 내용을 조례로 규정할 수 있음"}, {"case": "대법원 2022. 6. 30. 선고 2020추5169 판결", "org": "대법원", "date": "2022-06-30", "seq": "", "concl": "위임명령은 구체적으로 범위를 정한 개별 위임이 있어야 하며, 이 법리는 조례가 법률로부터 위임받은 사항을 다시 지방자치단체장이 정하는 규칙에 재위임하는 경우에도 적용됨"}], why: "금연구역에서 흡연하면 과태료 대상이 되는데, 그 구역의 범위(거리)를 조례가 아니라 시행규칙이 정한다. 조례 제5조는 장소(버스정류소·도시공원 등)만 정하고, 제7조제3항은 표지판 모양·크기·설치 방법과 '경계의 표시방법'만 규칙에 맡긴다 — 버스정류소 표지판에서 10미터 이내 보도라는 범위는 시행규칙 제2조가 정한다.", how: "시행규칙 제2조의 범위(거리)를 조례의 금연구역 지정 조문(각 호 장소 옆)으로 옮기고, 규칙에는 표지판·표시 방법만 남긴다."}
  - {oid: "2050348", art: "제2조", key: "rule_sets_zone_range", name: "과태료 대상 금연구역의 범위를 규칙으로 정함", level: "정비 권고", ctx: "금연구역의 경계(범위) — 버스정류소(택시 승차대)는 표지판으로부터 10미터 이내 보도로 한다 …", basis: "「국민건강증진법」 제9조제7항(지방자치단체는 조례로 일정한 장소를 금연구역으로 지정), 대법원 2020추5169(조례가 규칙에 재위임할 때도 대강을 예측할 수 있어야 함)", prec: [{"case": "의견23-0199", "org": "서울특별시 영등포구", "date": "2023-08-29", "seq": "", "concl": "아동복지시설 경계선에서 30미터 이내 구역을 금연구역으로 지정할 수 있도록 하는 내용은 조례에 규정할 수 있음"}, {"case": "의견23-0344", "org": "서울특별시 영등포구", "date": "2023-09-20", "seq": "", "concl": "유치원 경계선 10미터를 넘는 일정 구역을 금연구역으로 지정할 수 있도록 하는 내용을 조례로 규정할 수 있음"}, {"case": "대법원 2022. 6. 30. 선고 2020추5169 판결", "org": "대법원", "date": "2022-06-30", "seq": "", "concl": "위임명령은 구체적으로 범위를 정한 개별 위임이 있어야 하며, 이 법리는 조례가 법률로부터 위임받은 사항을 다시 지방자치단체장이 정하는 규칙에 재위임하는 경우에도 적용됨"}], why: "금연구역에서 흡연하면 과태료 대상이 되는데, 그 구역의 범위(거리)를 조례가 아니라 시행규칙이 정한다. 조례 제6조는 장소만 정하고, 제8조제2항은 안내표지판의 모양·규격·설치방법만 규칙에 맡긴다 — 버스정류소 표지판에서 10미터 이내 보도, 특화거리·공개공지의 범위는 시행규칙 제2조가 정한다.", how: "시행규칙 제2조의 범위(거리)를 조례의 금연구역 지정 조문(각 호 장소 옆)으로 옮기고, 규칙에는 표지판·표시 방법만 남긴다."}
  - {oid: "2047739", art: "제2조", key: "rule_sets_zone_range", name: "과태료 대상 금연구역의 범위를 규칙으로 정함", level: "정비 권고", ctx: "금연구역의 경계(범위) — 버스정류소(택시 승차대)는 표지판으로부터 10미터 이내 보도로 한다 …", basis: "「국민건강증진법」 제9조제7항(지방자치단체는 조례로 일정한 장소를 금연구역으로 지정), 대법원 2020추5169(조례가 규칙에 재위임할 때도 대강을 예측할 수 있어야 함)", prec: [{"case": "의견23-0199", "org": "서울특별시 영등포구", "date": "2023-08-29", "seq": "", "concl": "아동복지시설 경계선에서 30미터 이내 구역을 금연구역으로 지정할 수 있도록 하는 내용은 조례에 규정할 수 있음"}, {"case": "의견23-0344", "org": "서울특별시 영등포구", "date": "2023-09-20", "seq": "", "concl": "유치원 경계선 10미터를 넘는 일정 구역을 금연구역으로 지정할 수 있도록 하는 내용을 조례로 규정할 수 있음"}, {"case": "대법원 2022. 6. 30. 선고 2020추5169 판결", "org": "대법원", "date": "2022-06-30", "seq": "", "concl": "위임명령은 구체적으로 범위를 정한 개별 위임이 있어야 하며, 이 법리는 조례가 법률로부터 위임받은 사항을 다시 지방자치단체장이 정하는 규칙에 재위임하는 경우에도 적용됨"}], why: "금연구역에서 흡연하면 과태료 대상이 되는데, 그 구역의 범위(거리)를 조례가 아니라 시행규칙이 정한다. 조례 제4조는 장소만 정하고 범위를 규칙에 맡긴 조문이 없다(일반 위임만) — 버스정류장·택시 승강장 표지판에서 10미터 이내 보도라는 범위는 시행규칙 제2조가 정한다. 조례 제4조제1항은 근거를 「국민건강증진법」 제9조제6항으로 적는데, 조례로 금연구역을 지정하게 한 조문은 같은 조 제7항이다(제6항은 유치원·어린이집 시설 경계선 10미터 이내 구역).", how: "시행규칙 제2조의 범위(거리)를 조례의 금연구역 지정 조문(각 호 장소 옆)으로 옮기고, 규칙에는 표지판·표시 방법만 남긴다. 근거 조문을 「국민건강증진법」 제9조제7항으로 고친다."}
  - {oid: "2049383", art: "제2조", key: "rule_sets_zone_range", name: "과태료 대상 금연구역의 범위를 규칙으로 정함", level: "정비 권고", ctx: "금연구역의 경계(범위) — 버스정류소(택시 승차대)는 표지판으로부터 10미터 이내 보도로 한다 …", basis: "「국민건강증진법」 제9조제7항(지방자치단체는 조례로 일정한 장소를 금연구역으로 지정), 대법원 2020추5169(조례가 규칙에 재위임할 때도 대강을 예측할 수 있어야 함)", prec: [{"case": "의견23-0199", "org": "서울특별시 영등포구", "date": "2023-08-29", "seq": "", "concl": "아동복지시설 경계선에서 30미터 이내 구역을 금연구역으로 지정할 수 있도록 하는 내용은 조례에 규정할 수 있음"}, {"case": "의견23-0344", "org": "서울특별시 영등포구", "date": "2023-09-20", "seq": "", "concl": "유치원 경계선 10미터를 넘는 일정 구역을 금연구역으로 지정할 수 있도록 하는 내용을 조례로 규정할 수 있음"}, {"case": "대법원 2022. 6. 30. 선고 2020추5169 판결", "org": "대법원", "date": "2022-06-30", "seq": "", "concl": "위임명령은 구체적으로 범위를 정한 개별 위임이 있어야 하며, 이 법리는 조례가 법률로부터 위임받은 사항을 다시 지방자치단체장이 정하는 규칙에 재위임하는 경우에도 적용됨"}], why: "금연구역에서 흡연하면 과태료 대상이 되는데, 그 구역의 범위(거리)를 조례가 아니라 시행규칙이 정한다. 조례 제5조는 장소만 정하고 범위를 규칙에 맡긴 조문이 없다(일반 위임만) — 버스정류소 10미터 이내 등 범위는 시행규칙 제2조가 정한다. 또 조례 제5조의 학교·어린이놀이터 항목은 삭제됐는데 시행규칙 제2조(2012년 이후 개정 없음)는 '학교환경위생정화구역 중 절대정화구역 — 학교 출입문에서 50미터'와 어린이놀이터 범위를 그대로 둔다. 학교환경위생정화구역은 2017년 「교육환경 보호에 관한 법률」의 교육환경보호구역으로 바뀌었다.", how: "시행규칙 제2조의 범위(거리)를 조례의 금연구역 지정 조문(각 호 장소 옆)으로 옮기고, 규칙에는 표지판·표시 방법만 남긴다. 삭제된 장소의 범위는 규칙에서도 지운다."}

# 위임 조례 미제정·근거 조항 이동 — scripts/ordin/unenacted.py 목록(docs/ordinance/unenacted_scan_<날짜>.md)을 세션이 대조(2026-10-09, 운영자 확인 전). 형식은 annex 와 같다.
