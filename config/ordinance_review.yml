# 조례 내용 점검 '참고'(content_rule_ref) 후보를 사람이 상위법령 전문과 대조한 결과(2026-10-08 세션 대조, 운영자 확인 전).
# 근거 자료: data/ordinance/delegation/(scripts/ordin/delegation.py — 법률·시행령·시행규칙 현행 전문에서 '조례' 위임 조문 추출)
#   verdict: promote   → 올린다(sig content_rule). 기본은 「지방자치법」 제28조제1항 단서(주민 권리 제한·의무 부과·벌칙)에 법률 위임이 없음을 확인한 것.
#                        위임 문제가 아닌 이유(다른 기관 의무·위원 자격 등)는 label 에 적고, 수준은 level(기본 위반 소지)로 정한다.
#                        보조금·재정지원·계약을 받아들인 사람에게만 적용되는 조건은 제28조 단서 대상이 아니다(check 또는 delegated).
#            check     → 일반 위임만 있음 — 참고로 두되 확인 사항을 적는다
#            delegated → 위임 조문 확인 — 참고로 두고 위임 조문을 적는다(정비 대상 아님)
# 키는 자치법규ID(oid)와 조문(art). 사례 번호 키는 case(YAML 1.1 에서 no 는 불 값으로 읽힌다).
