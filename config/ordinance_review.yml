  - {oid: "2048959", art: "제9조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 지방보조금심의위원회와 별도로 공동주택 관리비용 지원대상 선정·지원금액 결정을 심의하는 자문기관(위원회)을 조례로 둠", level: "위반 소지", ctx: "구청장은 공동주택관리지원사업에 관한 다음 각 호의 사항을 심의·의결하기 위하여 위원회를 둔다. 1. 지원사업계획의 수립·집행에 관한 사항 2. 지원대상 사업내용과 사업금액 산정의 적정성 여부 3. 지원대상 사업의 우선순위와 지원금 결정에 관한 사항 4. 지원금 운용에 관한 사항 5. 법령과 예산의 목적에 맞는지 여부 6. 그 밖에 공동주택 관리업무 지원과 ", basis: "법제처 자치법규 의견제시(의견20-0106) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견20-0106", "org": "경상남도 거창군", "date": "2020-05-19", "seq": "", "concl": "이 사안의 경우 질의요지와 같은 자문기관을 조례로 설치하는 것은 지방자치법령에 위배될 소지가 있는 것으로 보입니다."}], why: "공동주택관리 지원사업의 지원대상 사업 선정·지원금액(우선순위·지원금) 결정을 심의하는 별도 위원회를 두어 지방보조금심의위원회와 심의사항이 겹치는 거창군 사례와 같다. [확인할 점] 회신 뒤 「지방보조금 관리에 관한 법률」(2021) 제정으로 근거 조문이 바뀌었으므로 같은 법령의 위원회 기능 대행 규정과 함께 확인할 것.", how: "지원대상·금액 심의를 지방보조금심의위원회로 일원화하거나 기능 중복이 없도록 위원회 기능을 조정하는 정비를 검토한다."}
