  - {oid: "2049171", art: "제16조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 자활기금 등 융자금을 「지방재정법 시행령」의 채권 면제 요건(이행기한 후 장기간 무자력 등)을 갖추지 않아도 천재지변·부득…", level: "위반 소지", ctx: "구청장은 다음 각 호의 경우에는 위원회의 의결을 거쳐 감면 또는 결손처분 할 수 있다. 1. 천재지변 기타 부득이한 사유로 인하여 회복할 수 없을 정도로 상환 능력을 상실하였다고 인정될 때에는 원금 또는 이자를 감면 할 수 있다.", basis: "법제처 자치법규 의견제시(의견13-0296, 의견16-0298) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견13-0296", "org": "전라북도 김제시", "date": "2013-10-15", "seq": "", "concl": "요건을 전부 갖추지 못한 경우에도 … 원금 및 이자채무를 감면할 수 있도록 하는 것은 상기법령에 위배"}, {"case": "의견16-0298", "org": "전라북도 남원시", "date": "2016-12-13", "seq": "", "concl": "시행령 제130조제1항ㆍ제2항 및 제131조제2항 요건을 갖추지 못한 경우에도 감면할 수 있도록 정하는 것은 상위법령에 위반되는 것으로 보임"}], why: "천재지변·사업실패·고령 등 사유만으로 원금·이자(연체이자)를 감면할 수 있게 하여, 회신이 문제 삼은 조문과 요건 구조가 같다. / 남원시 조례안과 거의 같은 문구(천재지변 그 밖에 부득이한 사유로 회복할 수 없을 정도로 상환능력 상실)로 시행령 요건과 별도로 원금·이자 감면을 허용한다. [확인할 점] 회신 당시 근거는 「지방재정법 시행령」 제130조 — 현행 조문 번호·요건 확인 필요. 같은 취지 회신 의견13-0049(철원군). 회신(2016) 뒤 지방재정법령의 채권 면제 조항 개정 여부는 현행 원문으로 다시 확인 필요", how: "감면(채권 면제) 요건을 「지방재정법 시행령」의 채권 면제 요건에 맞추거나 그 규정을 따르도록 고치는 방향으로 검토. 융자금 채권의 감면·면제는 「지방재정법」 제86조와 같은 법 시행령 제130조·제131조의 요건과 절차에 따르도록 고치거나 상위법령을 인용하는 방식으로 정비를 검토"}
  - {oid: "2181951", art: "제8조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 자활기금 등 융자금을 「지방재정법 시행령」의 채권 면제 요건(이행기한 후 장기간 무자력 등)을 갖추지 않아도 천재지변·부득…", level: "위반 소지", ctx: "① 구청장은 기금을 대여 받은 자가 제7조에 따라 상환기한을 연장하였으나 천재지변, 사업실패, 고령, 기타 부득이한 사유발생 등으로 근로능력을 상실하였다고 인정되는 경우에 한하여 위원회의 심의·의결을 거쳐 당해 채권과 그 이자 및 연체이자를 감면할 수 있다. ② 대여금에 대하여 감면을 받고자 하는 자는 자활기금 대여금 감면 신청서(별지 ", basis: "법제처 자치법규 의견제시(의견13-0296, 의견16-0298, 의견19-0032) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견13-0296", "org": "전라북도 김제시", "date": "2013-10-15", "seq": "", "concl": "요건을 전부 갖추지 못한 경우에도 … 원금 및 이자채무를 감면할 수 있도록 하는 것은 상기법령에 위배"}, {"case": "의견16-0298", "org": "전라북도 남원시", "date": "2016-12-13", "seq": "", "concl": "시행령 제130조제1항ㆍ제2항 및 제131조제2항 요건을 갖추지 못한 경우에도 감면할 수 있도록 정하는 것은 상위법령에 위반되는 것으로 보임"}, {"case": "의견19-0032", "org": "경상북도 영천시", "date": "2019-02-21", "seq": "", "concl": "시행령 제130조·제131조 요건을 갖추지 못한 경우에도…감면할 수 있도록 규정하는 것은 상위법령에 위배될 소지"}], why: "천재지변·사업실패·고령 등 사유만으로 원금·이자(연체이자)를 감면할 수 있게 하여, 회신이 문제 삼은 조문과 요건 구조가 같다. / 상환기한 연장 뒤 사업실패·고령 등 시행령에 없는 요건으로 채권과 이자·연체이자 감면을 규칙에서 허용한다. / 자활기금 대여금에 대해 시행령의 결손·감면 요건과 다른 표현(천재지변·사업실패·고령 등으로 근로능력 상실)으로 채권·이자·연체이자 감면 사유를 정하고 있어 법제처가 문제 삼은 유형과 같다. [확인할 점] 회신 당시 근거는 「지방재정법 시행령」 제130조 — 현행 조문 번호·요건 확인 필요. 같은 취지 회신 의견13-0049(철원군). 회신(2016) 뒤 지방재정법령의 채권 면제 조항 개정 여부는 현행 원문으로 다시 확인 필요 같은 취지 의견18-0214(충주시)도 있음. 자활기금 관련 법령·지침에 별도 감면 근거가 있는지, 회신 뒤 지방재정법령의 채권 관리 조문이 바뀌었는지 함께 확인할 것.", how: "감면(채권 면제) 요건을 「지방재정법 시행령」의 채권 면제 요건에 맞추거나 그 규정을 따르도록 고치는 방향으로 검토. 융자금 채권의 감면·면제는 「지방재정법」 제86조와 같은 법 시행령 제130조·제131조의 요건과 절차에 따르도록 고치거나 상위법령을 인용하는 방식으로 정비를 검토 감면 사유를 상위법령의 결손·감면 요건에 맞추거나 상위법령을 따르도록 인용하는 방식으로 정비를 검토한다."}
