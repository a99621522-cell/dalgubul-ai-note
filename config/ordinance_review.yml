  - {oid: "2048236", art: "제1조", key: "basis_moved_law", name: "근거 조항이 다른 법률로 옮겨감", level: "정비 권고", ctx: "이 조례는 「산림보호법」 제45조의9에 따라 … 산사태취약지역지정위원회의 구성ㆍ운영에 필요한 사항을 정함을 목적으로 한다.", basis: "「산림보호법」 제45조의9 삭제(2025.1.31), 「산림재난방지법」 제23조(산사태취약지역 지정위원회 — 시장·군수·구청장 소속은 조례로 정한다) — 2026-10-09 현행 조문 확인", prec: [{"case": "「산림재난방지법」 제23조", "org": "법령", "date": "", "seq": "", "concl": "산사태취약지역 지정위원회 — 산림재난방지기관의 장 소속으로 구성·운영하여야 하고, 시장·군수·구청장 소속은 해당 지방자치단체의 조례로 정한다"}], why: "조례 제1조가 근거로 든 「산림보호법」 제45조의9는 삭제되었고, 산사태취약지역 지정위원회 규정은 「산림재난방지법」 제23조로 옮겨졌다. 같은 조는 시장·군수·구청장 소속 위원회를 '해당 지방자치단체의 조례로 정한다'고 맡긴다.", how: "제1조의 근거를 「산림재난방지법」 제23조로 고치고, 위원회 기능·구성 조문이 같은 법과 시행령의 지정·변경 절차와 맞는지 함께 확인한다."}
