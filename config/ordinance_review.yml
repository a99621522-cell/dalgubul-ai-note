  - {oid: "2048156", art: "제5조", verdict: "delegated", deleg: "「물환경보전법」 제51조제2항: 공공폐수처리구역에서 폐수를 배출하려는 자 중 대통령령으로 정하는 자는 폐수를 폐수관로로 유입시켜야 한다 — 법률이 직접 정한 의무를 옮겨 적은 것."}
  - {oid: "2048156", art: "제6조", verdict: "check", deleg: "배수설비 설치 의무는 「물환경보전법」 제51조제2항이 직접 정하고, 설치방법·구조기준은 같은 조 제10항·시행규칙 제72조제12항 별표 16이 정한다. 2024.1.23 신설된 배수설비 설치 승인(제51조제5항)·준공검사와 검사필증 전 사용 금지(제7항·제8항)·사용 중지 신고(제9항)가 조례에 없다.", how: "단서의 소장 구조 조정은 시행규칙 별표 16 기준 안에서만 하도록 고치고, 배수설비 설치 승인·준공검사·사용 중지 신고 절차를 법 제51조제5항~제9항을 인용해 맞춘다."}
  - {oid: "2048156", art: "제9조", verdict: "check", deleg: "「물환경보전법」 제38조의2는 측정기기(적산유량계 등) 부착 의무자를 대통령령으로 정하는 자로 한정하고, 공공폐수처리시설 사용료 산정은 같은 법 제48조의3제4항·시행령 제64조(배출량·오염도 기준)가 정한다 — 모든 폐수 배출 사업자에게 유량계 설치를 지우라고 조례에 맡긴 조문은 없다.", how: "유량계를 사용료 산정 근거(시행령 제64조)로 두는 취지라면 '유량계를 설치하지 않은 사업자의 배출량은 용수 사용량 등으로 산정한다'처럼 산정 방법으로 정하거나, 오·폐수 유입처리 승인(법 제51조제3항) 조건으로 정한다."}
  - {oid: "2048156", art: "제13조", verdict: "check", deleg: "원인자 비용 부담은 「물환경보전법」 제48조제1항 후단이 직접 정하고, 설치 부담금 산정·부과·징수는 같은 법 제48조의2제5항에 따라 시행령 제62조~제65조가 정한다(총액은 지출액 이하, 보조금 제외, 비용부담계획은 기후에너지환경부장관 승인 — 법 제49조의2). 조례의 '시설설치비'는 법률 용어 '공공폐수처리시설 설치 부담금'과 다르다.", how: "부담 대상·산정 방법이 시행령 제63조·제64조와 승인받은 비용부담계획에 맞는지 확인하고, 용어를 '공공폐수처리시설 설치 부담금'으로 맞추며 근거 조문(법 제48조의2)을 적는다."}
