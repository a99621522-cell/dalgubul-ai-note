  - {oid: "2188538", art: "제5조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 사회재난 원인제공자에게 지자체가 부담한 지원금액 '전부'를 청구하도록 의무화하는 조문", level: "정비 권고", ctx: "구청장은 사회재난으로 피해를 유발한 원인자(이하 “원인제공자”라 한다)에게 제4조제1항 각 호의 지원을 위하여 부담한 지원금액 등 비용 전부를 청구한다.", basis: "법제처 자치법규 의견제시(의견19-0180) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견19-0180", "org": "경상남도 거창군", "date": "2019-06-20", "seq": "", "concl": "이 사안의 경우 질의 내용을 조례에 규정하는 것은 바람직하지 않은 것으로 보입니다."}], why: "거창군 개정안 문언('원인제공자에게…부담한 지원금액 전부를 청구한다')과 같은 내용으로 지원금 전부 청구를 의무로 정하고 있다. [확인할 점] 자료에는 회신 이유 앞부분이 없어 결론만 확인됨. 재난안전법의 구상 조문 개정 여부를 함께 확인할 것.", how: "청구 범위·재량을 정한 상위법령(재난안전법 구상 규정 등)에 맞추어 '전부 또는 일부를 청구할 수 있다' 등으로 고치는 방안을 검토한다."}
  - {oid: "2204373", art: "제2조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 조례 정의에서 비법인 단체인 대한적십자사봉사회 지구협의회를 '대한적십자사'로 규정함", level: "위반 소지", ctx: "1.“대한적십자사(이하“적십자사”라 한다)”란 대한적십자사봉사회 달성군 지구협의회를 말한다. 2.“적십자사 사업”이란 적십자사가 추진하는 사업을 말한다.", basis: "법제처 자치법규 의견제시(의견19-0339) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견19-0339", "org": "강원도 홍천군", "date": "2019-10-23", "seq": "", "concl": "(질의 나) 이 사안의 경우, 강원도 홍천군은 질의요지의 내용을 조례로 규정할 수 없을 것으로 보입니다."}], why: "「대한적십자사 조직법」상 지원·무상대부 대상은 법인인 대한적십자사인데, 이 조례는 지구협의회를 '대한적십자사(적십자사)'로 정의해 홍천군 질의 나와 같은 구조다. [확인할 점] 같은 쟁점 의견20-0178(거제시, 봉사회 무상대부)도 있음.", how: "정의 조문에서 지구협의회를 대한적십자사와 구별되는 별도 용어(예: 봉사회)로 정하고 지원 근거도 이에 맞추는 정비를 검토한다."}
  - {oid: "2232030", art: "제2조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 조례 정의에서 비법인 단체인 대한적십자사봉사회 지구협의회를 '대한적십자사'로 규정함", level: "위반 소지", ctx: "1. “대한적십자사(이하 “적십자사”라 한다)란 대한적십자봉사회 군위 지구협의회를 말한다. 2. “적십자사 회원”이란 적십자사 군위지구협의회의 회원을 말한다. 3. “적십자사 사업”이란 적십자사 군위지구협의회가 추진하는 사업을 말한다.", basis: "법제처 자치법규 의견제시(의견19-0339) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견19-0339", "org": "강원도 홍천군", "date": "2019-10-23", "seq": "", "concl": "(질의 나) 이 사안의 경우, 강원도 홍천군은 질의요지의 내용을 조례로 규정할 수 없을 것으로 보입니다."}], why: "「대한적십자사 조직법」상 지원·무상대부 대상은 법인인 대한적십자사인데, 이 조례는 지구협의회를 '대한적십자사(적십자사)'로 정의해 홍천군 질의 나와 같은 구조다. [확인할 점] 같은 쟁점 의견20-0178(거제시, 봉사회 무상대부)도 있음.", how: "정의 조문에서 지구협의회를 대한적십자사와 구별되는 별도 용어(예: 봉사회)로 정하고 지원 근거도 이에 맞추는 정비를 검토한다."}
  - {oid: "2162147", art: "제6조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 식자재마트·상품공급점 개설자에게 「유통산업발전법」 제8조의 상권영향평가서·지역협력계획서 제출을 권고하도록 한 조문(법률 위…", level: "위반 소지", ctx: "식자재마트, 상품공급점을 개설하려는 자(이하 “점포개설자”라 한다)에 대하여 건전한 유통질서의 확립 및 상생발전을 위하여 다음 각 호의 사항을 권고할 수 있다. 1. 영업을 시작하기 전에「유통산업발전법」제8조에 따른 상권영향 평가서 및 지역협력계획서의 제출 2. 영업을 시작하기 30일 전까지「유통산업발전법」제8조의2에 따른 개설 지역 및 시기 등을 포함한 ", basis: "법제처 자치법규 의견제시(의견18-0224) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견18-0224", "org": "경상북도 포항시", "date": "2018-10-10", "seq": "", "concl": "상권영향 평가서와 지역협력계획서의 제출…을 권고할 수 있도록 하는 내용은 「지방자치법」 제22조 단서에 위배될 소지"}], why: "서민경제특별진흥지구 안 식자재마트·상품공급점 개설자에게 상권영향평가서·지역협력계획서 제출을 권고하도록 해 포항시 질의 나와 같은 내용이다(제2호 개설계획 예고 권고는 법제처가 가능하다고 본 부분). [확인할 점] 제6조 제2호(개설계획 예고 권고)는 법제처가 조례로 규정할 수 있다고 회신한 내용이므로 대상이 아님.", how: "제1호(상권영향평가서·지역협력계획서 제출 권고)의 존치 여부를 상위법령 위임 범위에 비추어 검토한다."}
  - {oid: "2205711", art: "제22조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 위탁계약이 해지된 수탁자는 일정 기간 위탁운영(입찰·수의계약)에 참여할 수 없도록 일률적으로 정한 조문", level: "정비 권고", ctx: "② 제1항제1호 및 제2호에 따라 위탁계약이 해지된 자는 2년간 위탁운영에 참여할 수 없다. ③ 위탁을 해지한 경우 체육시설의 운영에 사용하던 부대설비와 장비, 비품일체는 중구에 귀속된다. 다만, 수탁기관과 사전 협의된 사항은 예외로 한다. ④ 제1항에 따라 그 위탁을 해지할 경우 위탁수수료 및 시설에 대한 기존 이용자의 권익보호에 관한 사항은 협약 내용에", basis: "법제처 자치법규 의견제시(의견20-0032) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견20-0032", "org": "경상북도 경산시", "date": "2020-02-25", "seq": "", "concl": "획일적으로 위탁계약이 해지된 수탁자에 대하여…입찰참가등 제한을 하도록…규정하는 것은 법령에 따른 지방자치단체 장의 권한을 침해할 소지"}], why: "체육시설 위탁계약이 해지된 자를 일정 기간(1~2년) 위탁운영 참여에서 일률적으로 배제하고 있어 경산시 조례안과 같은 유형이다. [확인할 점] 회신은 '권한 침해 소지·신중'으로 표현되어 정비 권고로 분류함.", how: "참여 제한을 일률 규정하지 않고 지방계약법령의 입찰참가자격 제한 절차에 따르도록 하거나 단체장 판단 여지를 두는 방향으로 검토한다."}
