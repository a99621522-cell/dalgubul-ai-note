  - {oid: "2048240", art: "제3조의2", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 새마을운동조직 구성원이 행정기관장이 소집한 회의에 참석한 데 대해 회의참석수당을 보조금으로 지급하도록 조례에 정하는 것", level: "위반 소지", ctx: "② 군수는 제1항에 따른 회의에 참석한 새마을지도자에게 예산의 범위에서 회의당 20,000원 이하의 회의수당을 지급할 수 있다. (본조신설 2025. 10. 10.)", basis: "법제처 자치법규 의견제시(의견23-0040, 의견25-0303) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견23-0040", "org": "부산광역시 강서구", "date": "2023-02-17", "seq": "", "concl": "동장이 소집한 회의에 참석한 새마을운동조직 구성원에게 회의참석수당을 보조금으로 지원하는 것은 「지방재정법」에 위배될 소지가 있어 바람직하지 않음"}, {"case": "의견25-0303", "org": "경상남도 하동군", "date": "2025-10-14", "seq": "", "concl": "회의에 참석한 새마을운동조직의 구성원에게 회의참석수당을 보조금으로 지원하는 내용을 조례에 규정할 때 신중하시기 바랍니다"}], why: "군수 또는 읍·면장이 군정업무 추진을 위해 소집한 새마을지도자 회의에 참석한 새마을지도자에게 회의당 회의수당을 지급하도록 정하고 있어, 법제처가 문제 삼은 민간단체 구성원 회의참석수당 보조와 같은 유형임. / 군수·읍면장이 소집한 새마을지도자 회의에 참석한 새마을지도자에게 회의당 20,000원 이하의 회의수당을 지급하도록 해 회신 사안과 같다. [확인할 점] 2025.10.10. 신설 조문. 법제처 의견22-0078(충남 예산군, 2022-04-28, 바르게살기운동 회원 회의참석수당)도 같은 취지로 바람직하지 않다고 회신했으며, 그 조례안 제3조의2 문구가 이 조문과 거의 같음. 2025-10-10 신설 조문. 같은 쟁점 의견23-0197(청주시)은 \"바람직하지 않을 것\"으로 회신했다.", how: "「새마을운동조직 육성법」·「지방재정법」 제17조의 보조 근거(조직 운영비 보조)에 맞는지 검토하고, 개인별 회의참석수당 지급 규정의 유지 여부를 재검토. 「지방재정법」 제17조제1항의 보조 사유에 해당하는지 다시 확인하고 회의참석수당 규정의 존치 여부를 검토"}
  - {oid: "2050602", art: "제5조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 「지방자치법 시행령」 제81조가 규칙으로 정하도록 한 이장·통장의 임명(자격·절차·임기 등)에 관한 사항을 조례로 정하는 것", level: "위반 소지", ctx: "②통·반장은 다음 각 호의 기준에 따라 위촉한다. (개정 2012.4.30) 1. 통장은 해당 통 관할 구역 내에 거주하는 사람으로서 책임감이 확고하여 주민을 지도할 능력이 있으며 덕망과 신임이 있는 활동적인 사람을 공개모집하여 동장이 위촉한다. (개정 2012.4.30) <단서 삭제 2019.2.20> 2. 반장은 지역 여건상 필요할 경우에 위촉하며, 책", basis: "법제처 자치법규 의견제시(의견23-0023, 의견22-0226) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견23-0023", "org": "전라남도 순천시", "date": "2023-01-12", "seq": "", "concl": "이ㆍ통장의 임명에 관한 사항을 조례로 정할 수는 없는 것으로 보임"}, {"case": "의견22-0226", "org": "경상남도 합천군", "date": "2022-08-18", "seq": "", "concl": "질의요지와 같은 내용을 규칙으로 규정하는 것은 바람직하지 않을 것으로 보임(입안 여부 신중 재검토)"}], why: "통장의 위촉 기준(거주 요건·모집공고·위촉권자)과 임기·해촉 사유를 조례에 직접 정하고 있어, 법제처가 시행령 제81조에 따라 규칙으로 정할 사항이라고 본 이·통장 임명 사항을 조례로 정한 유형과 같음. / 이장·통장 해임(해촉) 사유에 '그 밖에 ~ 인정(판단)될 때', '품위손상 등으로 지탄'처럼 포괄적·주관적 사유를 두고 있어, 법제처가 명확성 측면에서 바람직하지 않다고 본 이장 해임사유 규정과 같은 유형임. [확인할 점] 조례는 '위촉'이라는 용어를 쓰나 시행령 제81조의 통장 임명에 관한 사항에 해당하는지 확인 필요. 반장 관련 부분은 시행령 제81조 대상이 아님. 통·반장 해촉 규정(조례). 같은 조문은 의견23-0023 쟁점으로도 후보.", how: "통장 위촉(임명)의 기준·절차·임기·해촉에 관한 사항을 「지방자치법 시행령」 제81조에 따라 규칙으로 옮기는 정비를 검토. 해임(해촉) 사유를 구체적·객관적 요건으로 한정하고 '그 밖에 ~ 인정될 때' 같은 포괄 사유의 삭제 또는 구체화를 검토."}
  - {oid: "2142532", art: "제5조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 「지방자치법 시행령」 제81조가 규칙으로 정하도록 한 이장·통장의 임명(자격·절차·임기 등)에 관한 사항을 조례로 정하는 것", level: "위반 소지", ctx: "② 통ㆍ반장은 다음 각호의 기준에 따라 위촉한다.<개정 2013.4.30., 2023.3.30.> 1. 통장은 모집공고일 기준으로 해당 통 관할 구역 내에 2년 이상 계속 거주하는 30세 이상인 사람으로서 주민으로부터 덕망과 신임이 있으며 주민을 지도할 능력이 있는 사람 중에서 10일 이상의 모집공고를 거쳐 동장이 위촉한다.<개정 1999.11.3, 200", basis: "법제처 자치법규 의견제시(의견23-0023, 의견22-0226) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견23-0023", "org": "전라남도 순천시", "date": "2023-01-12", "seq": "", "concl": "이ㆍ통장의 임명에 관한 사항을 조례로 정할 수는 없는 것으로 보임"}, {"case": "의견22-0226", "org": "경상남도 합천군", "date": "2022-08-18", "seq": "", "concl": "질의요지와 같은 내용을 규칙으로 규정하는 것은 바람직하지 않을 것으로 보임(입안 여부 신중 재검토)"}], why: "통장의 위촉 기준(거주 요건·모집공고·위촉권자)과 임기·해촉 사유를 조례에 직접 정하고 있어, 법제처가 시행령 제81조에 따라 규칙으로 정할 사항이라고 본 이·통장 임명 사항을 조례로 정한 유형과 같음. / 이장·통장 해임(해촉) 사유에 '그 밖에 ~ 인정(판단)될 때', '품위손상 등으로 지탄'처럼 포괄적·주관적 사유를 두고 있어, 법제처가 명확성 측면에서 바람직하지 않다고 본 이장 해임사유 규정과 같은 유형임. [확인할 점] 조례는 '위촉'이라는 용어를 쓰나 시행령 제81조의 통장 임명에 관한 사항에 해당하는지 확인 필요. 반장 관련 부분은 시행령 제81조 대상이 아님. 통·반장 해촉 규정(조례). 같은 조문은 통장 임명 사항을 조례로 정한 점(의견23-0023)으로도 후보.", how: "통장 위촉(임명)의 기준·절차·임기·해촉에 관한 사항을 「지방자치법 시행령」 제81조에 따라 규칙으로 옮기는 정비를 검토. 해임(해촉) 사유를 구체적·객관적 요건으로 한정하고 '그 밖에 ~ 인정될 때' 같은 포괄 사유의 삭제 또는 구체화를 검토."}
