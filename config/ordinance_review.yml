  - {oid: "2049594", art: "제5조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 「지방자치법 시행령」 제81조가 규칙으로 정하도록 한 이장·통장의 임명(자격·절차·임기 등)에 관한 사항을 조례로 정하는 것", level: "위반 소지", ctx: "② 통·반장은 다음 각 호의 기준에 의거하여 위촉한다. <개정 2020.08.10., 2022.4.11.> 1. 통장은 해당 통 관할 구역 내에 거주하여야 하며, 책임감과 봉사정신이 투철하고 주민을 지도할 능력이 있는 사람 중에서 동장이 위촉한다. 이 경우 통장위촉은 지원자 중 일정한 기준에 따라 심사하고, 통장 위촉 및 심사에 필요한 기준은 규칙으로 정한", basis: "법제처 자치법규 의견제시(의견23-0023, 의견22-0226) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견23-0023", "org": "전라남도 순천시", "date": "2023-01-12", "seq": "", "concl": "이ㆍ통장의 임명에 관한 사항을 조례로 정할 수는 없는 것으로 보임"}, {"case": "의견22-0226", "org": "경상남도 합천군", "date": "2022-08-18", "seq": "", "concl": "질의요지와 같은 내용을 규칙으로 규정하는 것은 바람직하지 않을 것으로 보임(입안 여부 신중 재검토)"}], why: "통장의 위촉 기준(거주 요건·모집공고·위촉권자)과 임기·해촉 사유를 조례에 직접 정하고 있어, 법제처가 시행령 제81조에 따라 규칙으로 정할 사항이라고 본 이·통장 임명 사항을 조례로 정한 유형과 같음. / 이장·통장 해임(해촉) 사유에 '그 밖에 ~ 인정(판단)될 때', '품위손상 등으로 지탄'처럼 포괄적·주관적 사유를 두고 있어, 법제처가 명확성 측면에서 바람직하지 않다고 본 이장 해임사유 규정과 같은 유형임. [확인할 점] 조례는 '위촉'이라는 용어를 쓰나 시행령 제81조의 통장 임명에 관한 사항에 해당하는지 확인 필요. 반장 관련 부분은 시행령 제81조 대상이 아님. 이 조문은 위촉·심사 세부 기준을 규칙에 위임하고 있으나 위촉 요건·임기·해촉 사유는 조례에 남아 있음. 통·반장 해촉 규정(조례). 같은 조문은 의견23-0023 쟁점으로도 후보.", how: "통장 위촉(임명)의 기준·절차·임기·해촉에 관한 사항을 「지방자치법 시행령」 제81조에 따라 규칙으로 옮기는 정비를 검토. 해임(해촉) 사유를 구체적·객관적 요건으로 한정하고 '그 밖에 ~ 인정될 때' 같은 포괄 사유의 삭제 또는 구체화를 검토."}
