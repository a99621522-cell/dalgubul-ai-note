  - {oid: "2049061", art: "제16조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 조례로 정한 신고보상금을 잘못 지급한 경우 반환금을 지방세 체납처분의 예에 따라 징수하도록 한 조문(법률 위임 없는 강제징수)", level: "위반 소지", ctx: "구청장은 보상금을 지급한 후 제15조의 보상금 지급제외 대상임이 밝혀졌을 때는 이미 지급한 보상금을 환수하여야 하며, 환수방법은 지방세 부과·징수 및 체납처분의 예를 따른다.", basis: "법제처 자치법규 의견제시(의견19-0380) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견19-0380", "org": "경기도 수원시", "date": "2019-12-24", "seq": "", "concl": "부패방지권익위법 제70조의2제3항을 근거로 질의요지와 같은 내용을 수원시조례에 규정하는 것은 「지방자치법」 제22조 단서에 위배될 소지"}], why: "부조리·청렴·공익제보 신고 보상금의 환수를 '지방세 (부과·징수 및) 체납처분의 예'에 따르도록 정하고 있어 수원시 부조리 신고보상금 조례 질의와 같은 유형이다. [확인할 점] 기존 점검 규칙 loan_forced_collection(기금 융자금 강제징수)과 대상이 다른 별도 쟁점.", how: "체납처분의 예에 따른 강제징수 문구를 삭제하거나 법률에 근거가 있는 징수 절차만 인용하도록 정비를 검토한다."}
  - {oid: "2048537", art: "제13조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 조례로 정한 신고보상금을 잘못 지급한 경우 반환금을 지방세 체납처분의 예에 따라 징수하도록 한 조문(법률 위임 없는 강제징수)", level: "위반 소지", ctx: "보상금을 지급한 후에 제12조에 따른 보상금 지급 제외 대상임이 밝혀진 경우와 착오 등의 사유로 보상금이 잘못 지급된 경우에는 이미 지급한 보상금의 전부나 일부를 환수할 수 있으며 환수방법은 지방세 부과징수 및 체납처분의 예에 따른다.<개정 2014.4.30>", basis: "법제처 자치법규 의견제시(의견19-0380) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견19-0380", "org": "경기도 수원시", "date": "2019-12-24", "seq": "", "concl": "부패방지권익위법 제70조의2제3항을 근거로 질의요지와 같은 내용을 수원시조례에 규정하는 것은 「지방자치법」 제22조 단서에 위배될 소지"}], why: "부조리·청렴·공익제보 신고 보상금의 환수를 '지방세 (부과·징수 및) 체납처분의 예'에 따르도록 정하고 있어 수원시 부조리 신고보상금 조례 질의와 같은 유형이다. [확인할 점] 기존 점검 규칙 loan_forced_collection(기금 융자금 강제징수)과 대상이 다른 별도 쟁점.", how: "체납처분의 예에 따른 강제징수 문구를 삭제하거나 법률에 근거가 있는 징수 절차만 인용하도록 정비를 검토한다."}
