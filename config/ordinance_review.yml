  - {oid: "2146877", art: "제3조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 상위법령 근거 없이 조례로 지역치안협의회에 경찰서장·소방서장·세무서장 등 관내 국가기관 장을 당연직 위원(의장·부의장 포함…", level: "정비 권고", ctx: "② 협의회의 의장은 대구광역시 서구청장(이하 “구청장”이라 한다)과 대구광역시 서부경찰서장(이하 “경찰서장”이라 한다)이 공동으로 한다.(개정 2020.08.10.) ③ 당연직 위원은 다음 각 호와 같다. <개정 2022. 11. 10.> 1. 대구광역시 서구청장 2. 대구광역시 서구의회 의장 3. 대구광역시 서부경찰서장 4. 대구광역시 서부교육지원청 교육", basis: "법제처 자치법규 의견제시(의견14-0168) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견14-0168", "org": "서울특별시 의회사무처", "date": "2014-09-26", "seq": "", "concl": "상위법령에 특별한 규정이 없다면 관내기관 단체장을 당연직 위원으로 규정하는 것은 바람직하지 않음"}], why: "상위법령의 근거 없이 조례로 서부경찰서장을 공동의장으로, 서부소방서장·교육장을 당연직 위원으로 정하고 있어 법제처가 문제 삼은 구성 방식과 같다. [확인할 점] 2014년 회신이며 표준조례에 따른 조문일 수 있음. 의회 의장 당연직 부분은 별도 규칙(member_on_exec_committee) 대상. 자치경찰 관련 법령 변화로 근거가 생겼는지 확인 필요", how: "국가기관 장은 당연직이 아니라 해당 기관의 추천·동의를 받아 위촉하는 방식 등으로 구성 조항을 고치는 것을 검토한다."}
  - {oid: "2049980", art: "제3조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 상위법령 근거 없이 조례로 지역치안협의회에 경찰서장·소방서장·세무서장 등 관내 국가기관 장을 당연직 위원(의장·부의장 포함…", level: "정비 권고", ctx: "② 협의회의 의장은 대구광역시 수성구청장(이하“구청장”이라 한다)과 대구수성경찰서장(이하 “경찰서장”이라 한다)이 공동으로 한다.<개정 2023.4.10., 2024.9.20.> ③ 위원은 당연직 위원과 위촉직 위원으로 구분하고 다음 각 호의 사람을 당연직 위원으로 한다.<개정 2023.4.10.> 1. 대구광역시 수성구의회 의장 2. 대구광역시 동부교육청", basis: "법제처 자치법규 의견제시(의견14-0168) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견14-0168", "org": "서울특별시 의회사무처", "date": "2014-09-26", "seq": "", "concl": "상위법령에 특별한 규정이 없다면 관내기관 단체장을 당연직 위원으로 규정하는 것은 바람직하지 않음"}], why: "상위법령의 근거 없이 조례로 수성경찰서장을 공동의장으로, 수성소방서장·교육장을 당연직 위원으로 정하고 있어 법제처가 문제 삼은 구성 방식과 같다. [확인할 점] 2014년 회신이며 표준조례에 따른 조문일 수 있음. 의회 의장 당연직 부분은 별도 규칙(member_on_exec_committee) 대상. 자치경찰 관련 법령 변화로 근거가 생겼는지 확인 필요", how: "국가기관 장은 당연직이 아니라 해당 기관의 추천·동의를 받아 위촉하는 방식 등으로 구성 조항을 고치는 것을 검토한다."}
  - {oid: "2048856", art: "제1조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 법령이 과태료 부과기준을 정하고 조례 위임이 없는 폐기물 무단투기 등 과태료에 대해 조례로 부과·징수 사항을 따로 정함", level: "정비 권고", ctx: "제1조(목적) 이 조례는 「폐기물관리법」 제68조 및 「자원의 절약과 재활용촉진에 관한 법률」 제41조 및 「건설폐기물의 재활용촉진에 관한 법률」 제66조의 규정에 의한 과태료의 부과ㆍ징수사무에 관하여 필요한 사항을 규정함을 목적으로 한다. <개정 2005.12.30, 2008.12.1, 2025.10.30.>", basis: "법제처 자치법규 의견제시(의견14-0027) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견14-0027", "org": "서울특별시 광진구", "date": "2014-02-18", "seq": "", "concl": "조례로 과태료 부과를 위임하지 않았으므로 조례·규칙에서 과태료 부과를 규정하는 것은 적절하지 않음"}], why: "「폐기물관리법」 제68조 등 법률이 정한 과태료의 부과·징수 사무에 대해 별도 조례를 두고 의견제출·납부기간·이의제기·강제징수 절차(제3조~제7조)를 정하고 있다. [확인할 점] 제8조 신고포상금은 「폐기물관리법」 제61조의 조례 위임 사항이므로 다른 조례로 옮기는 방식을 함께 검토", how: "과태료 부과·징수는 「폐기물관리법」 시행령과 「질서위반행위규제법」에 따르도록 하고, 조례에는 위임받은 신고포상금 등 필요한 사항만 남기는 정비를 검토한다."}
  - {oid: "2047772", art: "제5조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 공공시설의 명칭과 위치를 조례에서 정하지 않고 규칙으로 위임함", level: "정비 권고", ctx: "제5조(명칭과 위치) 도서관별 명칭과 위치는 규칙으로 정한다.", basis: "법제처 자치법규 의견제시(의견14-0020) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견14-0020", "org": "경기도 용인시", "date": "2014-02-07", "seq": "", "concl": "사회복지시설의 명칭과 위치는 조례에서 정하여야 하므로 규칙으로 위임하는 것은 바람직하지 않음"}], why: "구립 공공도서관이라는 공공시설의 명칭과 위치를 조례에서 정하지 않고 규칙으로 정하도록 위임하고 있다. [확인할 점] 회신 대상은 사회복지시설이었고 이 조문은 도서관임", how: "「지방자치법」상 공공시설 설치·관리는 조례로 정하는 취지에 따라 도서관별 명칭과 위치를 조례(별표 등)에 직접 두는 방안을 검토한다."}
  - {oid: "2049937", art: "제10조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 조례 사후 입법평가위원회의 결과통보서 내용을 집행기관 주관부서가 반영하도록 의무화함", level: "정비 권고", ctx: "제10조(평가결과 반영) 주관부서의 장은 위원장으로부터 받은 사후 입법평가 결과통보서에 개선권고 사항이 있는 경우에는 이를 반영하여야 한다. 다만, 주관부서의 장은 평가 결과를 반영하기 어려운 경우에는 그 사유를 서면으로 위원장에게 통지하고, 반영 여부를 협의하여 결정하여야 한다.", basis: "법제처 자치법규 의견제시(의견13-0344) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견13-0344", "org": "부산광역시", "date": "2013-11-21", "seq": "", "concl": "결과통보서 내용을 주관부서가 반드시 반영하도록 한 규정은 합의제 행정기관 기능이라 적절치 않음"}], why: "입법평가위원회의 결과통보서에 개선권고가 있으면 주관부서의 장이 반영하여야 한다고 정해 위원회 권고에 집행기관을 기속하는 구조다. [확인할 점] 반영이 어려우면 사유를 통지하고 협의하는 단서가 있어 회신 사안보다 기속 정도가 약함", how: "위원회를 자문기관으로 명확히 하고 반영 의무를 \"반영하도록 노력\" 또는 구청장 검토 후 결정하는 방식으로 바꾸는 것을 검토한다."}
  - {oid: "2233093", art: "제21조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 공유재산 관리위탁 시 수탁자가 단체장의 승인을 받아 이용료를 정하도록 조례에 규정함", level: "정비 권고", ctx: "③ 수탁자는 군수의 승인을 받아 사용료 및 이용료를 따로 정할 수 있다. <개정 2022. 12. 22., 2025. 5. 26.> ④ 군수는 시설관리 및 운영상 필요하다고 판단될 때에는 위탁관리에 필요한 경비의 일부를 예산의 범위에서 지원할 수 있다. <개정 2013.3.29> ⑤ 그 밖에 시설에 대한 위탁관리 규정은 「공유재산 및 물품 관리법」, 「대구", basis: "법제처 자치법규 의견제시(의견14-0048) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견14-0048", "org": "경상북도 구미시", "date": "2014-03-05", "seq": "", "concl": "시장의 승인을 받아 수탁자가 이용료를 따로 정하도록 조례에 규정하는 것은 적절하지 않음"}], why: "문화·체육시설을 위탁하면서 \"수탁자는 군수의 승인을 받아 사용료 및 이용료를 따로 정할 수 있다\"고 해 회신 사안과 같은 구조다. [확인할 점] 회신 근거인 공유재산법 시행령 제21조의 현행 문언 확인 필요", how: "「공유재산 및 물품 관리법 시행령」에 따라 이용료를 군수가 결정하는 방식(조례 별표 또는 군수 결정·고시)으로 고치는 것을 검토한다."}
  - {oid: "2238110", art: "제8조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 공유재산 관리위탁 시 수탁자가 단체장의 승인을 받아 이용료를 정하도록 조례에 규정함", level: "정비 권고", ctx: "① 시설물을 이용하고자 하는 자는 이용료를 납부하여야 하며, 수탁자는 시설물별 이용료, 감면기준, 환불기준 등을 정하여 군수의 승인을 받아 이용료를 징수하여야 한다. ② 수탁자는 제1항에 따라 승인한 시설물 이용료를 공개하여야 한다.", basis: "법제처 자치법규 의견제시(의견14-0048) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견14-0048", "org": "경상북도 구미시", "date": "2014-03-05", "seq": "", "concl": "시장의 승인을 받아 수탁자가 이용료를 따로 정하도록 조례에 규정하는 것은 적절하지 않음"}], why: "공유재산법에 따라 관리위탁하는 시설물(제6조)의 이용료·감면·환불기준을 수탁자가 정해 군수 승인을 받도록 하고 있다. [확인할 점] 회신 근거인 공유재산법 시행령 제21조의 현행 문언 확인 필요", how: "이용료와 감면기준은 군수가 결정하도록 하고 수탁자는 이를 징수하는 구조로 고치는 것을 검토한다."}
  - {oid: "2047466", art: "제6조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 법률에 따른 위반행위 신고포상금의 지급대상을 해당 지자체 주민으로 한정함", level: "정비 권고", ctx: "포상금 지급대상자는 대구광역시에 주소를 둔 자로 하며, 신고접수 및 포상금 지급건수는 신고자별로 월 10건 이내, 지급금액은 예산의 범위 안에서 1인당 연간 30만원을 초과하여 지급하지 아니한다. [단서신설 2005.4.11]<개정 2009.4.10, 2014.7.30>", basis: "법제처 자치법규 의견제시(의견14-0124) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견14-0124", "org": "부산광역시", "date": "2014-06-23", "seq": "", "concl": "포상금 지급대상을 부산광역시민으로 한정하는 것은 어려울 것으로 보임"}], why: "쓰레기 무단투기 신고포상금의 지급대상자를 \"대구광역시에 주소를 둔 자\"로 한정하고 있다. [확인할 점] 회신은 「화물자동차 운수사업법」 신고포상금 사안이라 근거 법률이 다름", how: "근거 법률(「폐기물관리법」 제61조)이 신고한 자를 지급대상으로 정한 취지에 맞춰 주소 요건을 삭제하는 것을 검토한다."}
  - {oid: "2231930", art: "제4조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 생활폐기물 수집·운반 대행 평가 우수업체에 계약기간 연장 등 우대를 주도록 조례에 정함", level: "위반 소지", ctx: "③ 대행업체와의 계약기간은 3년을 원칙으로 하되, 「대구광역시 군위군 생활폐기물 수집ㆍ운반 대행업체 평가 조례」에 의한 평가결과 우수업체에 대한 계약연장은 업체당 연속 1회에 한한다. <개정 2024. 3. 29.> ④ 제1항에 따른 대행업자는 법령 및 조례 등 관계법규에서 정한 규정과 군수의 폐기물처리에 관한 조치를 지켜야 한다. <개정 2023. 12.", basis: "법제처 자치법규 의견제시(의견14-0190) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견14-0190", "org": "전라북도 전주시", "date": "2014-09-23", "seq": "", "concl": "평가우수업체 수의계약·계약기간 연장 등 우대조치 규정은 지방계약법 제9조제1항에 위반될 소지"}], why: "대행계약 기간을 3년으로 하면서 평가결과 우수업체에 대한 계약연장을 연속 1회 허용해 평가 결과를 근거로 경쟁입찰 없이 계약을 이어가는 구조다. [확인할 점] 같은 조 제2항 제4호(\"군수가 필요하다고 인정하는 경우\" 수의계약)도 함께 확인. 2014년 뒤 「폐기물관리법」 대행계약 평가 규정 개정 확인 필요", how: "우수업체 우대는 포상이나 입찰 가점으로 하고 계약연장 조항은 삭제하는 방안을 검토한다."}
  - {oid: "2226111", art: "제6조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 감면·지원 신청 때 행정정보 공동이용 동의서 제출을 조례로 의무화(동의하지 않을 때 서류 직접 제출 대안 없음)", level: "위반 소지", ctx: "피해지원금을 받으려는 사람은 화재가 진화된 날부터 30일 이내에 별지 제1호서식의 주택화재 피해 지원 신청서와 행정정보 공동이용 동의서 및 개인정보 수집·이용동의서를 작성하고 증명서류를 첨부하여 관할 읍ㆍ면장에게 지원을 신청하여야 한다.", basis: "법제처 자치법규 의견제시(의견16-0060) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견16-0060", "org": "경기도 양주시", "date": "2016-04-01", "seq": "", "concl": "‘행정정보공동이용 동의서’를 제출하도록 하는 조례안은 법률의 위임없이 주민에게 의무를 부과하는 내용으로 「지방자치법」제22조 단서에 위배될 소지"}], why: "지원 신청 요건으로 행정정보 공동이용 동의서 작성을 일률적으로 요구하고, 동의하지 않는 경우 서류를 직접 내는 길을 두지 않아 회신이 문제 삼은 '동의서 제출 의무'와 같은 구조임. [확인할 점] 같은 시 교통약자 이동편의 시행규칙 제3조제4항은 '동의하지 않은 경우 서류 제출' 단서를 두고 있어 대조 참고.", how: "동의서는 신청인이 동의하는 경우에만 받고, 동의하지 않으면 해당 서류를 직접 제출하게 하는 단서(「전자정부법」 제36조제2항 취지)를 두는 방향으로 검토."}
  - {oid: "2048319", art: "제10조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 자연휴양림 조례·규칙에 감염병환자 등의 입장 거절·퇴장 명령을 규정(법률은 입장료 등 징수기준만 조례에 위임)", level: "위반 소지", ctx: "군수는 다음 각 호의 어느 하나에 해당하는 사람에게 자연휴양림 시설사용 및 입장을 제한하거나 퇴장을 명할 수 있다. 1. 「감염병의 예방 및 관리에 관한 법률」 제2조제13호에 따른 감염병환자 2. 공공질서나 미풍양속을 해칠 우려가 있는 사람 … 4. 애완동물과 함께 입장하는 사람.", basis: "법제처 자치법규 의견제시(의견15-0321) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견15-0321", "org": "경기도", "date": "2015-12-04", "seq": "", "concl": "입장 제한에 관한 사항을 규정하고 있는 것으로 보이는바, 이는 상위법령의 위임범위를 벗어난 것으로 위법의 소지가 있으므로 삭제하는 것이 바람직"}], why: "「산림문화ㆍ휴양에 관한 법률」 제21조의5제2항은 지방자치단체 조성 휴양림의 입장료·시설사용료 징수기준만 조례로 정하게 하는데, 이 조문은 감염병환자·반려동물 동반자 등의 입장 제한·퇴장 명령을 정해 회신이 문제 삼은 입장 제한 규정과 같음. [확인할 점] 휴양림을 공공시설로 보아 관리권 범위의 이용 제한으로 볼 여지가 있어, 현행 법률·시행령의 이용 제한 근거를 함께 확인할 것.", how: "법률 제21조의6(금지행위)에 근거가 있는 호(불 피우기·채취 등)는 법률 인용으로 정리하고, 근거가 없는 입장 제한 호(감염병환자·반려동물 등)는 삭제하거나 이용 안내 수준으로 바꾸는 방향으로 검토."}
  - {oid: "2231977", art: "제10조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 자연휴양림 조례·규칙에 감염병환자 등의 입장 거절·퇴장 명령을 규정(법률은 입장료 등 징수기준만 조례에 위임)", level: "위반 소지", ctx: "군수는 다음 각 호의 어느 하나에 해당하는 사람에게 자연휴양림 입장을 제한하거나 퇴장을 명할 수 있다. 1.「감염병의 예방 및 관리에 관한 법률」 제2조제13호에 따른 감염병환자 … 7. 그 밖에 군수가 자연휴양림 이용을 제한할 필요가 있다고 인정하는 사람", basis: "법제처 자치법규 의견제시(의견15-0321) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견15-0321", "org": "경기도", "date": "2015-12-04", "seq": "", "concl": "입장 제한에 관한 사항을 규정하고 있는 것으로 보이는바, 이는 상위법령의 위임범위를 벗어난 것으로 위법의 소지가 있으므로 삭제하는 것이 바람직"}], why: "「산림문화ㆍ휴양에 관한 법률」 제21조의5제2항은 지방자치단체 조성 휴양림의 입장료·시설사용료 징수기준만 조례로 정하게 하는데, 이 조문은 감염병환자·반려동물 동반자 등의 입장 제한·퇴장 명령을 정해 회신이 문제 삼은 입장 제한 규정과 같음. [확인할 점] 휴양림을 공공시설로 보아 관리권 범위의 이용 제한으로 볼 여지가 있어, 현행 법률·시행령의 이용 제한 근거를 함께 확인할 것.", how: "법률 제21조의6(금지행위)에 근거가 있는 호(불 피우기·채취 등)는 법률 인용으로 정리하고, 근거가 없는 입장 제한 호(감염병환자·반려동물 등)는 삭제하거나 이용 안내 수준으로 바꾸는 방향으로 검토."}
  - {oid: "2261246", art: "제6조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 법률상 우선구매 대상 생산품 가운데 관내 소재 시설 생산품을 우선구매하도록 조례로 정함(지역 한정)", level: "위반 소지", ctx: "① 군수는 법 제22조의4에 따라 군에 소재하는 장애인 표준사업장의 생산품을 우선구매 하여야 한다. … ② 군수는 제2조제2호나목에 해당하는 기관이 법 제22조의4에 따라 군에 소재하는 장애인 표준사업장의 생산품을 우선구매하도록 적극적으로 노력하여야 한다.", basis: "법제처 자치법규 의견제시(의견16-0099) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견16-0099", "org": "서울특별시", "date": "2016-04-27", "seq": "", "concl": "관내 중증장애인생산품 생산시설에서 생산한 생산품을 우선구매하는 것을 원칙으로 한다고 규정하는 것은 상위법령에 위배되는 것으로 가능하지 않은 것"}], why: "「장애인고용촉진 및 직업재활법」 제22조의4는 소재지 구분 없이 장애인 표준사업장 생산품의 우선구매를 정하는데, 조례가 이를 '군에 소재하는' 사업장으로 한정해 의무로 정하고 있어 회신이 위배로 본 관내 한정 우선구매 원칙과 같은 구조임. [확인할 점] 회신은 「중증장애인생산품 우선구매 특별법」 사안이고 이 조례는 「장애인고용촉진 및 직업재활법」 제22조의4 사안이라 근거 법률이 다름. 제2항(노력 규정)은 회신상 '신중' 대상.", how: "우선구매 대상을 법률과 같이 장애인 표준사업장 생산품 전체로 두고, 관내 사업장은 판로 홍보·지원 등 별도 시책으로 정하는 방향으로 검토."}
  - {oid: "2232013", art: "제9조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 사회복지시설(재가노인지원센터) 위탁계약기간을 「사회복지사업법 시행규칙」(5년)과 다르게 조례로 정함", level: "위반 소지", ctx: "① 제4조 단서에 따라 센터의 사무를 위탁하는 경우 위탁기간은 3년으로 한다. 다만, 군수가 필요하다고 인정하는 경우 그 기간을 연장할 수 있다.", basis: "법제처 자치법규 의견제시(의견16-0164) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견16-0164", "org": "인천광역시 계양구", "date": "2016-06-22", "seq": "", "concl": "재가노인지원센터 운영의 위탁계약기간을 3년으로 규정하는 것은 「사회복지사업법 시행규칙」 제21조의2제2항에 위배될 소지"}], why: "회신 사안과 같은 재가노인지원센터의 위탁기간을 3년으로 정하고, 갱신도 선정위원회 심의 없이 군수 인정으로 연장하게 해 시행규칙 제21조의2제2항(5년, 선정위원회 심의 거쳐 갱신)과 다름.", how: "위탁계약기간을 5년으로 하고 갱신은 「사회복지사업법 시행규칙」 제21조의2제2항에 따라 수탁자선정위원회 심의를 거치도록 맞추거나 시행규칙을 따른다고 정하는 방향으로 검토."}
  - {oid: "2163688", art: "제3조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — LPG 충전사업 허가기준 조례에서 보호시설까지 안전거리 등 시설·기술기준을 시행규칙보다 강화", level: "위반 소지", ctx: "3. 액화석유가스 충전시설 중 저장설비·충전설비 및 자동차에 고정된 탱크 이입·충전장소는 그 외면으로부터 보호시설까지의 액화석유가스 충전사업자가 유지하여야 하는 안전거리는「액화석유가스의 안전관리 및 사업법 시행규칙」별표4 제1호가목1)가)에서 정한 거리의 2배로 한다.", basis: "법제처 자치법규 의견제시(의견15-0252) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견15-0252", "org": "강원도 원주시", "date": "2015-09-25", "seq": "", "concl": "보호시설까지의 거리를 법령에서 정한 기준보다 강화하는 등 … 강화된 기준을 두는 것은 같은 법 시행규칙 … 별표 4에 위반될 소지"}], why: "시행규칙 별표 4가 정한 보호시설 안전거리를 조례로 2배로 늘려, 회신이 위반 소지로 본 '안전거리 강화' 유형과 같음. [확인할 점] 회신 당시 근거는 법 제6조제2항, 현행은 제6조제3항(제1항제1호부터 제3호까지 요건의 세부사항 위임). 위임 범위에 안전거리가 포함되는지 운영자 확인 필요.", how: "시설·기술기준(안전거리)은 시행규칙 별표 4에 따르도록 하고, 조례에는 법 제6조제3항이 위임한 허가요건(설치 금지 지역 등)의 세부사항만 두는 방향으로 검토."}
  - {oid: "2141806", art: "제6조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 자치법규 입법예고 기간(20일 이상)을 단체장이 '특히 필요하다고 인정하는 경우' 줄일 수 있게 하는 포괄 단서", level: "정비 권고", ctx: "입법예고는 20일 이상 하여야 한다. 다만, 시장이 특히 필요하다고 인정하는 경우에는 그러하지 아니하다.", basis: "법제처 자치법규 의견제시(의견16-0152) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견16-0152", "org": "경상남도", "date": "2016-07-29", "seq": "", "concl": "“도지사가 특히 필요하다고 인정하는 경우”에 입법예고 기간을 20일 미만으로 단축할 수 있도록 규정하는 것은 바람직하지 않고"}], why: "회신이 바람직하지 않다고 본 '단체장이 특히 필요하다고 인정하는 경우' 예외 문구를 예고기간 단서로 그대로 두고 있음. [확인할 점] 같은 조례 제3조제2항에 생략·단축 사유가 열거돼 있으면 제6조 단서와의 관계를 함께 정리.", how: "「행정절차법」 제43조의 '특별한 사정'에 맞추어 단축할 수 있는 사유를 구체적으로 열거하는 방식으로 고치는 방향으로 검토."}
  - {oid: "2049169", art: "제7조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 자치법규 입법예고 기간(20일 이상)을 단체장이 '특히 필요하다고 인정하는 경우' 줄일 수 있게 하는 포괄 단서", level: "정비 권고", ctx: "입법예고 기간은 예고할 때 정하되, 20일 이상 하여야 한다. 다만, 구청장이 특히 필요하다고 인정하는 경우에는 그러하지 아니하다.", basis: "법제처 자치법규 의견제시(의견16-0152) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견16-0152", "org": "경상남도", "date": "2016-07-29", "seq": "", "concl": "“도지사가 특히 필요하다고 인정하는 경우”에 입법예고 기간을 20일 미만으로 단축할 수 있도록 규정하는 것은 바람직하지 않고"}], why: "회신이 바람직하지 않다고 본 '단체장이 특히 필요하다고 인정하는 경우' 예외 문구를 예고기간 단서로 그대로 두고 있음.", how: "「행정절차법」 제43조의 '특별한 사정'에 맞추어 단축할 수 있는 사유를 구체적으로 열거하는 방식으로 고치는 방향으로 검토."}
  - {oid: "2171188", art: "제5조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 법률이 보건복지부장관에게 맡긴 발달장애인·가족 실태조사를 같은 내용으로 지방자치단체장이 실시하도록 조례에 규정", level: "위반 소지", ctx: "④ 구청장은 발달장애인의 실태파악과 복지정책 수립을 위한 기초자료로 활용하기 위하여 3년마다 발달장애인과 그 가족에 대한 실태조사를 실시하여야 한다.", basis: "법제처 자치법규 의견제시(의견16-0005) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견16-0005", "org": "경기도", "date": "2016-01-21", "seq": "", "concl": "발달장애인법 제6조 및 「행정조사기본법」 제4조제3항에 위배되는 것으로 보이므로 … 조례에 규정하는 것은 바람직하지 않습니다"}], why: "법 제6조의 실태조사(목적·주기·대상)와 같은 문언의 실태조사를 구청장 의무로 정해, 회신이 유사·동일한 조사로 본 유형과 같음. [확인할 점] 현행 「발달장애인 권리보장 및 지원에 관한 법률」 제6조가 지방자치단체 실태조사를 허용하도록 바뀌었는지 확인 필요.", how: "법률상 실태조사와 겹치지 않도록 조례 조사의 범위·방법을 구 시책 자료 수집 수준으로 좁히거나, 국가 실태조사 결과를 활용하도록 고치는 방향으로 검토."}
  - {oid: "2231742", art: "제5조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 구청장(군수)이 위탁 운영하는 공립어린이집 보육교직원을 운영상 필요에 따라 다른 어린이집으로 근무하게(전보) 할 수 있게 …", level: "위반 소지", ctx: "② 그 밖의 직원은 국공립어린이집 원장 또는 수탁기관이 임면하되, 임면사항을 14일 이내에 군수에게 보고하여야 한다. ③ 군수는 국공립어린이집의 운영상 필요하다고 인정하는 경우에는 국공립어린이집 원장을 제외한 직원을 전보할 수 있다. 다만 위탁운영의 경우에는 수탁자 또는 국공립어린이집 원장의 제청으로 직원을 전보할 수 있다.", basis: "법제처 자치법규 의견제시(의견17-0176) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견17-0176", "org": "대구광역시 동구", "date": "2017-08-04", "seq": "", "concl": "위탁 어린이집 원장·보육교직원을 다른 수탁자 어린이집에 근무하게 할 수 있다고 규정하는 것은 「지방자치법」 제22조 단서에 위반되는 것으로 보임"}], why: "직원 임면권자를 원장·수탁기관으로 두면서 군수가 위탁 어린이집 직원까지 전보할 수 있게 해, 법률 근거 없이 수탁자와 보육교직원의 근로관계에 개입하는 구조가 동구 사례와 같다. [확인할 점] 위탁운영은 수탁자·원장의 제청을 요건으로 두어 동구 사례안보다 개입 정도가 약함; 직영 어린이집 직원(군이 임면)에 대한 전보는 쟁점이 다름", how: "위탁 어린이집 보육교직원의 근무지 변경은 임면권자(수탁기관)와 근로계약에 맡기고, 군수의 전보 권한은 군이 직접 임면하는 직원으로 한정하는 방향으로 정비를 검토"}
  - {oid: "2180253", art: "제2조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 법률 위임 없는 조례에서 '청년'을 정의하면서 연령을 정해 두고도 조례에 따른 개별 사업에서 달리 정하면 그에 따르도록 해…", level: "정비 권고", ctx: "1. “청년”이란 「청년고용촉진 특별법」제2조제1호에 따른 사람을 말한다. 다만, 이 조례 제6조에 따라 추진하거나 지원되는 각 호 사업에서 달리 정한 경우에는 그에 따른다.", basis: "법제처 자치법규 의견제시(의견17-0253) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견17-0253", "org": "경상남도 김해시", "date": "2017-09-27", "seq": "", "concl": "청년의 나이를 명확하게 규정하지 않고 개별사업 및 활동의 성격에 따라 달리 적용할 수 있다고 규정하는 것은 바람직하지 않은 것으로 보임"}], why: "김해시 조례안과 같이 「청년고용촉진 특별법」 연령을 원칙으로 하되 개별 사업에서 달리 정하면 그에 따르게 해 정의 규정의 연령이 사업별로 바뀔 수 있다. [확인할 점] '다른 법령·조례에서 연령을 달리 정한 경우 그에 따른다'는 단서(청년기본법 제3조와 같은 방식)는 이 쟁점에서 제외함", how: "사업별로 연령을 달리할 필요가 있으면 조례에 그 사업과 연령 범위를 직접 적거나, 다른 법령·조례에서 정한 연령을 따르는 방식으로 한정하는 정비를 검토"}
  - {oid: "2232028", art: "제2조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 법률 위임 없는 조례에서 '청년'을 정의하면서 연령을 정해 두고도 조례에 따른 개별 사업에서 달리 정하면 그에 따르도록 해…", level: "정비 권고", ctx: "1. “청년”이란「청년고용촉진 특별법」제2조제1호에 따른 사람을 말한다. 다만, 이 조례 제6조에 따라 추진하거나 지원되는 각 호 사업에서 달리 정한 경우에는 그에 따른다.", basis: "법제처 자치법규 의견제시(의견17-0253) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견17-0253", "org": "경상남도 김해시", "date": "2017-09-27", "seq": "", "concl": "청년의 나이를 명확하게 규정하지 않고 개별사업 및 활동의 성격에 따라 달리 적용할 수 있다고 규정하는 것은 바람직하지 않은 것으로 보임"}], why: "김해시 조례안과 같이 법률 연령을 원칙으로 하되 개별 사업에서 달리 정하면 그에 따르게 해 연령이 사업별로 바뀔 수 있다. [확인할 점] '다른 법령·조례에서 연령을 달리 정한 경우 그에 따른다'는 단서(청년기본법 제3조와 같은 방식)는 이 쟁점에서 제외함", how: "사업별로 연령을 달리할 필요가 있으면 조례에 그 사업과 연령 범위를 직접 적거나, 다른 법령·조례에서 정한 연령을 따르는 방식으로 한정하는 정비를 검토"}
  - {oid: "2222812", art: "제2조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 법률 위임 없는 조례에서 '청년'을 정의하면서 연령을 정해 두고도 조례에 따른 개별 사업에서 달리 정하면 그에 따르도록 해…", level: "정비 권고", ctx: "1. “청년”이란 대구광역시 달성군(이하 “군”이라 한다)에 주소를 둔 19세 이상 39세 이하인 사람을 말한다. 다만, 제4조에 따라 수행하는 각 호 사업에서 달리 정한 경우에는 그에 따른다.", basis: "법제처 자치법규 의견제시(의견17-0253) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견17-0253", "org": "경상남도 김해시", "date": "2017-09-27", "seq": "", "concl": "청년의 나이를 명확하게 규정하지 않고 개별사업 및 활동의 성격에 따라 달리 적용할 수 있다고 규정하는 것은 바람직하지 않은 것으로 보임"}], why: "정의에서 연령을 정하고도 센터가 수행하는 개별 사업에서 달리 정하면 그에 따르게 해 연령 기준이 사업별로 바뀔 수 있다. [확인할 점] '다른 법령·조례에서 연령을 달리 정한 경우 그에 따른다'는 단서(청년기본법 제3조와 같은 방식)는 이 쟁점에서 제외함", how: "사업별로 연령을 달리할 필요가 있으면 조례에 그 사업과 연령 범위를 직접 적거나, 다른 법령·조례에서 정한 연령을 따르는 방식으로 한정하는 정비를 검토"}
  - {oid: "2255372", art: "제4조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 공공시설 조례의 시행규칙에서 정치 목적 행사 등을 이유로 시설 사용허가(대관)를 제한하는 사유를 새로 정하는 규정", level: "정비 권고", ctx: "구청장은 사용자가 다음 각 호의 어느 하나에 해당하는 경우에는 사용허가를 아니할 수 있다. 1. 정치적인 행위를 목적으로 하는 경우 2. 종교활동을 목적으로 하는 경우 3. 영리를 목적으로 하는 경우", basis: "법제처 자치법규 의견제시(의견17-0067) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견17-0067", "org": "서울특별시 서초구", "date": "2017-04-06", "seq": "", "concl": "정치단체 관련 집회·행사 대관 제한은 조례로 정할 수 있는 사항이나 입법형식은 규칙이 아닌 조례로 규정하는 것이 바람직함"}], why: "모조례(제8조)는 '공공목적에 위배되지 않는 범위'에서 허가한다고만 두고, 정치 목적 등 구체적 사용 제한 사유는 규칙이 정하고 있어 서초구 사례와 같은 입법형식 문제가 있다. [확인할 점] 법제처는 제한 내용 자체는 조례 사항으로 가능하다고 보았고, 형평성 문제는 서초구안의 단서 부분에 관한 것임", how: "사용허가 제한 사유를 모조례에 직접 규정하고 규칙에는 절차 등 세부사항만 두는 방향으로 정비를 검토"}
  - {oid: "2231813", art: "제3조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 지방자치단체가 특정인이 납부할 취득세 상당액을 예산으로 직접 지원해 사실상 취득세 감면과 같은 결과를 내는 규정", level: "정비 권고", ctx: "① 조례 제9조에 따른 사업 자금의 지원은 다음 각 호와 같다. … 2. 농지 구입에 따른 세금 납부 지원 가. 대상세목 : 취득세(농특세 포함), 등록세(교육세 포함) 나. 지원금액 : 가구당 200만원 한도", basis: "법제처 자치법규 의견제시(의견17-0256) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견17-0256", "org": "충청북도 청주시", "date": "2017-10-19", "seq": "", "concl": "취득세를 직접 지원하는 것은 감면과 동일한 결과로 지방세특례제한법 등 감면 법령 적용을 회피하게 할 우려가 있어 입안에 신중을 기하기 바람"}], why: "귀농인이 농지 취득으로 납부할 취득세 등을 가구당 한도 안에서 예산으로 지원해, 청주시 사례가 우려한 '취득세 직접 지원에 따른 감면과 같은 결과'에 해당할 수 있다. [확인할 점] 취득세는 광역시세이고 지원 재원은 군 예산이라 청주시 사례(시가 자기 세목을 지원)와 세목 귀속이 다름; 모조례 제9조는 '보조 또는 융자 지원'으로만 규정", how: "취득세 상당액 지원 대신 귀농 정착 지원금 등 세목과 무관한 지원 방식으로 바꾸거나, 감면이 필요하면 지방세 감면 법령 체계에 따르는 방향으로 정비를 검토"}
  - {oid: "2177941", art: "제5조", key: "opin_other_org", name: "법제처가 다른 지자체에 회신한 쟁점 — 사회재난 원인제공자에게 지자체가 부담한 지원금액 '전부'를 청구하도록 의무화하는 조문", level: "정비 권고", ctx: "구청장은 사회재난으로 피해를 유발한 원인자(이하 “원인제공자”라 한다)에게 제4조제1항 각 호의 지원을 위하여 부담한 지원금액 등 비용 전부를 청구한다. <신설 2018.12.31.>", basis: "법제처 자치법규 의견제시(의견19-0180) — 다른 지방자치단체 질의에 대한 회신과 같은 쟁점", prec: [{"case": "의견19-0180", "org": "경상남도 거창군", "date": "2019-06-20", "seq": "", "concl": "이 사안의 경우 질의 내용을 조례에 규정하는 것은 바람직하지 않은 것으로 보입니다."}], why: "거창군 개정안 문언('원인제공자에게…부담한 지원금액 전부를 청구한다')과 같은 내용으로 지원금 전부 청구를 의무로 정하고 있다. [확인할 점] 자료에는 회신 이유 앞부분이 없어 결론만 확인됨. 재난안전법의 구상 조문 개정 여부를 함께 확인할 것.", how: "청구 범위·재량을 정한 상위법령(재난안전법 구상 규정 등)에 맞추어 '전부 또는 일부를 청구할 수 있다' 등으로 고치는 방안을 검토한다."}
