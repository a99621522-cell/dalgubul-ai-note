# 자치법규 정비 검토 신호 — scripts/ordin/signals.py 가 판정하고 화면이 설명을 읽는다.
# conf: auto = 기계적으로 확인되는 사실(폐지·이름·번호·기간) / check = 사람이 원문을 읽어 확인해야 하는 것
# show: 표본 검증(docs/ordinance/eval.md) 정밀도 80% 이상만 true. 판정이 아니라 '정비 검토 후보'다.
signals:
  law_renamed:
    name: 인용 법령 이름 바뀜
    conf: auto
    show: true
    rule: 조례가 겹낫표로 인용한 법령 이름이 현행 법령 목록에 없고, 법령 연혁에서 같은 법령(법령ID)의 옛 이름으로 확인됨
    how: 현행 법령 이름으로 고칠지, 인용 조문 번호도 그대로인지 확인
  law_not_current:
    name: 인용 법령 현행 목록에 없음
    conf: auto
    show: true
    rule: 인용한 법령 이름이 현행 법령 목록에 없고 법령 연혁 목록에만 있음(폐지·통합 등). 이어지는 법령은 연혁 표로 확인
    how: 법령 연혁에서 폐지·대체 법령을 확인하고 근거 조항을 바꿀지 검토
  name_unmatched:
    name: 인용 법령 이름 대조 안 됨
    conf: check
    show: false
    rule: 인용 이름이 현행·연혁 어디에도 그대로 없음(띄어쓰기·약칭·오기 가능). 비슷한 현행 법령 후보를 함께 보임
    how: 원문 표기와 후보를 비교
  article_missing:
    name: 인용 조문 없음
    conf: auto
    show: true
    rule: 현행 법령에 인용한 조(제n조, 제n조의m)가 없음
    how: 조문 이동·삭제 여부를 법령 연혁·신구조문에서 확인
  article_deleted:
    name: 인용 조문 삭제됨
    conf: auto
    show: true
    rule: 현행 법령의 인용 조문 내용이 '삭제'
    how: 삭제 사유와 옮겨 간 조문을 확인
  article_renumber:
    name: 근거 조문 번호 바뀜(전부개정·이동)
    conf: auto
    show: true
    rule: 인용 조문의 변경 이력에 전부개정·전문개정·조문이동이 있고 그 날짜가 자치법규 최종 공포일보다 늦으며, 자치법규 공포 당시 판의 같은 번호 조문 제목과 지금 제목이 다름(당시 판을 받지 못한 것은 넣지 않음)
    how: 당시 조문이 지금 몇 조로 옮겼는지 신구조문에서 확인해 인용 번호를 고칠지 검토
  article_changed:
    name: 근거 조문 개정 뒤 미개정
    conf: check
    show: false
    rule: 인용 조문의 마지막 변경일이 자치법규 최종 공포일보다 늦음(일부개정·타법개정). 개정됐다는 사실만으로 정비 대상은 아니다
    how: 조문 변경 내용(신구조문)이 위임 범위·기준에 닿는지 확인
  local_ref_missing:
    name: 인용 자치법규 현행 목록에 없음
    conf: check
    show: true
    rule: 인용한 대구 자치법규 이름이 대구시·9개 구군 현행 목록에 없고 전국 검색에서도 그대로 나오지 않음
    how: 이름이 바뀌었거나 폐지됐는지 자치법규 연혁 확인
  admrul_missing:
    name: 인용 행정규칙 대조 안 됨
    conf: check
    show: false
    rule: 고시·훈령·지침 등 인용 이름이 현행 행정규칙 목록에 그대로 없음
    how: 행정규칙 이름 변경·폐지 확인
  ministry_outdated:
    name: 옛 중앙행정기관 이름
    conf: auto
    show: true
    rule: 본문(부칙 제외)에 현행 「정부조직법」에 없는 옛 기관 이름이 있음
    how: 현행 기관 이름으로 고칠지 확인(문맥상 연혁 서술이면 그대로 둠)
  term_outdated:
    name: 법령에서 바뀐 용어
    conf: check
    show: false
    rule: 본문(부칙 제외)에 법률로 바뀐 옛 용어가 있음(config/ordinance_terms.yml)
    how: 문맥을 보고 새 용어로 고칠지 확인
  sunset:
    name: 유효기간 지남
    conf: auto
    show: true
    rule: 본문·부칙의 'YYYY년 M월 D일까지 효력을 가진다/유효하다'가 오늘보다 앞섬
    how: 연장·폐지 여부 확인
  gunwi_gb:
    name: 군위군 편입 전 표기
    conf: check
    show: false
    rule: 군위군 자치법규 본문(부칙 제외)에 경상북도·도지사·경북 표기가 남아 있음(2023-07-01 대구 편입)
    how: 대구광역시·시장 등으로 고칠 대상인지 문맥 확인
  penalty_basis:
    name: 과태료 조항 근거 인용 없음
    conf: check
    show: false
    rule: 과태료를 정한 조문에 법률 인용이 없음(지방자치법 제28조 단서·제34조 확인 대상)
    how: 법률 위임 근거를 확인
  expc_daegu:
    name: 같은 지자체가 법제처에 질의한 조문
    conf: check
    show: true
    rule: 이 자치법규가 인용한 법령 조문에 대해 같은 지자체(대구시·구군)가 법제처에 질의해 회답을 받은 해석례가 있음(법령이 전부개정된 경계를 넘는 짝은 잇지 않음). 회답일이 자치법규 최종 공포일보다 늦으면 '회답 뒤 개정 없음'
    how: 회답 내용이 자치법규 조문에 반영됐는지 확인
  expc_related:
    name: 같은 조문에 대한 법제처 해석례
    conf: check
    show: false
    rule: 이 자치법규가 인용한 법령 조문을 다룬 법제처 해석례(조례·자치법규에 관한 것)가 있음 — 다른 지자체·부처 질의 포함
    how: 회답이 이 조문의 위임 범위·기준에 닿는지 확인
  opin_daegu:
    name: 이 자치법규에 대한 법제처 의견제시
    conf: check
    show: true
    rule: 같은 지자체가 이 자치법규(같은 이름, 지자체 이름 뗀 비교)에 대해 법제처에 자치법규 의견제시를 요청해 회신받은 사례가 있음(법제처 누리집 의견제시 사례). 회신일이 최종 공포일보다 늦으면 '회신 뒤 개정 없음'
    how: 회신 의견이 조문에 반영됐는지 확인
  opin_same:
    name: 같은 이름 조례에 대한 법제처 의견제시
    conf: check
    show: true
    rule: 다른 지자체의 같은 이름 자치법규(지자체 이름을 뗀 이름이 같음)에 대해 법제처 의견제시 사례가 있음
    how: 같은 쟁점이 이 자치법규 조문에도 있는지 의견제시 이유와 대조
  opin_article:
    name: 같은 조문 쟁점의 법제처 의견제시
    conf: check
    show: false
    rule: 이 자치법규가 인용한 법령 조문이 의견제시 사례의 쟁점 조문(안건명·질의요지에 인용된 조문)과 같음(법령 전부개정 경계를 넘는 짝은 잇지 않음)
    how: 의견제시 이유가 이 조문의 위임 범위·용어에 닿는지 확인
  opin_conflict:
    name: 법제처가 같은 이름 조례에 '정할 수 없다' 취지로 회신
    conf: check
    show: true
    rule: 이 자치법규(또는 다른 지자체의 같은 이름 자치법규)에 대한 법제처 의견제시 결론에 '조례로 정할 수 없다'·'위임 범위를 벗어난다'·'상위법령에 위배' 같은 표현이 있음
    how: 같은 규정이 이 자치법규에 있는지 찾아 있으면 의견 취지대로 고치거나 삭제
  penal_clause:
    name: 조례에 형벌(징역·벌금) 규정
    conf: check
    show: true
    rule: 본문 조문에 '○년 이하의 징역'·'○원 이하의 벌금'·'징역(벌금)에 처한다'가 있음 — 지방자치법 제28조제1항 단서(벌칙은 법률 위임 필요)·제34조(조례 위반은 과태료)
    how: 법률 위임 조문을 확인하고, 없으면 삭제하거나 과태료로 바꿀지 검토
  fine_over_cap:
    name: 조례 과태료 1천만원 초과
    conf: check
    show: true
    rule: 다른 법률 인용이 없는 조문의 '○원 이하의 과태료'가 1천만원을 넘음(지방자치법 제34조제1항)
    how: 개별 법률의 위임이 있는지 확인하고, 없으면 1천만원 이하로 고침
  rrn_collect:
    name: 법령 근거 없는 주민등록번호 처리
    conf: check
    show: false
    rule: 조문에 '주민등록번호'가 나옴(제외·뒷자리 생략 문구 제외) — 「개인정보 보호법」 제24조의2(법률·대통령령 등의 근거가 있을 때만 처리)
    how: 근거 법령이 있는지 확인하고 없으면 생년월일 등으로 바꾸거나 삭제
