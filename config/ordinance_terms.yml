# 자치법규 정비 검토 — 옛 용어·기관명(신호 term_outdated). scripts/ordin/signals.py 가 읽는다.
# 기관명(ministries): 현행 「정부조직법」 본문(러너가 받음)에 그 이름이 없으면 옛 이름으로 본다 — 바뀐 날짜를 여기 적지 않아도 된다.
#   `now` 는 화면에 '현행 정부조직법에서 찾을 이름' 참고로만 보인다. 부칙(경과 규정)에 나온 옛 이름은 세지 않는다.
# 용어(terms): 법률로 바뀐 용어. basis 는 바꾼 법령(국가법령정보센터에서 확인할 이름). 문맥 판단이 필요하므로 confidence check.
