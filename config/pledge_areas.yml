# 산업별 정책제안 리포트 — 분야 목록과 요일 배정. 루틴(docs/ROUTINE_PROMPT.md, Claude 루틴 "산업별 정책제안 리포트")과 scripts/report_context.py 가 읽는다.
#
# 분야 10개 모두 매주 1편씩(주 10편). 평일 5일에 2개 분야씩 배정(weekday_plan, ISO 요일 1=월 … 5=금).
#   6대 산업(미래모빌리티·자동차부품 / 로봇·피지컬AI / 반도체·소부장 / 전통제조 AX / 헬스케어·의료기기 / AI·SW·창업)
#   + 기존 주력 4개(기계 / 자동차 / 섬유 / 뿌리산업). 지난 회차 같은 분야 = 1주 전.
# 각 분야: pledges(공약 항목 원문) · industry_groups(config/industry_groups.yml 의 name) · ksic(선택: KSIC 접두어로 기업을 고른다, 그룹과 합집합) ·
#          keywords(사업 DB·글 필터) · tags / site_types(선택) · sub_counts(선택) · focus(리포트 관점 — 같은 기업군을 다른 분야와 나눠 볼 때 무엇을 볼지)
#
# 공약 출처: 민선 9기 대구광역시 공약의 '6대 산업'(운영자 지정) + 기계·자동차·섬유·뿌리산업을 따로 분리.
# 공약 항목 원문(pledges)과 source_url 은 공개 자료(공약 이행계획 등)로 채울 것. 비어 있으면 리포트에 "공약 항목 미입력"이라 적는다.

version: 2026-09-25
