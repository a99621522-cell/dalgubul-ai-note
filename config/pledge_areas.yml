# 공약 분야별 정책제안 리포트 — 순환 목록. 루틴(docs/ROUTINE_PROMPT.md)과 scripts/report_context.py 가 읽는다.
#
# 주 1회(매주 월요일 05:00), 이번 주 분야 = areas[(ISO 주 번호 - 1) mod 분야 수]. 9개 분야 → 9주에 한 바퀴.
# 각 분야: pledges(공약 항목 원문) · industry_groups(config/industry_groups.yml 의 name) · keywords(사업 DB·글 필터) ·
#          tags / site_types(선택: 산업 그룹 대신 또는 함께, 태그·입지 유형으로 기업을 고른다. 예: 창업)
#          sub_counts(선택: 분야 안에서 따로 셀 묶음. ksic 접두어 / keywords / tags / site_types)
#
# 공약 출처: 민선 9기 대구광역시 공약의 '6대 산업'(운영자 지정) + 섬유산업·기계·뿌리산업·AI·창업을 따로 분리.
# 공약 항목 원문(pledges)과 source_url 은 공개 자료(공약 이행계획 등)로 채울 것. 비어 있으면 리포트에 "공약 항목 미입력"이라 적는다.

