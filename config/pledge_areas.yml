# 주 1회(매주 월요일 05:00), 이번 주 분야 = areas[(ISO 주 번호 - 1) mod 분야 수].
# 각 분야에 공약 항목(pledges)·연결 산업 그룹(industry_groups, config/industry_groups.yml 의 name)·
# 사업 DB와 글을 거를 키워드(keywords)를 적는다. 산업 그룹이 없는 분야(교통·복지 등)는 기업 사전 숫자 대신 사업 DB·예산·공고 숫자만 쓴다.
#
# ※ 아래 areas 는 '자리'만 잡은 것이다. 어느 공약(대구시장·군수, 몇 대)인지와 분야 이름·공약 항목은 공개 자료(공약 이행계획 보도자료 등)로 채운다.
#    검색 요지로 확인된 민선 9기 대구시 관련 키워드(확인 필요): 신공항·취수원, 소상공인 보증, 대구형 교통패스, 도청후적지·서대구 역세권,
#    AI 전환, 청년 창업, 재난안전, 교통 인프라. 분야 구분은 원문 미확인.

