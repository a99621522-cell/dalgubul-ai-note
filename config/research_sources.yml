# 정책제안 리포트 근거 기관 목록 (scripts/fetch_research.py → data/research/). 홈페이지·발간물 목록 페이지·RSS 는 공개 주소만.
# rss: 알고 있는 RSS 주소(없으면 자동 발견) · list: 발간물 목록 페이지 · item_pattern: 목록에서 항목으로 볼 링크(주소+글자) 정규식(선택)
# 접속 실패·robots 차단은 summary.md 에 그대로 남긴다. 상업 사이트 약관상 수집 금지인 곳은 넣지 않는다.
