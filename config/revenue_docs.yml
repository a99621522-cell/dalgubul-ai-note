# 지자체 세입예산사업명세서 받기(운영자 지시 2026-10-27 '세입 자료부터 받아서 해') — scripts/fetch_revenue_docs.py
# 지방재정365 재정 데이터셋의 세입은 관(款) 합계뿐이라(data/lofin/revenue_settle.csv), 항·목·사업 단위는 지자체 누리집 재정공시의 세입예산사업명세서(e호조 출력 PDF)에서 받는다.
# 공개 예산서(공공누리)만. 사람 이름·전화 없음. kind: pdf(바로 받기) / daegu_jumin(세션·CSRF 토큰 뒤 POST) / discover(러너가 누리집에서 첨부 후보만 로그 — 이 세션에서 접속이 막힌 곳)
# 2026-10-27 조사: 대구시·북구·달성군·군위군은 이 세션에서 받힘, 중구·동구·서구·남구·수성구·달서구 누리집은 이 세션에서 연결 거부 → 러너(revenue_docs.yml)로.
year: 2026
govs:
  - { key: daegu,    code: "2700000", name: 대구광역시, kind: daegu_jumin, page: "https://jumin.daegu.go.kr/budget/information/informationBudgetBill.do",
      file: "2026_본예산_2_세입예산사업명세서_일반회계 전체.pdf", acct: 일반회계 }
