# 입지 유형 규칙 — 산단 안팎을 가리지 않고 모든 기업에 유형 하나를 붙인다.
# 읽는 코드: scripts/sites.py (Python), src/lib/sites.ts (Astro). 규칙은 이 파일에만 둔다.
#
# 판정 순서(위가 우선): 단지명(complex) 일치 → 주소 패턴 → 산단 여부 → 개별입지
# complex 축(산단별 통계)과는 별개다. 예: 성서지식산업센터 입주기업은 complex=성서산단, site_type=지식산업센터.
#
# tags 는 여러 개 붙을 수 있는 표식이며 scripts/data/company_tags.csv 와 산단 외 목록의 tags 열에서 온다.
#   창업기업: 설립(founded) 7년 이내 (창업지원법 기준) — founded 값이 있는 기업만 자동 판정
#   창경센터보육, 연구소기업, 벤처, 이노비즈 등: 외부 공개 목록에서

version: 2026-09-25

types:
  - key: alphacity
    name: 수성알파시티
    complexes: [대구경북경제자유구역수성의료지구]
    address: ["알파시티", "수성구 대흥동", "알파시티1로", "알파시티2로"]
  - key: rnd
    name: 연구개발특구
    complexes: [대구연구개발특구]
    address: []
  - key: kic
    name: 지식산업센터
    complexes: []
    address: ["지식산업센터"]
    buildings_file: scripts/data/kic_buildings.csv   # 건물 도로명주소 목록(구군 + 도로명 건물번호). 주소가 일치하면 건물명이 없어도 이 유형
  - key: complex
    name: 산업단지
    rule: in_complex        # complex 가 '개별입지'·빈칸이 아니면
  - key: standalone
    name: 개별입지
    rule: default

# 산단 외 기업의 '단지' 값. 팩토리온 밖에서 들어온 기업은 complex 를 이 값으로 둔다
outside_complex: 산단 외

# 태그 정의 (표시 이름·설명). 목록 파일의 tags 열은 여기 key 를 ; 로 이어 쓴다
tags:
  startup: { name: 창업기업, desc: 설립 7년 이내 }
  ccei: { name: 창경센터 보육, desc: 대구창조경제혁신센터 보육·졸업 기업 }
  labfirm: { name: 연구소기업, desc: 연구개발특구 연구소기업 }
  venture: { name: 벤처기업, desc: 벤처기업확인 공시 }
  kmedi: { name: 첨복단지 입주, desc: 대구경북첨단의료복합단지 입주기업(케이메디허브 공개 현황) }
  innobiz: { name: 이노비즈, desc: 기술혁신형 중소기업 확인 }
  star: { name: 대구 스타기업, desc: 대구광역시 스타기업 육성사업 선정(대구시 공개 현황) }
  prestar: { name: Pre-스타기업, desc: 대구광역시 Pre-스타기업 육성사업 선정(대구시 공개 현황) }
  k3030: { name: 3030기업, desc: 대구광역시 3030기업 육성사업 선정(대구시 공개 현황) }
startup_years: 7

# 특구별 분류(운영자 지시 2026-09-29: 첫 화면에 산단 안팎·특구별 기업 수). 특구 경계는 공개 도면이 없어
# 기업 사전의 단지(complex)·입지 유형(site_type)·태그로 근사한다 → 걸친 단지는 통째로 세므로 대부분 상한값.
# 한 기업이 여러 특구에 들 수 있어 특구 합계를 서로 더하지 않는다. 읽는 코드: src/lib/sites.ts zones()/zonesOf()
zones:
  - key: opportunity
    name: 기회발전특구
    designated: 2024-06
    areas: 수성알파시티, 대구국가산단(2단계), 금호워터폴리스
    match: { site_types: [수성알파시티], complexes: [대구국가산업단지, 대구금호워터폴리스일반산업단지] }
    note: 국가산단은 2단계만 특구인데 1단계 기업까지 셈
    source: https://www.newsis.com/view/NISX20240620_0002781168
  - key: rnd
    name: 연구개발특구
    designated: 2025-12(변경)
    areas: 테크노폴리스, 성서첨단산업(성서5차), 융합R&D(수성알파시티), 의료R&D(첨복단지), 지식서비스R&D
    match: { site_types: [수성알파시티, 연구개발특구], complexes: [대구테크노폴리스일반산업단지, 성서5차첨단산업단지, 대구경북첨단의료복합단지도시첨단산업단지], tags: [kmedi] }
    note: 경북대 일대(지식서비스R&D지구)는 산단이 아니라 세지 못함
    source: https://www.ajunews.com/view/20251208154549158
  - key: robot
    name: AI로봇 글로벌혁신특구
    designated: 2025-05
    areas: 테크노폴리스, 국가산단, 제3산단, 성서산단, 수성알파시티, 대구의료원
    match: { site_types: [수성알파시티], complexes: [대구테크노폴리스일반산업단지, 대구국가산업단지, 대구제3일반산업단지, 성서지방산업단지] }
    note: 성서산단 전체를 셈
    source: https://www.newspim.com/news/view/20260224000519
  - key: fez
    name: 경제자유구역(대구 지구)
    designated: 2008-05
    areas: 테크노폴리스, 국제패션디자인(이시아폴리스), 신서첨단의료, 수성의료(알파시티)
    match: { site_types: [수성알파시티], complexes: [대구테크노폴리스일반산업단지, 대구이시아폴리스일반산업단지, 대구경북첨단의료복합단지도시첨단산업단지], tags: [kmedi] }
    note: ""
    source: https://dgfez.go.kr/page.php?mnu_uid=1508
  - key: motor
    name: 모터 소부장 특화단지
    designated: 2023-07
    areas: 국가산단, 테크노폴리스, 달성1·2차, 성서산단 1~5차
    match: { complexes: [대구국가산업단지, 대구테크노폴리스일반산업단지, 달성일반산업단지, 달성2차일반산업단지, 성서지방산업단지, 성서5차첨단산업단지] }
    note: 네 단지 전체를 셈
    source: https://m.sentv.co.kr/article/view/sentv202309070074
  - key: kmedi
    name: 첨단의료복합단지
    designated: 2009-08
    areas: 신서혁신도시 첨복단지
    match: { complexes: [대구경북첨단의료복합단지도시첨단산업단지], tags: [kmedi] }
    note: 케이메디허브 공개 입주기업 포함
    source: https://www.kmedihub.re.kr/
  - key: urban
    name: 도심융합특구
    designated: 2024-11
    areas: 옛 경북도청 터, 경북대, 삼성창조캠퍼스
    match: {}
    note: 주소가 동 단위까지만 있어 특구 경계를 가릴 수 없음
    source: https://www.etnews.com/20241107000326
