    date: "2019-07-09"
    title: 공유재산인 지하도상가의 상가법인 관리비 수입과 임차인 전대료·임차권 양도 수입의 부가가치세 미신고 — 세무서 세원관리 통보 (감사원 특별점검)
    facts: "인천의 지하도상가(인천세무서·북인천세무서 관할 15곳)에서 상가법인은 관리비 수입에 대한 부가가치세를, 임차인은 점포 전대료와 임차권 양도·양수 수입에 대한 부가가치세·소득세를 관할 세무서에 신고·납부해야 하는데 일부 상가법인(5곳)과 임차인(전대료 수입의 59%, 양도·양수 수입의 100%)이 미신고. 부가가치세법 제57조(무신고 조사·결정)와 국세청 부가가치세사무처리규정을 판단기준으로 삼아 세원관리를 통보."
    amount: "—(비율만 공개)"
