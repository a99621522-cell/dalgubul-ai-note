    title: 위탁 관리하던 부설주차장을 수탁 조합이 제3자에게 전대하면서 전대료 부가가치세를 신고·납부하지 않은 것을 공단이 알지 못한 채 방치 (감사원 특정감사, 위탁사무 지도·감독 분야)
    facts: "부산시설공단이 ㄴ 부설주차장을 (사)△△조합에 위탁 관리하게 했는데 조합은 2012~2016년 주차장을 제3자에게 전대하고 전대료 수입(과세표준 계 390,000,000원, 세액 39,000,000원 — 2012년 11,000,000원 … 2016년 1,000,000원)에 대한 부가가치세를 신고·납부하지 않았고, 공단은 이를 알지 못한 채 두었다. 감사원은 행정안전부장관에게 민간위탁 협약 체결 때 공증 등 관리 방안을 통보."
