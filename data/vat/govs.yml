# 지자체별 특성(운영자 지시 2026-11-05 '대구시와 기초지자체는 선택할 수 있게 해 … 지자체별로 다르니 특성을 반영해').
# 행정 순서. level: 광역/기초. corp: 시설관리공단(나라장터 수요기관정보 data/vat/orgs/daegu_g2b.csv 에 있는 것만 번호를 적고, 없으면 '확인 필요').
# status: 완성(운영자 검증 끝) / 검증 중 / 준비 중. traits: 점검기가 진단·질문에 반영하는 특성 — 사실과 출처만, 평가 없음.
govs:
  - key: daegu
    name: 대구광역시
    level: 광역
    status: 준비 중
    corp:
      - { name: 대구공공시설관리공단(나라장터 수요기관 이름), bizno: "514-82-08507", src: 나라장터 수요기관정보, note: "사업처마다 번호가 따로 있음(달서천·달성·대기환경·동부·북부·상리·서부·성서·신천·환경자원·명복공원·복합혁신센터) — 사업처 수입이 시 세입이면 시가 신고하는지, 공단 자기 사업인지 협약서로 확인" }
      - { name: 환경시설공단(하수·위생 사업소 — 나라장터 이름 '대구광역시환경시설공단' 등), bizno: "", src: 나라장터 수요기관정보, note: "하수 처리 용역은 면세(부가가치세법 제26조 제1항 제2호·수돗물·하수) — 대행이면 조특법 제106조 제1항 제6호" }
    traits:
      - 사업장별 등록 — 시설·사업소마다 사업자등록번호가 따로 있는 경우가 많아, 신고서를 사업자등록번호별로 나눠 읽습니다.
      - 장사시설(명복공원)·공영주차장·체육시설·전시컨벤션 등 시설이 많아 과세·면세가 섞입니다 — 공단 사업처 단위로 귀속을 봅니다.
      - 하수·상수도 사용료는 면세, 대행사업비는 지방공단 대행 면제(조특법 제106조 제1항 제6호) 대상인지 봅니다.
  - { key: jung, name: 대구광역시 중구, level: 기초, status: 준비 중, corp: [], traits: [세입예산서는 세입총괄표(사업 줄 없음)만 공개돼 시설 후보가 적습니다 — 시설은 직접 넣거나 질문으로 정합니다.] }
  - { key: dong, name: 대구광역시 동구, level: 기초, status: 준비 중, corp: [], traits: [] }
  - { key: seo, name: 대구광역시 서구, level: 기초, status: 준비 중, corp: [], traits: [] }
  - { key: nam, name: 대구광역시 남구, level: 기초, status: 준비 중, corp: [], traits: [] }
  - { key: buk, name: 대구광역시 북구, level: 기초, status: 준비 중, corp: [], traits: [] }
  - key: suseong
    name: 대구광역시 수성구
    level: 기초
    status: 검증 전(예시 설정 초안)
    bizno: "502-83-02507"
    corp: []
    traits:
      - 체육시설·야영장은 구가 직접 운영해 사용료가 구 세입입니다(국민체육센터·반다비체육센터·고산구민운동장·진밭골 생활체육센터·두산레포츠센터·구민운동장·진밭골 야영장) — 구 명의 사업이라 그 시설 지출은 구 사업자등록번호로 받은 세금계산서를 구가 공제합니다.
      - 체육시설 조례 별표 3 사용료는 '부가가치세를 포함한 금액' — 과세로 신고해 온 시설이라 그 시설 공사·운영 매입세액이 공제 대상입니다.
      - (재)수성문화재단 위탁 시설(수성아트피아·구립도서관 12곳·생활문화센터·관광시설 등)은 재단 명의 수입(사무의 위탁 조례 제2조·제14조) — 재단 명의 지출은 재단 몫, 구가 직접 낸 공사비만 구 몫입니다.
      - 민간위탁(화랑공원 테니스장·알파시티 축구장 — 수성구체육회, 청소년수련관, 노인·종합복지관)은 수탁자 명의 수입 — 구는 위탁수수료(수입의 10% 이상)만 세입.
      - 종량제 봉투 판매(2026 세입 약 81억 원)는 면세입니다(부가가치세과-1247).
      - 세입예산서는 일반회계뿐이라 공영주차장(주차장 특별회계)은 따로 확인합니다.
    # 지자체 맞춤(운영자 지시 2026-11-08 '수성구만 별도의 사이트로 구현해봐' — docs/prompts/vat_suseong_officer.md 1~4단계): 화면이 이 값으로 '먼저 볼 곳'·면적 나누기·구 신고에 넣지 않는 곳을 그린다(코드에 지자체 이름 없음)
    # focus[].match 는 기관 설정 시설 이름에 거는 정규식, area: true 면 면적 두 칸으로 과세 몫을 정한다. 순서 = 화면 순서
    focus:
      - key: sports
        title: 과세로 신고해 온 직영 체육시설
        match: "반다비|국민체육센터|구민운동장|생활체육센터|두산레포츠"
        why: "체육시설 조례 별표 3 사용료가 '부가가치세를 포함한 금액'이라 매출세액을 내 온 시설입니다. 그 시설의 공사·관리·운영비 부가세는 공제 대상(부가가치세법 제38조)이라, 신고서 매입세액에 빠짐없이 들어갔는지가 첫째입니다."
        todo: "이 시설 공사·관리 업체의 세금계산서가 구 사업자등록번호로 발급됐고 신고서 매입세액 (10)·(18)에 들어갔는지 홈택스 매입 목록에서 확인"
      - key: camp
        title: 진밭골 야영장
        match: "야영장"
        why: "지자체 오토캠핑장은 숙박업 과세로 봅니다(기준-2016-법령해석부가-0149). 다만 야영장 조례 요금표에는 '부가가치세 포함' 문구가 없어 사용료를 과세 매출로 신고해 왔는지부터 봅니다 — 신고해 왔다면 시설 매입세액은 공제 대상입니다."
        todo: "지난 신고서 과세표준 명세에 야영장 사용료가 있는지, 야영장 공사·관리 세금계산서가 공제됐는지 확인"
      - key: area
        title: 여러 용도가 섞인 건물 — 면적으로 나누기
        match: "행복드림센터|구청사|수성유원지"
        area: true
        why: "한 건물에 과세(수영장·헬스장, 빌려준 공간, 사용료 받는 광장)와 면세·행정(도서관·가족센터·사무실)이 함께 있으면 공통 공사·관리비는 과세로 쓰는 면적 비율만큼 공제합니다(부가가치세법 시행령 제81조 제4항). 아래 두 칸을 건축물대장·임대차계약서·사용허가서 면적으로 채우면 금액이 바로 바뀝니다."
      - key: foundation
        title: 문화재단 위탁 시설 중 구가 공사비를 낸 곳
        match: "아트피아|커뮤니티센터"
        why: "수성아트피아·커뮤니티센터는 (재)수성문화재단이 운영하고 대관료·수강료는 재단 수입이라 구 신고에 넣지 않습니다. 다만 리모델링·장비 공사는 구가 계약해 부가세를 냈습니다 — 재단이 무상으로 쓰면 구는 공제받을 수 없고(기본), 구가 사용료를 받아 과세로 신고해 왔다면 공제 대상입니다."
        todo: "위·수탁 협약서의 사용료(무상·유상) 조항 확인 — 유상이면 아래 「기본값으로 계산한 것」에서 이 시설의 「바꾸기」를 눌러 「유상」으로 고치면 다시 계산"
      - key: parking
        title: 공영주차장(주차장특별회계)
        match: "공영주차장"
        why: "구 직영 주차장은 열거 업종이 아니라 면세입니다(부가가치세법 시행령 제46조). 관리수탁자가 계약금액을 먼저 내고 요금을 거두는 곳이 있으면 그 계약금액은 임대 대가(과세)일 수 있어 따로 확인합니다."
        todo: "주차장 관리 위탁 계약 방식 확인 — 직영이면 매입세액 없음, 계약금액 선납 방식이면 그 주차장만 과세 여부 확인"
    exclude_note: "재단·민간위탁 시설은 이용료가 수탁자 수입이라 그 기관이 신고합니다 — 재단·수탁자 명의 지출은 구 신고에 넣지 않습니다. 구가 직접 낸 그 건물 공사비만 구 몫이고, 무상 사용이면 구 불공제입니다(문화재단 설립 조례 제16조)."
