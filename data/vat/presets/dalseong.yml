# 달성군 예시 설정(운영자 지시 2026-10-27 '달성군이 위탁 주는 시설을 넣는 것은 어때? → 만들어').
# 출처는 **공개된 자치법규만**(국가법령정보센터 자치법규, 2026-10-27 읽음). 시설 이름은 조례 조문에 적힌 대로, 과세 여부는 data/vat/rules.yml 의 유형 기준 참고 표시이지 군의 공식 판단이 아니다.
# 운영 방식(군 명의 대행인지 수탁기관 자기 사업인지)·사업자등록번호·매출은 조례로 알 수 없어 비워 둔다 — 담당자가 위·수탁 계약으로 채운다.
# 2차 조사(같은 날, 운영자 지시 '달성군 의회에 위탁동의안 받아야 하니 그쪽도 조사해봐'): 달성군의회 누리집 '의안 처리 현황'(council.dalseong.go.kr/content/info/processing.html, 제목 '위탁'·'대행'·'공단' 검색, 1991~2026)과 공단 누리집(dssiseol.or.kr 시설 목록·조직도)을 읽었다.
#   · 의회 동의안은 모두 '민간위탁'(민간위탁촉진 및 관리 조례) — 문화회관·선비체험관(송해기념관)·하빈PMZ평화예술센터·문화도시센터·도시재생지원센터·근로자복지관·보훈회관·군청 내 카페 등. 시설관리공단 수탁(대행사업)은 동의안으로 올라오지 않는다(공단 설립 조례 제20조: 위탁계약 + 군수 승인, 제3자 재위탁만 군의회 동의). 의안 상세에는 처리 일자만 있고 수탁자·기간·사용료 귀속은 없다.
#   · 공단 관리 시설은 공단 누리집 시설 목록·조직도(2026-10-27) 그대로. 운영 방식(군 명의 대행인지 공단 자기 사업인지)은 여전히 위탁계약·공단 사업자등록으로 확인해야 한다.
# 3차 조사(같은 날, 운영자 지시 '회의록 제안설명도 읽어서 수탁자랑 기간 채워봐'): 군의회 회의록(제9대, council.dalseong.go.kr/content/minutes/case.html 안건 검색 → 회의록 뷰어)의 민간위탁 동의안 제안설명에서 수탁자(기관 이름만)·위탁 기간·제안설명에 적힌 위탁사업비를 옮겼다(`contractor`·`term`). 발언자·공무원 성명은 적지 않는다. 동의안 뒤 실제 협약 내용은 위·수탁 협약서로 확인.
# 달성군시설관리공단 설립 및 운영에 관한 조례 제19조(사업): 문화·관광시설, 체육시설, 사회복지시설, 공원·유원지·자연휴양림, 위탁 사업, 청소년 수련시설 운영 / 제20조(대행사업): 위탁계약에 따라 군 등의 사업을 대행 — 어느 시설이 '대행'인지는 계약마다 다르다.
key: dalseong
org: 대구광역시 달성군
read: "2026-10-27"
note: 시설 이름은 공단 누리집(시설 목록·조직도)과 조례에서, 위탁 형태는 군의회 의안 처리 현황에서, 민간위탁 시설의 수탁자·위탁 기간은 군의회 회의록 제안설명에서 가져왔다(동의안 때 설명이므로 실제 협약은 계약서로 확인). '공단 관리' 시설은 공단이 군의 사업을 대행하는지 공단 자기 사업인지 위탁계약으로 확인해야 하고, '민간위탁' 시설은 수탁자가 운영하므로 군의 과세사업이 되는지는 사용료가 군 수입인지 수탁자 수입인지로 확인한다. 과세 여부 표시는 이 사이트 규칙의 유형 기준 참고이며 군의 공식 판단이 아니다.
findings:
  - 군의회 동의안은 '민간위탁'(사무의 민간위탁촉진 및 관리 조례)에만 있다. 시설관리공단 수탁(대행사업)은 공단 설립 조례 제20조대로 위탁계약과 군수 승인으로 하고, 제3자 재위탁 때만 군의회 동의를 받는다 — 공단 관리 시설은 의안 목록에 나오지 않는다.
  - 민간위탁 동의안(의안번호·본회의 처리일) — 문화회관 관리·운영 사무 재계약 2751(2025-11-07 제출) · 선비체험관(송해기념관) 위탁 운영 사무 민간위탁 2657(2025-04-18 원안가결) · 하빈PMZ평화예술센터 재위탁 2829(2026-06-08) · 문화도시센터 재계약 2752 · 도시재생(현장)지원센터 재계약 2750 · 근로자복지관 재위탁 2563(2024-10-22) · 보훈회관 재계약 2577(2024-12-18) · 기업+일자리 지원센터 2582 · 군청 내 카페 재계약 보고 2386(2023-10-16) · 마비정 벽화마을 리뉴얼 공공기관 위탁 동의(보고)안 2832(2026-06-08).
  - 의안 상세(BillView)에는 제출자·처리 일자만 있고 수탁자·위탁 기간·사용료 귀속은 없다. 수탁자·기간은 군의회 회의록 제안설명(제9대 회의록 안건 검색)에서 읽어 시설마다 적었다 — 문화회관 달성문화원 2026-01-01~2028-12-31(3년, 위탁사업비 매년 3억 5,500만 원; 2017년 협약은 기간이 '군수가 필요로 하는 기간'이어서 민간위탁 조례 제8조의 3년 이내에 맞춰 재계약) · 문화도시센터 (재)달성문화재단 2026-03-01~2028-02-29(2년, 2년 60억 원 — 국비 보조사업, 앞 기간 2023-03-01~2026-02-28) · 선비체험관(송해기념관) (재)달성문화재단 2025-07~2027-06(2년) · 하빈PMZ평화예술센터 2026-04 재계약 동의(마을문화센터 솜씨협동조합, 2026-06부터 2년) 뒤 2026-06 재위탁 동의((재)달성문화재단, 2026-07~2028-06 2년, 전시실·창작공간·음식체험관 약 487㎡) · 도시재생지원센터·천내리 도시재생현장지원센터 달성군사회적경제협의회(2025-12-31 만료 → 재계약, 새 기간은 제안설명에 없음) · 근로자복지관 현 수탁 한국노총 대구지역본부 달성지역지부(2024-12 만료) → 공개모집으로 새 수탁기관 선정, 2025-01~2026-12(2년; 선정 결과는 회의록에 없음) · 보훈회관 달성군 보훈단체협의회(2022-01-01부터 3년, 2024-12-31 만료 → 재계약, 연간 운영예산 약 7,800만 원, 입주 보훈단체 10개) · 군청 내 카페(딜라이트 카페, 18.04㎡) 사단법인 정인장애인복지회 2023-12-30~2026-12-29.
  - 같은 회의록(제308회 본회의 2023-10-19)에 실린 다른 민간위탁 재계약 보고 — 달성군종합사회복지관 사회복지법인 대구가톨릭사회복지회 2024-01-01~2028-12-31 · 북부노인복지관 (재)달성복지재단 2023-12-01~2028-11-30(5년) · 원어민 영어교실(3개 권역 4개소) (주)헤럴드대구본부 2024-01-01~2025-12-31. 사회복지시설은 수탁 법인이 운영하는 면세 사업이 보통이라 매입 기록 대상이 아닐 가능성이 크다(위탁계약으로 확인). 마비정 벽화마을 리뉴얼 공공기관 위탁(2026-06-08)은 시설 운영이 아니라 디자인·벽화·조경 사업의 위탁이라 시설 목록에 넣지 않았다.
  - 공단 누리집 조직도(2026-10-27)의 '공단관리시설': 문화교육사업부(여성문화복지센터·달성문화센터·국민체육센터·테크노스포츠센터·달성화석박물관), 시설관리사업부(체육시설관리팀·파크골프장관리팀·군민체육관·현풍공영버스정류장), 관광휴양사업부(비슬산휴양림·화원휴양림·화원동산·낙동강레포츠밸리·도동유교문화관·비슬산유스호스텔).
