# 달성군 예시 설정(운영자 지시 2026-10-27 '달성군이 위탁 주는 시설을 넣는 것은 어때? → 만들어').
# 출처는 **공개된 자치법규만**(국가법령정보센터 자치법규, 2026-10-27 읽음). 시설 이름은 조례 조문에 적힌 대로, 과세 여부는 data/vat/rules.yml 의 유형 기준 참고 표시이지 군의 공식 판단이 아니다.
# 운영 방식(군 명의 대행인지 수탁기관 자기 사업인지)·사업자등록번호·매출은 조례로 알 수 없어 비워 둔다 — 담당자가 위·수탁 계약으로 채운다.
# 달성군시설관리공단 설립 및 운영에 관한 조례 제19조(사업): 문화·관광시설, 체육시설, 사회복지시설, 공원·유원지·자연휴양림, 위탁 사업, 청소년 수련시설 운영 / 제20조(대행사업): 위탁계약에 따라 군 등의 사업을 대행 — 어느 시설이 '대행'인지는 계약마다 다르다.
key: dalseong
org: 대구광역시 달성군
read: "2026-10-27"
note: 조례에 이름이 나오는 시설만 넣었다. 조례 별표의 개별 체육시설(체육관·구장 등)과 공영주차장 이름은 조문에 없어 '군 체육시설'·'군 공영주차장' 한 줄로 두었으니 시설마다 「같은 유형 하나 더」로 늘려 이름을 적는다.
