facilities:
  - { name: 군 체육시설(체육관·구장 등 — 조례 별표 시설, 시설마다 나누기), type: sports, note: 체육시설 관리·운영 조례 제24조 — 시설관리공단 또는 비영리 법인·단체에 위탁 가능, 수탁기관이 사용허가·사용료 징수. 어느 시설을 누가 받았는지는 위탁협약. }
  - { name: 달성문화센터(수영장·헬스장·공연장·문화강좌실), type: sports, note: 달성문화센터 조례 제3조 — 수영장·헬스장은 체육시설 운영, 공연장 대관은 부동산임대업 여부 확인, 수강료는 프로그램. 제22조 위탁(출연 법인 우선). }
  - { name: 군 파크골프장(조례에 따른 파크골프장, 시설마다 나누기), type: golf, note: 파크골프장 관리 및 운영에 관한 조례. 골프장 운영업인지 기타 스포츠시설 운영업인지는 분류 확인(어느 쪽이든 열거 업종). }
  - { name: 화원자연휴양림(숲속의 집·산림휴양문화관), type: lodging, note: 자연휴양림 조례 제3조·제6조(시설사용료, 입장료 무료, 공단 홈페이지 게시)·제16조 위탁. }
  - { name: 비슬산자연휴양림(숲속의 집·숲속캠핑장·청소년수련관·세미나실), type: lodging, note: 자연휴양림 조례 제3조 제2항. 캠핑장은 숙박업 분류 확인. }
  - { name: 비슬산유스호스텔, type: lodging, note: 비슬산유스호스텔 조례 제19조 — 시설관리공단에 위탁할 때는 공단 설립 조례 적용. }
  - { name: 낙동강 레포츠밸리 오토캠핑장(캐라반), type: lodging, note: 낙동강 레포츠밸리 조례 제3조·제4조(시설이용료)·제12조(수납한 이용료는 다음 날 군 금고 납입 — 군 수입으로 들어가는 구조). }
  - { name: 낙동강 레포츠밸리 수상레저계류장, type: use_permit, note: 계류시설 사용료 — 부동산임대업(자리 빌려주기)인지 스포츠시설인지 유권해석 확인. }
  - { name: 군 공영주차장(주차장 설치 및 관리 조례, 시설마다 나누기), type: parking, note: 시행령 제46조 열거 업종이 아니라 군 직영이면 면세. 수탁기관 자기 사업이면 그 기관이 과세. }
  - { name: 문화회관(공연장·강의실·전시실 대관), type: venue, note: 문화회관 조례 제3조·제5조(사무 일부 위탁 가능). 대관이 부동산임대업인지 문화행사 용역인지 확인. }
  - { name: 교육문화복지센터(전용부분 사용허가), type: use_permit, note: 교육문화복지센터 조례 제3조 '전용부분'을 유상 사용허가 — 부동산임대업 해당 여부 확인. 제16조 출자·출연 법인 우선 위탁. }
  - { name: 사문진 역사공원 편의시설(매점·음식점·카페 사용허가), type: use_permit, note: 사문진 역사공원 조례 제3조 — 군이 설치한 매점·음식점·카페를 사용허가. 군이 직접 팔면 도소매·음식점업 과세, 자리를 빌려주면 임대업 여부 확인. }
  - { name: 농수산물종합유통센터, type: use_permit, note: 농수산물종합유통센터 조례 제6조 — 농협 등 운영주체에 5~10년 위탁, 운영주체가 직접 운영. 군이 받는 것이 사용료인지 확인. }
  - { name: 선비체험관·송해기념관(체험료·수강료·사용허가), type: culture, note: 조례 제3조 — 체험료·수강료는 프로그램, 기념관 입장은 박물관류 면세 여부 확인, 시설 사용허가는 임대업 여부 확인. 제22조 출자·출연 법인 우선 위탁. }
  - { name: 비슬산 치유의 숲(산림치유 프로그램 체험료), type: program, note: 치유의 숲 조례 제3조·제8조(위탁 가능). 열거 업종이 아니라 군 직영이면 면세. }
  - { name: 청소년센터(논공)·청소년 문화의 집(가창), type: program, note: 청소년수련시설 조례 제3조(사용료·강습료). 체육활동장 대관은 체육시설 여부 확인. 제15조 위탁(군 설립 법인 우선). }
  - { name: 비슬산 관광객 이용시설(친환경 전기차 운행), type: transit, note: 관광객 이용시설 조례 제2조·제12조(군 출연·설립 기관 우선 위탁). 군 직영 여객운송은 제19호 면세(과세는 고속철도뿐). }
