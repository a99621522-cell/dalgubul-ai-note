facilities:
  # ── 체육시설: 사용료가 구 세입(체육진흥과) ──
  - name: "도동복합운동장"
    type: "sports"
    run: "direct"
    op: "직영"
    note: "[2026-11-19 동구 조사] 2026 세입 '도동복합운동장 사용료' 66,000천원(5,500천원×12월, 체육진흥과) — 구 세입이라 구 사업. 기타 운동시설 운영업으로 과세(부가가치세법 제26조 제1항 제19호 단서·시행령 제46조). 요금표 '부가가치세 포함' 여부는 조례 확인."
  - name: "박주영축구장"
