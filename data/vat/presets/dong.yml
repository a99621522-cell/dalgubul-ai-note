# 동구 예시 설정(운영자 지시 2026-11-19 '동구 만들어'). 초안 — 운영자·담당자 검증 전.
# 출처는 공개 자료만: 동구 2026 본예산 세입예산사업명세서(일반회계, 이 저장소 data/vat/revenue/raw/dong_2026.txt),
#   조달청 나라장터 계약정보(data/vat/contracts/dong.json, 2020-07~), 조달청 수요기관 정보(사업자등록번호), 보도(시설 경위).
# 동구 세출예산사업명세서는 누리집에서 받지 못해(revenue_docs: 세출 없음) 운영 방식은 세입예산서의 수입 귀속과 계약 이름으로 짐작했다.
# 과세 여부는 data/vat/rules.yml 의 유형 기준 참고 표시이지 구의 공식 판단이 아니다. 사업자등록번호·실제 매출·협약 내용은 담당자가 채운다.
key: dong
org: 대구광역시 동구
read: "2026-11-19"
note: 시설 이름·수입 귀속은 동구 2026 세입예산사업명세서에서, 공사 규모·위탁 정황은 나라장터 계약에서, 경위는 보도에서 가져왔다. 동구는 구가 세운 시설 운영 지방공기업이 없어(나라장터 수요기관 정보에 공단 없음) 시설은 ① 구 직영(수입이 구 세입) ② 위탁 두 갈래다. 과세 여부 표시는 이 사이트 규칙의 유형 기준 참고이며 구의 공식 판단이 아니다.
findings:
  - "2026-11-19 동구 조사: 구 세외수입 가운데 시설에서 나오는 돈은 체육시설 사용료(체육진흥과)가 대부분 — 도동복합운동장 66,000천원·박주영축구장 60,000천원·율하테니스장 60,000천원·신서축구장 30,000천원·불로강변야구장 24,000천원·신서풋살장·불로풋살장·지저둔치축구장 각 12,000천원(합 276,000천원). 그 밖에 구청사 부설주차장 주차요금 9,500천원, 공항시장 공영주차장 수탁료 5,266천원, 공유재산 사용료(해피샵 율하점 6,789천원·금강행복마을 3,122천원·사회적협동조합 2곳 3,446천원). 가장 큰 세외수입은 종량제봉투 판매 수수료 6,000,000천원(면세)."
  - "용암산성 오토캠핑장(도동, 둔산로 484-52): 보도(2022-02-15)로 14억 원을 들여 2018-07 준공했지만 4차순환도로 노선 문제로 개장하지 못하고 있었다. 나라장터 계약 '용암산성 오토캠핑장 정비사업' 111,001천원(2023-06)·정보통신 23,621천원·전기 17,132천원, 2025-04 '용암산성 오토캠핑장 위탁 운영비 산정 원가계산 용역', 2025-11·2026 데크 보수 물품·냉난방기 구입. 2026 세입예산서에 캠핑장 사용료 줄이 없다 — 위탁 운영으로 이용료가 수탁자 수입인 것으로 보이나 협약서 확인 필요."
  - "아양기찻길(아양뷰): 보도(2024-08-04)로 카페와 보행로로 쓰이던 공간을 'New K-2 홍보관'으로 바꿨다(대구시 예산 15억 원 홍보관 + 구비 10억 원 리모델링, 2024-01 보도). 나라장터 '아양기찻길(아양뷰) New K-2 홍보관 조성사업' 약 12.5억 원·'공간리모델링 및 보행환경개선 공사' 682,580천원(2024-09) 등 2021년 뒤 계약 약 54억 원. 2026 세입예산서에 사용료 줄이 없다 — 홍보관·보행로는 무료라 기본은 매입세액 불공제."
  - "못 읽은 것: 동구 조례 본문·요금표(체육시설 사용료가 '부가가치세 포함'인지), 체육시설 사용료를 과세 매출로 신고해 왔는지, 용암산성 오토캠핑장 위탁 협약(이용료 귀속·구 부담 시설비), 아양기찻길 리모델링 전 카페 임대 방식과 그때 공사 부가세 처리, 공항시장 공영주차장 수탁료의 계약 방식."
