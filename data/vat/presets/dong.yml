  - name: "신서축구장·신서풋살장"
    type: "sports"
    run: "direct"
    op: "직영"
    alias: ["신서축구장", "신서풋살장", "신서 풋살장"]
    note: "[2026-11-19 동구 조사] 2026 세입 '신서축구장 사용료' 30,000천원·'신서풋살장 사용료' 12,000천원(체육진흥과). 2026-10 인조잔디 실태조사 용역."
  - name: "불로강변야구장·불로풋살장"
    type: "sports"
    run: "direct"
    op: "직영"
    alias: ["불로강변야구장", "불로풋살장", "불로야구장"]
    note: "[2026-11-19 동구 조사] 2026 세입 '불로강변야구장 사용료' 24,000천원·'불로풋살장 사용료' 12,000천원(체육진흥과). 금호강 둔치 — 도시계획시설 공원 안이면 체육공원 운영업 면세 해석(재경부 부가가치세제과-306)이 있어 결정 조서 확인."
  - name: "지저둔치축구장"
    type: "sports"
    run: "direct"
    op: "직영"
    note: "[2026-11-19 동구 조사] 2026 세입 '지저둔치축구장 사용료' 12,000천원(체육진흥과). 나라장터 '지저둔치 축구장 인조잔디 보수공사' 47,002천원(2026-09)·46,633천원(2026-10). 같은 둔치의 야외운동기구존 개선(92,951천원, 2026-07)·휴게시설 전기인입은 무료 시설이라 불공제 — 축구장 공사와 나눠 봄."
  # ── 캠핑장·관광 시설: 세입예산서에 사용료 줄이 없음 ──
  - name: "용암산성 오토캠핑장"
    type: "lodging"
    run: "entrusted_own"
    op: "위탁(확인)"
    alias: ["용암산성오토캠핑장", "용암산성 오토캠핌장"]
    note: "[2026-11-19 동구 조사] 도동 둔산로 484-52. 2018-07 준공(14억 원, 보도 2022-02-15 — 그때까지 미개장). 2023-06 정비사업 111,001천원·정보통신 23,621천원·전기 17,132천원, 2025-04 '위탁 운영비 산정 원가계산 용역' → 위탁 운영. 2026 세입예산서에 사용료 줄이 없어 이용료는 수탁자 수입으로 보았다(협약서 확인). 수탁자가 이용료를 받는 자기 사업이면 구가 낸 시설비 부가세는 무상 제공이라 불공제(법 제39조 제1항 제7호), 구가 사용료를 받고 빌려주면 과세 임대로 공제 대상."
    ask:
      - id: "fee"
        q: "용암산성 오토캠핑장 이용료는 누구 수입인가요(2026 세입예산서에 사용료 줄 없음)?"
        why: "수탁자 수입이면 수탁자 사업이라 구가 낸 정비·보수 부가세는 불공제입니다. 이용료를 구 세입으로 받으면 숙박업(캠핑장) 과세사업이라(기준-2016-법령해석부가-0149) 2023 정비사업 등 공사 부가세를 공제받을 수 있고, 이용료도 과세 매출로 신고해야 합니다."
        default: 0
        opts:
          - label: "수탁자 수입(위탁 운영) — 기본"
          - label: "구 세입(구가 이용료를 받음)"
            patch: { run: "direct" }
  - name: "아양기찻길(아양뷰·New K-2 홍보관)"
    type: "admin"
    run: "direct"
    op: "직영"
    alias: ["아양기찻길", "아양뷰"]
    note: "[2026-11-19 동구 조사] 보도(2024-08)로 카페·보행로를 New K-2 홍보관으로 전환, 나라장터 공간리모델링·보행환경개선 682,580천원(2024-09)·홍보관 조성 약 12.5억 원 등. 2026 세입예산서에 사용료 줄이 없어 무료 공간 — 기본은 매입세액 불공제(법 제39조 제1항 제7호). 리모델링 전 카페를 임대(사용료)로 운영했다면 그 기간·면적 몫은 과세 임대로 공제 대상이었는지 확인."
    ask:
      - id: "cafe"
        q: "아양기찻길에 사용료를 받고 빌려준 카페·매점 공간이 있나요(리모델링 전 포함)?"
        why: "빌려주고 사용료를 받는 공간은 과세 임대(법제처 15-0228)라 그 면적 몫만큼 공사·관리 부가세를 공제받을 수 있습니다. 모두 무료 홍보관·보행로면 불공제입니다."
        default: 0
        opts:
          - label: "없음 — 무료 공간(기본)"
          - label: "있음 — 면적의 일부(약 20%)"
            patch: { type: "lease", share: 0.2 }
  # ── 주차장 ──
  - name: "구청사 부설주차장"
    type: "parking"
    run: "direct"
    op: "직영"
    note: "[2026-11-19 동구 조사] 2026 세입 '구청사 부설주차장 주차요금' 9,500천원(재무과). 구 직영 주차장은 열거 업종이 아니라 면세(시행령 제46조)."
  - name: "공영주차장(구 조성 주차장)"
    type: "parking"
    run: "direct"
    op: "직영(확인)"
    alias: ["공영주차장", "안심 공영주차장", "대구혁신도시 공영주차장", "나불지 공영주차장", "효목마을주차장", "마을주차장", "불로게이트 주차장", "동편주차장", "지하주차장", "복개주차장", "임시주차장", "주차장"]
    note: "[2026-11-19 동구 조사] 나라장터 공영주차장 조성 계약(안심 공영주차장 조성사업·대구혁신도시 공영주차장 조성공사·나불지 공영주차장 확대조성공사·효목2동 효목마을주차장 조성·불로동 불로게이트 주차장 조성·동촌유원지 동편주차장 조성·효목동 마을공원 지하주차장 조성 등 — 2020-07 뒤 계약 금액은 화면의 계약 세액 어림 참고). 2026 세입예산서에 이 주차장들의 요금 줄이 없다 — 무료이거나 위탁. 구 직영 주차장은 열거 업종이 아니라 면세(시행령 제46조)라 조성 공사 부가세는 기본이 불공제. 특정 칸을 계약으로 빌려주거나 수탁자에게 정액을 받는 곳만 과세 임대로 따로 본다."
  - name: "공항시장주차장(위탁)"
    type: "parking"
    run: "entrusted_own"
    op: "위탁(확인)"
    alias: ["공항시장 공영주차장"]
    note: "[2026-11-19 동구 조사] 2026 세입 '공항시장 공영주차장 수탁료' 5,266천원(민생경제과) — 수탁자가 요금을 받고 구에 수탁료를 내는 구조. 정액 수탁료면 주차장을 빌려준 대가(과세 임대)일 수 있어 계약 방식 확인. 나라장터 '운영개선공사' 17,877천원(2022-10)·17,384천원(2022-12)."
  # ── 공유재산 사용허가: 과세 ──
  - name: "해피샵(율하점)"
    type: "use_permit"
    run: "direct"
    op: "사용허가"
    alias: ["해피샵 율하점"]
    note: "[2026-11-19 동구 조사] 2026 세입 '해피샵(율하점) 사용료' 6,788,920원(일자리경제과, 공유재산임대료). 행정재산 사용료는 과세(법제처 15-0228) — 과세로 신고해 왔다면 야외테라스 데크 보수(4,965천원, 2025-08)·노후시설 보수(3,680천원, 2026-08) 부가세가 공제 대상."
  - name: "금강행복마을"
    type: "use_permit"
