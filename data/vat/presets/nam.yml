facilities:
  # ── 앞산: 개장하지 못한 캠핑장과 그 자리의 숲속 책 쉼터 ──
  - name: "앞산 해넘이캠핑장(골안골 도시형 캠핑장 — 2023 준공, 미개장)"
    type: "admin"
    run: "direct"
    op: "직영"
    alias: ["앞산 골안골 도시형 캠핑장", "골안골 도시형 캠핑장", "골안골 캠핑장", "해넘이캠핑장", "앞산 캠핑장"]
    note: "[2026-11-18 남구 조사] 대명동 골안골. 나라장터 '앞산 골안골 도시형 캠핑장 조성 공사' 3,658,600천원(2021-10-06)·전기 218,720천원(2021-12)·실시설계 122,560천원(2020-07), 보도로는 총 83억 원·2023-05 준공. 감사원 지적(근린공원 안 숙박시설 등)으로 개장하지 못했고 2024-12 운영 예산 삭감, 2025-03 공원조성계획 변경(야영장 → 1종 근린생활시설)으로 '숲속 책 쉼터'가 됨. 사용료를 받은 적이 없어 과세사업에 쓰이지 않았다 — 기본은 매입세액 불공제(법 제39조 제1항 제7호). 공사 때 캠핑장(숙박업 과세) 목적으로 매입세액을 공제받았다면, 과세사업에 쓰지 않고 무료 공간으로 바꾼 것이 면세사업 등 전용(법 제10조 제1항)에 해당하는지 확인해야 한다."
    ask:
      - id: "credited"
        q: "앞산 해넘이캠핑장(골안골) 공사 세금계산서의 부가세를 2021~2023년 신고 때 매입세액으로 공제받았나요?"
        why: "공제받지 않았다면 돌려받을 돈은 지금 카페로 쓰는 부분(과세)에 해당하는 몫뿐이고, 그것도 면세·비과세로 쓰던 자산을 과세사업에 쓰기 시작한 때의 계산(시행령 제85조)을 따릅니다. 공제받았다면 개장하지 못하고 무료 공간이 된 지금은 오히려 내야 할 세금(법 제10조 제1항 면세사업 등 전용)이 있는지 세무서에 확인해야 합니다. 2021-2기~2023-1기 신고서 매입세액 (10)·(11)과 매입처별 세금계산서합계표에서 이 공사 업체를 찾으면 됩니다."
        default: 0
        opts:
          - label: "모름 — 지난 신고서에서 확인(기본, 불공제로 계산)"
          - label: "공제받지 않음"
            patch: { note: "캠핑장 공사 매입세액을 공제받지 않았음(담당 확인) — 카페 몫은 과세사업 전환(시행령 제85조)으로 검토." }
          - label: "공제받음"
            patch: { note: "캠핑장 공사 매입세액을 공제받았음(담당 확인) — 미개장·무료 공간 전환에 따른 면세사업 등 전용(법 제10조 제1항) 여부를 세무서에 확인." }
  - name: "앞산 숲속책쉼터(관리동 무인카페·열람실·서고)"
    type: "food"
    share: 0.15
    run: "direct"
    op: "직영"
    alias: ["숲속책쉼터", "책쉼터"]
    note: "[2026-11-18 남구 조사] 옛 앞산 해넘이캠핑장 관리동. 2026 세출 '숲속 책 쉼터 관리 및 운영' 646,863천원(공원녹지과): 무인카페 운영 소모품 14,400·커피머신 제빙기 6,000·무인카페 프로그램 유지관리비 1,320·등록면허세 18·신용카드결제 수수료 1,200천원 — 카페는 구 직영 음식점업(과세), 열람·대출은 무료. 같은 해 시설비 370,000천원(환경개선 100,000·BF 조성 200,000·통신 40,000·주차 차단기 20,000)·전기요금 36,000천원 등 건물 공통비는 카페(과세)로 쓰는 면적 비율만큼만 공제(시행령 제81조 제4항). 카페 매출(무인 결제)이 과세 매출로 신고되고 있는지 먼저 확인."
    ask:
      - id: "mix"
        q: "숲속 책 쉼터 관리동 면적 가운데 카페(좌석·주방·카운터)로 쓰는 몫은 얼마쯤인가요?"
        why: "카페(과세)와 무료 열람실·서고가 한 건물이라 건물 공통 공사·관리비(환경개선·전기요금·청소 등)는 카페로 쓰는 면적 비율만큼만 공제합니다(시행령 제81조 제4항). 도면이나 배치도를 보면 정확합니다. 커피머신·카페 소모품처럼 카페에만 쓰는 지출은 전액 공제 대상입니다."
        default: 0
        opts:
          - label: "약 15%(기본 — 면적 확인 전)"
            patch: { share: 0.15 }
          - label: "약 30%"
            patch: { share: 0.3 }
          - label: "약 50%"
            patch: { share: 0.5 }
      - id: "cafe_sales"
        q: "숲속 책 쉼터 무인카페 매출을 구 부가가치세 신고에 과세 매출로 넣고 있나요?"
        why: "구가 직접 파는 커피·음료는 음식점업 과세라 매출세액을 내야 하고, 그래야 카페 쪽 매입세액도 공제받습니다(부가가치세법 제38조). 카드 결제분은 홈택스 「신용카드 매출자료 조회」에서 확인됩니다."
        default: 0
        opts:
          - label: "모름 — 홈택스 신고 내역으로 확인"
          - label: "예 — 과세 매출로 신고해 옴"
            patch: { note: "무인카페 매출을 과세 매출로 신고해 옴(담당 확인)." }
          - label: "아니오 — 신고하지 않음"
            patch: { note: "무인카페 매출을 신고하지 않았음 — 카페 매입세액은 청구하지 않음(청구하면 매출세액·가산세를 함께 경정해 더 낼 수 있음)." }
  - name: "앞산자락 카페마실(앞산 행복 커뮤니티 플랫폼 — 사용허가)"
    type: "use_permit"
    run: "direct"
    op: "직영"
    alias: ["앞산자락 카페마실", "카페마실", "앞산행복커뮤니티플랫폼"]
    note: "[2026-11-18 남구 조사] 2026 세입 '앞산자락 카페마실 사용료' 20,000천원(정책추진단, 공유재산 사용허가) — 행정재산 사용허가 사용료는 과세(법제처 15-0228·재경부 186). 2026 세출 '앞산자락 카페마실 유지·관리 수수료' 3,180천원. 건물은 나라장터 '앞산 행복 커뮤니티 플랫폼(가칭) 조성 건축 공사' 980,541천원(2020-11)·전기 144,374천원(2020-07) — 2020년 공사분은 경정청구 기한(5년)이 대부분 지났고, 그 뒤 수선·관리 매입세액이 공제 대상."
    ask:
      - id: "sales_report"
        q: "앞산자락 카페마실·이천 어울림카페 사용료를 구 부가가치세 신고에 과세 매출로 넣고 있나요?"
        why: "행정재산을 빌려주고 받는 사용료는 부동산임대 성격이라 과세입니다(법제처 15-0228, 재경부 부가가치세제과-186). 과세로 신고해 왔다면 그 건물의 수선·관리 매입세액은 공제 대상이고, 신고하지 않았다면 매출 수정신고부터 해야 합니다."
        default: 0
        opts:
          - label: "모름 — 홈택스 신고 내역으로 확인"
          - label: "예 — 과세 매출로 신고해 옴"
