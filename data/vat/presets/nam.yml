# 남구 예시 설정(운영자 지시 2026-11-18 '남구만 따로 만들어'). 초안 — 운영자·담당자 검증 전.
# 출처는 공개 자료만: 남구 2026 본예산 세입예산사업명세서(일반회계 file_6)·부서별 세출예산사업명세서(이 저장소 data/vat/revenue/raw/nam_2026*.txt),
#   조달청 나라장터 계약정보(data/vat/contracts/nam.json, 2020-07~), 조달청 수요기관 정보(사업자등록번호), 보도(시설 경위).
# 남구 자치법규 본문은 이번 조사에서 국가법령정보센터 오픈API 가 IP 검증으로 막혀 읽지 못했다 — 요금표의 '부가가치세 포함' 여부는 확인 필요로 둔다.
# 과세 여부는 data/vat/rules.yml 의 유형 기준 참고 표시이지 구의 공식 판단이 아니다. 사업자등록번호·실제 매출·협약 내용은 담당자가 채운다.
key: nam
org: 대구광역시 남구
read: "2026-11-18"
note: 시설 이름·수입 귀속은 남구 2026 세입예산사업명세서에서, 운영 방식은 2026 세출예산사업명세서(민간위탁금·직영 운영비)에서, 공사 규모는 나라장터 계약에서, 경위는 보도에서 가져왔다. 남구는 구가 세운 시설 운영 지방공기업이 없어 시설은 ① 구 직영(수입이 구 세입) ② 민간위탁(이용료가 수탁자 수입) 두 갈래다. 과세 여부 표시는 이 사이트 규칙의 유형 기준 참고이며 구의 공식 판단이 아니다.
findings:
  - "2026-11-18 남구 조사: 구 세외수입 가운데 시설에서 나오는 돈은 적다 — 공공체육시설 사용료 60,000천원(평생교육과), 대덕문화전당 공연장·전시장·생활문화센터 사용료 45,000천원·공연입장료 30,000천원, 앞산자락 카페마실 사용료 20,000천원·이천 어울림카페 2,000천원(정책추진단, 공유재산 사용허가), 남구행복플랫폼 임대료 10,165천원, 대구은행출장소 임대료 13,615천원, 주차요금 24,000천원(행정지원과), 온마을아이맘센터 체육프로그램 참가비 12,000천원, 동행스튜디오 대여료 1,680천원. 가장 큰 세외수입은 쓰레기봉투 판매수입 2,795,640천원(면세)."
  - "앞산 해넘이캠핑장(대명동 골안골): 나라장터 계약 '앞산 골안골 도시형 캠핑장 조성 공사' 3,658,600천원(2021-10)·전기 218,720천원, 보도로는 총 83억 원·2023-05 준공. 감사원이 근린공원 안 캠핑장 숙박시설 설치 등 법령 위반을 지적해 개장하지 못했고, 2024-12 구의회가 캠핑장 운영 세입·세출 예산을 삭감, 2025-03 도시공원위원회가 용도를 야영장에서 1종 근린생활시설로 바꿔 '앞산 숲속 책 쉼터'(관리동 카페·열람실·서고, 책은 무료)로 전환. 2026 세출 '숲속 책 쉼터 관리 및 운영' 646,863천원(공원녹지과) — 무인카페 등록면허세·커피머신·카드결제 수수료가 있어 카페는 구 직영(음식점업 과세), 열람은 무료."
  - "남구국민체육센터: 2026 세출 '남구 스포츠클럽 운영지원' 민간위탁금 100,000천원·민간위탁심의위원회 수당 → 민간위탁. 보도(2024-11)로 수탁자는 (사)대구남구스포츠클럽. 2026 세입 '체육시설 관리ㆍ운영 위탁수수료' 1,000천원. 2025-07 시설개선 공사 547,099천원·전기 73,471천원·소방 69,469천원은 구 계약."
  - "남구 공영주차장: 2026 세출 '남구 공영주차장 운영'(행정지원과 — 주차부스 카드 수수료·주차관리시스템, 사회복무요원)으로 구 직영 — 주차장 운영업은 열거 업종이 아니라 구 명의면 면세. 앞산 빨래터공원 공영주차장 조성 2,923,970천원(2021-04)·소방 339,751천원·전기 186,083천원."
  - "못 읽은 것: 남구 조례 본문·요금표(국가법령정보센터 오픈API IP 검증 실패), 공공체육시설 사용료 60,000천원이 어느 시설 것인지(구민체육광장·앞산배수지 운동장 등으로 짐작), 대덕문화전당 대관을 과세로 신고해 왔는지, 숲속 책 쉼터 무인카페 매출 신고 여부, 남구행복플랫폼 임대 면적."
