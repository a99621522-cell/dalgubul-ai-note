facilities:
  # ── 구 직영 체육시설(체육시설 조례 별표 3 사용료 '부가가치세 포함', 2026 세입 체육진흥과) ──
  - name: "수성행복드림센터 반다비체육센터(수영장·헬스장)"
    type: "sports"
    share: 0.3
    run: "direct"
    op: "직영"
    alias: ["수성행복드림센터", "수성반다비체육센터", "반다비체육센터", "만촌책문화센터"]
    note: "[2026-11-05 수성구 조사] 만촌동 달구벌대로526길 50, 연면적 7,319㎡·부지 3,585㎡, 지하2~지상3층 생활SOC 복합시설(행복드림센터 조례 2026-08-20 제정). 층별: 지하2층 주차장 48면·기계실, 지하1층 반다비 수영장(25m 5레인), 1층 헬스장·가족센터 공동육아나눔터·육아책방, 2층 만촌책문화센터도서관·가족센터 교실·상담실, 3층 청소년 전용 다목적 공간. 2026-05-11 시범운영(무료), 하반기 정식 개관 뒤 유료. 2026 세입 체육진흥과 「수성행복드림센터 체육시설 사용료」 554,136천원(수영 프로그램 411,523·헬스장 108,000·일일 입장 31,800·사물함 2,813) — 구 명의 과세 매출(체육시설 조례 별표 3 제8호 '부가가치세 포함'). 수영·헬스는 과세 전용, 도서관·가족센터·청소년 공간은 무료 고유사무(비과세)라 건물 공통 공사·관리비(조례 제10조 총괄부서 예산)는 면적 비율로 안분(시행령 제81조 제4항, 대법원 2017두55329 — 비과세 몫은 공급가액이 없어 면적 등 다른 기준). 과세 몫은 층 수로 어림하면 약 37%(지하2층 공용을 빼고 4개 층 가운데 수영장 1개 층 + 1층 반쯤) — 면적표가 없어 기본값은 30%. 출처: 행복드림센터 조례 제3조·제6조·제10조, 체육시설 조례 별표 1·3, 2026 세입예산사업명세서, 보도(2026-05-03)·층별 시설 안내."
    ask:
      - id: "mix"
        q: "수성행복드림센터 연면적 7,319㎡ 가운데 반다비체육센터(수영장·헬스장·샤워실 등) 전용 면적은 얼마쯤인가요?"
        why: "체육(과세)과 도서관·가족센터·청소년 공간(무료, 비과세)이 한 건물이라 건물 공통 공사·관리비는 면적 비율로 나눕니다(시행령 제81조 제4항). 준공 면적표(층별·실별)를 보면 정확합니다."
        default: 0
        opts:
          - label: "약 30%(기본 — 면적표 확인 전)"
            patch: { share: 0.3 }
          - label: "약 40%(수영장 층이 가장 넓음)"
            patch: { share: 0.4 }
          - label: "약 50% 이상"
            patch: { share: 0.5 }
  - name: "수성국민체육센터(실내체육관·헬스장·다목적강좌실)"
    type: "sports"
