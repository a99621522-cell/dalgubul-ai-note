    term: "알파시티 축구장 민간위탁 동의(2019-03) 때 계약일부터 5년, 수수료 수입의 10% 이상"
    alias: ["화랑공원 테니스장", "알파시티 축구장", "알파시티축구장", "공공체육시설 위탁관리"]
    note: "[2026-11-05 수성구 조사] 화랑공원 테니스장(만촌로 151)·알파시티 축구장(대흥동 81·82, 부지 3,978㎡, 2019-02-28 대구도시공사에서 인수). 구의회 제228회 행정자치위원회(2019-03-14) 제안설명: 화랑공원 테니스장은 수성구 체육회가 수탁해 수입의 10%를 위탁수수료로 구에 납부, 알파시티 축구장과 묶어 한 기관에 5년 위탁. 2026 세입 「공공체육시설(알파시티축구장 및 화랑공원 테니스장) 위탁관리 수수료」 9,500천원. 이용료(별표 3 제2·3호, '부가가치세 포함')는 수탁자 수입이라 수탁자가 신고 — 구 과세사업 아님. 구가 받는 수수료는 시설을 쓰게 하는 대가(부동산임대 성격)로 볼 여지가 있어 질문으로."
