    note: "[2026-11-05 수성구 조사] 범어동 동대구로50길 121-10(구민운동장 옆), 2016-08-12 사용승인(운동시설·다목적체육관). 체육시설 조례 별표 3 제4호: 실내체육관 전용·개인사용, 배드민턴·탁구 강습, 체력단련장, 다목적강좌실 생활체육 프로그램(에어로빅·요가·댄스) — '모든 사용료는 부가가치세를 포함한 금액'. 2026 세입 「국민체육센터 사용료」 351,462천원(실내체육관 154,502·헬스장 108,000·다목적강좌실 수강료 77,760·사물함 11,200) — 전부 기타 운동시설 운영업 과세(강습료 포함), 과세 전용 시설이라 건물 공사·관리 매입세액 전액 공제 대상. 출처: 체육시설 조례 별표 1·2·3, 2026 세입예산사업명세서."
  - name: "수성구민운동장(축구장·사무실 임대)"
    type: "sports"
    run: "direct"
    op: "직영"
    alias: ["구민운동장", "수성구민운동장"]
    note: "[2026-11-05 수성구 조사] 범어동 동대구로50길 121-7. 체육시설 조례 별표 3 제1호: 축구장 전용사용료(주간 3시간 평일 10만 원 등), 상업사용료(촬영) — '부가가치세 포함'. 2026 세입 「구민운동장 사용료」 7,500천원, 공유재산임대료 「구민운동장 사무실 임대료」 13,292천원·「주차장 임대료」 119천원 — 사용료는 운동시설 과세, 사무실 임대는 부동산임대 과세라 시설 전체가 과세(사무실을 고유사무로 쓰는 부분만 빼고). 출처: 체육시설 조례 별표 1·3, 2026 세입예산사업명세서."
  - name: "고산구민운동장(수성제2구민운동장 — 축구장·야구장)"
    type: "sports"
    run: "direct"
    op: "직영"
    share: 0.7
    alias: ["고산구민운동장", "수성제2구민운동장", "제2구민운동장"]
    note: "[2026-11-05 수성구 조사] 체육시설 조례 별표 1 주소 매호동 천을로23길 81-57 — 2024-05-18 개관한 수성제2구민운동장(매호동 233-1 일원, 부지 48,237㎡, 총사업비 274억 600만 원, 2024-03 준공: 축구장·야구장 각 1면, 족구장 4면, 농구장 1면, 놀이터·산책로, 주차장 215면)과 같은 시설로 봄(주소 확인 필요). 축구장·야구장은 유료(별표 3 제6호 '부가가치세 포함', 연간 대관은 공유재산법 시행령 제13·14조), 농구장·족구장은 무료. 2026 세입 「고산구민운동장 사용료」 120,000천원 — 과세. 건립비 274억 원은 경정청구 기간(2021-07 이후 과세기간) 안이라 매입세액 공제 누락 여부 1순위 점검. 무료 구역(놀이터·산책로·농구·족구)은 면적으로 빼야 함. 도시계획시설 결정 고시(수성구 고시 제2020-3호 '제2구민운동장 도시계획시설사업')의 시설 종류는 원문 미확인. 출처: 체육시설 조례 별표 1·3, 2026 세입예산사업명세서, 보도(2024-05-19), 토지이음 고시 목록."
    ask:
      - id: "park"
        q: "고산구민운동장(수성제2구민운동장)은 도시계획시설 '체육시설(운동장)'인가요, '공원(체육공원)'인가요?"
        why: "지자체 체육공원 안 운동시설 이용료는 면세 해석(재경부 부가가치세제과-306)이 있고, 체육시설·운동장이면 기타 운동시설 운영업 과세(186). 구 조례 요금표가 '부가가치세 포함'이라 구는 과세로 신고해 온 것으로 보여 기본값은 체육시설. 토지이용계획확인서·고시 제2020-3호로 확인."
        default: 0
        group: "park"
        gq: "도시계획시설 공원(체육공원)으로 결정된 곳에 표시하세요 — 토지이용계획확인서의 「도시계획시설: 공원」"
        gyes: 1
        opts:
          - label: "체육시설·운동장 — 공원 아님(과세, 요금표 '부가세 포함'과 같음)"
          - label: "도시공원(체육공원) — 면세"
            patch: { type: "park_sports" }
      - id: "free"
        q: "고산구민운동장 부지 가운데 무료 구역(놀이터·산책로·농구장·족구장)은 얼마쯤인가요?"
        why: "유료 구장(축구·야구)과 무료 구역을 같이 짓고 관리하면 공통 공사비는 면적 비율로 나눕니다(시행령 제81조 제4항). 무료 구역 전용 공사는 불공제."
        default: 0
        opts:
          - label: "무료 구역이 작음(과세 몫 약 70%)"
            patch: { share: 0.7 }
          - label: "반쯤(과세 몫 약 50%)"
            patch: { share: 0.5 }
          - label: "유료 구장 전용 공사만 따로 봄(전액 과세)"
            patch: { share: null }
