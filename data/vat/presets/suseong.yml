# 수성구 예시 설정(운영자 지시 2026-11-05 '달성군 완성하고 수성구해 — 지자체별로 다르니 특성을 반영해'). 초안 — 운영자 검증 전.
# 조사 2갈래(조례 본문·별표·2026 세입예산서(일반회계·주차장특별회계)·구의회 회의록·재단 누리집)를 합침. 수성구는 시설관리공단이 없다 — 직영(사용료가 구 세입)·재단 위탁·민간위탁(수탁자 명의).
# 수성구 예시 설정 초안(2026-11-05 수성구 조사 — 달성군 예시 data/vat/presets/dalseong.yml 형식을 따름).
# 출처는 **공개 자료만**: 국가법령정보센터 자치법규(수성구 조례 본문·별표 요금표, 2026-11-05 읽음), 수성구 2026 본예산 세입예산사업명세서(일반회계 di001·주차장특별회계 di201),
#   수성구 2024 재정공시(공기업·출자출연기관 현황), 수성구의회 회의록(제228회 행정자치위원회 2019-03-14), 보도(시설 규모·개관).
# 과세 여부는 data/vat/rules.yml 의 유형 기준 참고 표시이지 구의 공식 판단이 아니다. 사업자등록번호·실제 매출·협약 내용은 담당자가 위·수탁 협약서로 채운다.
# 1차 결과 — **수성구에는 시설관리공단(지방공기업)이 없다**(2024 재정공시 7-4 '우리 수성구에 설립·운영 중에 있는 공기업은 없습니다', 3-3 '공기업이 없습니다').
#   출연기관은 (재)수성문화재단·(재)수성구미래교육재단 둘뿐(재정공시 3-4). 그래서 시설은 ① 구 직영(사용료가 구 세입) ② 민간위탁(수탁자 수입) 두 갈래이고 op 에 '공단'은 쓰지 않는다.
# 2차 결과 — 체육시설 조례 별표 3 의 사용료(구민운동장·알파시티 축구장·수성국민체육센터·두산레포츠센터·고산구민운동장·진밭골 생활체육센터·수성반다비체육센터)는
#   모두 '부가가치세를 포함한 금액' — 구가 이미 체육시설을 과세사업으로 보고 매출세액을 신고하는 구조로 보인다(매입세액을 빠짐없이 공제했는지가 점검 대상).
# 수성문화재단 설립 조례 제4조: 재단 사업 = 수성아트피아 운영·관리, 구립도서관 운영·관리, 생활문화센터·커뮤니티센터 운영·관리, 구청장이 위탁하는 문화·체육·관광 사업.
#   재단 조례 제16조: 구는 공유재산을 재단에 무상사용·수익하게 할 수 있다 — 무상이면 구에 공급이 없어 그 건물 공사·관리 매입세액은 구 불공제.
key: suseong
org: 대구광역시 수성구
read: "2026-11-05"
note: 시설 이름은 수성구 조례 본문·별표(체육시설 별표 1 명칭·위치, 도서관 별표 1, 평생학습센터·생활문화센터·커뮤니티센터 별표)에서, 사용료 귀속은 2026 세입예산사업명세서(일반회계·주차장특별회계)에서, 위탁 여부는 조례 위탁 조항과 구의회 회의록에서 가져왔다. 수성구는 시설관리공단이 없어 '직영'(사용료가 구 세입) 시설은 구 명의 사업이고, '민간위탁' 시설은 조례상 이용료가 수탁자 수입이라 구 과세사업이 아니다(수탁자가 신고). 과세 여부 표시는 이 사이트 규칙의 유형 기준 참고이며 구의 공식 판단이 아니다.
findings:
  - "2026-11-05 수성구 조사: 수성구는 지방공기업(시설관리공단)이 없다(2024 재정공시 7-4·3-3). 출연기관은 (재)수성문화재단·(재)수성구미래교육재단 2곳. 체육시설·야영장·평생학습센터·주차장은 구 직영(사용료가 구 세입), 수성아트피아·구립도서관 12곳·생활문화센터·커뮤니티센터는 수성문화재단, 청소년수련시설·복지관·영상미디어센터는 민간위탁(이용료는 수탁자 수입)."
  - "체육시설 조례(2026-09-30 시행) 별표 3 사용료는 시설마다 '모든 사용료는 부가가치세를 포함한 금액' — 구가 체육시설 매출세액을 이미 신고하는 구조. 2026 세입: 수성행복드림센터 체육시설 554,136천원(수영 프로그램 411,523·헬스 108,000·일일 입장 31,800·사물함 2,813) · 국민체육센터 351,462천원(실내체육관 154,502·헬스 108,000·다목적강좌실 77,760·사물함 11,200) · 고산구민운동장 120,000 · 진밭골 체육센터 75,000 · 두산레포츠센터 34,080 · 구민운동장 7,500 · 구민운동장 사무실 임대료 13,292천원(모두 체육진흥과). 이 시설들의 공사·관리 매입세액 공제 누락이 1순위 점검 대상."
  - "수성행복드림센터(만촌동 달구벌대로526길 50, 연면적 7,319㎡, 지하2~지상3층)는 반다비체육센터(지하1층 수영장·1층 헬스장, 과세)와 만촌책문화센터도서관(2층)·가족센터(1·2층)·청소년 전용공간(3층)이 함께 든 생활SOC 복합시설 — 2026-05-11 시범운영(무료), 하반기 유료. 행복드림센터 조례 제10조: 건물 공통 경비는 총괄부서 예산 — 공통 공사·관리비는 면적 비율 안분 대상."
  - "진밭골 야영장(범물동 진밭길 112, 카라반·오토캠핑·데크)은 공원녹지과 직영 세입 290,000천원 — 오토캠핑장은 숙박업 과세(기준-2016-법령해석부가-0149). 다만 야영장 조례 별표 1 요금표에는 체육시설과 달리 '부가가치세 포함' 문구가 없어 매출 신고 여부부터 확인해야 한다."
  - "화랑공원 테니스장·알파시티 축구장은 민간위탁 — 구의회 회의록(제228회 행정자치위원회 2019-03-14 제안설명): 화랑공원 테니스장은 수성구 체육회가 수탁, 수입의 10%를 위탁수수료로 구에 납부, 알파시티 축구장(대흥동 81·82, 부지 3,978㎡, 2019-02-28 대구도시공사에서 인수)을 함께 공개모집해 한 기관에 5년 위탁. 2026 세입 '공공체육시설(알파시티축구장 및 화랑공원 테니스장) 위탁관리 수수료' 9,500천원(이 사이트 CSV 는 금액을 0 으로 읽음 — 파서 확인 필요)."
  - "주차장특별회계 2026 세입: 유료공영주차장 주차요금 549,000천원(교통과, 구 직영 — 주차장 운영업은 열거 업종이 아니라 구 명의면 면세) · 범어공영주차장 위탁관리 징수교부금 21,000천원(42,000천원×50%). 일반회계에 구청사 부설 유료주차장 64,800천원. 주차장 조례 별표 3: 일반경쟁으로 정한 관리수탁자는 계약금액 전액 선납 — 그런 주차장이 있으면 구가 받는 계약금액은 주차장 임대 대가(과세) 여부 확인."
  - "수성못(수성유원지)은 토지 소유가 한국농어촌공사이고 오리배는 공사와 업체의 임대차였으며 2024-11 철거 — 구 수입이 아니어서 시설에 넣지 않았다. 구 수입은 거리가게 사용료 669천원(3개소)·공원 점용료·유원지 사용료 등 15,500천원(행정재산 사용료, 과세)뿐이고 수성못 야외무대(상화동산·수상·울루루·포켓무대)는 사용료 조항이 없어 무료."
  - "못 읽은 것: 모명재 한국전통문화체험관 운영 조례(국가법령정보센터 연결이 끊겨 받지 못함), 청소년수련시설·노인복지관·사회복지관·영상미디어센터의 현 수탁기관 이름(구의회 의안 원문을 못 열어 '협약서 확인'으로 둠), 행복드림센터 층별 면적, 파크골프장 이용료(조례 별표 3 에 줄이 없어 구 수입 없음으로 봄 — 수성패밀리파크 파크골프장은 수성구파크골프협회 회원제 운영 보도)."
