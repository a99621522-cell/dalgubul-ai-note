# 지방자치단체 부가가치세 매입세액 점검기 규칙 — /vat/ (운영자 지시 2026-10-27: '군청이나 대구시청 같은 지자체가 신고하는 부가가치세의 매입세액을 누락 없이 할 수 있는 사이트').
# 읽는 코드: src/lib/vat.ts → src/pages/vat/index.astro(표·설명), 브라우저 판정은 src/scripts/vat_check.ts 가 이 파일을 JSON 으로 받아 쓴다.
# 원칙: 조문 번호와 조문의 뜻만 적고 평가·해석을 더하지 않는다.
# 원문 대조(2026-10-27, 운영자 지시 '지침 워크플로 돌려서 원문 확인 필요 항목 정리해'): guidelines.yml 워크플로로 받은 국가법령정보센터 본문(data/guidelines/vat-act·vat-decree·vat-rule,
#   법 시행 2026-01-02 · 시행령 2026-04-01 · 시행규칙 2026-04-01 판)과 조문을 하나씩 맞췄다. 그 결과 —
#   · 시행령 제46조 제3호 열거 업종에 주차장 운영업은 없다(부동산임대업·도매 및 소매업·음식점업·숙박업·골프장 및 스키장 운영업·기타 스포츠시설 운영업). 제외는 가(국군 관계자 대상)·나(소속 직원 구내식당 직영)·다(민간투자 기부채납 시설관리운영권), 제4호 비급여 미용 진료·일부 동물 진료.
#     기획재정부령 제외는 '국군 관계자 범위'(시행규칙 제35조)뿐이고 지자체 체육시설을 빼는 규정은 없다.
#   · 조문 번호 바로잡음: 재계산은 시행령 제83조(제85조 아님), 과세사업 전환은 시행령 제85조(제86조 아님), 공급가액 없을 때 안분은 제81조 제4항·정산은 제82조, 기재부령 제40조 → 제35조.
#   · 안분 생략 3호는 '신규 사업'이 아니라 시행령 제63조 제3항 제3호 적용 재화(직전 과세기간이 없는 신규 사업자가 공급한 공통사용재화)다.
#   · 면세공급가액에는 면세사업 관련 국고보조금·공공보조금이 들어간다(시행령 제81조 제1항 단서) — 지자체 안분에서 중요.
#   · 법 제54조 제5항: 세금계산서를 받은 국가·지자체는 사업자가 아니어도 매입처별 세금계산서합계표를 과세기간 끝난 뒤 25일 안에 낸다.
#   법령 글자로 정해지지 않고 표준산업분류·유권해석에 달린 항목(행정재산 사용허가, 종량제 봉투, 대관, 광고 게시료, 파크골프장·야영장 분류)은 interp: true → '유권해석·분류 확인' 표시로 바꿨다. verify: true(원문 미대조)는 국세기본법 제45조의2 하나만 남았다(이 법은 받지 않음).
# 금액·비율 기준(5%·500만 원·5만 원·5%p·20일·5년)은 법령 값이며 바뀔 수 있다 — 바뀌면 여기만 고친다.
version: 2026-10-27
verified: { date: "2026-10-27", act: "2026-01-02", decree: "2026-04-01", rule: "2026-04-01" }   # 따옴표: YAML 이 날짜로 읽지 않게
law_url: "https://www.law.go.kr/법령/{law}/{art}"   # 예: 부가가치세법/제39조
laws:
  act: 부가가치세법
  decree: 부가가치세법시행령
  rule: 부가가치세법시행규칙
  basic: 국세기본법

# ── 1. 지자체가 하는 사업의 과세·면세 (부가가치세법 제26조 제1항 제19호 + 시행령 제46조) ──
# status: taxable(과세) | exempt(면세) | check(확인 필요). verify: 조문 원문 미대조. interp: 표준산업분류·유권해석에 달림.
taxable_principle:
  summary: 국가·지방자치단체·지방자치단체조합이 공급하는 재화·용역은 면세(법 제26조 제1항 제19호). 다만 시행령 제46조가 열거한 것 — 부동산임대업, 도매 및 소매업, 음식점업·숙박업, 골프장 및 스키장 운영업, 기타 스포츠시설 운영업(제3호), 고속철도 여객운송(제2호), 우정사업 일부(제1호), 비급여 미용 진료·일부 동물 진료(제4호) — 는 과세.
  basis: [{ law: act, art: 제26조 }, { law: decree, art: 제46조 }, { law: rule, art: 제35조 }]
  notes:
    - 제3호 업종이라도 제외되는 것 — 국가·지자체가 소속 직원 복리후생을 위해 구내에서 직접 경영하는 식당(나목), 국군이 군인·군무원 등에게 제공하는 소매·음식·숙박·스포츠시설(가목, 골프연습장 제외), 민간투자 기부채납 대가로 주는 시설관리운영권(다목). 지자체 체육시설을 따로 빼는 기획재정부령은 없다(시행규칙 제35조는 국군 관계자 범위만 정한다).
    - 어느 업종에 드는지는 한국표준산업분류로 보며, 시설이 실제로 하는 일(임대·판매·음식·숙박·운동시설 운영)로 판단한다. 법령 글자로 정해지지 않는 분류·해석 문제는 '유권해석·분류 확인' 표시.
    - 지방자치단체는 법인에 포함돼 납세의무자다(법 제3조 제1항). 과세사업을 하면 사업장마다 사업 개시일부터 20일 안에 등록하고(법 제8조 제1항, 사업장이 여럿이면 사업자 단위 과세 선택 가능 제8조 제3항) 세금계산서를 발급하며(법 제32조) 예정·확정신고를 한다(법 제48조·제49조).
    - 위탁(대행) 운영 시설은 '누가 사업자인가'(지자체 명의 사업인지, 수탁기관 자기 사업인지)에 따라 신고 주체가 달라진다. 지자체 명의 사업이면 그 시설의 매입 세금계산서도 지자체 등록번호로 받아야 매입세액으로 공제된다. 수탁기관(지방공단 등)은 지자체가 아니므로 제19호 면세를 받지 못한다.
facilities:
  - { key: lease,     name: 공유재산 임대(건물·상가·토지 대부료),            status: taxable, group: 부동산임대업(시행령 제46조 제3호),
      note: 토지 '공급'은 면세(법 제26조 제1항 제14호)이지만 토지 '임대'는 과세. 주택과 그 부수토지 임대는 면세(제12호, 시행령 제41조), 전·답·과수원·목장용지·임야·염전 임대업은 과세 대상 사업에서 뺀다(시행령 제3조 제1항 제6호 가목). 임대보증금은 간주임대료를 공급가액에 넣는다(법 제29조 제10항 제1호, 시행령 제65조).,
      basis: [{ law: decree, art: 제46조 }, { law: decree, art: 제41조 }, { law: decree, art: 제3조 }, { law: decree, art: 제65조 }] }
  - { key: use_permit, name: 행정재산 사용·수익허가 사용료,                   status: check,   group: 부동산임대업 해당 여부,
      note: 공유재산법상 '사용허가'라도 실질이 부동산 임대이면 부동산임대업으로 보는 해석 사례가 있다. 허가 대상(건물 일부·부지·자판기 자리 등)과 사용 방식으로 판단하고 국세청 유권해석을 확인한다., interp: true,
      basis: [{ law: decree, art: 제46조 }] }
  - { key: sports,    name: 체육시설(수영장·헬스장·체육관·구장 대관·빙상장 등), status: taxable, group: 기타 스포츠시설 운영업(시행령 제46조 제3호),
      note: 강습료·대관료·입장료 모두 그 시설 운영의 공급가액. 지자체 체육시설을 면세로 남기는 제외 규정은 현행 시행령·시행규칙에 없다(제외는 국군 관계자 대상뿐).,
      basis: [{ law: decree, art: 제46조 }, { law: rule, art: 제35조 }] }
  - { key: golf,      name: 골프장·스키장(파크골프장 포함 여부는 분류 확인),   status: taxable, group: 골프장 및 스키장 운영업(시행령 제46조 제3호),
      note: 파크골프장·골프연습장이 '골프장 운영업'인지 '기타 스포츠시설 운영업'인지는 표준산업분류로 확인 — 어느 쪽이든 열거 업종이면 과세., interp: true,
      basis: [{ law: decree, art: 제46조 }] }
  - { key: food,      name: 직영 식당·카페·매점·기념품점·농산물 판매장,          status: taxable, group: 음식점업·도매 및 소매업(시행령 제46조 제3호),
      note: 소속 직원 복리후생을 위해 구내에서 직접 경영하는 식당은 제외(면세, 제3호 나목). 판매장의 미가공 농축수산물은 품목 자체가 면세(법 제26조 제1항 제1호)라 과세 품목과 나눠 적는다.,
      basis: [{ law: decree, art: 제46조 }, { law: act, art: 제26조 }] }
  - { key: lodging,   name: 숙박시설(자연휴양림 숙박동·수련원·야영장 등),         status: taxable, group: 숙박업(시행령 제46조 제3호),
      note: 야영장(캠핑장)이 표준산업분류 숙박업에 드는지 확인. 입장료·시설사용료가 숙박 공급가액에 드는지도 계약·요금 체계로 본다., interp: true,
      basis: [{ law: decree, art: 제46조 }] }
  - { key: parking,   name: 공영주차장(직영) 주차요금,                             status: exempt,  group: 열거 업종 아님 → 지자체 공급 면세(제19호),
      note: 시행령 제46조 제3호 열거 업종에 주차장 운영업은 없다(2026-04-01 시행 원문으로 확인). 지자체가 직접 운영하는 주차장은 제19호 면세. 수탁기관이 자기 사업으로 운영하면 그 기관은 지자체가 아니므로 과세이고, 과세 임대 상가의 부설주차장은 그 임대에 부수되는지 계약으로 본다.,
      basis: [{ law: decree, art: 제46조 }, { law: act, art: 제26조 }] }
  - { key: funeral,   name: 공설 장례식장·화장시설·봉안시설 사용료,                 status: exempt,  group: 지자체 공급 면세(제19호)·장의 용역 면세(제5호),
      note: 장의업자의 장의용역(시행령 제35조 제6호)과 지자체로부터 공설묘지·화장시설·봉안시설 관리를 위탁받은 자가 제공하는 화장·안치·관리 용역(제35조 제8호)도 면세. 장례식장 안 식당·매점·용품 판매는 음식점업·도소매업으로 과세가 될 수 있어 따로 본다.,
      basis: [{ law: act, art: 제26조 }, { law: decree, art: 제35조 }] }
  - { key: water,     name: 상수도(수돗물)·하수도 사용료,                           status: exempt,  group: 수돗물 면세(제2호)·지자체 공급 면세(제19호),
      note: 수돗물은 누가 공급하든 면세 품목. 상하수도 공기업 특별회계도 매입세액 공제가 없다(면세사업).,
      basis: [{ law: act, art: 제26조 }] }
  - { key: waste_bag, name: 종량제 봉투 판매·폐기물 처리 수수료,                   status: check,   group: 도소매업 해당 여부,
      note: 법령에는 종량제 봉투 규정이 없다. 봉투 판매를 폐기물 처리 용역의 대가로 보아 면세로 본 해석 사례가 있으니 국세청 유권해석을 확인한다., interp: true,
      basis: [{ law: act, art: 제26조 }, { law: decree, art: 제46조 }] }
  - { key: culture,   name: 박물관·미술관·과학관·도서관 입장료,                     status: exempt,  group: 입장 용역 면세(제17호)·지자체 공급 면세(제19호),
      note: 안의 매점·카페·기념품점은 과세 사업으로 따로 본다.,
      basis: [{ law: act, art: 제26조 }] }
  - { key: venue,     name: 공연장·전시장·회의실 대관료,                            status: check,   group: 부동산임대업 해당 여부,
      note: 시설을 일정 기간 빌려주는 대관이 부동산임대업인지, 문화행사 용역(제16호)인지 계약 내용으로 본다. 유권해석 확인., interp: true,
      basis: [{ law: decree, art: 제46조 }, { law: act, art: 제26조 }] }
  - { key: transit,   name: 시내버스·마을버스 등 여객운송(직영),                   status: exempt,  group: 여객운송 용역 면세(제7호)·지자체 공급 면세(제19호),
      note: 지자체 공급 중 과세인 여객운송은 고속철도뿐(시행령 제46조 제2호). 제7호 단서의 항공기·고속버스·전세버스·택시·삭도·유람선 등은 일반 사업자 기준이고 지자체 직영이면 제19호로 돌아간다.,
      basis: [{ law: act, art: 제26조 }, { law: decree, art: 제46조 }] }
  - { key: admin,     name: 고유 행정사무(민원 수수료·증명 발급·과태료 등),         status: exempt,  group: 과세 대상 아님·지자체 공급 면세(제19호),
      note: 사업자가 아닌 지위에서 하는 행정 행위는 부가가치세 대상이 아니다. 여기 쓰인 지출의 매입세액은 공제할 수 없고, 과세사업 시설과 함께 쓰인 지출이면 공통매입세액.,
      basis: [{ law: act, art: 제26조 }] }
  - { key: ad_space,  name: 시설물 광고 게시료(옥외광고·전광판),                   status: check,   group: 광고업·임대업 해당 여부,
      note: 광고 매체 제공이 어느 업종인지(광고업은 열거 업종이 아니고, 자리를 빌려주는 것이면 부동산임대업일 수 있다) 유권해석으로 확인., interp: true,
      basis: [{ law: act, art: 제26조 }, { law: decree, art: 제46조 }] }

# ── 2. 매입세액 공제·불공제 규칙 (법 제38조·제39조·제40조·제41조·제43조·제46조, 시행령 제74조~제85조) ──
rules:
  deductible:
    summary: 자기의 사업을 위하여 사용했거나 사용할 목적으로 공급받은 재화·용역에 대한 부가가치세액은 매출세액에서 공제한다. 세금계산서(또는 요건을 갖춘 신용카드매출전표 등)를 받고 매입처별 세금계산서합계표를 제출해야 한다. 세금계산서를 받은 국가·지자체는 사업자가 아니어도 합계표를 과세기간 끝난 뒤 25일 안에 낸다(법 제54조 제5항).
    basis: [{ law: act, art: 제38조 }, { law: act, art: 제54조 }]
  nondeductible:   # 법 제39조 제1항 각 호 (원문 대조 2026-10-27)
    - { key: no_list,   no: 1호, name: 매입처별 세금계산서합계표 미제출·부실기재,           fix: 예정·확정신고 때 합계표를 내고 빠진 것은 확정신고(또는 수정신고·경정청구·기한후신고와 함께 제출)로 보완한다. 등록번호·공급가액이 착오로 다르게 적혔어도 세금계산서로 거래가 확인되면 공제(시행령 제74조)., basis: [{ law: act, art: 제39조 }, { law: decree, art: 제74조 }] }
    - { key: no_invoice, no: 2호, name: 세금계산서를 받지 않았거나 필요적 기재사항이 빠짐·사실과 다름, fix: 공급자에게 세금계산서(공급받는 자 = 우리 기관 등록번호) 발급 또는 수정세금계산서를 요청한다. 일부 착오(나머지 기재사항으로 거래 확인), 확정신고기한까지 받은 지연 발급분 등은 시행령 제75조의 예외로 공제., basis: [{ law: act, art: 제39조 }, { law: decree, art: 제75조 }] }
    - { key: unrelated, no: 4호, name: 사업과 직접 관련이 없는 지출,                      fix: 범위는 소득세법 시행령 제78조·법인세법 시행령 제48조·제49조 제3항·제50조를 따른다(시행령 제77조). 과세사업과의 관련을 지출 결의서·계약서에 남긴다., basis: [{ law: act, art: 제39조 }, { law: decree, art: 제77조 }] }
    - { key: car,       no: 5호, name: 비영업용 소형승용자동차 구입·임차·유지,              fix: 개별소비세법 제1조 제2항 제3호의 자동차(승용차)가 대상. 운수업·자동차 판매업·자동차 임대업·운전학원업·기계경비업 출동차량 등 영업에 직접 쓰는 것은 제외(시행령 제78조 → 제19조). 9인승 이상 승합·화물·경차는 개별소비세 대상이 아니다., basis: [{ law: act, art: 제39조 }, { law: decree, art: 제78조 }, { law: decree, art: 제19조 }] }
    - { key: entertain, no: 6호, name: 기업업무추진비(접대비)와 이와 유사한 비용,         fix: 기념품·선물·접대성 식사 등. 직원 복리후생비·광고선전비는 여기에 들지 않는다 — 성격을 지출 서류에 적는다., basis: [{ law: act, art: 제39조 }] }
    - { key: exempt_use, no: 7호, name: 면세사업등에 관련된 매입세액(면세사업 투자 포함),   fix: 고유 행정사무·면세 시설에 쓰인 지출. 과세·면세에 함께 쓰이면 불공제가 아니라 공통매입세액 안분(법 제40조)., basis: [{ law: act, art: 제39조 }, { law: act, art: 제40조 }] }
    - { key: land,      no: 7호, name: 토지에 관련된 매입세액,                            fix: 토지 취득·형질변경·공장부지·택지 조성, 건물이 있는 토지를 사서 건물을 철거하고 토지만 쓰는 경우의 건물 취득·철거비, 토지 가치를 늘려 취득원가가 되는 비용(시행령 제80조). 건물 신축·수선은 토지 관련이 아니다., basis: [{ law: act, art: 제39조 }, { law: decree, art: 제80조 }] }
    - { key: pre_reg,   no: 8호, name: 사업자등록 신청 전의 매입세액,                     fix: 공급시기가 속하는 과세기간이 끝난 뒤 20일 이내에 등록을 신청하면 그 과세기간 기산일까지 거슬러 공제. 새 과세사업을 시작하면 등록부터 한다., basis: [{ law: act, art: 제39조 }, { law: act, art: 제8조 }] }
  card:
    summary: 신용카드매출전표·현금영수증(사업자지출증빙)으로도 공제할 수 있다(법 제46조 제3항) — 공급자가 영수증 발급 의무 사업자가 아니고, 부가가치세액이 따로 적혀 있으며, 신용카드매출전표등 수령명세서를 신고 때 내고 전표를 5년 보관할 때. 간이과세자가 영수증을 발급해야 하는 기간(직전 연도 공급대가 4,800만 원 미만 등)에 발급한 전표는 안 된다.
    not_allowed: 공제하지 못하는 공급자(시행령 제88조 제5항) — 목욕·이발·미용업, 여객운송업(전세버스 제외), 입장권을 발행하는 사업, 비급여 미용 진료, 일부 동물 진료, 무도학원·자동차운전학원. 부가가치세액이 구분되지 않은 전표, 면세사업자 전표도 공제하지 못한다.
    basis: [{ law: act, art: 제46조 }, { law: decree, art: 제88조 }, { law: act, art: 제36조 }, { law: act, art: 제71조 }]
  late_invoice:
    summary: 공급시기 뒤에 받은 세금계산서는 그 공급시기가 속하는 과세기간의 확정신고기한까지 받으면 공제(시행령 제75조 제3호). 확정신고기한이 지난 뒤 받았더라도 발급일이 확정신고기한 다음 날부터 1년 이내이고, 수정신고서·경정청구서를 세금계산서와 함께 내거나 거래사실이 확인되어 세무서장이 결정·경정하면 공제(제7호). 공급받는 자 가산세는 법 제60조.
    basis: [{ law: decree, art: 제75조 }, { law: act, art: 제60조 }]
  common:   # 공통매입세액 안분
    summary: 과세사업과 면세사업등을 함께 할 때 면세 관련 매입세액은 실지귀속에 따라 가르고, 실지귀속을 구분할 수 없는 공통매입세액만 '총공급가액 중 면세공급가액 비율'로 안분한다(법 제40조, 시행령 제81조 제1항). 실지귀속이 분명한 과세사업 지출은 안분하지 않고 전액 공제. 면세공급가액에는 면세사업과 관련해 받은 국고보조금·공공보조금(과세표준에 들지 않는 것)도 넣는다(제81조 제1항 단서).
    formula: 불공제 매입세액 = 공통매입세액 × 면세공급가액 ÷ 총공급가액 (해당 과세기간)
    skip:
      - { key: ratio5,  name: 면세공급가액 비율 5% 미만,   cond: 해당 과세기간 총공급가액 중 면세공급가액이 5% 미만이면 안분하지 않고 전액 공제. 다만 공통매입세액이 500만 원 이상이면 안분한다(시행령 제81조 제2항 제1호)., ratio_lt: 0.05, amount_lt: 5000000 }
      - { key: small,   name: 공통매입세액 5만 원 미만,     cond: 해당 과세기간 공통매입세액 합계가 5만 원 미만이면 전액 공제(제2항 제2호)., amount_lt: 50000 }
      - { key: newbiz,  name: 신규 사업자의 공통사용재화,   cond: 직전 과세기간이 없는 신규 사업자가 그 과세기간에 공급한 공통사용재화(공급가액 전부를 과세표준으로 한 재화, 시행령 제63조 제3항 제3호)의 매입세액은 안분하지 않는다(제2항 제3호). }
    no_supply: 과세·면세 공급가액이 없거나 한쪽만 있으면 매입가액 비율 → 예정공급가액 비율 → 예정사용면적 비율 순으로 안분하고(건물·구축물 신축·취득은 예정사용면적 우선, 시행령 제81조 제4항), 공급가액·사용면적이 확정되는 과세기간의 확정신고 때 정산한다(제82조).
    prelim: 예정신고 때는 예정신고기간의 공급가액으로 안분하고, 확정신고 때 그 과세기간(1~6월 또는 7~12월) 전체 공급가액으로 다시 계산해 정산한다(시행령 제81조 제1항 단서).
    basis: [{ law: act, art: 제40조 }, { law: decree, art: 제81조 }, { law: decree, art: 제82조 }, { law: rule, art: 제54조 }]
  recalc:   # 감가상각자산 납부세액 재계산
    summary: 안분해 공제한 감가상각자산(건물·구축물·기계·비품)은 그 뒤 과세기간의 면세공급가액 비율(면적으로 안분했으면 면세사용면적 비율)이 취득(또는 직전 재계산) 때보다 5%p 이상 늘거나 줄면 납부세액을 다시 계산해 확정신고와 함께 신고·납부한다(법 제41조, 시행령 제83조).
    formula: 가산(또는 공제)세액 = 해당 재화의 매입세액 × (1 − 체감률 × 경과 과세기간 수) × 면세비율 증감분. 체감률은 건물·구축물 5%(과세기간마다), 그 밖의 감가상각자산 25%. 과세기간 중에 취득했어도 그 과세기간 개시일에 취득한 것으로 본다(제83조 제5항).
    rates: { building: 0.05, other: 0.25 }
    threshold_pp: 0.05
    basis: [{ law: act, art: 제41조 }, { law: decree, art: 제83조 }, { law: rule, art: 제55조 }]
  convert:
    summary: 면세사업에 쓰던 감가상각자산(매입세액 불공제분)을 과세사업에 쓰게 되면 '불공제 매입세액 × (1 − 체감률 × 경과 과세기간 수)'를 그 과세기간 매입세액으로 공제할 수 있고, 과세·면세에 함께 쓰면 과세공급가액 비율을 곱한다(과세 비율 5% 미만이면 없음). 시설 용도가 바뀌면 확인.
    basis: [{ law: act, art: 제43조 }, { law: decree, art: 제85조 }]
  filing:
    periods:
      - { name: 제1기 예정신고, span: 1월 1일~3월 31일, due: 4월 25일 }
      - { name: 제1기 확정신고, span: 1월 1일~6월 30일(예정신고분 제외), due: 7월 25일 }
      - { name: 제2기 예정신고, span: 7월 1일~9월 30일, due: 10월 25일 }
      - { name: 제2기 확정신고, span: 7월 1일~12월 31일(예정신고분 제외), due: 다음 해 1월 25일 }
    notes:
      - 예정신고 때 합계표를 내지 못했으면 같은 과세기간 확정신고 때 함께 낼 수 있다(법 제54조 제3항). 예정신고에서 빠뜨린 매입세액도 확정신고에 넣는다.
      - 확정신고까지 지난 뒤 발견한 누락 매입세액은 경정청구(법정신고기한부터 5년 이내, 국세기본법 제45조의2)로 돌려받는다 — 합계표·수령명세서를 경정청구서와 함께 내면 공제(시행령 제74조 제2호).
      - 장부·세금계산서·영수증은 확정신고기한 뒤 5년 보존한다(법 제71조 제3항). 과세·면세 공급을 장부에 나눠 적는다(제71조 제2항).
    basis: [{ law: act, art: 제48조 }, { law: act, art: 제49조 }, { law: basic, art: 제45조의2 }, { law: act, art: 제71조 }]
    verify: true   # 국세기본법은 창고에 받지 않아 제45조의2 는 원문 미대조

# ── 3. 지출 건 판정기의 선택지 (브라우저 판정, src/scripts/vat_check.ts) ──
inputs:
  use:
    - { key: taxable, name: 과세사업에만 쓰임(임대 상가·체육시설·식당 등 과세 시설 전용) }
    - { key: exempt,  name: 면세사업·고유 행정사무에만 쓰임 }
    - { key: common,  name: 과세·면세에 함께 쓰임(청사 겸용 건물, 공통 관리비 등) }
    - { key: unknown, name: 어느 쪽인지 모름 }
  kind:
    - { key: general,  name: 일반 재화·용역(용역비·수선·소모품·청소·경비·전기·가스·통신·인쇄 등) }
    - { key: building, name: 건물·구축물 신축·증축·대수선(자본적 지출), 설계·감리 }
    - { key: equip,    name: 기계장치·비품·차량(승용차 아님) 취득 }
    - { key: land,     name: 토지 취득·조성·형질변경, 토지만 쓰려는 건물 철거 }
    - { key: car,      name: 승용차(개별소비세 과세 대상, 비영업용) 구입·임차·유류·수리 }
    - { key: entertain, name: 접대·기념품·선물·경조사 }
    - { key: welfare,  name: 직원 복리후생(식대·피복·행사) }
    - { key: outsource, name: 수탁기관(시설관리공단 등)에 주는 위탁수수료·대행사업비 }
    - { key: payroll,  name: 인건비·급여·수당 }
    - { key: insurance, name: 보험료·금융 수수료·이자 }
    - { key: exempt_goods, name: 면세 재화·용역(수돗물·도서·신문·교육·의료 등) }
    - { key: tax,      name: 세금·공과금·과태료·면허 수수료 }
  proof:
    - { key: tax_invoice,  name: 전자세금계산서 — 공급받는 자가 우리 기관(지자체) 사업자등록번호 }
    - { key: tax_invoice_other, name: 세금계산서 — 공급받는 자가 다른 명의(수탁기관·부서 개인 등) }
    - { key: card_vat,     name: 신용카드매출전표·현금영수증(사업자지출증빙) — 부가가치세액 따로 적힘 }
    - { key: card_novat,   name: 신용카드매출전표 — 부가가치세액 구분 없음(간이·면세 공급자 포함) }
    - { key: bill,         name: 계산서(면세 거래) }
    - { key: receipt,      name: 영수증·간이영수증·증빙 없음 }
  supplier:
    - { key: general,  name: 일반과세자 }
    - { key: simple_ok, name: 간이과세자(세금계산서 발급 가능) }
    - { key: simple_no, name: 간이과세자(영수증 발급 기간)·면세사업자 }
    - { key: unknown,  name: 모름 }
  timing:
    - { key: now,  name: 공급시기가 이번 신고 대상 기간 안 }
    - { key: late, name: 지난 과세기간 공급분을 이제 받음(지연 수취) }
    - { key: prereg, name: 사업자등록 신청 전에 공급받음 }

# ── 4. 위탁 시설 운영에서 자주 나오는 지출 — 매입세액이 있는지, 어디에 귀속되는지 ──
common_items:
  - { item: 전기요금(한전), vat: 있음,  tip: 세금계산서(전자) 공급받는 자 명의를 확인. 과세 시설 전용 계량기면 실지귀속 과세, 청사 겸용이면 공통. }
  - { item: 도시가스·난방, vat: 있음,  tip: 시설별 계량기·계약이 나뉘어 있으면 실지귀속으로 전액 공제. }
  - { item: 수도요금,     vat: 없음,  tip: 수돗물은 면세 품목(법 제26조 제1항 제2호) — 공제할 세액이 없다. }
  - { item: 통신·인터넷, vat: 있음,  tip: 회선별로 어느 시설인지 기록. }
  - { item: 청소·경비·시설관리 용역, vat: 있음, tip: 용역 계약을 시설별로 나누면 실지귀속. 한 계약이 여러 시설이면 계약서·과업지시서의 시설별 금액으로 가를 수 있는지 본다. }
  - { item: 수선·유지보수(승강기·소방·냉난방), vat: 있음, tip: 과세 시설 건물의 수선은 공제. 자본적 지출(대수선)은 감가상각자산 재계산 대상에 적어 둔다. }
  - { item: 소모품·비품, vat: 있음, tip: 카드 결제면 부가가치세액 구분과 공급자(영수증 발급 의무 사업자 아님) 확인, 수령명세서에 적는다. }
  - { item: 홍보 인쇄물·광고, vat: 있음, tip: 광고선전비는 접대비가 아니다. 과세 시설 홍보면 공제. }
  - { item: 보험료, vat: 없음, tip: 금융·보험 용역은 면세(법 제26조 제1항 제11호). }
  - { item: 인건비, vat: 없음, tip: 급여는 부가가치세 거래가 아니다. 파견·용역 계약으로 사람을 쓰면 용역비(과세). }
  - { item: 위탁수수료·대행사업비, vat: 확인, tip: 수탁기관이 지자체에 공급하는 용역(과세)인지, 실비 전달·정산인지 계약으로 본다. 용역이면 세금계산서를 받고 시설 귀속에 따라 공제·안분. 수탁 사업 수행 비용을 공급가액에 넣고 빼는 기준은 시행령 제75조 제9호 마·바목 참고. }
  - { item: 공사비(과세 시설 신축·증축), vat: 있음, tip: 건물 공사는 공제(토지 조성분은 불공제). 준공 뒤 면세비율이 5%p 이상 바뀌면 재계산(시행령 제83조). }
  - { item: 토지 매입·부지 조성, vat: 없음/불공제, tip: 토지 공급은 면세, 조성·형질변경 매입세액은 불공제(시행령 제80조). }
  - { item: 승용차 유류·수리, vat: 있음(불공제), tip: 개별소비세 과세 대상 승용차(비영업용)는 불공제. 승합·화물·경차는 공제. }

# ── 5. 신고 전 점검표 (브라우저 체크 상태는 localStorage) ──
checklist:
  - { stage: 상시, id: c01, text: 과세사업 목록이 지금 하는 시설·계약과 같은가 — 새로 생긴 임대 계약·매점·체육시설·숙박시설이 사업자등록(업종)에 들어 있는가, basis: [{ law: act, art: 제8조 }] }
  - { stage: 상시, id: c02, text: 위탁(대행) 시설의 세금계산서 공급받는 자가 지자체 사업자등록번호로 돼 있는가 — 수탁기관 명의로 받은 것은 우리 매입세액이 아니다, basis: [{ law: act, art: 제39조 }] }
  - { stage: 상시, id: c03, text: 지출마다 '어느 시설(과세·면세·공통)'인지 원장에 적고 있는가 — 실지귀속이 분명하면 안분 대상이 아니다, basis: [{ law: act, art: 제40조 }, { law: decree, art: 제81조 }] }
  - { stage: 상시, id: c04, text: 계량기·계약을 시설별로 나눌 수 있는 공통 지출(전기·가스·용역)은 나눴는가, basis: [{ law: decree, art: 제81조 }] }
  - { stage: 신고, id: c05, text: 홈택스 전자세금계산서 매입 목록 전부가 매입처별 세금계산서합계표에 들어갔는가(지연 발급분 포함), basis: [{ law: act, art: 제54조 }] }
  - { stage: 신고, id: c06, text: 카드(클린카드)·현금영수증 결제 중 과세사업 지출을 신용카드매출전표등 수령명세서에 적었는가 — 부가가치세액 구분·공급자 요건 확인, basis: [{ law: act, art: 제46조 }, { law: decree, art: 제88조 }] }
  - { stage: 신고, id: c07, text: 불공제 항목(토지·승용차·접대·면세사업 관련)을 공제분에서 뺐는가, basis: [{ law: act, art: 제39조 }] }
  - { stage: 신고, id: c08, text: 공통매입세액 안분 계산서를 만들었는가 — 면세공급가액에 면세사업 관련 국고·공공보조금을 넣었는가, 생략 기준(면세비율 5% 미만·공통매입세액 500만 원 미만, 5만 원 미만) 적용 여부 포함, basis: [{ law: decree, art: 제81조 }] }
  - { stage: 신고, id: c09, text: 임대보증금 간주임대료를 과세표준에 넣었는가(매출 쪽), basis: [{ law: act, art: 제29조 }, { law: decree, art: 제65조 }] }
  - { stage: 확정, id: c10, text: 예정신고 때 안분한 공통매입세액을 과세기간 전체 공급가액으로 정산했는가, basis: [{ law: decree, art: 제81조 }] }
  - { stage: 확정, id: c11, text: 안분 공제한 건물·설비의 면세비율이 취득 때보다 5%p 이상 바뀌었는가(납부세액 재계산, 확정신고와 함께), basis: [{ law: act, art: 제41조 }, { law: decree, art: 제83조 }] }
  - { stage: 확정, id: c12, text: 예정신고에서 빠진 매입세액을 확정신고에 넣었는가 — 지난 과세기간 누락은 경정청구(5년), basis: [{ law: basic, art: 제45조의2 }, { law: decree, art: 제74조 }] }
  - { stage: 확정, id: c13, text: 장부·세금계산서·수령명세서·안분 계산 근거를 확정신고기한 뒤 5년 보존하도록 철했는가, basis: [{ law: act, art: 제71조 }] }
