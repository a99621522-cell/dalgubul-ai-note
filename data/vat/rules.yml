    invoice_late: 0.005         # 세금계산서 지연수취 — 공급가액의 5/1,000(부가가치세법 제60조 제7항 제1호), 서식 (66)
    list_missing: 0.005         # 매입처별 세금계산서합계표 미제출·부실기재분으로 공제받은 매입세액의 공급가액 5/1,000(법 제60조 제7항 제2호)
    note: 경정청구로 돌려받는 쪽에는 가산세가 없다. 가산세는 덜 낸 쪽(과소신고·무신고·납부지연)에만 붙고, 세무서가 경정할 것을 미리 알고 낸 수정신고·기한후신고에는 감면이 없다(제48조 제2항).
