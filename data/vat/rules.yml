  # ── 세무회계법인 관점 2차(2026-10-27 '이제 다시 평가해봐' → '순서대로 해') — 틀릴 수 있는 자리·큰 돈이 있는 자리. 조문·절차만 ──
  admin_common:   # 1. 본청·행정 공통 지출의 안분 — 고유 행정사무(비과세)도 '면세사업등'(법 제40조, 시행규칙 제54조 제1항)이라 공통이지만, 공급가액이 없어 공급가액 비율(영 제81조 제1항)을 쓸 수 없다
    summary: 행정 일과 함께 쓴 지출(청사 전기·통신·청소 등)은 과세사업과 면세사업등(면세사업 + 부가가치세가 과세되지 않는 재화·용역을 공급하는 사업)의 공통매입세액이다. 고유 행정사무에는 공급가액이 없어 '어느 한 사업의 공급가액이 없는 경우'(영 제81조 제4항)로 보아 매입가액 비율 → 예정공급가액 비율 → 예정사용면적 비율 순서로 안분한다. 시설 안 공통(과세·면세 시설이 같이 쓴 것)과는 따로 묶는다.
    caution: 행정 수입(과태료·수수료)은 공급가액이 아니라 면세 공급가액에 넣지 않는데, 그 결과 비율이 0%가 되면 본청 공통이 전액 공제되는 셈이라 조사에서 가장 먼저 뒤집힌다. 지자체 고유사무 공통매입세액의 안분 기준은 유권해석(국세청 질의회신)으로 확인한다 — 이 도구는 제4항 순서와 기준값 입력만 제공한다.
    interp: true
    basis: [{ law: act, art: 제40조 }, { law: decree, art: 제81조 }, { law: rule, art: 제54조 }]
  subsidy_settle:   # 3. 보조사업 지출의 매입세액 공제 ↔ 보조금 정산
    summary: 국비·시비 보조금으로 집행한 과세 시설 지출도 매입세액 공제 요건은 같다(법 제38조). 다만 공제받은 부가세는 보조사업자가 실제로 부담한 경비가 아니므로 보조금 정산에서 보조 대상 경비에서 빼거나 반납·조정 대상이 될 수 있다 — 교부 조건·정산 지침(국고보조금 통합관리지침, 지방보조금 관리 조례·지침)을 확인하고 정산 담당 부서와 맞춘다.
    todo: 공제받은 부가세 = 보조사업 집행액 중 부가세분 × 공제 비율(전용 100% · 공통은 과세 비율). 정산 서류에 '매입세액 공제분'을 따로 적어 두면 뒤에 반납 다툼이 없다. 조세 조문이 아니라 보조금 집행 절차이므로 조문 번호는 적지 않는다.
  develop:   # 4. 공영개발·분양(산업단지·택지 조성, 공설시장·지식산업센터 분양) — 지자체 부가세에서 가장 큰 금액이 걸리는 자리
    land_sale: 토지 공급은 면세(법 제26조 제1항 제14호). 건물·구축물 분양은 과세. 토지와 건물을 함께 공급하면 건물의 실지거래가액이 공급가액이고, 구분이 불분명하거나 안분액과 30% 이상 차이 나면 기준시가(감정평가가액·장부가액) 비례로 안분한다(법 제29조 제9항, 영 제64조). 다른 법령에 따라 가액을 구분한 경우는 실지거래가액(영 제64조 제2항 제1호).
    land_cost: 토지 조성·형질변경·토목 등 토지 관련 매입세액은 불공제(법 제39조 제1항 제7호). 건물 건축비는 과세 분양분 공제. 설계·감리·기반시설처럼 토지·건물에 함께 드는 비용은 공통매입세액이며, 분양 전이라 공급가액이 없으면 예정공급가액 비율(영 제81조 제4항 제2호)로 안분하고 분양 공급가액이 확정되는 과세기간에 정산한다(제82조).
    timing: 분양 계약금 뒤 인도까지 6개월 이상이고 그 사이 대가를 나눠 받으면 중간지급조건부 — 대가의 각 부분을 받기로 한 때가 공급시기(영 제28조 제3항 제3호, 시행규칙 제18조 제1호). 건물 분양 중도금마다 세금계산서를 끊고 매출세액을 신고한다. 지방회계법 제35조 선금급도 같은 조항(시행규칙 제18조 제3호).
    refund: 조성·건축 중 매입세액이 매출세액보다 크면 조기환급(법 제59조 제2항 제2호 사업 설비)을 매월·매 2월로 신고한다(영 제107조). 분양이 시작돼 매출세액이 생기면 환급에서 납부로 바뀌므로 과세기간별 흐름표로 자금 계획을 세운다.
    housing: 국민주택 규모 이하 주택 공급의 면세는 조세특례제한법에 따른다 — 이 도구는 다루지 않으며 주택 분양 사업은 세무대리인과 확인한다.
    basis: [{ law: act, art: 제26조 }, { law: act, art: 제29조 }, { law: decree, art: 제64조 }, { law: act, art: 제39조 }, { law: decree, art: 제81조 }, { law: decree, art: 제82조 }, { law: decree, art: 제28조 }, { law: rule, art: 제18조 }, { law: act, art: 제59조 }, { law: decree, art: 제107조 }]
  entity_unit:   # 5. 사업자 단위 과세 — 등록 단위를 합치면 면세비율이 하나로
    summary: 사업장이 둘 이상인 사업자는 본점·주사무소 관할 세무서에 사업자 단위로 등록할 수 있고(법 제8조 제3항), 사업장별 등록에서 바꾸려면 적용받으려는 과세기간 개시 20일 전까지 변경등록을 신청한다(제4항). 사업자 단위가 되면 공통매입세액 안분은 전 사업장의 공급가액으로 한다(영 제81조 제3항은 전기통신·철도만의 규정이고, 사업자 단위 과세자는 등록 단위가 하나라 그 단위의 총공급가액으로 안분).
    caution: 합친 비율이 유리한지는 면세 시설이 어느 단위에 있느냐에 달려 있어 단위별 면세분 합계와 합친 면세분을 견준다. 변경은 과세기간 단위로만 되고 되돌리기에도 같은 절차가 든다. 결정은 기관·세무대리인 몫.
    basis: [{ law: act, art: 제8조 }, { law: decree, art: 제81조 }]
  agency_contract:   # 6. 공단·수탁기관 대행 협약서 점검 — 군 명의 사업의 지출 매입세액이 군과 공단 사이에 떨어지지 않게(절차 체크리스트, 조문 아님)
    - { key: name, text: 협약서에 사업의 명의(군 명의 사업인지 공단 자기 사업인지)와 그에 따른 신고 주체가 적혀 있다 }
    - { key: invoice, text: 군 명의 사업의 지출은 세금계산서 공급받는 자를 군(해당 사업장) 등록번호로 받는다고 정했고, 공단 명의로 받으면 군이 공제하지 못한다는 점이 명시돼 있다 }
    - { key: rebill, text: 공단이 자기 명의로 지출한 뒤 군에 정산받는 구조라면, 공단이 군에 '대행 용역' 세금계산서를 발급해 군이 공제하고 공단이 매입세액을 공제하는 재청구 구조가 협약서에 있다 }
    - { key: fee, text: 대행수수료(공단의 과세 용역 대가)와 대행 사업비 실비(군이 부담하는 경비)가 항목·금액으로 구분돼 있다 }
    - { key: revenue, text: 시설 수입(사용료·입장료)이 누구 수입으로 귀속되는지(군 세외수입 / 공단 수입)와 그에 따른 과세·면세 처리가 적혀 있다 }
    - { key: asset, text: 군이 부담한 수선·설비(감가상각자산)의 소유·공제 주체와 재계산 추적 책임이 적혀 있다 }
    - { key: docs, text: 공단이 매달 군에 보내는 매입 인계표(이 도구의 인계표 형식)와 보내는 날이 협약서 또는 운영 지침에 있다 }

# ── 3. 지출 건 판정기의 선택지 (브라우저 판정, src/scripts/vat_check.ts) ──
inputs:
  use:
    - { key: taxable, name: 과세사업에만 쓰임(임대 상가·체육시설·식당 등 과세 시설 전용) }
    - { key: exempt,  name: 면세사업·고유 행정사무에만 쓰임 }
    - { key: common,  name: 과세·면세에 함께 쓰임(청사 겸용 건물, 공통 관리비 등) }
    - { key: unknown, name: 어느 쪽인지 모름 }
  kind:
    - { key: general,  name: 일반 재화·용역(용역비·수선·소모품·청소·경비·전기·가스·통신·인쇄 등) }
    - { key: building, name: 건물·구축물 신축·증축·대수선(자본적 지출), 설계·감리 }
    - { key: equip,    name: 기계장치·비품·차량(승용차 아님) 취득 }
    - { key: land,     name: 토지 취득·조성·형질변경, 토지만 쓰려는 건물 철거 }
    - { key: car,      name: 승용차(개별소비세 과세 대상, 비영업용) 구입·임차·유류·수리 }
    - { key: entertain, name: 접대·기념품·선물·경조사 }
    - { key: welfare,  name: 직원 복리후생(식대·피복·행사) }
    - { key: outsource, name: 수탁기관(시설관리공단 등)에 주는 위탁수수료·대행사업비 }
    - { key: payroll,  name: 인건비·급여·수당 }
    - { key: insurance, name: 보험료·금융 수수료·이자 }
    - { key: exempt_goods, name: 면세 재화·용역(수돗물·도서·신문·교육·의료 등) }
    - { key: tax,      name: 세금·공과금·과태료·면허 수수료 }
  proof:
    - { key: tax_invoice,  name: 전자세금계산서 — 공급받는 자가 우리 기관(지자체) 사업자등록번호 }
    - { key: tax_invoice_other, name: 세금계산서 — 공급받는 자가 다른 명의(수탁기관·부서 개인 등) }
    - { key: card_vat,     name: 신용카드매출전표·현금영수증(사업자지출증빙) — 부가가치세액 따로 적힘 }
    - { key: card_novat,   name: 신용카드매출전표 — 부가가치세액 구분 없음(간이·면세 공급자 포함) }
    - { key: bill,         name: 계산서(면세 거래) }
    - { key: receipt,      name: 영수증·간이영수증·증빙 없음 }
  supplier:
    - { key: general,  name: 일반과세자 }
    - { key: simple_ok, name: 간이과세자(세금계산서 발급 가능) }
    - { key: simple_no, name: 간이과세자(영수증 발급 기간)·면세사업자 }
    - { key: unknown,  name: 모름 }
  timing:
    - { key: now,  name: 공급시기가 이번 신고 대상 기간 안 }
    - { key: late, name: 지난 과세기간 공급분을 이제 받음(지연 수취) }
    - { key: prereg, name: 사업자등록 신청 전에 공급받음 }

# ── 4. 위탁 시설 운영에서 자주 나오는 지출 — 매입세액이 있는지, 어디에 귀속되는지 ──
common_items:
  - { item: 전기요금(한전), vat: 있음,  tip: 세금계산서(전자) 공급받는 자 명의를 확인. 과세 시설 전용 계량기면 실지귀속 과세, 청사 겸용이면 공통. }
  - { item: 도시가스·난방, vat: 있음,  tip: 시설별 계량기·계약이 나뉘어 있으면 실지귀속으로 전액 공제. }
  - { item: 수도요금,     vat: 없음,  tip: 수돗물은 면세 품목(법 제26조 제1항 제2호) — 공제할 세액이 없다. }
  - { item: 통신·인터넷, vat: 있음,  tip: 회선별로 어느 시설인지 기록. }
  - { item: 청소·경비·시설관리 용역, vat: 있음, tip: 용역 계약을 시설별로 나누면 실지귀속. 한 계약이 여러 시설이면 계약서·과업지시서의 시설별 금액으로 가를 수 있는지 본다. }
  - { item: 수선·유지보수(승강기·소방·냉난방), vat: 있음, tip: 과세 시설 건물의 수선은 공제. 자본적 지출(대수선)은 감가상각자산 재계산 대상에 적어 둔다. }
  - { item: 소모품·비품, vat: 있음, tip: 카드 결제면 부가가치세액 구분과 공급자(영수증 발급 의무 사업자 아님) 확인, 수령명세서에 적는다. }
  - { item: 홍보 인쇄물·광고, vat: 있음, tip: 광고선전비는 접대비가 아니다. 과세 시설 홍보면 공제. }
  - { item: 보험료, vat: 없음, tip: 금융·보험 용역은 면세(법 제26조 제1항 제11호). }
  - { item: 인건비, vat: 없음, tip: 급여는 부가가치세 거래가 아니다. 파견·용역 계약으로 사람을 쓰면 용역비(과세). }
  - { item: 위탁수수료·대행사업비, vat: 확인, tip: 수탁기관이 지자체에 공급하는 용역(과세)인지, 실비 전달·정산인지 계약으로 본다. 용역이면 세금계산서를 받고 시설 귀속에 따라 공제·안분. 수탁 사업 수행 비용을 공급가액에 넣고 빼는 기준은 시행령 제75조 제9호 마·바목 참고. }
  - { item: 공사비(과세 시설 신축·증축), vat: 있음, tip: 건물 공사는 공제(토지 조성분은 불공제). 준공 뒤 면세비율이 5%p 이상 바뀌면 재계산(시행령 제83조). }
  - { item: 토지 매입·부지 조성, vat: 없음/불공제, tip: 토지 공급은 면세, 조성·형질변경 매입세액은 불공제(시행령 제80조). }
  - { item: 승용차 유류·수리, vat: 있음(불공제), tip: 개별소비세 과세 대상 승용차(비영업용)는 불공제. 승합·화물·경차는 공제. }

# ── 5. 신고 전 점검표 (브라우저 체크 상태는 localStorage) ──
# ── 7. 과세사업 발굴 점검표 — 지자체 세외수입 항목별 과세·면세(운영자 지시 2026-10-27 '절감 사유에 맞게 → 순서대로 해': 절감 사유 ① 본청 과세사업 검토 후 매입세액 발굴·대상 확대) ──
# status: taxable(과세 — 과세사업 등록·신고 대상, 그 시설 지출 공제) | exempt(면세 — 공제 없음, 면세공급가액에 넣음) | check(유권해석·분류 확인) | none(재화·용역 공급이 아님 — 공급가액에 넣지 않음).
# type 은 facilities 의 key(기관 설정 시설로 넣을 때 유형). deduct 는 과세로 볼 때 공제 대상이 되는 지출. 값·조문만, 평가 없음.
revenue_items:
  - { key: lease_bldg, group: 재산임대수입, name: 공유재산(일반재산) 건물·상가·토지 대부료, status: taxable, type: lease, basis: [{ law: act, art: 제26조 }, { law: decree, art: 제46조 }], deduct: 그 건물·토지의 수선·관리·경비·중개 지출 }
  - { key: use_permit, group: 재산임대수입, name: 행정재산 사용·수익허가 사용료(청사 안 매점·카페·은행 공간, 자판기 자리, 통신 중계기 자리), status: check, type: use_permit, basis: [{ law: act, art: 제26조 }, { law: decree, art: 제46조 }], deduct: 그 공간의 수선·관리 지출(부동산임대업으로 보면), note: 사용허가 사용료가 부동산임대업에 드는지는 유권해석·분류로 — 과세로 신고하는 기관이 많다 }
  - { key: housing, group: 재산임대수입, name: 주택(관사·공공임대주택) 임대료, status: exempt, basis: [{ law: act, art: 제26조 }], deduct: 없음(주택 임대 면세 — 제12호), note: 상가·토지가 섞이면 그 부분은 과세 }
  - { key: sports, group: 사용료수입, name: 체육시설 이용료(수영장·헬스장·체육관·구장 대관·빙상장·파크골프장), status: taxable, type: sports, basis: [{ law: decree, art: 제46조 }], deduct: 시설 전기·가스·수도 외 관리비, 청소·경비 용역, 수선·공사, 장비·비품 }
  - { key: lodging, group: 사용료수입, name: 숙박시설 이용료(자연휴양림 숙박동·수련원·유스호스텔·야영장·오토캠핑장), status: taxable, type: lodging, basis: [{ law: decree, art: 제46조 }], deduct: 숙박동·캠핑장 관리비, 침구·비품, 수선·공사 }
  - { key: golf, group: 사용료수입, name: 골프장·스키장 이용료, status: taxable, type: golf, basis: [{ law: decree, art: 제46조 }], deduct: 코스·슬로프 관리, 장비, 수선 }
  - { key: culture, group: 사용료수입, name: 박물관·미술관·과학관·도서관·동물원·식물원 입장료, status: exempt, type: culture, basis: [{ law: act, art: 제26조 }], deduct: 없음(제17호 면세) — 안의 매점·카페·기념품점은 따로 과세 }
  - { key: venue, group: 사용료수입, name: 공연장·전시장·회의실·강당 대관료, status: check, type: venue, basis: [{ law: act, art: 제26조 }, { law: decree, art: 제46조 }], deduct: 대관 공간의 관리·수선(부동산임대업으로 보면), note: 공연·문화행사 자체 입장료는 제16호 면세일 수 있음 }
  - { key: program, group: 사용료수입, name: 강습·체험 프로그램 참가비(문화강좌·산림치유·청소년수련·체험관), status: exempt, type: program, basis: [{ law: act, art: 제26조 }], deduct: 없음(열거 업종 아님 → 제19호 면세) }
  - { key: parking, group: 사용료수입, name: 공영주차장 주차요금(직영), status: exempt, type: parking, basis: [{ law: act, art: 제26조 }, { law: decree, art: 제46조 }], deduct: 없음(주차장 운영업은 열거 업종 아님) — 수탁 공단이 자기 사업으로 하면 공단이 과세 }
  - { key: water, group: 사용료수입, name: 상수도·하수도 사용료, status: exempt, type: water, basis: [{ law: act, art: 제26조 }], deduct: 없음(수돗물 제2호·지자체 공급 제19호) }
