# 대구 기업지원기관 '선정·결과' 공지 수집 대상 (scripts/collect_awards_notices.py 가 이 파일만 읽는다)
#
# 항목:  name 기관명 · abbr 카드에 쓸 약칭(주관기관 표시) · field 분야 · url 공지 목록 주소
#        status  allowed_static  정적 HTML 목록 — 수집
#                js              목록이 JavaScript 로 그려져 requests 로는 빈 페이지 — 이 수집기에서 제외, 주간 루틴(브라우저)에 맡김
#                blocked         robots.txt 가 목록·전체를 차단 — 수집하지 않음(우회 금지, CLAUDE.md 9항)
#                unreachable     사이트 접속 불가 — 확인 후 갱신
#                url_pending     게시판 주소 미확인 — 채운 뒤 status 를 바꿀 것
#        link_pattern  글 링크 href 에 공통으로 들어가는 문자열 (또는 selector 에 CSS 선택자)
#        keywords      제목 필터(기본값 위 defaults) · since_days 최근 N일(기본 365 — 첫 실행은 1년, 이후 늘릴 것)
#        note          조사 근거·주의 (2026-09-23 robots/구조 확인 결과)
#
# 원칙: robots.txt 와 이용약관에 제한이 있으면 건너뛴다. 대표자·개인 이름은 선정기업 목록에서 제외한다.

defaults:
  keywords: [선정, 결과, 확정, 발표, 명단]
  since_days: 365            # 첫 실행 범위. 소급이 끝나면 1825(5년)로 올린다
  max_per_run: 30            # 하루 Gemini 호출 상한(게시글당 1회)
  attachments: [pdf, xlsx]   # hwp/hwpx 는 표준 라이브러리로 읽을 수 없어 건너뛴다(본문·PDF·XLSX 만)

