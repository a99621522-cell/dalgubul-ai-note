# 주간 루틴(docs/ROUTINE_PROMPT.md)이 순회하는 기업지원기관 목록.
# collect.py 는 이 파일을 읽지 않는다. 루틴이 브라우저로 게시판을 읽어
# scripts/inbox/weekly-YYYYMMDD.json 으로 떨구면 collect.py 가 그걸 가져간다.
#
# 이 기관들의 공고 목록은 거의 전부 JavaScript 로 그려지거나 POST 로만 조회된다.
# 그래서 requests+BeautifulSoup 인 collect.py 의 boards: 로는 0건이 나온다.
# 브라우저를 쓰는 주간 루틴이 이 목록을 맡는 이유다.
#
# robots: 2026-09-22 확인값. allow 가 아닌 기관은 수집하지 않는다(CLAUDE.md 9항).
# note 의 '수집 방식'은 루틴이 게시판을 읽을 때 주의할 점.

institutions:
  # ---------- 대구 지역 ----------
  - name: 대구테크노파크
    home: https://www.ttp.org
    board_url: https://www.ttp.org/bbs/BoardControll.do?bbsId=BBSMSTR_000000000003
    category: grants
    robots: allow
    note: 목록이 JS 렌더링. 서버가 TLS 중간 인증서를 보내지 않아 requests 는 scripts/data/ca-extra.pem 필요

  - name: 대구기계부품연구원
    home: https://www.dmi.re.kr
    board_url: https://www.dmi.re.kr/portal/contents.do?mId=0509000000
    category: grants
    robots: allow
    note: 사업공고 게시판. 상세글은 /portal/bbs/view.do. 목록은 JS 렌더링

  - name: 한국로봇산업진흥원
    home: https://www.kiria.org
    board_url: https://www.kiria.org/portal/info/portalInfoBusinessList.do
    category: grants
    robots: allow      # Disallow 는 /info/ 이고 이 경로는 /portal/info/ 라 해당 없음
    note: 제목 링크가 javascript:fn_update('IBUS_...') 형태. 클릭해야 상세로 감

  - name: 대구경북디자인진흥원
    home: https://www.dgdp.or.kr
    board_url: https://www.dgdp.or.kr/notice/public
    category: grants
    robots: allow
    note: 2026-09-22 기준 게시물 0건. 빈 게시판인지 JS 로딩 실패인지 루틴이 확인할 것

  - name: 한국산업단지공단
    home: https://www.kicox.or.kr
    board_url: ""
    category: economy
    robots: allow      # robots.txt 가 Claude-User 를 명시적으로 허용
    note: 첫 화면에 모집공고가 뜨나 링크가 #none. 사업공고 게시판 번호 확인 필요(입찰공고는 /boardList/1002)

  - name: 대구상공회의소
    home: https://www.dcci.or.kr
    board_url: ""
    category: economy
    robots: allow
    note: 첫 화면에서 '공고' 메뉴를 찾지 못함. 루틴이 사이트맵에서 확인할 것

  - name: 대구경북지방중소벤처기업청
    home: https://www.mss.go.kr
    board_url: ""
    category: grants
    robots: allow
    note: 본청 사이트. 대구경북청 공고 게시판 경로 확인 필요

  - name: 달성군 고시공고
    home: https://www.dalseong.daegu.kr
    board_url: https://eminwon.dalseong.daegu.kr/emwp/jsp/ofr/OfrNotAncmtLSub.jsp?not_ancmt_se_code=01,04
    category: grants
    robots: allow      # eminwon 호스트에는 robots.txt 가 없음
    note: 표준 eMinwon. 목록은 OfrAction.do 로 POST 해야 나옴. 행정 공고 비중이 높아 선별 필요

  # ---------- 경북대 계열 ----------
  - name: 경북대학교 산학협력단
    home: https://iac.knu.ac.kr
    board_url: https://iac.knu.ac.kr/Notice?menuId=MENU_0000000333
    category: grants
    robots: allow

  - name: 경북대학교 창업지원단
    home: https://startup.knu.ac.kr
    board_url: https://startup.knu.ac.kr/bbs/board.php?bo_table=noti
    category: grants
    robots: allow

  - name: 경북대학교 첨단정보통신융합산업기술원
    home: https://www.iact.or.kr
    board_url: ""
    category: grants
    robots: allow      # robots.txt 없음
    note: 기업 제품개발지원 공고를 냄. 공지 게시판 주소 확인 필요

# 수집하지 않는 기관 — 제공기관이 막았거나 거둬들인 곳. 우회하지 않는다(CLAUDE.md 9항).
blocked:
  - name: 대구디지털혁신진흥원
    home: https://www.dip.or.kr
    reason: robots.txt 가 /home/notice/businessbbs/boardList.ubs 등 공고 목록을 차단(오타 'Disllow' 지만 의도는 명확)
  - name: 대구창조경제혁신센터
    home: https://ccei.creativekorea.or.kr/daegu
    reason: "robots.txt: Disallow: / (첫 화면만 허용)"
  - name: 소상공인시장진흥공단
    home: https://www.semas.or.kr
    reason: "robots.txt: Disallow: / (첫 화면만 허용)"
  - name: 대구광역시 보도자료
    home: https://info.daegu.go.kr
    reason: "robots.txt: User-agent * 는 Disallow: / — 네이버·다음 봇만 허용"
  - name: 정책브리핑
    home: https://www.korea.kr
    reason: 2026-07-01 RSS 서비스 중단("콘텐츠 저작권 등 권리 보호"). 대체 스크래핑도 하지 않음

# 확인 필요
unverified:
  - name: 대구경북첨단의료산업진흥재단
    home: https://www.dgmif.re.kr
    reason: 2026-09-22 접속 실패. 주소가 바뀌었는지 확인 후 institutions 로 옮길 것
  - name: 대구RISE센터
    home: ""
    reason: 대구시 RISE 사업 공고 페이지 주소 확인 필요

# 전국 통합 창구 — 개별 기관을 다 긁는 대신 여기로 덮는다.
# 기업마당은 중앙부처·지자체·유관기관 기업지원 공고를 모아 API 로 준다(collect.py 가 매일 호출).
aggregators:
  - {name: 기업마당, url: https://www.bizinfo.go.kr, method: api, robots: allow}
  - {name: K-Startup, url: https://www.k-startup.go.kr, method: board, robots: allow}
  - {name: IRIS 범부처통합연구지원, url: https://www.iris.go.kr, method: board, robots: "allow(일부 /wklounge/ 경로 차단)"}
  - {name: 소상공인24, url: https://www.sbiz24.kr, method: board, robots: allow}
  - {name: 고용24, url: https://www.work24.go.kr, method: board, robots: allow}
  - {name: 나라장터, url: https://www.g2b.go.kr, method: api(data.go.kr 조달청)}
