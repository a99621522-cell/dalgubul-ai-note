# 수집 소스 설정. 키워드는 소문자 비교(대소문자 무시). 한 항목이라도 걸리면 선별.
max_per_run: 8        # 1회 실행당 Gemini 호출 상한 (비용·검수 부담 조절)

# 기업지원기관 공고는 여기(boards:)가 아니라 주간 루틴이 맡는다.
# 이유: 기관 게시판 목록이 대부분 JS 렌더링/POST 조회라 requests+BeautifulSoup 로는 0건이다.
# 기관 목록·게시판 주소·robots 판정은 scripts/data/institutions.yml 참고.

# 기업마당 지원사업정보 API. 공고마다 지역 해시태그가 붙어 있어 그걸로 거른다.
#   region   — 이 지역 태그가 없는 공고(부산·인천 등 타 지역 전용)는 버린다.
#              대구 한정 공고와 전국 공고(16개 지역 태그가 전부 붙은 것)는 둘 다 받는다.
#   keywords — 비워 두면 위 기준으로 전부 받는다(기본). 전국 공고가 너무 많아지면
#              산업어를 채워 전국 공고만 한 번 더 거를 수 있다. 대구 한정 공고는 항상 전부.
#   max_per_run(위) 이 하루 Gemini 호출 상한이라, 여기서 많이 받아도 그 수만큼만 초안이 된다.
bizinfo:
  endpoint: https://www.bizinfo.go.kr/uss/rss/bizinfoApi.do
  count: 100
  region: 대구
  keywords: []

# RSS 소스 없음.
# 정책브리핑(korea.kr)은 2026-07-01 RSS 서비스를 중단했다(사유: 콘텐츠 저작권 등 권리 보호).
# 제공기관이 거둬들인 것이므로 대체 스크래핑도 하지 않는다.
# 새 RSS 를 넣을 때는 반드시 robots.txt 와 이용조건을 먼저 확인할 것.
rss: []

# RSS 없는 게시판. url 은 목록 페이지. item_selector 는 제목 링크의 CSS 선택자.
# item_selector 대신 link_pattern(링크 주소에 공통으로 들어가는 문자열)만 적어도 동작.
# 추가 전 확인: (1) robots.txt 허용 여부 (2) 정적 HTML 에 제목 링크가 실제로 있는지
#   python3 scripts/collect.py --dry-run 으로 '링크 N개'가 0이 아닌지 본다.
#
# 아래 소스들은 검토 후 제외했다(2026-09-22):
#   대구광역시 보도자료 — 실제 위치 info.daegu.go.kr, robots.txt 가 User-agent * 를 전면 차단
#   달성군 고시공고     — eminwon 목록이 POST 조회 전용. 주간 루틴이 담당
#   대구테크노파크      — 목록이 JS 렌더링. 주간 루틴이 담당
boards: []

# OpenDART 공시 → 대구 기업 '확장 신호' (scripts/collect_dart.py 가 매일 읽어 inbox JSON 으로 떨군다)
#   types        B 주요사항보고(신규시설투자·유상증자·타법인주식취득·영업양수·합병) / I 거래소공시(단일판매공급계약·자율공시)
#   keywords     보고서명에 하나라도 들어가면 후보. exclude 가 들어가면 제외(철회·취소)
#   region_words company.json 의 본사 주소에 이 낱말이 있으면 대구 기업으로 판정(회사당 1회 조회 후 state/dart_corp.json 캐시)
#   max_items    하루 inbox 에 넣는 상한 — 이 뒤 Gemini 요약은 max_per_run(위) 이 다시 자른다
dart:
  days_back: 3
  types: [B, I]
  keywords: [신규시설투자, 유상증자, 타법인주식, 단일판매, 공급계약, 영업양수, 합병, 자산양수, 유형자산, 투자판단, 공장]
  exclude: [철회, 취소]
  region_words: [대구광역시, 대구시]
  max_items: 20
  max_company_lookups: 300

# 국민연금 가입 사업장 내역 (공공데이터포털 데이터셋 15083277) → scripts/collect_nps.py → data/nps/YYYYMM.csv (대구만)
#   api          이번 달 오픈API 주소. 포털 데이터셋 페이지 "오픈API" 탭의 uddi 가 파일마다 다르므로 매달 갱신하거나
#                Actions 실행 때 api_url 입력으로 넘긴다. 예: https://api.odcloud.kr/api/15083277/v1/uddi:xxxxxxxx-...
#   filter       서버 쪽 조건(odcloud cond). 법정동주소광역시도코드 27 = 대구. 열 이름이 다르면 주소 LIKE 로 바꾼다
#   region_words 파일 방식(--file)이나 코드 열이 없을 때 주소로 거르는 낱말
#   키는 환경변수 DATA_GO_KR_KEY. 이 세션 환경은 포털 접속이 막혀 있어 GitHub Actions(nps.yml)나 로컬에서 실행
nps:
  api: ""
  per_page: 1000
  max_pages: 500
  filter: { column: 법정동주소광역시도코드, op: EQ, value: "27" }
  region_words: [대구광역시, "대구 "]

# 민선 9기 대구시장 공약 원문 (scripts/fetch_pledges.py, .github/workflows/pledges.yml)
pledges:
  seeds:
    - https://mayor.daegu.go.kr/index.do?menu_id=00938601   # 열린시장실 > 민선9기공약 (하위 메뉴를 따라간다)
    - https://mayor.daegu.go.kr/index.do?menu_id=00938606   # 열린시장실 > 주요 추진과제 13개
    # 중앙선관위 정책·공약마당 > 당선인공약 > 제9회 전국동시지방선거 (JS 페이지: 시·도지사선거 → 지역 대구광역시 → 조회 → 당선인 공약서 PDF)
    - url: https://policy.nec.go.kr/plc/commiment/initUELCommiment.do?menuId=WINNR2
      steps: [{click: 선거선택}, {wait: 1}, {click: 도지사선거}, {wait: 2}, {click: 지역선택}, {wait: 1}, {click: 대구광역시}, {wait: 2}, {click: 조회}, {wait: 3}]
    - url: https://policy.nec.go.kr/plc/commiment/initUELCommiment.do?menuId=WINNR2
      steps: [{click: 도지사선거}, {wait: 2}, {click: 대구}, {wait: 2}, {click: 조회}, {wait: 3}, {download: 공약서}]
