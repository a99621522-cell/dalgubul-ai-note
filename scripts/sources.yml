# 수집 소스 설정. 키워드는 소문자 비교(대소문자 무시). 한 항목이라도 걸리면 선별.
max_per_run: 8        # 1회 실행당 Gemini 호출 상한 (비용·검수 부담 조절)

bizinfo:
  endpoint: https://www.bizinfo.go.kr/uss/rss/bizinfoApi.do
  count: 100
  keywords: [대구, 달성, 경북, 로봇, 인공지능, AI, 스마트공장, 모빌리티, 의료기기, 섬유]

rss:
  # 정책브리핑(korea.kr) — 부처 보도자료 전체. URL이 바뀌면 korea.kr 하단 'RSS' 메뉴에서 확인
  - name: 정책브리핑
    url: https://www.korea.kr/rss/pressrelease.xml
    category: economy
    limit: 60
    keywords: [대구, 달성, 성서산단, 국가산단, 테크노폴리스, 대구테크노파크, 대구기업]

  - name: 정책브리핑(산업정책)
    url: https://www.korea.kr/rss/pressrelease.xml
    category: policy
    limit: 60
    keywords: [산업부, 중소벤처기업부, 산업단지, 스마트공장, 로봇, 자동차부품, 뿌리산업, 규제샌드박스, 기회발전특구, 지방시대, 예산]

  # 대구시 보도자료 — RSS 주소는 daegu.go.kr 에서 확인 후 채울 것
  # - name: 대구광역시
  #   url: https://www.daegu.go.kr/...rss...
  #   category: economy
  #   keywords: [기업, 투자, 산업, 로봇, AI, 창업, 지원]

# RSS 없는 게시판. url 은 목록 페이지. item_selector 는 제목 링크의 CSS 선택자(브라우저 F12 로 확인).
# 잘 모르면 item_selector 대신 link_pattern(링크 주소에 공통으로 들어가는 문자열)만 적어도 동작.
# 처음엔 python3 scripts/collect.py --dry-run 으로 잡히는 제목을 보고 selector 를 다듬는다.
boards:
  - name: 대구광역시 보도자료
    url: https://www.daegu.go.kr/index.do?menu_id=00000904   # 목록 주소 확인 후 수정
    link_pattern: menu_id=00000904
    category: economy
    limit: 40
    keywords: [기업, 투자, 산업, 로봇, AI, 인공지능, 창업, 지원, 경제, 스타트업]

  - name: 달성군 고시공고
    url: https://www.dalseong.daegu.kr/                         # 고시공고 목록 주소로 교체
    link_pattern: /board/
    category: grants
    limit: 40
    keywords: [공모, 지원사업, 모집, 신청]

  - name: 대구테크노파크 사업공고
    url: https://www.ttp.org/                                   # 사업공고 목록 주소로 교체
    link_pattern: /board/
    category: grants
    limit: 40
    keywords: [공모, 모집, 지원, 사업]
