# 수집 소스 설정. 키워드는 소문자 비교(대소문자 무시). 한 항목이라도 걸리면 선별.
max_per_run: 8        # 1회 실행당 Gemini 호출 상한 (비용·검수 부담 조절)

# 기업지원기관 공고는 여기(boards:)가 아니라 주간 루틴이 맡는다.
# 이유: 기관 게시판 목록이 대부분 JS 렌더링/POST 조회라 requests+BeautifulSoup 로는 0건이다.
# 기관 목록·게시판 주소·robots 판정은 scripts/data/institutions.yml 참고.

bizinfo:
  endpoint: https://www.bizinfo.go.kr/uss/rss/bizinfoApi.do
  count: 100
  keywords: [대구, 달성, 경북, 로봇, 인공지능, AI, 스마트공장, 모빌리티, 의료기기, 섬유]

# RSS 소스 없음.
# 정책브리핑(korea.kr)은 2026-07-01 RSS 서비스를 중단했다(사유: 콘텐츠 저작권 등 권리 보호).
# 제공기관이 거둬들인 것이므로 대체 스크래핑도 하지 않는다.
# 새 RSS 를 넣을 때는 반드시 robots.txt 와 이용조건을 먼저 확인할 것.
rss: []

# RSS 없는 게시판. url 은 목록 페이지. item_selector 는 제목 링크의 CSS 선택자.
# item_selector 대신 link_pattern(링크 주소에 공통으로 들어가는 문자열)만 적어도 동작.
# 추가 전 확인: (1) robots.txt 허용 여부 (2) 정적 HTML 에 제목 링크가 실제로 있는지
#   python3 scripts/collect.py --dry-run 으로 '링크 N개'가 0이 아닌지 본다.
#
# 아래 소스들은 검토 후 제외했다(2026-09-22):
#   대구광역시 보도자료 — 실제 위치 info.daegu.go.kr, robots.txt 가 User-agent * 를 전면 차단
#   달성군 고시공고     — eminwon 목록이 POST 조회 전용. 주간 루틴이 담당
#   대구테크노파크      — 목록이 JS 렌더링. 주간 루틴이 담당
boards: []
