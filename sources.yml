# 수집 소스 설정. 키워드는 소문자 비교(대소문자 무시). 한 항목이라도 걸리면 선별.
max_per_run: 8        # 1회 실행당 Gemini 호출 상한 (비용·검수 부담 조절)

bizinfo:
  endpoint: https://www.bizinfo.go.kr/uss/rss/bizinfoApi.do
  count: 100
  keywords: [대구, 달성, 경북, 로봇, 인공지능, AI, 스마트공장, 모빌리티, 의료기기, 섬유]

rss:
  # 정책브리핑(korea.kr) — 부처 보도자료 전체. URL이 바뀌면 korea.kr 하단 'RSS' 메뉴에서 확인
  - name: 정책브리핑
    url: https://www.korea.kr/rss/pressrelease.xml
    category: economy
    limit: 60
    keywords: [대구, 달성, 지역산업, 지방시대, 소상공인, 중소기업, 산업단지, 규제샌드박스, 지역경제]

  - name: 정책브리핑(AI)
    url: https://www.korea.kr/rss/pressrelease.xml
    category: ai-trends
    limit: 60
    keywords: [인공지능, AI, 로봇, 자율주행, 데이터센터, 반도체, 디지털전환, AX]

  # 행정안전부 보도자료 — 공무원 AI·AI 정부 실험실
  - name: 행정안전부
    url: https://www.mois.go.kr/gpms/view/jsp/rss/rss.jsp?ctxCd=1012
    category: gov-ai
    limit: 40
    keywords: [인공지능, AI, 실험실, 챔피언, AX, 디지털정부, 공공데이터, 온AI]

  # 대구시 보도자료 — RSS 주소는 daegu.go.kr 에서 확인 후 채울 것
  # - name: 대구광역시
