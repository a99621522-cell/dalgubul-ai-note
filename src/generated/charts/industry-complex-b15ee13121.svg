<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="100%" role="img" aria-label="기타 서비스 산단별 고용 인원. 산단 외 3,857명, 성서산단 2,470명, 서대구산단 2,321명, 대구제3산단 568명, 대구국가산단 220명, 달성2차산단 156명, 북구검단산단 141명, 경자구역 수성의료지구 73명, 개별입지 63명, 대구이시아폴리스산단 61명, 그 밖의 단지 4명" style="max-width:720px;height:auto;font-size:14px">
