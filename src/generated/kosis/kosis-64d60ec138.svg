<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 454" width="100%" role="img" aria-label="대구 제조업 중분류별 부가가치(2024년, 10명 이상, 억원). 기타 기계 및 장비 제조업 23,800억원, 자동차 및 트레일러 제조업 23,271억원, 금속가공제품 제조업; 기계 및 가구 제외 21,066억원, 섬유제품 제조업; 의복제외 10,645억원, 고무 및 플라스틱제품 제조업 8,697억원, 식료품 제조업 7,295억원, 전기장비 제조업 7,110억원, 의료 정밀 광학기기 및 시계 제조업 6,557억원, 전자부품 컴퓨터 영상 음향 및 통신장비 제조업 5,702억원, 펄프 종이 및 종이제품 제조업 4,632억원, 1차 금속 제조업 3,525억원, 화학물질 및 화학제품 제조업; 의약품 제외 2,510억원" style="max-width:720px;height:auto;font-size:14px">
